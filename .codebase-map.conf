# .codebase-map.conf — per-repo config for the codebase-map kit (coding-governance dogfooding itself).
# RESTRICTED grammar — sourced by bash AND parsed by map_lib.load_conf(): plain KEY=VALUE, a value
# with spaces MUST be double-quoted, no inline comments after a value, no `export`.
#
# INSTALL PREFIX: handled by the engine. the aRootedPrefix unit replaced the kit-dir-grandparent rule
# with `map_lib.resolve_root()`, which walks up for THIS file bounded by `.git`. Every entrypoint —
# gen_map, the gate, reuse_lookup, map_diff — is correct at this repo's `tools/` prefix with no
# environment set. The former CODEBASE_MAP_ROOT workaround is gone; do not reintroduce it.
# `adopt-codebase-map.sh` now runs here too, and its own e2e leg is on the bar.

MAP_ROOT=memory/map

# This repo has no test collector; every gate is a leg in tools/gate-legs.json. The gate template is
# instantiated beside its subject, matching the repo's `<stem>.test.sh` convention, and runs
# standalone. It is project-owned, like map_extractors.py, which also lives inside the kit dir.
GATE_FILE=tools/codebase-map/test_codebase_map.py

# The digest command, verbatim — consumed by the scaffolded map README and the kickoff manifest.
MAP_DIFF_CMD="python tools/codebase-map/map_diff.py"

# --- reuse-convergence layer -------------------------------------------------------------------

# bash carries this repo's PRODUCT — the gates, the adopters, the hooks — and has no symbol
# extractor, because map_lib ships a real parser for Python and an enumeration floor for JS and
# nothing for shell. Declared here so reuse_lookup.py prints a partial-recall notice instead of a
# falsely-confident "no seam fits": a bash seam is genuinely not in the corpus.
RECALL_DARK_LAYERS="bash"

# Fan-in at/above which a symbol counts as a reusable seam. Kept at the kit default of 3 — this is
# a small tree and the threshold has not been re-measured against it. Revisit once the map has
# dossiers: raise it if 3 files turns out to be common here, lower it if the seam set comes back empty.
SEAM_FANIN_THRESHOLD=3

# No clone-ratchet kit is adopted here, so --converge reports new_clones: null.
CLONE_COUNT_FILE=""

# How many feature dossiers may declare an EMPTY `decisions` list. SHRINK-ONLY: a debt being
# drained, not a tolerance, and the shrink-only half is the RATCHETS row in the drift-audit
# signals module rather than this sentence. MEASURED here, 2026-09-05: 17 empty of 21 dossiers
# when the check landed, then 16 once the one dossier this build had read the governing record
# for was filled. It is not backfilled in bulk: a guessed id resolves and is therefore worse
# than an empty list, which is visibly empty. Drains as dossiers are touched by work that can
# fill them honestly.
DOSSIER_DECISIONS_EMPTY_PIN=16
