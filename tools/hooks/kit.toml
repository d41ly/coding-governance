# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "agent-cap"
home = "tools/hooks"
scope = "repo"
version_from = { file = "agent-cap.js", pattern = "KIT_AGENT_CAP_VERSION = " }
requires = ["settings-merge"]

# TWO destinations for ONE source. The kit copy AND the wired copy are both required: the parity arm
# fails outright when the wired copy is absent, so a single-destination model reds it in every target.
# ONE DESTINATION, not two. TOOL-dRetiredFork-14: these hooks shipped to `{prefix}/hooks/` AND
# `.claude/hooks/`, byte-identical, so every policy value in them was stated twice and every carve-out
# over them doubled before anyone edited anything. 2211 duplicated tracked lines across three files.
#
# `.claude/hooks/` stays EXPRESSIBLE -- an adopter who wants it can still say so in their own entry
# (F1, ratified). gov simply stops shipping it. Nothing is deleted from an adopter's tree by this
# change: `govkit update --write-withdrawals` does that, on their timing and after their wired
# command has moved, because the reverse order unwires a security guard for the window between.
[[files]]
include = ["agent-cap.js"]
role = "engine"
to = "{prefix}/hooks/agent-cap.js"

# WITHHELD, TOOL-aQuenchedHarness-3: this suite stages a break into a copy of the hook
# beside it, so its subject is the hook and it has a job only when that source changes.
# `project-owned` rather than a second carve-out rule, because this home enumerates its
# files one rule per file and a source claimed twice is the conflict selfcheck reports.
# `silenced_legs` drops the leg that names it, so both halves close here.
[[files]]
include = ["agent-cap.test.sh"]
role = "project-owned"

# The descriptor travels with the kit, as it does for every entry whose include is `**`. Without
# this rule it was the ONE file under a non-flat home that no rule claimed — invisible to the
# surface predicate, which is depth-1 and sees only `tools/hooks`.
[[files]]
include = ["kit.toml"]
role = "engine"
to = "{prefix}/hooks/kit.toml"

# The grammar this hook enforces, moved out of the charter at v3.0. It ships with
# the hook because it is implementation detail of ONE hook: an adopter installing agent-cap and not
# receiving the marker spellings gets a guard whose refusals they cannot satisfy. It is also the
# fourth file under this non-flat home, and selfcheck reds on any tracked file here no rule claims.
[[files]]
include = ["README.md"]
role = "engine"
to = "{prefix}/hooks/README.md"

# scratch-guard — the second hook in this home. THREE rules for THREE files, not one rule with a
# three-element include: govkit check 7i quantifies per FILE under a non-flat home, and every rule
# here is already one-per-file for that reason. `.claude/settings.json` is deliberately NOT a
# destination of this entry — it is owned by `settings-merge`, and check 4 reds on two entries
# writing one destination. The wiring rides `settings-merge.py --fragment` instead.
[[files]]
include = ["scratch-guard.js"]
role = "engine"
to = "{prefix}/hooks/scratch-guard.js"

# WITHHELD, TOOL-aQuenchedHarness-3: this suite stages a break into a copy of the hook
# beside it, so its subject is the hook and it has a job only when that source changes.
# `project-owned` rather than a second carve-out rule, because this home enumerates its
# files one rule per file and a source claimed twice is the conflict selfcheck reports.
# `silenced_legs` drops the leg that names it, so both halves close here.
[[files]]
include = ["scratch-guard.test.sh"]
role = "project-owned"

[[files]]
include = ["scratch-guard.fragment.json"]
role = "engine"
to = "{prefix}/hooks/scratch-guard.fragment.json"

[adopt]
# RESTORED. TOOL-aQuenchedHarness-3 removed two `[[gate_leg]]` rows from this file and took
# the `[adopt]` table and the whole `[check]` block out with them -- the hunk boundaries ran
# past the rows it meant to delete. `agent-cap` was then the only descriptor of thirteen
# carrying neither, and `govkit check <target>` reds on exactly that for every adopter that
# selected it. Found by the closing review of the build that deleted them.
argv = ["python", "{prefix}/settings-merge.py"]
mutates_index = false

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
#
# The reason is UNCHANGED except for its first clause, which said the kit "ships a self-test
# that rides the bar as its own leg". It no longer ships one: TOOL-aQuenchedHarness-3
# withheld both suites, and they are legs on GOV's bar alone. The rest of the argument --
# no adopter verb, no rendered artifact, wiring is check-wiring's question -- holds as it did.
none = """
this kit ships a hook and a settings fragment and nothing that runs: its two self-tests are withheld from every adopter and are legs on gov's bar alone, and there is no rendered artifact. Whether the hook is WIRED is check-wiring's question, not this kit's
"""

[[lf_pin]]
pattern = "*.fragment.json"
why = "check-wiring.sh reads the fragment with sed; a trailing CR lands inside the captured matcher and the arm reports UNWIRED against a correctly wired repo"
