# kit.toml — this entry, declared as data. Read by <prefix>/govkit/.
# Contract: memory/builds/dDeclaredLoop/spec/2026-10-24-spec-TOOL-dDeclaredLoop-1.md

id = "loop"
home = "loop"
layer = "layer.flow"
scope = "repo"
# The kit's version constant; README.md's first line carries the marker that equals it.
version_from = { file = "loop_lib.py", pattern = "^KIT_LOOP_VERSION = " }
# The definition names no other kit's file. Its reader is stdlib only but for `read_actor_base`, which
# imports the memory-tree kit's compare base to read the actor-witness list at it (TOOL-dDeclaredLoop-5),
# and `read_builds_dir`, which imports that kit's conf reader to find the builds folder of a tree whose
# conf sets DESIGN_RECORD (TOOL-dDeclaredLoop-41), so this kit requires memory-tree. The roles kit requires this one, since its catalogue checker and its
# adopter read each workflow's order here. Two reads of the playbook kit take no edge
# (TOOL-dDeclaredLoop-12): `read_layer_tags` reads its layers.toml for the item inputs' layer tags, and
# `--scopes` runs its load_sets.py as a subprocess for each item's scope. Each prints `unarmed` where
# that kit does not resolve, so the check and the verb degrade rather than fail. The read of the roles
# kit takes no edge either, since the roles kit requires this one (TOOL-dDeclaredLoop-9):
# `read_role_defaults` imports its roles_lib.py inside the function for each role item's defaults, and
# where that kit does not resolve every role item prints `unarmed`. The re-run stand-in,
# loop_witness.py (TOOL-dDeclaredLoop-17), imports the memory-tree kit's tree_lib, build_records and
# deviation_join inside its functions, under the edge above, and its `hold-inherited` plant runs the
# unattended driver, which requires this kit, so that reach takes no edge and exits 2 where the driver
# does not resolve; the plant's leg is gov's own, an [[exempt_leg]] of the registry, no row here.
# The checklist command, loop_checklist.py (TOOL-dDeclaredLoop-11), reads that driver's two core
# registry lines as text, found the same way, so it takes no edge either and exits 2 where the driver
# does not resolve; its leg is gov's own [[exempt_leg]] too. The transition tables' command, loop_table.py
# (TOOL-dDeclaredLoop-13), reads this kit's definition alone, and the playbook kit's layer tags through
# `read_items` only where they resolve, so every holder can run it and its leg ships below. The item
# kind's module, loop_items.py (TOOL-dDeclaredLoop-24), reads the composition of gov's items with an
# adopter's through the playbook kit's overlay_rows.py `compose` verb, run as a subprocess and found
# through `resolve_kit_dir`, so it takes no edge and `check` exits 2 where that kit does not resolve; it
# reads the memory-tree kit's record table under the edge above, and its leg is gov's own [[exempt_leg]].
requires = ["memory-tree"]

# Everything the kit ships is engine, overwritten on every update: the definition, its reader, the
# adopter and the README. The gov steps and each workflow's place are gov's, never an adopter's seed.
[[files]]
include = "**"
role = "engine"

# The adopter grades the installed definition and writes nothing, so adopting is checking.
[adopt]
argv = ["bash", "{kit}/adopt-loop.sh", "--check"]
mutates_index = false
why_no_regenerate = "the adopter reads the definition the kit ships and writes nothing: there is no rendered artifact to go a vintage stale"

[check]
argv = ["bash", "{kit}/adopt-loop.sh", "--check"]

[[outcome]]
code = 0
probe = { must_exist = "{kit}/loop.toml" }
means = "adopted"

# THE DEFINITION LEG SHIPS. Its subject is the definition every reader in the target reads, so a
# failure means the target's loop does not read, whoever changed it.
[[gate_leg]]
name = "loop definition"
subject = "repo"
argv = ["python", "{kit}/loop_lib.py", "--check"]
reads = { base = "it compares the actor-witness list with itself at the compare base, the merge-base with the default branch, so a verdict cached against one base says nothing about another (TOOL-dDeclaredLoop-5)." }
guard = []
ceiling = 120

# THE TRANSITION TABLES' LEG SHIPS, for the reason the definition's does: its subject is the tables every
# mover in the target reads, so a failure means the target's moves do not hold (TOOL-dDeclaredLoop-13).
[[gate_leg]]
name = "loop transition tables"
subject = "repo"
argv = ["python", "{kit}/loop_table.py", "check", "--selftest"]
guard = []
ceiling = 120
