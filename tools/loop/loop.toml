# ---- The transition tables (TOOL-dDeclaredLoop-13) -----------------------------------------------------

[states]
build = ["planning", "designing", "building", "testing", "deploying", "paused", "parked"]
feature = ["decomposed", "designed", "built", "tested", "deployed"]
unit = ["designed", "built", "tested", "deployed"]
terminal = ["landed", "withdrawn", "superseded", "incomplete", "deferred", "retired", "refused", "merged", "answered"]
feature-terminal = ["deployed"]
unit-terminal = ["deployed"]

# The build table, B1 to B25 between open states, then T1 to T5 into a terminal, P1 on a parent's
# withdrawal (TOOL-dDeclaredLoop-15), and E1 to E5, the endings of a build whose rework budget is spent
# (TOOL-dDeclaredLoop-31). No row enters deferred, retired, merged or answered yet: those are other
# units' and builds' rows.

# B1
[[transition]]
level = "build"
from = ["none"]
item = "item.entry.claim"
outcome = "claimed"
disposition = "new"
to = "planning"
witness = "the claim record"

# B2
[[transition]]
level = "build"
from = ["none"]
item = "item.plan.dedupe"
outcome = "patch"
to = "designing"
witness = "the dupes record"

# B3
[[transition]]
level = "build"
from = ["none"]
item = "item.entry.claim"
outcome = "claimed"
disposition = "repeat"
to = "designing"
witness = "the claim record"

# B4
[[transition]]
level = "build"
from = ["planning"]
item = "item.plan.exit"
outcome = "recorded"
to = "designing"
witness = "the transition record"

# B5
[[transition]]
level = "build"
from = ["designing"]
item = "item.design.exit"
outcome = "recorded"
to = "building"
witness = "the transition record"

# B6
[[transition]]
level = "build"
from = ["designing"]
item = "item.design.decompose"
outcome = "goal-fork"
to = "planning"
witness = "the decomposition record naming the goal fork"

# B7
[[transition]]
level = "build"
from = ["building"]
item = "item.build.exit"
outcome = "recorded"
to = "testing"
witness = "the transition record"

# B8
[[transition]]
level = "build"
from = ["building"]
item = "item.build.unit-pass"
outcome = "spec-wrong"
to = "designing"
witness = "the pass record naming the spec defect"

# B9
[[transition]]
level = "build"
from = ["building"]
item = "item.build.core"
outcome = "own-red"
to = "designing"
witness = "the core verdict naming the build's own red"

# B10
[[transition]]
level = "build"
from = ["building"]
item = "item.review.dispose"
outcome = "unit"
to = "designing"
witness = "the review disposition promoting a unit"

# B11
[[transition]]
level = "build"
from = ["planning", "designing", "building", "testing", "deploying"]
item = "@any"
outcome = "admitted"
when = "before-push"
to = "@reentry"
witness = "the admission record naming the re-entered item"

# B12
[[transition]]
level = "build"
from = ["testing"]
item = "item.test.exit"
outcome = "recorded"
to = "deploying"
witness = "the transition record"

# B13
[[transition]]
level = "build"
from = ["testing"]
item = "item.test.attribute"
outcome = "code-miss"
to = "building"
witness = "the attribution record"

# B14
[[transition]]
level = "build"
from = ["testing"]
item = "item.test.merge"
outcome = "conflict"
to = "building"
witness = "the merge record naming the conflict"

# B15
[[transition]]
level = "build"
from = ["building"]
item = "item.build.resolve"
outcome = "resolved"
to = "testing"
witness = "the resolution commit"

# B16
[[transition]]
level = "build"
from = ["testing"]
item = "item.test.attribute"
outcome = "spec-wrong"
to = "designing"
witness = "the attribution record"

# B17
[[transition]]
level = "build"
from = ["deploying"]
item = "item.deploy.current"
outcome = "stale"
to = "testing"
witness = "the currency record naming the moved default branch"

# B18
[[transition]]
level = "build"
from = ["deploying"]
item = "item.deploy.land"
outcome = "refused"
to = "testing"
witness = "the lander's refusal"

# B19
[[transition]]
level = "build"
from = ["@open"]
item = "item.life.request"
outcome = "pause"
to = "paused"
witness = "the owner's request record"

# B20
[[transition]]
level = "build"
from = ["paused"]
item = "item.life.request"
outcome = "resume"
to = "@prior"
witness = "the owner's request record"

# B21
[[transition]]
level = "build"
from = ["building"]
item = "item.build.unit-pass"
outcome = "interface-change"
to = "designing"
witness = "the pass record naming the interface change"

# B22
[[transition]]
level = "build"
from = ["building"]
item = "item.build.distill"
outcome = "unclassed"
to = "designing"
witness = "the distill record naming the unclassed finding"

# B23
[[transition]]
level = "build"
from = ["building"]
item = "item.build.resolve"
outcome = "interface-clash"
to = "designing"
witness = "the resolution record naming the clash"

# B24
[[transition]]
level = "build"
from = ["testing"]
item = "item.test.seen-red"
outcome = "missing"
to = "building"
witness = "the seen-red record naming the missing arm"

# B25
[[transition]]
level = "build"
from = ["testing"]
item = "item.test.route"
outcome = "inherited"
to = "designing"
witness = "the route record naming the inherited red"

# T1
[[transition]]
level = "build"
from = ["planning"]
item = "item.plan.triage-rule"
outcome = "refuse"
to = "refused"
witness = "the triage record"

# T2
[[transition]]
level = "build"
from = ["planning"]
item = "item.plan.triage-judge"
outcome = "refuse"
to = "refused"
witness = "the triage record"

# T3
[[transition]]
level = "build"
from = ["deploying"]
item = "item.deploy.close"
outcome = "closed"
to = "landed"
witness = "the transition record"

# T4
[[transition]]
level = "build"
from = ["@open"]
item = "item.life.close"
outcome = "withdrawn"
when = "before-push"
to = "withdrawn"
witness = "the transition record"

# T5
[[transition]]
level = "build"
from = ["@open"]
item = "item.life.close"
outcome = "superseded"
when = "before-push"
to = "superseded"
witness = "the transition record"

# P1
[[transition]]
level = "build"
from = ["designing", "building", "deploying"]
item = "item.deploy.parents"
outcome = "withdrawn"
to = "planning"
witness = "the parent's post or the hold's record, and the plan revision"

# E1 to E5: the endings `flow.on-exhausted` names once the rework budget is spent (TOOL-dDeclaredLoop-31),
# each on `@any` with the ending as its outcome and drawing nothing. The five step states are written
# out, because `@open` holds paused and parked too.

# E1
[[transition]]
level = "build"
from = ["planning", "designing", "building", "testing", "deploying"]
item = "@any"
outcome = "close-incomplete"
when = "before-push"
to = "incomplete"
witness = "the exhaustion record, and every open unit's defer row"
draws = "none"

# E2
[[transition]]
level = "build"
from = ["planning", "designing", "building", "testing", "deploying"]
item = "@any"
outcome = "park-for-owner"
to = "parked"
witness = "the exhaustion record and the hand-off"
draws = "none"

# E3
[[transition]]
level = "build"
from = ["parked"]
item = "@any"
outcome = "disposed"
disposition = "continue"
to = "@prior"
witness = "the owner's disposition record"
draws = "none"

# E4
[[transition]]
level = "build"
from = ["parked"]
item = "@any"
outcome = "disposed"
disposition = "none"
when = "before-push"
to = "incomplete"
witness = "the owner's disposition record, and every open unit's defer row"
draws = "none"

# E5
[[transition]]
level = "build"
from = ["testing"]
item = "@any"
outcome = "descope"
to = "building"
witness = "the exhaustion record naming the descoped unit, and the revert commit"
draws = "none"

# The unit table, U1 to U8: a unit is designed when its spec is committed and derived READY, built when
# its pass commits and acceptance record hold, tested while the verdict for the build's prepared merge
# holds, and deployed when the landing contains it.

# U1
[[transition]]
level = "unit"
from = ["none"]
item = "item.design.ready"
outcome = "ready"
to = "designed"
witness = "the spec committed and derived READY"

# U2
[[transition]]
level = "unit"
from = ["designed"]
item = "item.build.acceptance"
outcome = "pass"
to = "built"
witness = "the pass commit and its acceptance record"

# U3
[[transition]]
level = "unit"
from = ["built"]
item = "item.test.exit"
outcome = "recorded"
to = "tested"
witness = "the verdict for the build's prepared merge"

# U4
[[transition]]
level = "unit"
from = ["tested"]
item = "item.deploy.land"
outcome = "landed-gated"
to = "deployed"
witness = "the landing containing the unit"

# U5
[[transition]]
level = "unit"
from = ["built"]
item = "item.test.attribute"
outcome = "spec-wrong"
to = "designed"
witness = "the attribution record"

# U6
[[transition]]
level = "unit"
from = ["tested"]
item = "item.deploy.current"
outcome = "stale"
to = "built"
witness = "the currency record naming the moved default branch"

# U7
[[transition]]
level = "unit"
from = ["tested"]
item = "item.deploy.land"
outcome = "landed-ungated"
to = "deployed"
witness = "the landing containing the unit"

# U8
[[transition]]
level = "unit"
from = ["tested"]
item = "item.deploy.land"
outcome = "already-held"
to = "deployed"
witness = "the landing containing the unit"

# The feature table, F1 to F8: a feature holds its least-advanced unit's state, so a row fires on its
# last unit's outcome, which the mover judges and the engine does not.

# F1
[[transition]]
level = "feature"
from = ["none"]
item = "item.design.decompose"
outcome = "decomposed"
to = "decomposed"
witness = "the decomposition record"

# F2
[[transition]]
level = "feature"
from = ["decomposed"]
item = "item.design.ready"
outcome = "ready"
to = "designed"
witness = "its last unit's spec committed and derived READY"

# F3
[[transition]]
level = "feature"
from = ["designed"]
item = "item.build.acceptance"
outcome = "pass"
to = "built"
witness = "its last unit's pass commit and acceptance record"

# F4
[[transition]]
level = "feature"
from = ["built"]
item = "item.test.exit"
outcome = "recorded"
to = "tested"
witness = "the verdict for the build's prepared merge"

# F5
[[transition]]
level = "feature"
from = ["tested"]
item = "item.deploy.land"
outcome = "landed-gated"
to = "deployed"
witness = "the landing containing its last unit"

# F6
[[transition]]
level = "feature"
from = ["designed", "built"]
item = "item.design.reentry"
outcome = "breaking"
to = "decomposed"
witness = "the architect's re-entry record naming the breaking change"

# F7
[[transition]]
level = "feature"
from = ["tested"]
item = "item.deploy.land"
outcome = "landed-ungated"
to = "deployed"
witness = "the landing containing its last unit"

# F8
[[transition]]
level = "feature"
from = ["tested"]
item = "item.deploy.land"
outcome = "already-held"
to = "deployed"
witness = "the landing containing its last unit"

