outcomes = ["verified", "unverified", "timed-out"]
witness = { class = "history", by = "the wake's witness, or the landing record's build.closes value" }
owner = "dShippedRelease"
routes = { verified = "item.deploy.close", unverified = "stand-in:{prefix}/memory-tree/build_records.py", timed-out = "stand-in:{prefix}/memory-tree/build_records.py" }

[[item]]
tag = "item.deploy.snapshot"
step = "step.deploy"
actor = "command:deploy.snapshot"
needs = ["item.deploy.notify", "item.deploy.released"]
inputs = ["layer.memory:the card"]
allowance = "the snapshot commit"
returns = "record-kind.snapshot"
outcomes = ["committed"]
witness = { class = "history", by = "the snapshot commit" }
owner = "dShippedRelease"
routes = { committed = "item.deploy.unlease" }

[[item]]
tag = "item.deploy.unlease"
step = "step.deploy"
actor = "command:deploy.unlease"
needs = ["item.deploy.snapshot"]
inputs = ["layer.runtime:the build's leases and its mailbox"]
allowance = "the terminal tombstones and the mailbox's copy in the build folder"
returns = "record-kind.tombstone"
outcomes = ["closed"]
witness = { class = "history", by = "the terminal tombstones, and the mailbox's messages in the folder" }
owner = "dShippedRelease"
routes = { closed = "item.deploy.close" }

[[item]]
tag = "item.deploy.close"
step = "step.deploy"
actor = "command:deploy.close"
needs = ["item.deploy.released", "item.deploy.unlease"]
inputs = ["layer.memory:the reached items' witnesses and the release outcome"]
allowance = "the transition record"
returns = "record-kind.transition"
outcomes = ["closed", "red-wait"]
witness = { class = "history", by = "the transition record" }
owner = "dShippedRelease"
routes = { closed = "transition", red-wait = "stand-in:{prefix}/memory-tree/build_records.py" }

# ---- The review program ------------------------------------------------------------------------------

[[item]]
tag = "item.review.trigger"
step = "none"
actor = "command:review.trigger"
needs = []
inputs = ["layer.flow:the subject's review rows and the review policy keys"]
allowance = "none"
returns = "record-kind.review-trigger"
outcomes = ["fired", "refused"]
witness = { class = "history", by = "the trigger line the trigger verb prints, joined to the review record's trigger= field" }
owner = "dDeclaredLoop"
routes = { fired = "item.review.pin", refused = "stand-in:{prefix}/unattended/unattended.sh" }

[[item]]
tag = "item.review.pin"
step = "none"
actor = "command:review.pin"
needs = ["item.review.trigger"]
inputs = ["layer.memory:the subject paths and the trigger line"]
allowance = "none"
returns = "record-kind.review-pin"
outcomes = ["pinned"]
witness = { class = "history", by = "the pin line, joined to the trigger line" }
owner = "dFairHearing"
routes = { pinned = "item.review.report" }

[[item]]
tag = "item.review.report"
step = "none"
actor = "command:review.report"
needs = ["item.review.pin"]
inputs = ["layer.memory:the pinned subjects"]
allowance = "the review record"
returns = "record-kind.review"
outcomes = ["reported"]
witness = { class = "history", by = "the review record" }
owner = "dFairHearing"
routes = { reported = "item.review.dispose" }

[[item]]
tag = "item.review.dispose"
step = "none"
actor = "command:review.dispose"
needs = ["item.review.report"]
inputs = ["layer.memory:the review record"]
allowance = "the build's units and asks"
returns = "record-kind.review-disposal"
outcomes = ["fold", "unit", "ask", "intake", "plan-revision", "released"]
witness = { class = "history", by = "each confirmed finding joined to its fold, unit or ask" }
owner = "dDeclaredLoop"
routes = { fold = "item.review.fold", unit = "transition", ask = "stand-in:{prefix}/memory-tree/backlog.py", intake = "stand-in:{prefix}/memory-tree/backlog.py", plan-revision = "item.plan.record", released = "stand-in:{prefix}/unattended/unattended.sh" }

[[item]]
tag = "item.review.fold"
step = "none"
actor = "role:gov-spec-writer"
seed = "write-set"
map = "base"
needs = ["item.review.dispose"]
outcomes = ["next-round", "released", "at-bound", "probe"]
witness = { class = "history", by = "each confirmed finding joined to its fold at the spec's new blob, which the re-invoke's prevSubjects pins" }
owner = "dDeclaredLoop"
routes = { next-round = "item.review.trigger", released = "stand-in:{prefix}/unattended/unattended.sh", at-bound = "item.review.dispose", probe = "stand-in:{prefix}/loop/probe.py" }
draws = { next-round = "review-round" }

[[item]]
tag = "item.review.cost"
step = "none"
actor = "command:review.cost"
needs = ["item.review.report"]
inputs = ["layer.memory:the review record's review-shape line"]
allowance = "the review-shape line"
returns = "record-kind.review-shape"
outcomes = ["done"]
witness = { class = "history", by = "the review-shape line's cost fields" }
owner = "dDeclaredLoop"
routes = { done = "stand-in:{prefix}/unattended/unattended.sh" }

# ---- The probe program (TOOL-dPlacedRequest-7) -------------------------------------------------------
# Testing outside Test: placed at an item boundary by probe.points or the owner, or raised by a role's probe
# outcome. Each row sits in no step; an unbuilt part rides its row's owner, the build that lands it. A route
# to the probe tool's stand-in is the line probe.py prints ending `· to <asker>`, the asker re-entered with
# it as its input; the owner item is the unattended driver's stand-in.

[[item]]
tag = "item.probe.trigger"
step = "none"
actor = "command:probe.trigger"
needs = []
inputs = ["layer.flow:the probe policy keys and the probe program's trigger-cause rows"]
allowance = "the probe-trigger record"
returns = "record-kind.probe-trigger"
outcomes = ["opened", "not-opened"]
witness = { class = "history", by = "the probe-trigger record" }
owner = "dPlacedRequest"
routes = { opened = "item.probe.pin", not-opened = "stand-in:{prefix}/loop/probe.py" }

[[item]]
tag = "item.probe.pin"
step = "none"
actor = "command:probe.pin"
needs = ["item.probe.trigger"]
inputs = ["layer.memory:the probe-trigger record and the commit it pins"]
allowance = "the probe record's head"
returns = "record-kind.probe"
outcomes = ["verification", "reproduction", "experiment"]
witness = { class = "history", by = "the head, recorded before any run" }
owner = "dPlacedRequest"
routes = { verification = "item.probe.design", reproduction = "item.probe.design", experiment = "item.probe.experiment" }

[[item]]
tag = "item.probe.design"
step = "none"
actor = "role:gov-tester"
needs = ["item.probe.pin"]
outcomes = ["done"]
witness = { class = "history", by = "the method's schema check" }
owner = "dWitnessedBar"
routes = { done = "item.probe.run" }

[[item]]
tag = "item.probe.experiment"
step = "none"
actor = "role:gov-researcher"
needs = ["item.probe.pin"]
outcomes = ["done", "beyond-authority"]
witness = { class = "history", by = "the method's schema check" }
owner = "dBoundRoles"
routes = { done = "item.probe.run", beyond-authority = "stand-in:{prefix}/unattended/unattended.sh" }

[[item]]
tag = "item.probe.run"
step = "none"
actor = "executor"
needs = [["item.probe.design", "item.probe.experiment"]]
inputs = ["layer.memory:the probe record's pinned commit and method"]
allowance = "the probe record's run lines"
returns = "record-kind.probe"
outcomes = ["done", "unrunnable"]
witness = { class = "history", by = "the run lines by hash" }
owner = "dWellOiledMachine"
routes = { done = "item.probe.judge", unrunnable = "item.probe.return" }

[[item]]
tag = "item.probe.judge"
step = "none"
actor = "command:probe.judge"
needs = ["item.probe.run"]
inputs = ["layer.memory:the probe record's method and run lines"]
allowance = "the probe record's verdict"
returns = "record-kind.probe"
outcomes = ["judged", "claimed"]
witness = { class = "history", by = "the computed verdict" }
owner = "dPlacedRequest"
routes = { judged = "item.probe.return", claimed = "item.probe.judge-claimed" }

[[item]]
tag = "item.probe.judge-claimed"
step = "none"
actor = "role:gov-tester"
needs = ["item.probe.judge"]
outcomes = ["done"]
witness = { class = "history", by = "the judgment's schema check, held as claimed" }
owner = "dWitnessedBar"
routes = { done = "item.probe.return" }

[[item]]
tag = "item.probe.return"
step = "none"
actor = "command:probe.return"
needs = ["item.probe.judge"]
inputs = ["layer.memory:the judged probe record"]
allowance = "the probe record's writer"
returns = "record-kind.probe"
outcomes = ["returned", "claimed", "unrunnable"]
witness = { class = "history", by = "the probe record" }
owner = "dTotalRecall"
routes = { returned = "stand-in:{prefix}/loop/probe.py", claimed = "stand-in:{prefix}/unattended/unattended.sh", unrunnable = "stand-in:{prefix}/unattended/unattended.sh" }

# One [[selects]] row per policy value that selects a component a layer point stands for
# (TOOL-dDeclaredLoop-2 S8): `key` the policy key, `value` its value, `point` the layer point the value
# needs. Read by guard.py's `check_expansion_value` alone: where no core row of the playbook kit's
# layers.toml declares the point, policy-file.on-missing-expansion says whether the value is refused
# or read as its catalogue default. No check of this file reads the table.
[[selects]]
key = "policy-file.proof"
value = "signed"
point = "point.instruction.signed-proof"

[[selects]]
key = "policy-file.proof"
value = "both"
point = "point.instruction.signed-proof"

[[selects]]
key = "instructions.proof"
value = "signed"
point = "point.instruction.signed-proof"

[[selects]]
key = "instructions.proof"
value = "both"
point = "point.instruction.signed-proof"

[[selects]]
key = "instructions.edit"
value = "flow-only"
point = "point.instruction.flow"

# build.closes = after-release-verifies needs point.flow.release, the release slot, Flow's core point in
# Deploy where integrations' engines attach: `strict` and `guarded` close a build only after its release
# verifies (KICK-dKeptSession-1 S4).
[[selects]]
key = "build.closes"
value = "after-release-verifies"
point = "point.flow.release"
