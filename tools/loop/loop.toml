# ---- The entry program (TOOL-dPlacedRequest-3) -------------------------------------------------------
# The flow's router before any step (flow-steps' [entry]): orient, place by the policy key `placement`,
# claim, and answer a question to a build. Each row sits in no step. entry.orient's placing outcome is the value `policy.py get placement`
# returns at the item boundary, one outcome per value; the three placing rows share one route table, and a
# failed placement.check is the item's refusal, back to it by default. item.entry.intake joins
# entry.orient's needs when dWellOiledMachine declares it.

[[item]]
tag = "item.entry.orient"
step = "none"
actor = "role:gov-orienter"
map = "base"
needs = []
outcomes = ["agent-places", "declared-checked", "owner-places", "probe"]
witness = { class = "history", by = "the session's card, its view key recomputing; the build card at refs/gov/builds/<slug>/card where the card routes a build" }
owner = "dPlacedRequest"
routes = { agent-places = "item.entry.place", declared-checked = "item.entry.place-check", owner-places = "item.entry.place-owner", probe = "stand-in:{prefix}/loop/probe.py" }

[[item]]
tag = "item.entry.place"
step = "none"
actor = "role:gov-orienter"
needs = ["item.entry.orient"]
outcomes = "dispositions"
witness = { class = "history", by = "placement.py check over the return's facts: the newest placement block's check: line reading pass or recorded" }
owner = "dPlacedRequest"
routes = { new = "item.entry.claim", patch = "item.entry.claim", repeat = "item.entry.claim", amend = "stand-in:{prefix}/loop/placement.py", breakpoint = "item.review.trigger", unit = "item.entry.place", continue = "stand-in:{prefix}/unattended/unattended.sh", ask = "stand-in:{prefix}/memory-tree/backlog.py", none = "stand-in:{prefix}/roles/agents/gov-orienter.agent.md" }
draws = { unit = "route-back" }

[[item]]
tag = "item.entry.place-check"
step = "none"
actor = "command:entry.place-check"
needs = ["item.entry.orient"]
inputs = ["layer.memory:the request's own declaration and the scout's return as evidence", "layer.runtime:the request's placement store"]
allowance = "the request's placement block"
returns = "the request's placement block, its check: line written by placement.py check"
outcomes = "dispositions"
witness = { class = "history", by = "placement.py check over the declared placement" }
owner = "dPlacedRequest"
routes = { new = "item.entry.claim", patch = "item.entry.claim", repeat = "item.entry.claim", amend = "stand-in:{prefix}/loop/placement.py", breakpoint = "item.review.trigger", unit = "item.entry.place", continue = "stand-in:{prefix}/unattended/unattended.sh", ask = "stand-in:{prefix}/memory-tree/backlog.py", none = "stand-in:{prefix}/roles/agents/gov-orienter.agent.md" }
draws = { unit = "route-back" }

[[item]]
tag = "item.entry.place-owner"
step = "none"
actor = "owner"
needs = ["item.entry.orient"]
inputs = ["layer.memory:the scout's return, printed as evidence by placement.py place"]
allowance = "the owner's disposition record naming item.entry.place-owner"
returns = "record-kind.disposition"
outcomes = "dispositions"
witness = { class = "history", by = "the owner's disposition record, record-kind.disposition, naming item.entry.place-owner" }
owner = "dPlacedRequest"
routes = { new = "item.entry.claim", patch = "item.entry.claim", repeat = "item.entry.claim", amend = "stand-in:{prefix}/loop/placement.py", breakpoint = "item.review.trigger", unit = "item.entry.place", continue = "stand-in:{prefix}/unattended/unattended.sh", ask = "stand-in:{prefix}/memory-tree/backlog.py", none = "stand-in:{prefix}/roles/agents/gov-orienter.agent.md" }
draws = { unit = "route-back" }
deadline = "policy.run.owner-deadline"
on-deadline = "ask"

[[item]]
tag = "item.entry.claim"
step = "none"
actor = "command:entry.claim"
needs = [["item.entry.place", "item.entry.place-check", "item.entry.place-owner"]]
inputs = ["layer.memory:the request's passed placement, as placement.py record prints it", "layer.runtime:the claim ref and the build lease"]
allowance = "the claim ref; on a patch or a repeat the build lease, the derived plan record and the first transition record"
returns = "the claim ref's body"
outcomes = ["claimed", "slug-taken", "awaiting", "refused"]
witness = { class = "history", by = "the claim ref refs/gov/claims/<slug> on the remote; on a patch or a repeat the lease record and the derived plan record too" }
owner = "dPlacedRequest"
routes = { claimed = "transition", slug-taken = "item.entry.claim", awaiting = "item.entry.claim", refused = "stand-in:{prefix}/memory-tree/backlog.py" }
draws = { slug-taken = "route-back" }
waits = ["awaiting"]
deadline = "policy.flow.wait-ceiling"
on-deadline = "refused"

# mailbox.answer, before any step (flow-steps' [entry]; KICK-dKeptSession-25): a question to a build,
# answered by the role owning the asked interface or item once `next` dispatches it; until then the
# asker's default answers it past the deadline (cl-dClosedLoop-0162), the same stand-in covering the role.
[[item]]
tag = "item.entry.mailbox-answer"
step = "none"
actor = "command:mailbox.answer"   # the stand-in covering the owning role until `next` (cl-dClosedLoop-0504)
needs = []
inputs = ["layer.flow:the question message", "layer.memory:the asked interface's declaration or the asked item's witnesses"]
allowance = "one answer commit on the answering session's mail ref"
returns = "the answer's mail commit"
outcomes = ["answered", "awaiting", "defaulted"]
witness = { class = "history", by = "derive_mail_answer_outcome over the question's mail rows" }
owner = "dKeptSession"
routes = { answered = "stand-in:{prefix}/unattended/unattended.sh", awaiting = "item.entry.mailbox-answer", defaulted = "stand-in:{prefix}/unattended/unattended.sh" }
waits = ["awaiting"]
deadline = "policy.flow.wait-ceiling"
on-deadline = "defaulted"

