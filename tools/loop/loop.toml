# loop.toml — the loop's definition: the gov steps, and where each roles workflow sits in them.
# Read through loop_lib.py beside this file, and by nothing else; `python loop_lib.py --check` grades it.
#
# One [[step]] row per gov step, in the loop's order:
#   tag    the step's tag, a member of the `step` namespace
#   order  its place in the loop, counted from 1
#   state  the build state a build holds while it is in the step
#   exit   the step's exit item, a tag of the `item` namespace
#   witness  what witnesses the step's exit: { class = "<class>", by = "<what>" }, the class one of
#          [witnesses] classes or refused below (TOOL-dDeclaredLoop-5)
#
# [witnesses], the witness classes: `classes` a fact the acting agent cannot type is witnessed by,
# `refused` the class it can (`actor`), which no witness may carry unless actor-witnesses.txt beside
# this file lists it with the build whose computed witness takes its place.
#
# One [[witness-alias]] row per checker word of the unattended driver's DOD_CORE:
#   word   the checker word, `machine` or `agent`
#   means  the class it means
#
# One [[workflow]] row per workflow of the roles kit's workflows.toml, joined by name both ways by that
# kit's catalogue checker (rule R6):
#   name   the roles workflow
#   order  its build order, 0 for an any-time workflow; the `## Stage <n>` number of the /build Skill
#   step   the step its work sits in, a [[step]] tag above, or "none"
#   reach  optional, `entry` or `review`: the word its work orders load practices under, where that is
#          not the step's own last segment
#
# [dispositions], the one closed disposition set (cl-dClosedLoop-0101), the words a placing item returns:
#   set    its members, each one word, none given twice
# It is not the review round's exit (fold or promote, REVIEW_DISPOSITIONS of the unattended kit), not the
# per-finding report grammar (class:, new:, gate:, none), and not triage's verdicts (select, defer,
# retire, refuse), which move a build in planning to one of its terminal states.
#
# One [[disposition-alias]] row per legacy word that means a member:
#   word   the legacy word, no member of the set
#   means  the member it means

[[step]]
tag = "step.plan"
order = 1
state = "planning"
exit = "item.plan.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.design"
order = 2
state = "designing"
exit = "item.design.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.build"
order = 3
state = "building"
exit = "item.build.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.test"
order = 4
state = "testing"
exit = "item.test.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.deploy"
order = 5
state = "deploying"
exit = "item.deploy.close"
witness = { class = "history", by = "the transition record that closes the build" }

[witnesses]
classes = ["history", "hook-record", "remote-verdict"]
refused = ["actor"]

[[witness-alias]]
word = "machine"
means = "history"

[[witness-alias]]
word = "agent"
means = "actor"

[[workflow]]
name = "orient"
order = 1
step = "none"
reach = "entry"

[[workflow]]
name = "reuse"
order = 2
step = "step.design"

[[workflow]]
name = "spec-write"
order = 3
step = "step.design"

[[workflow]]
name = "spec-review"
order = 4
step = "step.design"
reach = "review"

[[workflow]]
name = "build"
order = 5
step = "step.build"

[[workflow]]
name = "closing-review"
order = 6
step = "step.build"
reach = "review"

[[workflow]]
name = "gate-bar"
order = 7
step = "step.test"

[[workflow]]
name = "research"
order = 0
step = "step.plan"

[[workflow]]
name = "handoff"
order = 0
step = "none"

[[workflow]]
name = "bookkeeping"
order = 0
step = "none"

[dispositions]
set = ["continue", "amend", "new", "patch", "repeat", "unit", "breakpoint", "ask", "none"]

[[disposition-alias]]
word = "attach"
means = "amend"

[[disposition-alias]]
word = "defer"
means = "ask"

[[disposition-alias]]
word = "refuse-as-duplicate"
means = "continue"
