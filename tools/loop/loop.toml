# loop.toml — the loop's definition: the gov steps, and where each roles workflow sits in them.
# Read through loop_lib.py beside this file, and by nothing else; `python loop_lib.py --check` grades it.
#
# One [[step]] row per gov step, in the loop's order:
#   tag    the step's tag, a member of the `step` namespace
#   order  its place in the loop, counted from 1
#   state  the build state a build holds while it is in the step
#   exit   the step's exit item, a tag of the `item` namespace
#   witness  what witnesses the step's exit: { class = "<class>", by = "<what>" }, the class one of
#          [witnesses] classes or refused below (TOOL-dDeclaredLoop-5)
#
# [witnesses], the witness classes: `classes` a fact the acting agent cannot type is witnessed by,
# `refused` the class it can (`actor`), which no witness may carry unless actor-witnesses.txt beside
# this file lists it with the build whose computed witness takes its place.
#
# One [[witness-alias]] row per checker word of the unattended driver's DOD_CORE:
#   word   the checker word, `machine` or `agent`
#   means  the class it means
#
# One [[computed-witness]] row per witness a tool computes rather than the acting agent typing it
# (TOOL-dDeclaredLoop-17); its class is the class of the item it serves, never typed here:
#   name      the witness kind, one word
#   serves    the [[item]] tag it witnesses, or "none" for an item no row below declares
#   writer    what writes it today: "stand-in:{prefix}/<home>/<file>" or an actor `<kind>:<name>`
#   armed-by  the build that writes it for real
#
# One [[workflow]] row per workflow of the roles kit's workflows.toml, joined by name both ways by that
# kit's catalogue checker (rule R6):
#   name   the roles workflow
#   order  its build order, 0 for an any-time workflow; the `## Stage <n>` number of the /build Skill
#   step   the step its work sits in, a [[step]] tag above, or "none"
#   reach  optional, `entry` or `review`: the word its work orders load practices under, where that is
#          not the step's own last segment
#
# [dispositions], the one closed disposition set (cl-dClosedLoop-0101), the words a placing item returns:
#   set    its members, each one word, none given twice
# It is not the review round's exit (fold or promote, REVIEW_DISPOSITIONS of the unattended kit), not the
# per-finding report grammar (class:, new:, gate:, none), and not triage's verdicts (select, defer,
# retire, refuse), which move a build in planning to one of its terminal states.
#
# One [[disposition-alias]] row per legacy word that means a member:
#   word   the legacy word, no member of the set
#   means  the member it means
#
# One [[checklist]] row per handle of the unattended driver's DOD_CORE and DIRECTIVES_CORE
# (TOOL-dDeclaredLoop-11), naming the item by its tag and never by a number; loop_checklist.py beside
# this file checks the rows both ways against the two registries:
#   registry  DOD_CORE or DIRECTIVES_CORE, the driver constant holding the handle
#   handle    the handle, as the registry spells it before its first ":"
#   item      the [[item]] tag whose witness the handle's check reads
#
# [states], each level's states (TOOL-dDeclaredLoop-13): `build`, `feature` and `unit`, each the list of
# that level's open states. A level's entry is "none", never a state. `terminal` is no level: it lists
# the build level's terminal states (TOOL-dDeclaredLoop-15), which a build row may enter and no row may
# leave, and none of which is an open state. `feature-terminal` and `unit-terminal` are no levels either:
# each lists its level's terminal set, members of that level's own states, which no row of the level may
# leave (TOOL-dDeclaredLoop-54). loop_table.py beside this file reads them and the three tables below,
# and its `check` grades them:
#
# One [[transition]] row per move of a level's table:
#   level        build, feature or unit, a key of [states]
#   from         a list of the level's states, "none" for its entry, or "@open" for every open state
#   item         the item whose outcome fires the row, by tag; "@any" on the one row re-entering a step,
#                the re-entered item named by the move's `reenters` fact, and on an ending row, whose
#                outcome is an ending word: close-incomplete, park-for-owner, descope or disposed
#   outcome      one word of that item's closed outcome set
#   to           a state of the level, "@prior" for the state the move's `prior` fact names, or
#                "@reentry" for the state of the re-entered item's step
#   witness      what witnesses the move
#   disposition  optional, the member of [dispositions] the move's `disposition` fact must be
#   when         optional, "before-push": the row holds only while the move's `pushed` fact is no
#   draws        optional, "none": the row is an ending, and a backward move on it draws nothing from the
#                rework budget; a row without it draws as any move does
#
# One [[stand-in]] row per row item whose owning build has not landed, shrink-only: `item`, its tag,
# and `owner`, that build, which deletes the row in the landing that arms the item's witness.
#
# One [[owed-row]] row per cross-step route whose build row another unit or build writes, shrink-only:
# `item` and `outcome`, the route, and `by`, the writer, which deletes the row in the same landing.
#
# One [[phase]] row per phase of the unattended driver's PHASES_CORE, in its order (TOOL-dDeclaredLoop-52):
#   phase  the phase, as the driver spells it
#   step   the [[step]] tag whose state the phase reads, its state never typed beside it; or
#   state  a build state of [states], a terminal, or "none", where the phase has no step
# A qualified row follows its phase's unqualified one and carries qualifiers, each matched against the
# run's fact of that key: `halt-code`, `hold-code` and `ending`. The first qualified row whose every
# qualifier matches is read, else the unqualified row. loop_table.py beside this file reads and checks them.
#
# One [[record-version]] row per typed record kind an item returns or reads (TOOL-dDeclaredLoop-24),
# read by loop_items.py beside this file:
#   kind     record-kind.<name>, a key of the memory-tree kit's record table
#   version  the kind's current version, an integer from 1; an input or a `returns` written
#            record-kind.<name>@<n> names a version, and one written without `@<n>` reads this one
#   fields   the first eight hex of the SHA-256 of the kind's row, its `required` and `closed`, as
#            canonical JSON. A row whose fields hash moved while its version did not is refused: a bump
#            re-pins it. An untyped kind reads version 1 and has no row.
#
# One [[trigger-cause]] row per cause a program's trigger admits, the closed set held as data
# (TOOL-dPlacedRequest-7): `program`, the program's tag segment, and `cause`, one word; loop_lib.py's
# `read_trigger_causes` reads a program's causes in file order, and probe.py's `trigger` refuses any other.
#
# One [[hook]] row per key of the codebase map's `git-hooks` and `harness-hooks` inventories, the stage
# claim of that hook (TOOL-dDeclaredLoop-4); stage_coverage.py beside this file joins them both ways:
#   key    the inventory key, a git hook's name or `<event> <script>`, a script under the tool root
#          spelled `{prefix}/<path>`, which the join expands to the tool root's repo-relative path
#   stage  a non-empty list of [[step]] tags, or ["none"] for a hook serving no build stage
#
# One [[item]] row per item of a gov step's program (TOOL-dDeclaredLoop-12), after every table above:
#   tag        the item's tag, `item.<step>.<name>`, a member of the `item` namespace
#   step       the [[step]] tag its tag opens; "none" for a tag `item.review.<name>`, the breakpoint
#              program's, `item.probe.<name>`, the probe program's, or `item.entry.<name>`, the entry
#              program's, each sitting in no step (TOOL-dDeclaredLoop-50, TOOL-dPlacedRequest-7, -3)
#   actor      `<kind>:<name>`, one actor of one kind: role, command, executor, hook or owner, or the
#              bare `executor` or `owner`; a role's name is its role file's stem, such as gov-builder
#   needs     the items it waits for: each entry a tag, or a list of tags any one of which meets it; []
#              for none. A need on an item outside the five programs is added by the unit declaring it.
#   inputs     `<layer tag>:<what it reads>`, the layer a tag of the playbook kit's layers.toml; a role
#              actor's absent inputs, allowance and returns are its role's
#   allowance  what it may write; a role actor's may only narrow its role's to `none`
#   returns    its return template, the record kind it writes
#   outcomes   its closed outcome set, a list of words, or "dispositions" for the set above
#   witness    what witnesses it: { class = "<class>", by = "<what>" }
#   owner      the build that owns it
#   routes     an inline table, one `<outcome> = "<target>"` per outcome: a declared item tag,
#              "transition" for a cross-step move, or "stand-in:{prefix}/<home>/<file>", today's tool
#              where the route reaches a later build. Inline, never an [item.routes] table, so the
#              tag index reads each row as one span.
#   upstream   optional, the items whose returns' `## Establishes` rows it is handed and answers in its
#              own `## Upstream`: one-line inline tables { item = "<tag>", gate = "record" | "measured" },
#              a `measured` entry with `measured-by`, a path HEAD holds, and `measured-line`, a line it
#              holds whole; an item carrying one routes the outcome `finding` (TOOL-dDeclaredLoop-29).
#              No gov row carries it: upstream.py beside this file grades and joins it.
#   seed       optional, "none" when absent: what the item's `code` slot is computed from, one of the
#              `seed` row's order in item-schema.toml beside this file, "write-set", "question-paths"
#              or "scope-paths", on a role item alone (TOOL-dPlacedRequest-8); loop_lib.py's
#              `check_item_seeds` grades it and `resolve_item_seed` turns it into paths
#   draws      optional, an inline table from an outcome to the rework budget's cause its route draws, one
#              of budget.py's CAUSES: the route is a counted edge (TOOL-dDeclaredLoop-33)
#   waits      optional, the outcomes on which the item waits on another party; an item with an owner
#              actor waits on the owner. Such an item declares both of:
#   deadline     whole hours, or "policy.<key>" naming a catalogue row of a deadline type
#   on-deadline  the outcome outside `waits` whose route it takes past the deadline
#              termination.py beside this file grades the four, and a wait or cycle whose bound a build
#              not yet landed declares stands on its termination-pending.txt.

[[step]]
tag = "step.plan"
order = 1
state = "planning"
exit = "item.plan.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.design"
order = 2
state = "designing"
exit = "item.design.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.build"
order = 3
state = "building"
exit = "item.build.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.test"
order = 4
state = "testing"
exit = "item.test.exit"
witness = { class = "history", by = "the transition record into the next step" }

[[step]]
tag = "step.deploy"
order = 5
state = "deploying"
exit = "item.deploy.close"
witness = { class = "history", by = "the transition record that closes the build" }

[witnesses]
classes = ["history", "hook-record", "remote-verdict"]
refused = ["actor"]

[[witness-alias]]
word = "machine"
means = "history"

[[witness-alias]]
word = "agent"
means = "actor"

[[computed-witness]]
name = "acceptance"
serves = "item.build.acceptance"
writer = "stand-in:{prefix}/loop/loop_witness.py"
armed-by = "dWellOiledMachine"

[[computed-witness]]
name = "probe-rerun"
serves = "item.probe.run"
writer = "stand-in:{prefix}/loop/loop_witness.py"
armed-by = "dPlacedRequest"

[[computed-witness]]
name = "red-attribution"
serves = "item.test.route"
writer = "stand-in:{prefix}/run-gates/run-gates.sh"
armed-by = "dWitnessedBar"

[[workflow]]
name = "orient"
order = 1
step = "none"
reach = "entry"

[[workflow]]
name = "reuse"
order = 2
step = "step.design"

[[workflow]]
name = "spec-write"
order = 3
step = "step.design"

[[workflow]]
name = "spec-review"
order = 4
step = "step.design"
reach = "review"

[[workflow]]
name = "build"
order = 5
step = "step.build"

[[workflow]]
name = "closing-review"
order = 6
step = "step.build"
reach = "review"

[[workflow]]
name = "gate-bar"
order = 7
step = "step.test"

[[workflow]]
name = "research"
order = 0
step = "step.plan"

[[workflow]]
name = "handoff"
order = 0
step = "none"

[[workflow]]
name = "bookkeeping"
order = 0
step = "none"

[dispositions]
set = ["continue", "amend", "new", "patch", "repeat", "unit", "breakpoint", "ask", "none"]

[[disposition-alias]]
word = "attach"
means = "amend"

[[disposition-alias]]
word = "defer"
means = "ask"

[[disposition-alias]]
word = "refuse-as-duplicate"
means = "continue"

# The mailbox's one closed kind set (KICK-dKeptSession-5 S3): the words a message's `kind` may be,
# checked by the unattended driver's `--mail post` before any commit, read through `read_mail_kinds`.
[mail]
kinds = ["confirm-request", "confirmed", "changed", "overlap", "takeover", "landed", "question", "answer", "ack",
         "intake", "withdrawn", "superseded"]

# What each value of the `attendance` policy key adds (KICK-dKeptSession-17 S2): one row per value, its keys
# exactly `value` and `adds`, each member of `adds` one of loop_lib.py's closed ATTENDANCE_INTERACTIONS, owner
# interactions only, so no row selects an actor, the driver or a binding; read through `read_attendance`.
[[attendance]]
value = "unattended"
adds = []

[[attendance]]
value = "announce"
adds = ["announce", "ask-live"]

[[attendance]]
value = "confirm-steps"
adds = ["announce", "ask-live", "confirm-step-exit"]

[[attendance]]
value = "confirm-acts"
adds = ["announce", "ask-live", "confirm-before-act"]

