# item-schema.toml — the row schema of the `item` kind (TOOL-dDeclaredLoop-24): what a repository's own
# `[[item]]` row in its overlay may hold, and which fields and rows of gov's items it may not touch.
# Read by the playbook kit's overlay_rows.py through the kinds register's `kind.item` row, and by
# loop_items.py beside this file, which joins the `[[fixed-row]]` set with the definition's step exits.
#
# [kind]: `name`, the kind, and `owner-seat`, the tag segments a repository row may hold `adopter` at, so a
# repository item is tagged item.<step>.adopter.<name>, seat 2, or item.adopter.<stage>.<name>, seat 1, an
# item of the repository's own stage step.adopter.<stage> (TOOL-dDeclaredLoop-25).
#
# One [[field]] row per key of a gov item but `tag`, which is no field: a `supersedes` composes at gov's
# tag and an `amends` carries no tag of its own, so a gov item's tag never changes. A field is open when
# it declares `widens`, the direction that widens it, and fixed otherwise: by its `fixed-by` sources, or
# by its undeclared class where it declares neither, so the fixed set is deny-by-default.
#   needs     a constraint set: removing a need widens
#   upstream  the items whose commitments it is handed, a set of one-line inline tables { item, gate }
#             (TOOL-dDeclaredLoop-29): removing an entry widens, since the item answers fewer rows. No
#             `ref`, since an entry is a table and the exclusion walk reads a ref field's members as tags;
#             no gov row carries it, so an `amends` adding it to one is held and a repository writes it on
#             its own row or in a `supersedes`
#   inputs    a read set: reading more widens
#   routes    patched whole by an `amends`, every changed route one widening
#
# One [[fixed-row]] per step's exit item and for the floor item, whose witness the runner writes: no
# repository row amends, supersedes or excludes one. Every source is a `principle=` tag, never a parser
# path, which would resolve to nothing at another install prefix.

[kind]
name = "item"
owner-seat = [2, 1]

[[field]]
name = "step"
shape = "scalar"
fixed-by = ["principle=principle.p20"]

[[field]]
name = "witness"
shape = "scalar"
fixed-by = ["principle=principle.p2"]

[[field]]
name = "outcomes"
shape = "set"
fixed-by = ["principle=principle.p24"]

[[field]]
name = "actor"
shape = "scalar"

[[field]]
name = "allowance"
shape = "scalar"

[[field]]
name = "returns"
shape = "scalar"

[[field]]
name = "owner"
shape = "scalar"

# The termination check's four fields (TOOL-dDeclaredLoop-33) declare no `widens`, so they are fixed by
# their undeclared class and every patch of one is refused naming it: `draws` and `waits` bound gov's
# cycles, so a repository row sets its own and never patches gov's, and `deadline` and `on-deadline` stay
# fixed until a numeric widening direction lands (its spec's F9).
[[field]]
name = "draws"
shape = "scalar"

[[field]]
name = "waits"
shape = "set"

[[field]]
name = "deadline"
shape = "scalar"

[[field]]
name = "on-deadline"
shape = "scalar"

[[field]]
name = "needs"
shape = "set"
ref = "needs"
widens = "remove"

[[field]]
name = "upstream"
shape = "set"
widens = "remove"

[[field]]
name = "inputs"
shape = "set"
widens = "add"

[[field]]
name = "routes"
shape = "set"
widens = "add"

# The code seed and its two neighbours, landed in one edit (TOOL-dPlacedRequest-8). A scalar's `widens`
# lists its values narrowest first, so the order IS the value set and no `values` key is written. An
# absent `seed` or `map` reads `none` and an absent `unfolds` reads empty.
[[field]]
# seed: what the item's `code` slot is computed from, each value a broader neighbourhood: none, the
# unit's declared write set, the question's paths, the design's scope paths. Only a role item declares
# one other than none; loop_lib.py's `check_item_seeds` reads this order as the value set and
# `resolve_item_seed` turns a value into paths.
name = "seed"
shape = "scalar"
widens = ["none", "write-set", "question-paths", "scope-paths"]

[[field]]
# map, the seed's neighbour: whether the item's work order fills its `map` slot (TOOL-dPlacedRequest-6)
name = "map"
shape = "scalar"
widens = ["none", "base"]

[[field]]
# unfolds: the registry words whose namespaces the map slot spells out node by node (TOOL-dPlacedRequest-6)
name = "unfolds"
shape = "set"
widens = "add"

[[fixed-row]]
tag = "item.plan.exit"
fixed-by = ["principle=principle.p20"]

[[fixed-row]]
tag = "item.design.exit"
fixed-by = ["principle=principle.p20"]

[[fixed-row]]
tag = "item.build.exit"
fixed-by = ["principle=principle.p20"]

[[fixed-row]]
tag = "item.test.exit"
fixed-by = ["principle=principle.p20"]

[[fixed-row]]
tag = "item.deploy.close"
fixed-by = ["principle=principle.p20"]

[[fixed-row]]
tag = "item.test.verdict"
fixed-by = ["principle=principle.p2"]
