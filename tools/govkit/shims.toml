# shims.toml - one [[shim]] row per surface gov has moved: a command, a hook path, a module
# import, or a flag of a script that stays (TOOL-dSafePassage-6, TOOL-dTotalRecall-20). `python
# <this kit>/shims.py --write` renders each open row's forwarder at its `from` path, and `--check`
# holds every forwarder equal to its render and every closed row's file absent. A forwarder is never
# written by hand. What an adopter sees: help/shims.md.
#
# Keys, every one required:
#   id     = "<entry>/<slug>"                         # unique, as a step id
#   kind   = "command" | "hook" | "module" | "verb"  # a module or verb row's paths end in .py
#   from   = "{prefix}/<kit>/<old path>"              # the forwarder is written here; .sh, .js or .py
#   to     = "{prefix}/<kit>/<new path>"              # what it forwards to, in the same language
#   closed = false                                    # true only once install.deprecation-window allows it
#
# A `verb` row forwards one flag of a script that stays: its `from` is the script's path and the
# flag, its `to` the target script's path and its words, each split on spaces. Its forwarder is a
# block, `run_shim_<slug>(argv)`, written inside the `from` script above its `def main(` line, and
# the script's dispatch calls it for the flag; `--check` grades the block, and a closed row's block
# must be gone. This file holds two rows, both `verb`: gen_build_index.py's `--new-build` and
# `--new-spec`, forwarded to the record door's `new build-readme` and `new spec`.
#
# A row lands with closed = false. `govkit selfcheck` refuses closed = true until at least one
# release has been cut and at least the window's count of releases have been cut since the commit
# that landed it on the default branch.

[[shim]]
id = "memory-tree/new-build-to-record"
kind = "verb"
from = "{prefix}/memory-tree/gen_build_index.py --new-build"
to = "{prefix}/memory-tree/gov_record.py new build-readme"
closed = false

[[shim]]
id = "memory-tree/new-spec-to-record"
kind = "verb"
from = "{prefix}/memory-tree/gen_build_index.py --new-spec"
to = "{prefix}/memory-tree/gov_record.py new spec"
closed = false
