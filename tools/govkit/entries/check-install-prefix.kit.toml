# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "check-install-prefix"
scope = "repo"
kind = "flat"
home = "tools"
selectable = "conditional"
why_conditional = "the runbook prescribes it only for a target that itself ships kits onward; a target that merely consumes them has nothing for it to police"
version_from = { none = "no version constant exists; measured 2026-08-11." }
requires = []
sentinel = "tools/check-install-prefix.sh"

[[files]]
include = ["check-install-prefix.sh", "check-install-prefix.test.sh"]
role = "engine"
to = "{prefix}/{relpath}"
claims = ["tools/check-install-prefix.sh", "tools/check-install-prefix.test.sh"]

[[files]]
include = ["install-prefix-waivers.txt"]
role = "generated"
to = "{prefix}/install-prefix-waivers.txt"
claims = ["tools/install-prefix-waivers.txt"]
note = "MEASURED optional: the gate is green with the file absent and with it empty. gov's own waiver rows are gov-specific and must not travel, so this is seeded empty rather than copied."

[adopt]
argv = []
mutates_index = false
why_no_adopter = "installation is a copy of a gate script plus its self-test; the waiver registry beside it is target-authored and gov never seeds it"

[[gate_leg]]
name = "install-prefix self-test"
subject = "kit"
argv = ["bash", "{prefix}/check-install-prefix.test.sh"]
guard = ["{prefix}/check-install-prefix.sh"]

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
this entry IS a gate. Its self-test is the leg, and running a gate from `check` would make `check` a second merge bar rather than a verifier of the install
"""

[[gate_leg]]
name = "install-prefix (shipped surface)"
argv = ["bash", "{prefix}/check-install-prefix.sh"]
guard = []
subject = "repo"
