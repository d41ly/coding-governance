# kit.toml — this entry, declared as data. Read by <prefix>/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "check-install-prefix"
scope = "repo"
kind = "flat"
home = "."
layer = "layer.flow"
selectable = "conditional"
why_conditional = "the runbook prescribes it only for a target that itself ships kits onward; a target that merely consumes them has nothing for it to police. Installed at such a target anyway, it grades nothing and says so: with no govkit registry it prints a SKIP line and the gate exits 0 (TOOL-aRepatriatedFork-16)"
version_from = { none = "no version constant exists; measured 2026-08-11." }
requires = []
sentinel = "check-install-prefix.sh"
# PLAY-dOrderedCharter-17: each edge to a non-core kit is a declared slot with its fallback.
optional = [
  { part = "{prefix}/check-install-prefix.sh", point = "point.flow.version", fallback = "the gate skips, said" },
  { part = "{prefix}/check-install-prefix.test.sh", point = "point.flow.version", fallback = "the registry arms skip, said" },
]

[[files]]
include = ["check-install-prefix.sh", "check-install-prefix.test.sh"]
role = "engine"
to = "{prefix}/{relpath}"
claims = ["{prefix}/check-install-prefix.sh", "{prefix}/check-install-prefix.test.sh"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "installation is a copy of a gate script plus its self-test; the gate is a pure ban and reads no sidecar, so there is nothing to seed (TOOL-aRepatriatedFork-30)"

[[gate_leg]]
tag = "leg.check-install-prefix.install-prefix-self-test"
tests = ["feature.install-prefix"]
name = "install-prefix self-test"
subject = "kit"
purpose = "arms the install-prefix ban red and green"
argv = ["bash", "{prefix}/check-install-prefix.test.sh"]
guard = ["{prefix}/check-install-prefix.sh"]
stage = ["step.test"]
enforces = ["practice.gate"]

[gate_leg.gov]
guard = ["{prefix}/", "{prefix}/lib/"]
chunk = "selftests"
ceiling = 1670

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
this entry IS a gate. Its self-test is the leg, and running a gate from `check` would make `check` a second merge bar rather than a verifier of the install
"""

[[gate_leg]]
tag = "leg.check-install-prefix.install-prefix-shipped-surface"
tests = ["feature.install-prefix"]
name = "install-prefix (shipped surface)"
subject = "repo"
purpose = "bans a kit path spelled in the shipped surface"
argv = ["bash", "{prefix}/check-install-prefix.sh"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
signature = ["bash", "{prefix}/check-install-prefix.sh", "--offenders"]
guard = []
chunk = "product"
ceiling = 2940
