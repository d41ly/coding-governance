# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "push-main"
scope = "repo"
kind = "flat"
home = "tools"
version_from = { none = "no version constant exists; measured 2026-08-11. Prescribed for copy by the runbook and detectable only by its sentinel path." }
requires = []
sentinel = "tools/push-main.sh"

[[files]]
include = ["push-main.sh", "push-main.test.sh"]
role = "engine"
to = "{prefix}/{relpath}"
claims = ["tools/push-main.sh", "tools/push-main.test.sh"]

# A verbatim repo-root destination with no prefix at all — the class the guard table calls
# "verbatim repo-root", emitted under the identity substitution.
[[files]]
include = [".githooks/pre-push", ".githooks/pre-push.test.sh"]
role = "engine"
root_relative = true
to = "{relpath}"
claims = [".githooks/pre-push", ".githooks/pre-push.test.sh"]

# The branch-guard BLOCK, not the file. The runbook's instruction is to copy that block into the
# target's own pre-commit, which is a merged-role write into a file the target owns.
[[files]]
include = [".githooks/pre-commit"]
role = "merged"
root_relative = true
to = ".githooks/pre-commit"
marker_style = "hash-comment"
block_id = "govkit:branch-guard"
# Its position is SEMANTIC — the guard reads `rc` and `top` set at the top of the
# hook and must precede the legs — so an unmarked destination REFUSES rather than
# appending. A wrong guess is a hook that exits 1 on every commit, or a guard that
# never fires; both are silent.
insert = "refuse"
claims = [".githooks/pre-commit"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "the hook is inert until the target points core.hooksPath at it, which is the wiring checker's job"

[[gate_leg]]
name = "push-main self-test"
subject = "repo"
argv = ["bash", "{prefix}/push-main.test.sh"]
guard = ["{prefix}/push-main.sh", ".githooks/"]

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the self-test is this entry's gate leg and there is no rendered artifact to compare. The branch-guard region is a `merged` rule, and its drift arm is the merged writer's, not this key's
"""
subject = "repo"

[[gate_leg]]
name = "pre-push self-test"
argv = ["bash", ".githooks/pre-push.test.sh"]
guard = [".githooks/"]

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
subject = "repo"
[[lf_pin]]
pattern = ".githooks/pre-commit"
why = "a CRLF hook does not execute"
[[lf_pin]]
pattern = ".githooks/pre-push"
why = "a CRLF hook does not execute"
