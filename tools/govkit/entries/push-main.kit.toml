# kit.toml — this entry, declared as data. Read by <prefix>/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "push-main"
scope = "repo"
kind = "flat"
home = "."
version_from = { none = "no version constant exists; measured 2026-08-11. Prescribed for copy by the runbook and detectable only by its sentinel path." }
requires = []
sentinel = "push-main.sh"

[[files]]
include = ["push-main.sh", "push-main.test.sh"]
role = "engine"
to = "{prefix}/{relpath}"
claims = ["{prefix}/push-main.sh", "{prefix}/push-main.test.sh"]

# A verbatim repo-root destination with no prefix at all — the class the guard table calls
# "verbatim repo-root", emitted under the identity substitution.
[[files]]
include = [".githooks/pre-push", ".githooks/pre-push.test.sh", ".githooks/pre_push_bar_selftest.py"]
role = "engine"
root_relative = true
to = "{relpath}"
claims = [".githooks/pre-push", ".githooks/pre-push.test.sh", ".githooks/pre_push_bar_selftest.py"]

# THE HOOK'S RUN-LOG SUITE IS WITHHELD, per TOOL-aQuenchedHarness-3. Its subject is the hook's own
# writer, which a target receives verbatim and never edits, so it has a job only where that source
# changes. Withheld by claiming the source as `project-owned`, which `apply` never lands; its leg is
# carried on gov's bar by an [[exempt_leg]] row in the deployer's registry, never a [[gate_leg]] here,
# because a descriptor row naming a leg the target cannot carry is what reds the deployer. The sibling
# suite above still ships, and changing that is not TOOL-dLoggedFlight-4's.
[[files]]
include = [".githooks/pre-push.runlog.test.sh"]
role = "project-owned"
root_relative = true
claims = [".githooks/pre-push.runlog.test.sh"]

# The branch-guard BLOCK, not the file. The runbook's instruction is to copy that block into the
# target's own pre-commit, which is a merged-role write into a file the target owns.
[[files]]
include = [".githooks/pre-commit"]
role = "merged"
root_relative = true
to = ".githooks/pre-commit"
marker_style = "hash-comment"
block_id = "govkit:branch-guard"
# Its position is SEMANTIC — the guard reads `rc` and `top` set at the top of the
# hook and must precede the legs — so an unmarked destination REFUSES rather than
# appending. A wrong guess is a hook that exits 1 on every commit, or a guard that
# never fires; both are silent.
insert = "refuse"
claims = [".githooks/pre-commit"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "the hook is inert until the target points core.hooksPath at it, which is the wiring checker's job"

# The three self-tests below are `kit`: each tests an engine file an adopter receives verbatim, self-tests run on demand only (owner, 2026-10-09), and the adopter's runner holds a `kit` leg unless GATE_SELFTESTS=1.
[[gate_leg]]
name = "push-main self-test"
subject = "kit"
argv = ["bash", "{prefix}/push-main.test.sh"]
guard = ["{prefix}/push-main.sh", ".githooks/"]

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the self-test is this entry's gate leg and there is no rendered artifact to compare. The branch-guard region is a `merged` rule, and its drift arm is the merged writer's, not this key's
"""

[[gate_leg]]
name = "pre-push self-test"
subject = "kit"
argv = ["bash", ".githooks/pre-push.test.sh"]
guard = [".githooks/"]
# Carried into an adopter's manifest at run-gates 1.2 or later, kept where the adopter raised it, and
# graded equal to gov's manifest by selfcheck 7h (DEPL-aBenchedProbe-2). The only descriptor leg with one.
ceiling = 1780

# THE BAR HARNESS, which re-disables the hook's executed-word, option, working-copy and declared arms in a copy
# on every run and observes the evasions land (TOOL-aRepatriatedFork-5, the owner's F2 ruling). It
# ships so an adopter can retire its own copy: NicoCares carried the original.
[[gate_leg]]
name = "pre-push bar self-test"
subject = "kit"
argv = ["python3", ".githooks/pre_push_bar_selftest.py"]
guard = [".githooks/"]

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = ".githooks/pre-commit"
why = "a CRLF hook does not execute"
[[lf_pin]]
pattern = ".githooks/pre-push"
why = "a CRLF hook does not execute"
