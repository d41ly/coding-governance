# --- defaulted. The render RECORDS that it defaulted, because a default silently identical to an
# --- answer is how an operator ships a value they never chose.

[[placeholder]]
key = "HELP_DIR"
class = "defaulted"
default = "help/"
why = "where the user-facing page per feature lives"

[[placeholder]]
key = "REVIEW_DIR"
class = "defaulted"
default = "memory/reviews/"
why = "where a Tier-2 run is persisted as an in-repo artifact"

[[placeholder]]
key = "PROSE_AUDIT"
class = "defaulted"
default = "none yet — the thresholds still bind"
why = "the audit script that quantifies chat-prose waste"

# ---------------------------------------------------------------- the fenceable blocks
# `when:` fences name a PROJECT PROPERTY that no kit governs, so they cannot be validated against the
# registry. This is that namespace's declaration, and `drop_blocks` in a target's deploy.toml is
# checked against it in both directions: a member naming nothing here refuses, and a fence naming
# nothing here refuses too.

[[block]]
name = "security-outbound"
why = "the outbound-call and stored-content rules. Drop them where the project has no such surface."

[[block]]
name = "cross-os"
why = "the cross-OS and toolchain section. Drop it for a single-OS team."
