# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "playbook"
scope = "repo"
kind = "flat"
version_from = { file = "coding-governance-agents.template.md", pattern = "governance-template: v", kind = "marker" }
requires = []

# ONE file as of v3.0. The charter converged and the domain companion was deleted; the customize
# companion was a deploy-time catalogue the runbook said to read and not ship, and it is now a
# renderer. What ships is the charter template, and
# the old note read:
# TWO files, not three. The customize companion is a deploy-time catalog the runbook says to read and
# not ship, and counting it is how the spec over-stated this entry for four revisions.
#
# ROLE: `seed`, not `project-owned`. Gov SUPPLIES these bytes once and the target owns them
# afterwards, which is what `seed` means. Tagged `project-owned` the entry landed zero bytes while
# sitting first in the default selection, and the placeholder hole below probed two paths nothing
# had written.
[[files]]
include = ["coding-governance-agents.template.md"]
role = "seed"
to = "{playbook_path}"
claims = ["coding-governance-agents.template.md"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "installation is a copy to an owner-chosen path; the placeholders are the hole"

[[hole]]
id = "playbook-placeholders"
kind = "authoring"
blocks_adopt = false
blocks_gate = false
why = "the placeholders span BOTH deployed files, and nothing in a target observes them — no leg reads the playbook. A probe naming only the main file was MEASURED going false-green while the companion sat unfilled, which is why both operands are named."
discharge = { command = ["bash", "-c", "! grep -qE '\\{\\{[A-Z]' \"$1\"", "--", "{playbook_path}"] }

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
installation is a copy to an owner-chosen path and there is no adopter. What needs observing is the placeholders, and that is the declared hole with its own probe
"""

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = "{playbook_dir}/coding-governance-agents.template.md"
why = "under a strict byte gate"
