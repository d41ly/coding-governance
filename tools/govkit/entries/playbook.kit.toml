# --- defaulted. The render RECORDS that it defaulted, because a default silently identical to an
# --- answer is how an operator ships a value they never chose.

[[placeholder]]
key = "HELP_DIR"
class = "defaulted"
default = "help/"
why = "where the user-facing page per feature lives"

[[placeholder]]
key = "REVIEW_DIR"
class = "defaulted"
# TOOL-aScouredKit-14, corrected. The default was `memory/reviews/`, a directory that exists in no
# tree this kit has ever produced: the memory-tree kit's own hygiene check 5 requires a review record
# to live under `<MEMORY_ROOT>/builds/<slug>/reviews/`, so the charter was defaulting every adopter
# to a location its sibling gate REFUSES. Found because a hand-edit of the rendered AGENTS.md was
# reverted by the next render — the value is declared here, and editing the render was treating a
# generated file as authored.
#
# A LITERAL, because a default is not token-expanded (`render_playbook.py` substitutes it as-is), so
# `{{MEMORY_ROOT}}` here would land verbatim in the charter. An adopter whose memory root is not
# `memory` answers `review_dir` in their own `[answers]`, which is what the `defaulted` class is for.
default = "memory/builds/<slug>/reviews/"
why = "where a Tier-2 run is persisted as an in-repo artifact; must agree with memory-tree hygiene check 5, which requires <MEMORY_ROOT>/builds/<slug>/reviews/"

[[placeholder]]
key = "ADOPTER_RULES"
class = "defaulted"
default = "- none — this repository adds no rules of its own"
why = "the project block, under `This repository's own rules`: this repository's own rules, one `- ` bullet per line, from `[charter] adopter_rules`. DEFAULTED, not asked: an asked key would refuse every adopter's next re-render until it answered, and the update would roll the kit back. The render grades each line (TOOL-aDistilledCharter-1)"

# ---------------------------------------------------------------- the fenceable blocks
# `when:` fences name a PROJECT PROPERTY that no kit governs, so they cannot be validated against the
# registry. This is that namespace's declaration, and `drop_blocks` in a target's deploy.toml is
# checked against it in both directions: a member naming nothing here refuses, and a fence naming
# nothing here refuses too.

[[block]]
name = "cross-os"
why = "the cross-OS and toolchain section. Drop it for a single-OS team."

# LEGACY blocks, kept declared for the same reason as the legacy placeholders above. A v4.0 template
# carries neither fence; a `drop_blocks` member naming one is then noted, never refused.
[[block]]
name = "node-table"
legacy = "v3"
why = "LEGACY v3.x: the one-row section 2 node table, dropped where the registry lived outside the region."

[[block]]
name = "security-outbound"
legacy = "v3"
why = "LEGACY v3.x: the outbound-call and stored-content rules, which v4.0 moved to the spec template's security checklist (TEMPLATE-SPEC.md)."
