# kit.toml — this entry, declared as data. Read by <prefix>/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "playbook"
layer = "layer.instruction"
scope = "repo"
kind = "flat"
version_from = { none = "the entry lands no file since PLAY-dOrderedCharter-31 retired its seeded template, so no file of it carries a constant; the template versions with the playbook-render kit that ships it beside its engine" }
requires = []

# NO FILE since PLAY-dOrderedCharter-31. The entry seeded the charter template at an owner-chosen
# `{playbook_path}`, a copy the render stopped reading at PLAY-dOrderedCharter-34; the renderer kit
# now lands the template beside its engine. The seed rule, its placeholder hole and its line-ending
# pin left together, and the registry's `[[retired]]` row `playbook/seeded-template` carries an
# adopter's seeded copy. What the entry still holds is the placeholder declaration the renderer
# reads, and the upgrade step that moves `[charter] adopter_rules` into the overlay.

[adopt]
argv = []
mutates_index = false
why_no_adopter = "the entry lands no file: the playbook-render kit ships the template and renders the charter"

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the entry lands no file, so there is nothing here to observe: the render's own --check grades the charter and any surviving placeholder
"""

# The step that carries `[charter] adopter_rules` into the overlay as level-0 `repo.` units
# (PLAY-dOrderedCharter-31 S4). Its `surfaces` is the declared absence: the key stays a live input of
# the render, so the step takes no member of gov's product away. Frozen once landed.
[[upgrade]]
id = "playbook/adopter-rules-to-overlay"
up = ["python", "{gov}/govkit/steps/adopter_rules_to_overlay.py", "up", "{target}"]
down = ["python", "{gov}/govkit/steps/adopter_rules_to_overlay.py", "down", "{target}"]
witness = ["python", "{gov}/govkit/steps/adopter_rules_to_overlay.py", "witness", "{target}"]
surfaces = []
needs-target = false

# ---------------------------------------------------------------- the DECLARATION the renderer reads
# Every placeholder in the charter template, in one of three classes. This array replaces the prose
# catalogue the deploy companion used to carry: a catalogue and a program are two answers to one
# question, and the catalogue is the copy that rots.
#
# NO COUNT APPEARS HERE. `render_playbook.py` quantifies over what the template actually holds and
# refuses on a placeholder no row declares, so the population is derived on every run. Two revisions
# of the spec stated a figure and both were wrong when read.

# PROJECT_NAME is ASKED: its probe answers from the RENDERING node, and measured 2026-09-23 it answered
# `vendor` at a submodule adopter. Both adopters forked this file to say so; DEPL-aRepatriatedFork-1 S2
# retires that fork. An answer outranks any probe now as well (S1).
[[placeholder]]
key = "PROJECT_NAME"
class = "asked"
why = "the repo this charter governs. ASKED, not derived: the probe names the primary checkout's directory, which is a node's layout rather than the product's name — a submodule adopter derived `vendor`"

[[placeholder]]
key = "DEFAULT_BRANCH"
class = "derived"
probe = "default_branch"
why = "the shared integration branch, observed from the remote rather than assumed to be main"

[[placeholder]]
key = "MEMORY_ROOT"
class = "derived"
probe = "memory_root"
why = "the memory tree's root, from the memory-tree conf that already declares it"

[[placeholder]]
key = "MEMORY_DISCIPLINES"
class = "derived"
probe = "memory_disciplines"
why = "the closed stream enum, from the same conf — never a list of directories"

[[placeholder]]
key = "ID_FAMILIES"
class = "derived"
probe = "id_families"
why = "the id families, from the same conf, so the charter and the records share one scheme"

[[placeholder]]
key = "CI_FILE"
class = "derived"
probe = "ci_file"
why = "the workflow file the bar is wired into"

[[placeholder]]
key = "GATE_RUNNER"
class = "derived"
probe = "gate_runner"
why = "the one command that runs the whole local bar"

[[placeholder]]
key = "LEXICON_CONF"
class = "derived"
probe = "lexicon_conf"
kit = "lexicon"
why = "the naming declaration's path; only reachable when the lexicon block survives"

[[placeholder]]
key = "NODE_TABLE"
class = "derived"
probe = "node_table"
why = "the section-3 node registry, one row per node of the fleet registry beside the engine (`fleet.toml`), with the repository's `[nodes.<tag>]` overrides. Gov is the one allocator, so a machine carries one tag in every adopter (TOOL-aDistilledCharter-2). It replaced TAG_A, MACHINE_A, PRIMARY_TREE_A, WORKTREE_ROOT_A and VARIANCES_A, which rendered one row from whichever node ran the render"

[[placeholder]]
key = "ROLE_ROSTER"
class = "derived"
probe = "role_roster"
kit = "roles"
why = "the Agent roles section: one `- ` line per role, printed by the roles kit's own `roster` verb so that kit stays the one reader of role files; only reachable when the roles block survives (TOOL-aOrientedCast-18)"

# --- LEGACY: names a v3.x template uses and v4.0 does not. KEPT DECLARED (TOOL-aDistilledCharter-2
# rev-2, closing review round 1, R1): an adopter's template is a SEED that `govkit update` never
# rewrites, so after an update the v4.0 engine renders the adopter's v3.x template, and a refusal on
# one of these names rolls the kit back. They resolve exactly as they did; the render notes a v3.x
# marker and asks for a reseed.

[[placeholder]]
key = "TAG_A"
class = "defaulted"
default = "a"
legacy = "v3"
why = "LEGACY v3.x: the node tag of the one-row section 2 table. v4.0 renders every node from the fleet registry (NODE_TABLE)"

[[placeholder]]
key = "MACHINE_A"
class = "asked"
legacy = "v3"
why = "LEGACY v3.x: the one-row table's machine and user. Stated, never sniffed from the environment"

[[placeholder]]
key = "PRIMARY_TREE_A"
