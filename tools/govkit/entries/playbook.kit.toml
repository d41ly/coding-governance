# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "playbook"
scope = "repo"
kind = "flat"
version_from = { file = "coding-governance-agents.template.md", pattern = "governance-template: v", kind = "marker" }
requires = []

# ONE file as of v3.0. The charter converged and the domain companion was deleted; the customize
# companion was a deploy-time catalogue the runbook said to read and not ship, and it is now a
# renderer. What ships is the charter template, and
# the old note read:
# TWO files, not three. The customize companion is a deploy-time catalog the runbook says to read and
# not ship, and counting it is how the spec over-stated this entry for four revisions.
#
# ROLE: `seed`, not `project-owned`. Gov SUPPLIES these bytes once and the target owns them
# afterwards, which is what `seed` means. Tagged `project-owned` the entry landed zero bytes while
# sitting first in the default selection, and the placeholder hole below probed two paths nothing
# had written.
[[files]]
include = ["coding-governance-agents.template.md"]
role = "seed"
to = "{playbook_path}"
claims = ["coding-governance-agents.template.md"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "installation is a copy to an owner-chosen path; the placeholders are the hole"

[[hole]]
id = "playbook-placeholders"
kind = "authoring"
blocks_adopt = false
blocks_gate = false
why = "the placeholders span BOTH deployed files, and nothing in a target observes them — no leg reads the playbook. A probe naming only the main file was MEASURED going false-green while the companion sat unfilled, which is why both operands are named."
discharge = { command = ["bash", "-c", "! grep -qE '\\{\\{[A-Z]' \"$1\"", "--", "{playbook_path}"] }

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
installation is a copy to an owner-chosen path and there is no adopter. What needs observing is the placeholders, and that is the declared hole with its own probe
"""

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = "{playbook_dir}/coding-governance-agents.template.md"
why = "under a strict byte gate"

# ---------------------------------------------------------------- the DECLARATION the renderer reads
# Every placeholder in the charter template, in one of three classes. This array replaces the prose
# catalogue the deploy companion used to carry: a catalogue and a program are two answers to one
# question, and the catalogue is the copy that rots.
#
# NO COUNT APPEARS HERE. `render_playbook.py` quantifies over what the template actually holds and
# refuses on a placeholder no row declares, so the population is derived on every run. Two revisions
# of the spec stated a figure and both were wrong when read.

[[placeholder]]
key = "PROJECT_NAME"
class = "derived"
probe = "project_name"
why = "the repo this charter governs"

[[placeholder]]
key = "DEFAULT_BRANCH"
class = "derived"
probe = "default_branch"
why = "the shared integration branch, observed from the remote rather than assumed to be main"

[[placeholder]]
key = "MEMORY_ROOT"
class = "derived"
probe = "memory_root"
why = "the memory tree's root, from the memory-tree conf that already declares it"

[[placeholder]]
key = "MEMORY_DISCIPLINES"
class = "derived"
probe = "memory_disciplines"
why = "the closed stream enum, from the same conf — never a list of directories"

[[placeholder]]
key = "ID_FAMILIES"
class = "derived"
probe = "id_families"
why = "the id families, from the same conf, so the charter and the records share one scheme"

[[placeholder]]
key = "CI_FILE"
class = "derived"
probe = "ci_file"
why = "the workflow file the bar is wired into"

[[placeholder]]
key = "GATE_RUNNER"
class = "derived"
probe = "gate_runner"
why = "the one command that runs the whole local bar"

[[placeholder]]
key = "LEXICON_CONF"
class = "derived"
probe = "lexicon_conf"
kit = "lexicon"
why = "the naming declaration's path; only reachable when the lexicon block survives"

[[placeholder]]
key = "TAG_A"
class = "derived"
probe = "node_tag"
why = "this node's registry tag"

[[placeholder]]
key = "MACHINE_A"
class = "derived"
probe = "machine"
why = "this node's machine and user, which is how a node identifies itself — never a path"

[[placeholder]]
key = "PRIMARY_TREE_A"
class = "derived"
probe = "primary_tree"
why = "where the default branch lives on this node"

[[placeholder]]
key = "WORKTREE_ROOT_A"
class = "derived"
probe = "worktree_root"
why = "where this node's per-unit worktrees are rooted"

# --- asked. The renderer refuses rather than guessing; that posture is govkit's, inherited here.

[[placeholder]]
key = "VARIANCES_A"
class = "asked"
why = "this node's per-node quirks — a credential scope, a harness launch config. NOT derivable even for the current node: it is knowledge the operator has and the tree does not"

[[placeholder]]
key = "STREAM_OWNERSHIP"
class = "asked"
why = "which node owns which stream"

[[placeholder]]
key = "DOC_ROUTING_TABLE"
class = "asked"
why = "work-area to doc tree to id families to backlog"

[[placeholder]]
key = "PRODUCT_PREAMBLE"
class = "asked"
why = "what the software is, its deployment model, its major runtime pieces"

[[placeholder]]
key = "REPO_LAYOUT_MAP"
class = "asked"
why = "each top-level dir and its role, so sessions never re-derive where things live"

[[placeholder]]
key = "COMMAND_CATALOG"
class = "asked"
why = "the one-true invocation for install, dev, migrations, seeding, format and lint"

[[placeholder]]
key = "PRODUCT_CONTEXT_HOME"
class = "asked"
why = "where business and product context lives, so sessions locate it instead of asking"

[[placeholder]]
key = "GATE_COMMANDS"
class = "asked"
why = "the merge bar's legs. Derivable-looking and deliberately asked: a wrong gate list is a charter that lies about what green means"

[[placeholder]]
key = "COMMIT_TRAILER"
class = "asked"
