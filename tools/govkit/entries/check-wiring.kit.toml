# kit.toml — this entry, declared as data. Read by <prefix>/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "check-wiring"
scope = "repo"
kind = "flat"
home = "."
version_from = { file = "check-wiring.sh", pattern = "^KIT_CHECK_WIRING_VERSION=" }
requires = []
requires_if = [{ kit = "push-main", why = "TOOL-aLevelledCopy-8: the ssh arm DERIVES core.sshCommand from push-main.sh's one GOV_SSH_KEEPALIVE= definition line, read with sed and never sourced. It degrades to `skip` where push-main is absent, and to a named UNWIRED, whose remedy is updating the push-main kit, where an installed push-main.sh predates that line. A plain `requires` cannot close that skew, since an older push-main still satisfies it, and would refuse every check-wiring selection without the lander. This row is a DECLARATION `govkit selfcheck` grades and nothing else: it installs nothing, orders nothing and couples no update. No condition key: the edge holds wherever push-main is installed" }]

# The fragment is what makes the SessionStart entry RE-MATCHABLE by the merger: `check-wiring.sh
# --session` used to be wired by hand with no matcher, so it ran on every compaction. It is NOT
# graded: `check-wiring.sh`'s `check_card` reads only the two card fragments' matchers, and no arm
# reads this entry's — a hand narrowing to `startup` passes green until the next merge re-matches
# it (the aReplayedCard closing review, F12). It is `{here}`-relative because this kit is flat. It
# is in the include list AND in `claims`, because rule 4b reds a rule whose resolved destination is
# not among its own claims. TOOL-aReplayedCard-2.
[[files]]
include = ["check-wiring.sh", "check-wiring.test.sh", "check-wiring.fragment.json"]
role = "engine"
to = "{prefix}/{relpath}"
claims = ["{prefix}/check-wiring.sh", "{prefix}/check-wiring.test.sh", "{prefix}/check-wiring.fragment.json"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "it IS the wiring checker; the runbook wires its self-test as a leg and explicitly warns against running the checker itself as a merge-bar leg"

[[gate_leg]]
name = "check-wiring self-test"
subject = "kit"
argv = ["bash", "{prefix}/check-wiring.test.sh"]
guard = ["{prefix}/check-wiring.sh", "{prefix}/check-wiring.test.sh"]

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
it IS the wiring checker. The runbook explicitly warns against running it as a merge-bar leg; running it from `check` is the same mistake through a different door. Its self-test is the leg
"""
