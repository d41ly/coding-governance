# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "kickoff-manifest"
scope = "repo"
kind = "flat"
home = "skills/session-kickoff"
version_from = { file = "manifest-check.sh", pattern = "^KIT_MANIFEST_VERSION=" }
requires = []

[[files]]
include = ["manifest-check.sh"]
role = "engine"
to = "{prefix}/manifest-check.sh"

[[files]]
include = ["MANIFEST-TEMPLATE.md"]
role = "seed"
to = "{manifest_path}"

# Machine-scoped: the engine installs ONCE PER MACHINE as a junction outside the target repo, so
# `apply` writes nothing for it and emits an order instead.
[[files]]
include = ["SKILL.md"]
role = "engine"
scope = "machine"
link = true
to = "{user_skills}/session-kickoff"

[adopt]
argv = []
mutates_index = false
why_no_adopter = "installation is a copy plus a per-machine link; the manifest's own section B is the hole"

[[gate_leg]]
# TOOL-aScouredKit-12. The PATH IS PASSED, because the engine cannot derive it. `manifest-check.sh`
# resolves the manifest from a hardcoded two-element list and reads MEMORY_ROOT zero times, while
# the seed above lands at the target-supplied `{manifest_path}` that nothing validates and intake
# refuses to invent. At any answer but gov's own the leg exited 2 forever, on `guard = []`, printing
# a remedy that told the adopter to move the manifest out of their declared memory root — and this
# entry is in the registry's DEFAULT selection. The script already accepts and grades a path as $1.
name = "kickoff-manifest ratchet"
subject = "repo"
argv = ["bash", "{prefix}/manifest-check.sh", "{manifest_path}"]
guard = []
history_depth = "full"
red_after_land = true

[[hole]]
id = "manifest-section-b"
kind = "authoring"
blocks_adopt = false
blocks_gate = true
why = "MEASURED: the ratchet exits 1 on a copied-and-unfilled template, failing its placeholder check and its stamp check together, and exits 2 with no manifest at all. There is no install of this kit that leaves its leg at exit 0 without an authoring step. The probe is the WHOLE check, not the placeholder grep: filling every placeholder and stamping a well-formed but foreign sha passes the grep and still reds the leg."
# TOOL-aScouredKit-12, second half. The LEG above gained `{manifest_path}` and this probe did
# not, eleven lines below it — so the hole stayed undischarged forever at any non-gov answer
# and `exempt_leg` would then grant the newly-fixed leg a standing red-after-install
# exemption. Caught by this build's own closing review. One token, twice.
discharge = { command = ["bash", "{prefix}/manifest-check.sh", "{manifest_path}"] }

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
installation is a copy. The ratchet is this entry's gate LEG and grading it from `check` would run a gate; the authoring step it needs is the declared hole, and the hole's probe is what observes it
"""

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = "{user_skills}/session-kickoff/SKILL.md"
why = "measured: 224 CR bytes under a gate that greps its text"
