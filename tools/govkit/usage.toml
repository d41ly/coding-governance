# usage.toml — each user-facing member's declared usage, read by `<prefix>/govkit/docs_leg.py` beside
# this file and by nothing else (TOOL-dSafePassage-13).
#
# One `[[class]]` row per class of `surface-classes.toml`: `class`, its id there; `usage`, the
# shape of its members' usage (`verb`, `key`, `hook`, `leg`, `page` or `none`); `rows`, where the
# members' rows come from, a reader `<path under the tool root>:<function>` over the registry that
# already states them, or `usage.toml`, the `[[usage]]` rows below; and a `why`. A `page` or
# `none` class carries no `rows`.
#
# A `[[usage]]` row is `id`, `shape` and the shape's fields: a `verb` row's `entry`, `verb` and
# `flags` (a trailing `=` takes a value), a `key` row's `values` and `default`. It is written only
# for a member whose own registry states no usage, or for a `script:<path>[#<verb>]` a page under
# `help/` shows that no class holds. A row a class's reader already returns is a finding.
#
# A CLASS JOINS BY ADDING ITS ROW: a registered class with no row here is a finding, and so is a
# shaped class with no `rows`.

[[class]]
class = "file"
usage = "none"
why = "an installed file's user-facing usage is the command or hook that runs it, graded in its own class"

[[class]]
class = "installable"
usage = "none"
why = "the same: a destination is graded through the command, hook or key that reaches it"

[[class]]
class = "hook"
usage = "hook"
rows = "govkit/docs_leg.py:read_hook_usage"
why = "a hook is its event and its matcher, which its fragment states"

[[class]]
class = "command"
usage = "verb"
rows = "usage.toml"
why = "a Skill is its name and its arguments, which no registry states"

[[class]]
class = "agent"
usage = "page"
why = "a role agent is graded for presence on a page"

[[class]]
class = "conf"
usage = "key"
rows = "usage.toml"
why = "a conf key is its values and its default, which no registry states in one place"

[[class]]
class = "policy"
usage = "key"
rows = "govkit/docs_leg.py:read_policy_usage"
why = "a policy key is its allowed values and its default, which its catalogue row states"

[[class]]
class = "verb"
usage = "verb"
rows = "govkit/docs_leg.py:read_verb_usage"
why = "a CLI verb is a verb and its flags, which its declared usage text states"

[[class]]
class = "entry"
usage = "page"
why = "a registry entry is graded for presence on a page"

