# registry.toml — the deployable population, as a DECLARATION.
#
# Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/ (S2, S12, AC10).
#
# WHY THIS IS NOT A DIRECTORY LISTING. No listing equals the deployable set, and the ways it fails
# are not symmetric. Some `<prefix>/*` directories are not deployable (`<prefix>/lib/`, the gate-runner
# cluster). Some entries are not `<prefix>/*` directories at all: the playbook is root files, the
# kickoff ratchet lives under `skills/`, and several single-file gates sit directly under `<prefix>/`.
# One directory carries TWO entries, because `<prefix>/workflows/` versions its files under two kit ids.
# `map_extractors._tool_kits()`'s own docstring records the same lesson from the other side:
# README-gating "would have silently dropped three of ten".
#
# NO COUNT APPEARS IN THIS FILE OR IN THE SPEC. `selfcheck` derives every population figure over the
# tracked surface. The spec stated two counts across its life and both were true when measured and
# false when read.
#
# EVERY tracked path in the asserted surface is an ENTRY, a member of exactly one entry's [[files]],
# or an EXEMPT row with a non-empty reason. `selfcheck` asserts that in both directions and reds on
# an exemption whose path no longer exists.

version = 1

# The surface `selfcheck` quantifies over (spec S12). Depth-1 under <prefix>/, everything under the
# hook and kickoff trees, and the shipped root playbook files.
[surface]
globs = [
  "{prefix}/*",
  ".githooks/**",
  "skills/session-kickoff/**",
  "coding-governance-agents.template.md",
]

# The DEFAULT selection, declared here rather than in the engine. `--all` is DERIVED (every
# non-conditional entry) and is deliberately not written down anywhere.
[selection]
# One id per line: these are entry ids, and a comma-joined run of quoted kit names reads to the
# carried-prefix ban as a path assembled from quoted segments.
default = [
  "playbook",
  # PLAY-dOrderedCharter-31 S11: the renderer ships the template `check-microformats` grades, so it
  # ships with every default install.
  "playbook-render",
  "kickoff-manifest",
  "memory-tree",
  # PLAY-dOrderedCharter-78 S1: `playbook-render` requires the policy kit, so the default carries it.
  "policy",
  "codebase-map",
  "memory-recall",
  "run-gates",
  "check-microformats",
  # TOOL-aRoutedQuill-5 S1: the write gate and the fan-out cap ship with every default install, wired
  # by settings-merge, and check-wiring reports an install left unwired or unarmed.
  "agent-cap",
  "settings-merge",
  "check-wiring",
  # TOOL-aOrientedCast-8 S1: the role catalogue, its agent types and the `/build` Skill bind only
  # where they are installed and rendered, so the roles kit ships with every default install.
  # TOOL-dDeclaredLoop-36 S1: `roles` requires `loop`, whose definition the catalogue checker and
  # the adopter of `roles` read each workflow's order from, so the default carries `loop` too.
  "loop",
  "roles",
]

