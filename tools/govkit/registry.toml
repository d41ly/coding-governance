id = "check-line-length"
descriptor = "tools/govkit/entries/check-line-length.kit.toml"

[[entry]]
id = "check-microformats"
descriptor = "tools/govkit/entries/check-microformats.kit.toml"

[[entry]]
id = "playbook-render"
descriptor = "tools/playbook/kit.toml"

[[entry]]
id = "memory-tree"
descriptor = "tools/memory-tree/kit.toml"

[[entry]]
id = "codebase-map"
descriptor = "tools/codebase-map/kit.toml"

[[entry]]
id = "memory-recall"
descriptor = "tools/memory-recall/kit.toml"

[[entry]]
id = "run-gates"
descriptor = "tools/run-gates/kit.toml"

[[entry]]
id = "drift-audit"
descriptor = "tools/drift-audit/kit.toml"

[[entry]]
id = "agent-instructions"
descriptor = "tools/agent-instructions/kit.toml"

[[entry]]
id = "unattended"
