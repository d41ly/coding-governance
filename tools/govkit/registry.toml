# ------------------------------------------------------------------------------------- succession
# TOOL-dSafePassage-1 S2. A `[[retired]]` row names an entry id or an upgrade-step id that left the
# live population: `id`, `successor` (a live id of the same kind, or "none") and `surfaces`. The
# retiring commit is DERIVED from the default branch's first-parent history and never typed. `update`
# and `check` read these rows through `<prefix>/govkit/upgrade_steps.py`, never here: a claimed kit
# with a successor is carried to it, one retired to "none" is released and its rows read
# `withdrawn`. A landed row is frozen. A target's `kits` naming a retired id reads as its successor
# (PLAY-dOrderedCharter-31 S10).

# PLAY-dOrderedCharter-31 S1: the renderer's `entry-files` scope absorbed the kit's wiring.
[[retired]]
id = "agent-instructions"
successor = "playbook-render"
surfaces = [
  "entry:agent-instructions",
  "file:{prefix}/agent-instructions/README.md",
  "file:{prefix}/agent-instructions/adopt-agent-instructions.sh",
  "file:{prefix}/agent-instructions/kit.toml",
  "installable:{prefix}/agent-instructions/README.md",
  "installable:{prefix}/agent-instructions/adopt-agent-instructions.sh",
  "installable:{prefix}/agent-instructions/kit.toml",
]

# PLAY-dOrderedCharter-31 S5: the `playbook` entry's seed rule, which copied the charter template to
# `{playbook_path}`. The renderer kit ships the template beside its engine; an adopter's copy reads
# `retired-edited` or `withdrawn` at `update`.
[[retired]]
id = "playbook/seeded-template"
successor = "none"
surfaces = ["file:coding-governance-agents.template.md", "installable:{playbook_path}"]

# TOOL-dWitnessedBar-18: the playbook kit's `project-owned` seed of `instructions-legacy.txt`, which the
# kit's directory held. The list moved to its ledger home under the memory root, registered in this
# registry, gov-only; the kit seeds it no more, and an adopter's copy is released.
[[retired]]
id = "playbook/instructions-legacy-seed"
successor = "none"
surfaces = ["file:{prefix}/playbook/instructions-legacy.txt"]

# TOOL-dWitnessedBar-111, on the owner's ruling: the adopter-rules step's landed witness held each
# converted rule to its text, so an instruction edit of a rule read as the step un-applied. Its
# successor keeps the frozen up and down and reads a rule by its derived tag as well.
[[retired]]
id = "playbook/adopter-rules-to-overlay"
successor = "playbook/adopter-rules-to-overlay-2"
surfaces = []

# ------------------------------------------------------------------------------------- exemptions
# Each carries a non-empty reason. `selfcheck` reds on an exemption whose path no longer exists, so
# a stale exemption cannot quietly widen the surface.

[[exempt]]
path = "{prefix}/line-length-limits.txt"
why = "gov's OWN declaration, deliberately not shipped. It names gov's two subjects, neither of which exists in an adopter tree, where a row naming an absent path is a stale red — so seeding it would red an adopter on install day. The target authors its own, and a subject with no row is graded at the 450 default."

[[exempt]]
path = "{prefix}/lib"
why = """
Not a kit. It has no README, no version constant and no adopter, and it ships nothing: it is
gov-internal. `resolve-python.sh` is the canon every inline copy in every kit is gated against. The gate-runner
cluster USED to be exempt because it sourced this path at runtime and so could not travel;
the aPacedTurnstile build's spec set under `memory/builds/aPacedTurnstile/spec/` inlined the canonical block into every shipped file that had one and promoted
run-gates to an entry, so that reason is retired rather than repeated. TOOL-aSealedCaravan-1 S9 gave the memory-tree kit its own
launcher, so nothing under here ever needs to travel. The `merge.rows.driver` argument earlier
revisions of the spec gave for this exemption is STALE and is not repeated: that config now names a
kit-internal launcher.
"""

[[exempt]]
path = "{prefix}/gate-legs.json"
why = "gov's own leg manifest. Gov-specific by construction; a target's leg list is emitted from the selected kits' [[gate_leg]] blocks, never copied."

[[exempt]]
path = "{prefix}/check-template-size.sh"
why = "gates gov's OWN product template, defaulting to the playbook at the repo root. Prescribed for copy nowhere in the runbook, and an adopter's instantiated playbook carries no size ceiling."

[[exempt]]
path = "{prefix}/check-spec-tokens.py"
why = """
grades gov's OWN spec corpus against gov's OWN gate manifest. Its leg join reads <prefix>/gate-legs.json,
which registry.toml already exempts as gov-specific by construction, and its waiver registry is seeded
from THIS tree's measured hits. An adopter's specs are theirs and their manifest lives elsewhere;
shipping this would red on install day for a population gov never measured. Prescribed for copy nowhere.
"""

[[exempt]]
path = "{prefix}/check-spec-tokens.test.sh"
why = "the red/green self-test for the above, which is itself an exemption. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
path = "{prefix}/chain-packet.py"
why = """
the front door for gov's OWN chain packets: it runs the packet instrument under the dClosedLoop
build's `build/` folder, a record of THIS tree's memory, and is bound to that instrument's blobs.
An adopter holds no such instrument and no chain, so there is nothing for it to open. It serves
check-spec-tokens.py's packet join, itself exempt above. Prescribed for copy nowhere. TOOL-aBatchedPacket-1.
"""

[[exempt]]
path = "{prefix}/chain-packet.test.sh"
why = "the red/green self-test for the above, which is itself an exemption. Exemptions are exact-path, so the door's row does not cover its sibling."

[[exempt]]
path = "{prefix}/check-kit-placeholders.py"
why = """
grades a kit-AUTHORING invariant, and an adopter does not author kit descriptors — they receive
them copy-installed. The join is declared-placeholders subset-of substituted-by-that-kit's-own-adopter,
so the defect it catches is one gov ships; catching it in the adopter's tree is one release too
late, and the adopter cannot fix it there without forking the descriptor. That is the fork class
this whole build exists to stop manufacturing. Prescribed for copy nowhere in the runbook.
"""

[[exempt]]
path = "{prefix}/check-kit-placeholders.test.sh"
why = "the red/green self-test for the above, which is itself an exemption. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
path = "{prefix}/check-dead-paths.sh"
why = """
gates gov's OWN corpus against gov's OWN deletion and rename history. The needle set is derived from `git log --diff-filter=D` over this repo, plus the source of every `--diff-filter=R` row outside memory/ (TOOL-aRepatriatedFork-45), and each half's anti-vacuity guard is a FROZEN SENTINEL naming a basename this repo deleted or renamed away at 5b00666 — in a target tree neither name was ever present, so neither sentinel could resolve and the leg would red on install day. That is the exact defect the closing review filed against three other new gates; shipping this one would repeat it. An adopter who wants the class authors their own sentinels from their own deletion and rename history.
"""

[[exempt]]
path = "{prefix}/check-dead-paths.test.sh"
why = "the red/green self-test for the above, which is itself exempt. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
path = "{prefix}/check-remote-literals.sh"
why = "gates gov's OWN kit source: a kit file that names a remote by literal is a defect gov ships, so catching it in an adopter's tree is one release too late and unfixable there without forking the kit. An adopter's own scripts and their remote names are theirs. Prescribed for copy nowhere in the runbook (TOOL-dLadderedRemote-3)."

[[exempt]]
path = "{prefix}/check-remote-literals.test.sh"
why = "the red/green self-test for the above, which is itself exempt. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
