why = "gates gov's OWN product playbook against gov's OWN tree — it derives the kit population from this repo's <prefix>/ and compares values against the sources in this repo that own them. Prescribed for copy nowhere in the runbook; an adopter's instantiated playbook has no kit population to check."

[[exempt]]
path = "{prefix}/check-playbook-parity.test.sh"
why = "the red/green self-test for the above, which is itself exempt. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
