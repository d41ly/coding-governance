# ------------------------------------------------------------------------------------- exemptions
# Each carries a non-empty reason. `selfcheck` reds on an exemption whose path no longer exists, so
# a stale exemption cannot quietly widen the surface.

[[exempt]]
path = "tools/line-length-limits.txt"
why = "gov's OWN declaration, deliberately not shipped. It names gov's two subjects, neither of which exists in an adopter tree, where a row naming an absent path is a stale red — so seeding it would red an adopter on install day. The target authors its own, and a subject with no row is graded at the 450 default."

[[exempt]]
path = "tools/lib"
why = """
Not a kit. It has no README, no version constant and no adopter, and it ships nothing: it is
gov-internal. `resolve-python.sh` is the canon every inline copy in every kit is gated against. The gate-runner
cluster USED to be exempt because it sourced this path at runtime and so could not travel;
the aPacedTurnstile build's spec set under `memory/builds/aPacedTurnstile/spec/` inlined the canonical block into every shipped file that had one and promoted
run-gates to an entry, so that reason is retired rather than repeated. TOOL-aSealedCaravan-1 S9 gave the memory-tree kit its own
launcher, so nothing under here ever needs to travel. The `merge.rows.driver` argument earlier
revisions of the spec gave for this exemption is STALE and is not repeated: that config now names a
kit-internal launcher.
"""

[[exempt]]
path = "tools/gate-legs.json"
why = "gov's own leg manifest. Gov-specific by construction; a target's leg list is emitted from the selected kits' [[gate_leg]] blocks, never copied."

[[exempt]]
path = "tools/check-template-size.sh"
why = "gates gov's OWN product template, defaulting to the playbook at the repo root. Prescribed for copy nowhere in the runbook, and an adopter's instantiated playbook carries no size ceiling."

[[exempt]]
path = "tools/check-dead-paths.sh"
why = """
gates gov's OWN corpus against gov's OWN deletion history. The needle set is derived from `git log --diff-filter=D` over this repo, and the anti-vacuity guard is a FROZEN SENTINEL naming a basename this repo deleted at 5b00666 — in a target tree that name was never present, so the sentinel could not resolve and the leg would red on install day. That is the exact defect the closing review filed against three other new gates; shipping this one would repeat it. An adopter who wants the class authors their own sentinel from their own deletion history.
"""

[[exempt]]
path = "tools/check-dead-paths.test.sh"
why = "the red/green self-test for the above, which is itself exempt. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
path = "tools/dead-path-waivers.txt"
why = "the shrink-only waiver registry the gate above CONSUMES. Its rows are gov paths and gov line numbers; seeded from this repo's measured population, meaningless in any other tree."

[[exempt]]
path = "tools/check-playbook-parity.sh"
why = "gates gov's OWN product playbook against gov's OWN tree — it derives the kit population from this repo's tools/ and compares values against the sources in this repo that own them. Prescribed for copy nowhere in the runbook; an adopter's instantiated playbook has no kit population to check."

[[exempt]]
path = "tools/check-playbook-parity.test.sh"
why = "the red/green self-test for the above, which is itself exempt. Exemptions are exact-path, so the gate's row does not cover its sibling."

[[exempt]]
path = "tools/playbook-kit-waivers.txt"
why = "the declared exemption list the playbook-parity gate READS: kit dirs deliberately not named in the shipped charter template. Gov-specific by construction — it enumerates gov's own tools/ population — and prescribed for copy nowhere in the runbook."

[[exempt]]
path = "tools/check-template-size.test.sh"
why = "gov's own red/green self-test for the template size gate, which is itself exempt: it gates gov's product template and is prescribed for copy nowhere in the runbook. Exemptions are exact-path, so the gate's row does not cover its sibling — the run-gates.sh / .test.sh / .evidence.test.sh trio is the precedent."

[[exempt]]
path = "tools/template-size-limits.txt"
why = "the DECLARED size ceilings for gov's own charter template, kickoff engine and rendered charter, read by check-template-size.sh, which is itself exempt for the same reason. An adopter's instantiated playbook carries no size ceiling and therefore no declaration of one."

[[exempt]]
path = "tools/template-size-highwater.txt"
why = "the size gate's high-water record, keyed by measured file. Travels with check-template-size.sh, which is exempt for the same reason: it gates gov's own product template and is prescribed for copy nowhere. Exemptions are exact-path, so the gate's row does not cover this one."

[[exempt]]
path = "tools/govkit"
why = "the deployer itself. It runs on the deployer machine and is never installed into a target, so it is an entry of nothing. Stated rather than omitted, because the surface assertion would otherwise red on it."

[[exempt]]
path = ".githooks/pre-commit.test.sh"
why = "gov's own red/green self-test of the reference branch-guard block. The runbook prescribes copying the BLOCK into the target's own pre-commit, not this file."

[[exempt]]
path = "skills/session-kickoff/manifest-check.test.sh"
why = "not prescribed for copy anywhere in the runbook, unlike the check-wiring and push-main self-tests which are. The asymmetry is deliberate here and recorded as an open question in the spec rather than resolved by guessing."

[[exempt_leg]]
name = "charter size"
why = "it measures THIS repo's own rendered charter against a row in tools/template-size-limits.txt. The gate script is itself a registry exemption rather than an entry file, and the subject is a repo-root artifact no kit ships, so there is no descriptor for the leg to be claimed by."

[[exempt_leg]]
name = "branch-guard self-test"
why = """
gov's own red/green proof of the reference branch-guard block. The runbook prescribes copying the BLOCK into the target's own pre-commit, not this file, and the path it drives is already a registry exemption for that reason.
"""

[[exempt_leg]]
name = "recall floor"
why = """
gov's own recall-quality floor. The question set it grades is keyed on gov record ids and the value it compares against was MEASURED on this corpus, so both are meaningless in an adopter's tree — a pin copied from another corpus is the class `memory/gotchas/pin-copied-from-another-corpus.md` names. `tools/memory-recall/kit.toml` withholds `check-recall.py` and `recall-fixture.json` from the payload with a `project-owned` rule, so an adopter never receives the program this leg runs. An adopter who wants a floor authors their own fixture and measures their own value; that adoption path is the parked half of `TOOL-aWalkedCorpus-3` section 8.
"""

[[exempt_leg]]
name = "recall floor arms"
why = """
the arms for the leg above, and gov-only for the same reason plus a sharper one: each arm is keyed on a specific gov record id (`TOOL-aWrittenMethod-4`, `TOOL-aMouldedFolio-1`, `TOOL-aStandingWrit-2`) and on literals measured against this corpus, so in any other tree they would red on absence rather than on behaviour. Withheld by the same `project-owned` rule. This is why they do NOT live in `selftest.py`, which DOES ship and DOES run on an adopter's bar.
"""

[[exempt_leg]]
name = "dead-path carriers (deleted files still named)"
why = """
gov's own dead-path scan. Its needle set is derived from this repo's deletion history and it is anchored on a frozen sentinel basename only this repo ever had, so the script is a registry exemption rather than an entry file and there is no descriptor for the leg to be claimed by.
"""

[[exempt_leg]]
name = "dead-path carriers self-test"
why = """
the arms for the leg above, gov-only for the same reason. Its fixtures construct real deletion histories containing gov's sentinel basename, which is a fact about this repo rather than about the predicate.
"""

[[exempt_leg]]
name = "govkit selfcheck"
why = """
the deployer grading its own declarations. It runs on the deployer machine and is never installed into a target, so there is nothing in an adopter for it to check.
"""

[[exempt_leg]]
name = "govkit selftest"
why = """
the deployer's own arms. Same reason as its selfcheck: the deployer does not travel.
"""

[[exempt_leg]]
name = "manifest-check self-test"
why = """
gov's own red/green proof of the ratchet. The ratchet ITSELF is deployed and is claimed by the kickoff-manifest entry; this self-test is not prescribed for copy anywhere in the runbook, and that asymmetry is deliberate.
"""

[[exempt_leg]]
name = "python resolver (behaviour + inline parity + idiom ban)"
why = """
grades tools/lib/, the permanently exempt gov-internal directory, plus the inline copies every kit already carries. Nothing here travels, and the parity it asserts is asserted before the kits ship rather than after.
"""

[[exempt_leg]]
name = "run-gates gov canary"
why = """
the GOV-ONLY arms of the run-gates canary, gov-only for the reason the recall-floor pair above is: each arm is keyed on THIS repo's corpus — gov's declared chunk names, gov's network-calling leg names, a named gov leg's guard — so in any other tree they would red on absence rather than on behaviour. `tools/run-gates/kit.toml` withholds the file from the payload with a `project-owned` rule, so an adopter never receives the program this leg runs, and the harness REFUSES (exit 2) rather than passing when the manifest it is pointed at is not gov's. The SHIPPED canary keeps every assertion true in any tree and is claimed, as a [[gate_leg]] of the run-gates entry.
"""

[[exempt_leg]]
name = "template size <=48KiB"
why = """
gates gov's OWN product template at the repo root. An adopter's instantiated playbook carries no size ceiling, and the runbook prescribes this script for copy nowhere.
"""

[[exempt_leg]]
name = "govkit refusal join"
why = """
a gov-internal harness over gov's OWN deployer, which is itself a registry exemption because it never travels into a target. An adopter receives neither the deployer nor this join, so there is nothing in their tree for it to enumerate. The asymmetry with the two self-tests the runbook DOES prescribe for copy is deliberate and is the reason this row carries a sentence rather than a shrug.
"""

# ------------------------------------------------------------------- gov-only pins
# eol pins that belong to NO deployable. Forcing them into an entry would attribute a
# gov-internal rule to a kit an adopter receives.

[[gov_only_pin]]
pattern = "*.sh"
why = "every shell script in this repo, including ones no kit ships"

[[gov_only_pin]]
pattern = "tools/gate-legs.json"
why = "gov's own leg manifest, a registry exemption"

[[gov_only_pin]]
pattern = "tools/govkit/*"
why = "the deployer itself, which never travels"

[[exempt_leg]]
name = "govkit acceptance matrix"
why = """
a gov-internal harness over gov's OWN deployer, which never travels into a target. It drives the deployer against four repo SHAPES; an adopter has one repo and receives no deployer, so there is nothing there for it to exercise.
"""

[[exempt_leg]]
name = "template size gate selftest"
why = """
gov's own red/green proof of the size gate above; it travels with a gate that does not travel.
"""

[[exempt_leg]]
name = "playbook parity"
why = """
grades gov's OWN playbook against this repo's state. An adopter's playbook is an instantiated copy with their own answers in it, so there is nothing here for them to grade.
"""

[[exempt_leg]]
name = "playbook parity selftest"
why = """
gov's own red/green proof of the parity gate above; same reason.
"""
