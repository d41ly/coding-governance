why = "the size gate's high-water record, keyed by measured file. Travels with check-template-size.sh, which is exempt for the same reason: it gates gov's own product template and is prescribed for copy nowhere. Exemptions are exact-path, so the gate's row does not cover this one."

[[exempt]]
path = "{prefix}/check-hook-destinations.sh"
why = "it resolves gov's own descriptors through `<prefix>/govkit`, the deployer, which is a registry exemption itself and never travels into a target. An adopter has fragments and adopter scripts but no deployer, so this gate cannot run there at all. The protection it buys is therefore gov-side only, and that limit is the reason for this row rather than an oversight: gov is where the fragments and the descriptors are AUTHORED, so it is where a fragment naming an unshipped destination is created. TOOL-dRetiredFork-21."

[[exempt]]
path = "{prefix}/check-hook-destinations.test.sh"
why = "the arms for the gate above, exempt for the same reason: they drive a checker that cannot run in an adopter tree."

[[exempt]]
path = "{prefix}/govkit"
why = "the deployer itself. It runs on the deployer machine and is never installed into a target, so it is an entry of nothing. Stated rather than omitted, because the surface assertion would otherwise red on it."

[[exempt]]
path = ".githooks/gate-env.sh"
why = "THIS repository's gate policy, deliberately not shipped. `.githooks/pre-push` travels to every push-main adopter, so a choice written into it is a choice they inherit; this file is the choice, and no kit claims it. Selfcheck ASSERTS that property rather than trusting this row — TOOL-dUnstalledConvoy-28"

[[exempt]]
path = ".githooks/commit-msg"
why = "gov's own commit-time carrier for hygiene check 26, deliberately not shipped. It is the one hook that sees every CONCLUDED merge -- a clean `git merge` fires `pre-merge-commit` with no `MERGE_HEAD` and then this hook with one -- and it calls the memory-tree kit's transition audit over the pending merge. An adopter wires its own carrier per the runbook's switch section, because a hook file is copied whole and a target that already owns a `commit-msg` would have it overwritten. The runbook names this file as the REFERENCE. TOOL-dDerivedDocket-9."

[[exempt]]
path = ".githooks/pre-commit.test.sh"
why = "gov's own red/green self-test of the reference branch-guard block. The runbook prescribes copying the BLOCK into the target's own pre-commit, not this file."

[[exempt]]
path = ".githooks/straggler-guard.sh"
why = "the shards-to-builds straggler predicates, deliberately not shipped. A pre-flip branch carries the OLD kit and no straggler rule, so the rule cannot live in any kit the hook resolves through the committing tree — it has to sit beside the hook files, where `core.hooksPath` reaches it. That makes it gov-side only: an adopter's transition is their own, and each wires this library and its `pre-rebase` sibling in its own deployer build, with the runbook naming these files as the REFERENCE. `.githooks/pre-push` ships verbatim through the push-main kit and its new block is inert wherever this file is absent. TOOL-dDerivedDocket-13."

[[exempt]]
path = ".githooks/pre-rebase"
why = "gov's own rebase-time carrier for the straggler rule, deliberately not shipped for the reason its `straggler-guard.sh` sibling states. A hook file is copied whole, so a target that already owns a `pre-rebase` would have it overwritten; the runbook's switch section names this file as the REFERENCE an adopter copies. Exemptions are exact-path, so the library's row does not cover this one. TOOL-dDerivedDocket-13."

[[exempt]]
path = ".githooks/straggler-guard.test.sh"
why = "gov's own red/green arms for the two files above, which are themselves registry exemptions. Its fixtures build a memory tree, install this repo's kits into it and drive the real hooks; an adopter receives neither the library nor `pre-rebase`, so the suite would red there on absence rather than on behaviour. Exemptions are exact-path, so the subjects' rows do not cover their sibling — the precedent is `.githooks/pre-commit.test.sh` above. TOOL-dDerivedDocket-13."

[[exempt]]
path = "skills/session-kickoff/card-store.fixture.sh"
why = "gov's own fixture for the build card, deliberately not shipped. Each case copies the memory-tree, loop and unattended kits out of the tree it sits in into a scratch repository and drives the engine beside it against a bare remote; the kickoff self-test's arm runs it where it sits beside the checker and says so where it does not. TOOL-dPlacedRequest-2 S12."

[[exempt]]
path = "skills/session-kickoff/card-compaction.fixture.sh"
why = "gov's own live fixture for the orientation card file, deliberately not shipped. It drives two headless `claude` sessions and a compaction, minutes of model time and API tokens, so the main loop runs it live and no target receives it: a target has no build whose card it would prove. PLAY-dOrderedCharter-8 S1; exempted by PLAY-dOrderedCharter-77 S7."

[[exempt]]
path = "AGENTS.md"
why = "gov's own rendered charter, deliberately not shipped: the playbook kit renders each adopter its own. It lies outside the declared surface, so this row narrows nothing there. It is the class selfcheck's guard taxonomy (check 7c) gives the `policy fixtures` guard line naming it, a gov-only leg (its `[[exempt_leg]]` row) whose cases read the file. TOOL-dGroundRules-79."

[[exempt]]
