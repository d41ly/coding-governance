# surface-classes.toml — the classes of adopter-visible member the step gate grades (TOOL-dSafePassage-10).
#
# One `[[class]]` row per class, read by `<prefix>/govkit/step_gate.py` beside this file and by
# nothing else: `id`, the `<class>` half of every member id `<class>:<name>`; `reader`, the function
# returning the member names over one tree; `plant`, the function staging one vanished member in a
# scratch clone; a `summary`; and an optional `witness`, a reader of the class's own change record
# whose names count as witnessed. Each function is `<path under the tool root>:<function>`, spelled
# through `{prefix}`, and loaded from the TIP's tree for both sides of the range.
#
# A CLASS JOINS BY ADDING ITS ROW, and the row arms its own red: a row naming no plant is refused,
# and `step_gate.py --fixture --plant <id>` must exit 1 without a witness row and 0 with one. A class
# empty at the tip refuses the gate, so a row whose reader finds nothing grades nothing and says so.

[[class]]
id = "file"
reader = "{prefix}/govkit/step_gate.py:read_file_members"
plant = "{prefix}/govkit/step_gate.py:write_file_plant"
summary = "each destination gov's own plan derives"

[[class]]
id = "installable"
reader = "{prefix}/govkit/step_gate.py:read_installable_members"
plant = "{prefix}/govkit/step_gate.py:write_installable_plant"
summary = "each destination a shipped descriptor survivor resolves to, as shipped --epoch reads them"

[[class]]
id = "hook"
reader = "{prefix}/govkit/step_gate.py:read_hook_members"
plant = "{prefix}/govkit/step_gate.py:write_hook_plant"
summary = "each tracked hook fragment's name, the population the deployer wires"

[[class]]
id = "command"
reader = "{prefix}/govkit/step_gate.py:read_command_members"
plant = "{prefix}/govkit/step_gate.py:write_command_plant"
summary = "each Skill a shipped survivor lands at .claude/skills/<name>/SKILL.md, by its name"

[[class]]
id = "agent"
reader = "{prefix}/govkit/step_gate.py:read_agent_members"
plant = "{prefix}/govkit/step_gate.py:write_agent_plant"
summary = "each role agent an adopter's roles kit renders, by its stem"

[[class]]
id = "conf"
reader = "{prefix}/govkit/step_gate.py:read_conf_members"
plant = "{prefix}/govkit/step_gate.py:write_conf_plant"
summary = "each conf key a descriptor's [config] declares required or defaulted, as <conf file>#<KEY>"

[[class]]
id = "policy"
reader = "{prefix}/govkit/step_gate.py:read_policy_members"
plant = "{prefix}/govkit/step_gate.py:write_policy_plant"
summary = "each [[key]] name in the policy schema catalogue"

[[class]]
id = "verb"
reader = "{prefix}/govkit/step_gate.py:read_verb_members"
plant = "{prefix}/govkit/step_gate.py:write_verb_plant"
summary = "each verb a declared usage source states, as <cli>:<verb>"

[[class]]
id = "entry"
reader = "{prefix}/govkit/step_gate.py:read_entry_members"
plant = "{prefix}/govkit/step_gate.py:write_entry_plant"
summary = "each registry [[entry]] row's id"

[[class]]
id = "drive"
reader = "{prefix}/playbook/render_playbook.py:read_drive_members"
plant = "{prefix}/playbook/render_playbook.py:write_drive_plant"
summary = "each stage and role of the drive rows gov's deploy selects, as drive.<stage>.<role> (PLAY-dOrderedCharter-37)"

[[class]]
id = "kind"
reader = "{prefix}/playbook/render_playbook.py:read_kind_members"
plant = "{prefix}/playbook/render_playbook.py:write_kind_plant"
summary = "each [[kind]] tag of the kinds register (PLAY-dOrderedCharter-37)"

[[class]]
id = "unit"
reader = "{prefix}/playbook/pins.py:read_unit_members"
plant = "{prefix}/playbook/pins.py:write_unit_plant"
summary = "each gov instruction unit, by its tag, from every kit's instructions.toml"
witness = "{prefix}/playbook/pins.py:read_change_successors"

[[class]]
id = "unit-usage"
reader = "{prefix}/playbook/render_playbook.py:read_unit_usage_members"
plant = "{prefix}/playbook/render_playbook.py:write_unit_usage_plant"
summary = "each gov instruction unit carrying a usage, by its tag, the units help/reference/units.md documents"
witness = "{prefix}/playbook/pins.py:read_change_successors"
