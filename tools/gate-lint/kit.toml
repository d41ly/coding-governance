# kit.toml — this entry, declared as data. Read by <prefix>/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "gate-lint"
home = "gate-lint"
layer = "layer.flow.leg-packs"
scope = "repo"
version_from = { none = "no version constant exists in this kit; measured 2026-08-11. --all-selectable, so AC8's predicate falls back to the sentinel path below." }
requires = []
sentinel = "ps-hygiene.py"

[[files]]
include = "**"
role = "engine"

# NO REGISTRY IS SHIPPED, AND THE LEG NAMES NONE. A `seed` rule here used to land an empty registry
# under `{memory_root}/project/`, because the leg's argv named that path and `silenced_legs`
# withholds a leg whose argv names a file no rule writes — `apply` exited 1 at every adopter until
# the rule existed (TOOL-aLeakedHandle-1's closing review, F1).
#
# The rule then broke the same thing one layer out. Check 3 of the memory-tree hygiene gate admits
# only a closed set of names under `{memory_root}/project/`, so gov wrote a file into every
# adopter's memory tree that the adopter's own gate then refused. Widening that case list reaches
# an adopter only on a later `update`, and reaches a FORKED copy of the checker never — one live
# adopter runs a fork — so the seed had to go rather than the refusal.
#
# The ARGUMENT went instead of the file. The scanner's registry positional is OPTIONAL: with none
# supplied it grades against an empty declaration and reports every carried site as undeclared,
# which is a RED leg an adopter answers by declaring their own rows and putting the path back into
# their own leg argv — theirs to edit, in their own manifest. Dropping this rule while the argv
# still named the path is F1 again in the other direction, so the two land in ONE commit by
# construction. TOOL-cMendedVintage-2.

[adopt]
argv = []
mutates_index = false
why_no_adopter = "the kit ships no adopter. Its README carries no copy or install instruction either, and the runbook's claim that the README hands leg wiring to the consuming project is not borne out by the README — recorded as a gap rather than papered over."

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
#
# THE HOLE `gate-lint-leg-wiring` IS GONE, discharged rather than deleted. It declared that this kit
# shipped no leg of its own and that nothing in a target observed it, and it carried
# `discharge = { command = ["bash", "-c", "exit 1"] }` — undischargeable by construction, which is
# how a permanent gap gets recorded honestly. The `[[gate_leg]]` blocks below are what closes
# it: the kit declares legs, and each runs at a target out of the kit's own home.
# TOOL-aLeakedHandle-1. Declaring the leg alone did NOT close the hole at first — its argv named a
# registry path no rule shipped, so `silenced_legs` withheld it and `apply` exited 1 at every
# adopter while this comment said otherwise. The correction is that the argv now names nothing
# outside the kit, so there is no shipped path for that predicate to miss. TOOL-cMendedVintage-2.
#
# What has NOT changed is the adopter. There is still none, still no rendered artifact, and so still
# nothing for `check` to measure — a gate leg is run by the merge bar, not by this verb.
none = """
the kit ships no adopter and no rendered artifact, so there is nothing for this verb to run; its gate legs are declared below and are executed by the bar rather than by `check`
"""

# The tree scan. `subject = "repo"` because a failure of this leg is a statement about the graded
# repository's shell tree and not about the kit that ships the scanner, and NO guard, because it
# grades every tracked `*.sh`: no subset of paths bounds it, and a guard could only make it skip the
# file that just broke.
# NO REGISTRY ARGUMENT IS NOT AN EMPTY ONE when the target holds the default (TOOL-dHomeGraded-1 S7): each
# mode then reads `<MEMORY_ROOT>/project/<its registry>.txt`, the path the home rows below name, so an
# adopter declares its own sites there without editing gov's emitted row, which govkit reports as drift.
# A kit file installed at gov's own bytes is not graded in an adopter at all: gov grades it here.
[[gate_leg]]
tag = "leg.gate-lint.shell-hygiene-a-loop-fed-by-a-command-substitution"
tests = ["feature.gate-lint"]
pack = "portability"
enforces = ["practice.portable.launch"]
name = "shell hygiene (a loop fed by a command substitution)"
subject = "repo"
purpose = "catches a loop fed by a command substitution in a shell file"
argv = ["python3", "{kit}/sh_hygiene.py"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
argv = ["python3", "{prefix}/gate-lint/sh_hygiene.py", "memory/project/substitution-fed-loops.txt"]
guard = []
chunk = "product"
ceiling = 300

# The location-probe ban, the scanner's second mode (TOOL-aGraftedHelix-45). `subject = "repo"` and
# no guard for the loop scan's reason: it grades the repository's shell tree, and a new probe can
# arrive in any file. The argv passes no registry, so an adopter's first run grades against an empty
# declaration and lists every bare probe it already has — the same posture as the leg above. The
# home repository's own row passes its registry and excludes its memory tree; it grades its suites,
# because they ship to every adopter (TOOL-dRemeasuredRender-1).
[[gate_leg]]
tag = "leg.gate-lint.shell-hygiene-a-location-probe-asked-from-a-moved"
tests = ["feature.gate-lint"]
pack = "portability"
enforces = ["practice.portable.paths"]
name = "shell hygiene (a location probe asked from a moved directory)"
subject = "repo"
purpose = "catches a location probe asked from a moved directory"
argv = ["python3", "{kit}/sh_hygiene.py", "--location-probes"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
argv = [
  "python3",
  "{prefix}/gate-lint/sh_hygiene.py",
  "--location-probes",
  "memory/project/location-probe-waivers.txt",
  ".",
  ":!memory/",
]
guard = []
chunk = "product"
ceiling = 300

# The spawn-idiom lint, the scanner's third mode (TOOL-aSparedSpawn-8). `subject = "repo"` and no guard
# for the loop scan's reason: a fork spent on builtin work can arrive in any shell file. Its three
# BANNED classes take no registry row at all; its six counted classes grade against an empty
# declaration when no registry is passed, so an adopter's first run lists every site it carries — the
# posture of the two legs above. The home repository's row passes its registry and excludes its
# memory tree; its suites stay in, counted by the registry classes alone.
# The fork COUNT beside it, `fork-count.sh`, ships with this kit and its leg does not: its ceilings name
# this repository's own entrypoints and fixtures, so it is an `[[exempt_leg]]` in the deployer registry.
[[gate_leg]]
tag = "leg.gate-lint.shell-hygiene-a-fork-spent-on-builtin-work"
tests = ["feature.gate-lint"]
pack = "portability"
enforces = ["practice.portable.launch"]
name = "shell hygiene (a fork spent on builtin work)"
subject = "repo"
purpose = "catches a fork spent on builtin work in a shell file"
argv = ["python3", "{kit}/sh_hygiene.py", "--spawn-idioms"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
argv = [
  "python3",
  "{prefix}/gate-lint/sh_hygiene.py",
  "--spawn-idioms",
  "memory/project/spawn-idiom-sites.txt",
  ".",
  ":!*.test.sh",
  ":!memory/",
]
guard = []
chunk = "product"
ceiling = 300

# The temp-name lint, the scanner's fourth mode (TOOL-dRedressedBar-24). `subject = "repo"` and no guard
# for the loop scan's reason: a temp written at a fixed name and renamed into place can arrive in any
# shell file. The argv passes no registry, so an adopter's first run grades against an empty
# declaration and lists every site it carries — the posture of the three legs above. The home
# repository's row passes its registry and excludes its suites and its memory tree, as the spawn-idiom
# row does: a suite's temps live in its own scratch dir.
[[gate_leg]]
tag = "leg.gate-lint.shell-hygiene-a-fixed-name-temp-renamed-into-place"
tests = ["feature.gate-lint"]
pack = "portability"
enforces = ["practice.portable.temp-files"]
name = "shell hygiene (a fixed-name temp renamed into place)"
subject = "repo"
purpose = "catches a fixed-name temp renamed into place in a shell file"
argv = ["python3", "{kit}/sh_hygiene.py", "--temp-names"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
argv = [
  "python3",
  "{prefix}/gate-lint/sh_hygiene.py",
  "--temp-names",
  "memory/project/temp-name-sites.txt",
  ".",
  ":!*.test.sh",
  ":!memory/",
]
guard = []
chunk = "product"
ceiling = 300

# The stage-commit lint, the scanner's fifth mode (TOOL-dSettledStage-2). `subject = "repo"` and no
# guard for the loop scan's reason: a commit after a stage nothing tested can arrive in any shell file.
# The argv passes no registry, so an adopter's first run grades against an empty declaration and lists
# every site it carries — the posture of the four legs above. The home repository's row passes its
# registry and excludes its suites and its memory tree, as the temp-name row does: a suite's fixture
# repositories commit what they just staged. It enforces the line-endings rule: the stage it catches
# untested is the one a tree dirty by line endings alone normalises back to the committed bytes.
[[gate_leg]]
tag = "leg.gate-lint.shell-hygiene-stage-committed-untested"
tests = ["feature.gate-lint"]
pack = "portability"
enforces = ["practice.portable.line-endings"]
name = "shell hygiene (a stage committed with no staged-diff test)"
subject = "repo"
purpose = "catches a commit after an untested stage in a shell file"
argv = ["python3", "{kit}/sh_hygiene.py", "--stage-commits"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
argv = [
  "python3",
  "{prefix}/gate-lint/sh_hygiene.py",
  "--stage-commits",
  "memory/project/stage-commit-sites.txt",
  ".",
  ":!*.test.sh",
  ":!memory/",
]
guard = []
chunk = "product"
ceiling = 300

# The self-test arm. `subject = "kit"` puts it under the 2026-08-23 kit-self-test hold deliberately:
# a suite that stages breaks into a copy of a scanner has a job only when that scanner's source
# changes, and none at all in an adopter's repo that copy-installs the kit and never edits it. The
# guard names the kit dir the scanner lives in, so it runs when the thing it grades moves.
[[gate_leg]]
tag = "leg.gate-lint.shell-hygiene-selftest"
tests = ["feature.gate-lint"]
pack = "portability"
name = "shell-hygiene selftest"
subject = "kit"
purpose = "stages breaks into a copy of the shell-hygiene scanner"
argv = ["python3", "{kit}/sh_hygiene.py", "--selftest"]
guard = ["{kit}/"]
stage = ["step.test"]

[gate_leg.gov]
chunk = "selftests"
ceiling = 300

# THE PORTABILITY PACK (TOOL-dWitnessedBar-24): one leg per rule of the portable practice, each row
# `pack = "portability"` and `enforces` naming its rule, beside the four shell-hygiene rows above that
# joined it. Every scan row is `subject = "repo"` with no guard, for the loop scan's reason, and its
# adopter argv passes no registry, so an adopter's first run grades against an empty declaration and
# lists every site it carries — the posture the shell-hygiene rows set. Gov's argv passes its ledger
# home under `[gate_leg.gov]`, over the population the home's seed measures.
#
# The encoding leg MOVED IN from the deployer registry's `[[exempt_leg]]` table: it ships now, the
# owner ruling that kept it gov-only (TOOL-aRepatriatedFork-3 §8 F2) answered by `test.seed`, which
# seeds an adopter's population at the update (TOOL-dWitnessedBar-24 §8 F2). It keeps its tag.
[[gate_leg]]
tag = "leg.gov.encoding-posture-text-io-names-its-encoding"
tests = ["feature.gate-lint"]
pack = "portability"
enforces = ["practice.portable.encoding"]
name = "encoding posture (text IO names its encoding)"
subject = "repo"
purpose = "catches Python text IO that does not name its encoding"
argv = ["python3", "{kit}/encoding_posture.py"]
guard = []
stage = ["step.test"]

[gate_leg.gov]
argv = ["python3", "{prefix}/gate-lint/encoding_posture.py", "memory/project/encoding-posture-sites.txt", ".", "{prefix}", "skills"]
guard = []
chunk = "product"
ceiling = 300

