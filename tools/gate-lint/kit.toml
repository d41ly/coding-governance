[gate_leg.gov]
chunk = "product"
ceiling = 300

# The PowerShell scanner's self-test (§8 F4): gov tracks no `.ps1`, and the scan refuses an empty
# population, so gov's bar runs the predicates through the self-test. An adopter tracking `.ps1` adds
# the scan leg itself, as the README says. Held like the shell-hygiene self-test above, for its reason,
# but guarded on the one file its self-test grades, which imports no kit sibling (§8 F12): a guard on
# the whole kit dir would trip on every gate-lint scanner the pack edits.
[[gate_leg]]
tag = "leg.gate-lint.powershell-hygiene-selftest"
tests = ["feature.gate-lint"]
pack = "portability"
name = "powershell hygiene selftest"
subject = "kit"
purpose = "stages breaks into a copy of the PowerShell scanner"
argv = ["python3", "{kit}/ps-hygiene.py", "--selftest"]
guard = ["{kit}/ps-hygiene.py"]
stage = ["step.test"]

[gate_leg.gov]
chunk = "selftests"
ceiling = 300

# THE CONVERTED REGISTRIES (TOOL-dWitnessedBar-16): each list a check of this kit reads, converted in place
# onto the ledger grammar, its direction the one its old header declared. Every seed is the conversion
# program's `read-back`, which prints the home's own rows, but `encoding-posture-sites`'s: its reader
# measures keyed rows now, as its `--stdout` and `--js` siblings do, so an adopter that never held the
# legacy registry seeds it too (TOOL-aFlattenedSeed-3).
[[ledger]]
population = "encoding-posture-sites"
leg = "encoding posture (text IO names its encoding)"
seed = ["python", "{prefix}/gate-lint/encoding_posture.py", "--measure", ".", "{prefix}", "skills"]
key = "site"
fields = ["path", "arm"]
drain = "hunk"
direction = "shrink-only"
home = "memory/project/encoding-posture-sites.txt"

[[ledger]]
population = "fork-ceilings"
leg = "spawn budget (forks per hot entrypoint)"
seed = ["python", "{prefix}/memory-tree/convert_registry.py", "read-back", "fork-ceilings"]
key = "key"
fields = ["id", "bash", "base", "setup", "command"]
verbatim = ["base"]
drain = "key"
direction = "ceiling"
home = "memory/project/fork-ceilings.txt"

[[ledger]]
population = "location-probe-waivers"
leg = "shell hygiene (a location probe asked from a moved directory)"
seed = ["python", "{prefix}/memory-tree/convert_registry.py", "read-back", "location-probe-waivers"]
key = "site"
fields = ["path", "probe"]
drain = "hunk"
direction = "shrink-only"
home = "memory/project/location-probe-waivers.txt"

[[ledger]]
population = "spawn-idiom-sites"
leg = "shell hygiene (a fork spent on builtin work)"
seed = ["python", "{prefix}/memory-tree/convert_registry.py", "read-back", "spawn-idiom-sites"]
key = "site"
fields = ["path", "class"]
drain = "hunk"
direction = "shrink-only"
home = "memory/project/spawn-idiom-sites.txt"

[[ledger]]
