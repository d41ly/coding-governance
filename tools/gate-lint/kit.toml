# The language-roles rule: each shell file's code lines on a shrink-only ledger, so shell outside a shim
# only shrinks, and a shim earns its lines through the ledger factory's widen route (§8 F3).
[[gate_leg]]
tag = "leg.gate-lint.portability-shell-lines-only-shrink"
