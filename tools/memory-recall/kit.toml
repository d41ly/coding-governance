# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "memory-recall"
home = "tools/memory-recall"
scope = "repo"
version_from = { file = "recall_conf.py", pattern = "^KIT_MEMORY_RECALL_VERSION = " }
requires = ["memory-tree"]

[[files]]
include = "**"
role = "engine"

# The graded floor is GOV-ONLY. NOTE THE SCOPE: this withholds them from `govkit apply` only. The
# copy-install path WIRE-INTO-PROJECT.md documents is a plain `cp -r` of the kit dir and does not
# read this file, so that runbook names the three as gov-only separately.
# They are withheld by CLAIMING their destination — govkit
# has no `exclude` key, and a `**` rule's pool drops only what another rule owns (scan_claimed_paths).
# `project-owned` is absent from LANDABLE_ROLES, so `apply` never writes them. Without this the kit
# ships an adopter a question set keyed on gov record ids, a program reading a `RECALL_FLOOR` their
# conf does not carry, and arms asserting this repo's own measured literals — with no [[gate_leg]] to
# run any of it. An adopter's floor has to be measured against their corpus, from a fixture they
# author; shipping ours is `memory/gotchas/pin-copied-from-another-corpus.md`.
[[files]]
include = ["recall-fixture.json", "check-recall.py", "test_recall_floor.py"]
role = "project-owned"

[[files]]
include = ["SKILL.template.md"]
role = "rendered"
to = ".claude/skills/memory-recall/SKILL.md"
placeholders = ["FAMILIES", "MEMORY_ROOT", "QUERY_CLI"]

[config]
file = ".memory-tree.conf"
owner = "memory-tree"
required_keys_render = ["MEMORY_ROOT", "FAMILIES"]

[adopt]
argv = ["bash", "{kit}/adopt-memory-recall.sh", "--scaffold"]
mutates_index = false

[check]
argv = ["bash", "{kit}/adopt-memory-recall.sh", "--check"]

[[outcome]]
code = 0
probe = { must_exist = ".claude/skills/memory-recall/SKILL.md" }
means = "adopted"

[[gate_leg]]
name = "memory-recall kit selftest"
subject = "kit"
argv = ["python", "{kit}/selftest.py"]
guard = ["{kit}/"]

[[gate_leg]]
name = "memory-recall skill wiring"
subject = "repo"
argv = ["bash", "{kit}/adopt-memory-recall.sh", "--check"]
guard = []

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = ".claude/skills/memory-recall/SKILL.md"
why = "a rendered artifact its own gate byte-compares"

# DEPL-dCarriedReceipt-10 S7 — the three sources gov FORKED from inCMS rather than authoring.
# Each carries a `FORKED from` header naming its upstream and the width of the divergence, and each
# would be DESTROYED by an ordinary `engine` update: gov's copy imports `recall_conf`, which the
# adopter's tree does not have, so copying gov's bytes over the adopter's fork is a live
# ModuleNotFoundError. Reproduced against a real inCMS checkout at DEPL-dCarriedReceipt-10 AC1.
#
# `forked` is report-only and written in NEITHER direction. The role is a claim this RULE makes and
# is re-read here on every run, never inferred from what an attribution walk found.
[[files]]
include = ["extract.py", "query.py", "recall-opened.js"]
role = "forked"
direction = "gov-from-target"
record = "DEPL-dCarriedReceipt-10"
# The RECORD is the unit that adjudicated these three declarations -- its section 4 Inventory
# names each source, its direction and why -- and NOT the memory-recall port that first created
# the divergence. That port's spec is deliberately never closed, so citing it from a tracked
# source is a permanent drift drain rather than the transient one the signal is meant to catch.
