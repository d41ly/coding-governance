# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "unattended"
home = "tools/unattended"
scope = "repo"
version_from = { file = "unattended.sh", pattern = "^KIT_UNATTENDED_VERSION=" }
requires = ["memory-tree"]

[[files]]
include = "**"
role = "engine"

[[files]]
include = ["SKILL.template.md"]
role = "rendered"
to = ".claude/skills/unattended/SKILL.md"
placeholders = ["KIT_DIR", "MEMORY_ROOT", "LANDER", "KEEPALIVE_CREATE", "KEEPALIVE_DELETE", "KEEPALIVE_INTERVAL"]

[[files]]
include = ["PROTOCOL.template.md"]
role = "rendered"
to = "{memory_root}/guides/UNATTENDED-PROTOCOL.md"
placeholders = []

# the playbook template. Placeholder-free like the protocol, so the
# adopter copies it rather than rendering it.
[[files]]
include = ["PLAYBOOK-TEMPLATE.template.md"]
role = "rendered"
to = "{memory_root}/guides/PLAYBOOK-TEMPLATE.md"
placeholders = []

[config]
file = ".unattended.conf"
owner = "unattended"
required_keys_gate = ["LANDER", "BYPASS_BAN", "GATE_CMD", "WIRING_CHECK", "KEEPALIVE_CREATE", "KEEPALIVE_DELETE", "CORE_FLOOR", "DIRECTIVES_FLOOR"]
required_keys_render = ["LANDER", "KEEPALIVE_CREATE", "KEEPALIVE_DELETE", "KEEPALIVE_INTERVAL"]
optional_keys = ["MEMORY_ROOT", "KICKOFF_ENGINE", "KICKOFF_EXITS", "PHASES_EXTRA", "DOD_EXTRA", "DIRECTIVES_EXTRA"]
defaults = { MEMORY_ROOT = "memory" }

[adopt]
argv = ["bash", "{kit}/adopt-unattended.sh"]
mutates_index = false
requires_config_first = true

[check]
argv = ["bash", "{kit}/adopt-unattended.sh", "--check"]

[[outcome]]
code = 1
probe = { must_not_exist = ".unattended.conf" }
means = "no-project-layer"

[[outcome]]
code = 1
probe = { must_exist = "{memory_root}/guides/UNATTENDED-PROTOCOL.md", must_not_exist = ".claude/skills/unattended/SKILL.md" }
means = "render-failed-half-stamped"

# ---------------------------------------------------------------------------------------------------
# THIS KIT'S SELF-TESTS ARE NOT GATE LEGS, and that is an owner ruling rather than an omission.
# `check-unattended.test.sh`, `unattended.test.sh`, `check-playbook.test.sh`, `cross-component.test.sh`
# and `adopt-unattended.test.sh` stage breaks into copies of this kit and assert the checkers still
# catch them. Their subject is the CHECKER, so they have a job only when this kit's source changes and
# none at all in an adopter's repo that copy-installs the kit and never edits it. Ruled 2026-08-23:
# they run on the owner's demand, never on the merge bar, here and in every adopter alike.
#
# THE THREE LEGS BELOW STAY, and the difference is their subject: they read the REPOSITORY - its
# run-state records, its playbooks, the shipped skill's wiring - which goes stale with nobody editing
# this kit. Those are seconds. The self-tests were 3339 s of a 4926 s bar, 68% of all leg-seconds,
# with the largest putting a 26-minute FLOOR under every full run. Measured node d, 2026-08-23;
# memory/builds/dScriptedRepeat/build/2026-08-23-build-TOOL-dScriptedRepeat-5-bar-cost-measurement.md.
#
# THE COMPENSATING CHECK, because an exemption is not coverage (charter §7). Work touching
# `tools/unattended/` is not done until this prints GREEN and the verdict is in the landing report:
#
#     bash tools/unattended/run-unattended-gates.sh            # the self-tests
#     bash tools/unattended/run-unattended-gates.sh --all      # and the three legs beside them
#
# There is no gate behind that sentence. A kit edit that guts a check now lands green unless a person
# runs it, and this file is where that trade is recorded as having been made deliberately.
# ---------------------------------------------------------------------------------------------------

[[gate_leg]]
name = "unattended kit gate"
argv = ["bash", "{kit}/check-unattended.sh"]
guard = []
red_after_land = true

# the playbook validity leg. No guard: it grades an adopter's playbooks and
# the kit's own fixture, so a guard scoped to this kit dir would skip it on exactly the commits that
# change a playbook.
subject = "repo"
[[gate_leg]]
name = "playbook validity gate"
argv = ["bash", "{kit}/check-playbook.sh"]
guard = []
red_after_land = true
subject = "repo"

[[gate_leg]]
name = "unattended skill wiring"
argv = ["bash", "{kit}/adopt-unattended.sh", "--check"]
guard = []
red_after_land = true
subject = "repo"

[[hole]]
id = "keepalive-tool-names"
kind = "authoring"
blocks_adopt = false
blocks_gate = true
why = "a key ABSENT from the conf reds both the adopter check arm and the kit gate leg. But the shipped conf example copied verbatim renders its angle-bracket placeholder text as literal prose and passes EVERY check, because the placeholder detector greps the brace shape only — so this hole is half-silent and the probe is the only thing that sees that half."
# NARROWED, and re-SUBJECTED, by TOOL-dScrubbedConduit-1 S4. The old probe grepped `<[a-z-]+>` over
# the RENDERED SKILL.md — a file whose own template ships 25 `<slug>`, 6 `<name>` and more as
# DOCUMENTED SYNTAX. It therefore failed for every adopter no matter how correctly the conf was
# filled, including in this repo, where it has never passed. A hole nobody can discharge is worse
# than the half-silence it was added to catch, and because `exempt_leg` suppresses the
# red-after-install criterion for any entry with an undischarged blocks_gate hole, it was also
# silently exempting all three unattended gate legs in every adopter tree.
#
# The subject is now the CONF, not the render: a rendered SKILL.md cannot tell a conf-injected
# placeholder from the template's own syntax without matching literals. The predicate is "a value
# wrapped in angle brackets is still a placeholder", which is general rather than a literal match —
# and it catches KEEPALIVE_INTERVAL, whose shipped value `<e.g. every 10 minutes (…)>` does NOT match
# `<[a-z-]+>` and was undetectable under the old probe.
discharge = { command = ["bash", "-c", "! grep -qE '^KEEPALIVE_(CREATE|DELETE|INTERVAL)=\"<.*>\"' .unattended.conf"] }

[[hole]]
id = "directives-floor"
kind = "measured-pin"
blocks_adopt = false
blocks_gate = true
why = "undeclared or malformed reds the kit gate at check 16 arm C. The correct value for a faithful copy install is the driver's own DIRECTIVES_CORE member count, so this is a transcription hole rather than a corpus measurement — the same shape as core-floor, and declared in the SAME commit as the branch that refuses it. Without the declaration an adopter deploys green through govkit and reds their own unattended kit gate with no key and no hole to tell them why."
discharge = { command = ["bash", "-c", "grep -qE '^DIRECTIVES_FLOOR=\"?[0-9]+' .unattended.conf"] }

[[hole]]
id = "core-floor"
kind = "measured-pin"
blocks_adopt = false
blocks_gate = true
why = "undeclared or malformed reds the kit gate. For a faithful copy install the correct value is the driver's own core set sizes, so this is a transcription hole rather than a corpus measurement."
discharge = { command = ["bash", "-c", "grep -qE '^CORE_FLOOR=\"?[0-9]+:[0-9]+' .unattended.conf"] }

[[lf_pin]]
pattern = ".unattended.conf"
why = "its values are shell COMMANDS; a CR is executed"
[[lf_pin]]
pattern = "{kit}/.unattended.conf.example"
why = "the adopter copies it verbatim into the line above"
[[lf_pin]]
pattern = "{kit}/*.md"
why = "the protocol and the playbook template are byte-compared against the shipped copies"
[[lf_pin]]
pattern = "{memory_root}/guides/PLAYBOOK-TEMPLATE.md"
why = "an installed artifact its own adopter byte-compares"
[[lf_pin]]
pattern = ".claude/skills/unattended/SKILL.md"
why = "a rendered artifact its own gate byte-compares"
