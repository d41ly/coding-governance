# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the aPacedTurnstile build's spec set under `memory/builds/aPacedTurnstile/spec/`
# under memory/builds/aPacedTurnstile/spec/.
#
# WHY THIS KIT EXISTS AT ALL. The runner was a registry EXEMPTION with two stated reasons, both
# exact: it sourced tools/lib/, which is gov-internal and never travels, and with that path absent
# it exited 2 having run ZERO legs. So `govkit apply` wired legs into a runner the target was
# assumed to already own, and a target that owned none received a merge bar that could not start.
# S2 cut the dependency by inlining the resolver into every shipped file that had one; this
# descriptor is what makes the result deployable.

id = "run-gates"
home = "tools/run-gates"
scope = "repo"
version_from = { file = "run-gates.sh", pattern = "^KIT_RUN_GATES_VERSION=" }
requires = []

[[files]]
include = "**"
role = "engine"

# THIS KIT'S SELF-TESTS ARE WITHHELD. TOOL-aQuenchedHarness-3. Each stages a break into a copy of a
# checker in THIS directory and asserts the checker still catches it, so its subject is the checker
# and it has a job only when the source here changes -- and none at all in a tree that copy-installs
# the kit and never edits it. That is the 2026-08-23 owner ruling, applied to what SHIPS rather than
# only to what runs.
#
# WITHHELD BY CLAIMING THE DESTINATION, the mechanism `tools/codebase-map/kit.toml` already uses and
# explains: govkit has no `exclude` key, a `**` rule's pool drops only what another rule owns, and
# `project-owned` is absent from LANDABLE_ROLES so `apply` never writes it.
#
# AND THE LEG GOES WITH THE FILE, through machinery that already exists: `silenced_legs` refuses to
# emit a gate leg whose argv names a path the target does not hold, and `_cmd_apply` REPORTS each one
# rather than shipping it. So this rule closes both halves and needs no deployer code.
#
# SCOPE, and it is the half a reader misses: this withholds from `govkit apply` ONLY. The
# copy-install path in `WIRE-INTO-PROJECT.md` is a plain `cp -r` of the kit dir and does not read
# this file, so that runbook removes them separately. The suites remain in the public repository for
# anyone who edits a kit.
[[files]]
include = ["adopt-run-gates.test.sh", "profile_bar.test.sh", "run-gates.evidence.test.sh", "run-gates.test.sh", "run-gates.turnstile.test.sh", "run-selftests.test.sh"]
role = "project-owned"

# THE GOV-ONLY HARNESS IS WITHHELD. Its arms are keyed on THIS repo's corpus — gov's declared chunk
# names, gov's network-calling leg names, a gov leg's guard — and in an adopter tree the manifest is
# seeded empty and emitted from descriptors, so every one of them would red on arrival. That is
# memory/gotchas/pin-copied-from-another-corpus.md, the class this kit's own spec refuses by name
# when it declines to seed an adopter with gov's leg names.
#
# Withheld by CLAIMING the destination, exactly as tools/memory-recall/kit.toml withholds
# check-recall.py, recall-fixture.json and test_recall_floor.py: govkit has no `exclude` key, a `**`
# rule's pool drops only what another rule owns, and `project-owned` is absent from the landable
# roles so `apply` never writes it. It is a leg on GOV's bar and carries an [[exempt_leg]] row in
# tools/govkit/registry.toml — deliberately NOT a [[gate_leg]] below, because a descriptor row
# naming a leg the target's manifest cannot carry is what reds the deployer's selfcheck.
[[files]]
include = ["run-gates.gov.test.sh"]
role = "project-owned"

# GOV'S OWN CEILING EVIDENCE, withheld for the reason above one line over: these two files
# carry THIS repo's recorded seconds and the headroom declared against them, so an adopter
# receiving them gets a pin measured on a corpus they do not have. `derive-ceilings.py`
# itself DOES ship -- it is the tool, and it refuses rather than defaulting when no headroom
# is declared, which is the announced-unarmed state rather than a silent one.
# TOOL-aQuenchedHarness-2.
[[files]]
include = ["ceiling-evidence.txt", "ceiling-margin.txt"]
role = "project-owned"

# THE SELF-TEST DECLARATION IS GOV'S TOO. Its rows name this repo's suites and carry
# readings taken on this node, so an adopter receiving it gets a population they do not have
# and a gate that reds on arrival. `run-selftests.sh` itself DOES ship — it is the mechanism
# the 2026-08-23 ruling always implied, and it refuses with a named message rather than
# defaulting when no declaration is present, which is the announced-unarmed state.
# TOOL-aQuenchedHarness-4.
[[files]]
include = ["selftest-budgets.txt"]
role = "project-owned"

[adopt]
argv = ["bash", "{kit}/adopt-run-gates.sh"]
mutates_index = false

[check]
argv = ["bash", "{kit}/adopt-run-gates.sh", "--check"]

[[outcome]]
code = 0
probe = { must_exist = "{kit}/run-gates.sh" }
means = "adopted"

# THE RULE, not a census: a row here must name a leg the TARGET's manifest can carry, and it moves
# in the same commit as that manifest row — a descriptor row naming a leg the manifest lacks reds
# selfcheck at the adding unit's own landing. The count is DERIVED by govkit and is deliberately
# not written here; the number that used to sit in this sentence was wrong one commit later.
[[gate_leg]]
name = "run-gates wiring"
subject = "repo"
argv = ["bash", "{kit}/adopt-run-gates.sh", "--check"]
guard = []

# The seed for a target's own [gate_runner] declaration. `cmd_intake` emits this block when this
# entry is selected (S9), resolving the path tokens ONLY: the runner's own `{name}` placeholder in
# `observed_ran` passes through verbatim, because it is the RUNNER's substitution and not the
# deployer's. Without this the first `apply` after adopting the runner silently takes the
# "ORDERED, not emitted" branch and exits 0 — the silent-green direction this deployer refuses by
# name everywhere else.
[gate_runner_seed]
kind = "manifest"
grammar = "json-array"
file = "{prefix}/gate-legs.json"
command = ["bash", "{kit}/run-gates.sh"]
dedupe_key = "name"
# The environment that makes a run TOTAL. Required by the deployer for a complete `manifest`
# promotion; a partial one is refused rather than silently accepted. The runner reads this
# name to bypass every leg guard, which is what the push boundary sets.
run_all_env = "GATE_FULL=1"
# ARRAYS, not scalars, and the closing review's blocker is why. `read_gate_verdicts` iterates
# `for tmpl in (gr.get(key) or [])`, so a STRING is walked CHARACTER BY CHARACTER: the head becomes
# the single character `G`, no real leg name is ever recovered, and because `observed_ran` is scanned
# first and `setdefault` wins, no key can ever be red. Reproduced: a real `apply` exited 0 recording
# {'ATE FAIL': 'green', 'ATE ok': 'green', ...} while the target's canary leg was genuinely RED.
observed_ran = ["GATE ok    {name}"]
observed_failed = ["GATE FAIL  {name}"]
# D8: without this the deployer's `skipped` state is unreachable and its DEAD-PROBE refusal is
# structurally dead. The runner prints this verb on every guard-scoped run.
observed_skipped = ["GATE skip  {name}"]
# The reuse verb, for the same reason `observed_skipped` exists: without a template the deployer has
# no state for a leg a target reused, so that outcome is structurally unreachable and its DEAD-PROBE
# refusal can never fire. One trailing space after the verb, because the verbs are padded so the
# NAME starts in one column.
observed_reused = ["GATE reuse {name}"]
# The FIFTH verb (TOOL-dUnstalledConvoy-26). Without it every kit-subject leg is invisible to
# `read_gate_verdicts`, and an upgrading adopter's apply reports each one as GONE AFTER — a leg that
# was green before, holds no state after, and trips the "a leg that vanished is not a leg that
# passed" refusal. Two trailing spaces, because the verbs are padded so the NAME starts in one
# column and the reader anchors on that prefix.
observed_held = ["GATE held  {name}"]

# Line-ending pins this kit needs in a TARGET. Every shipped file here is a shell script or the
# manifest a shell script parses; a CRLF script does not execute.
[[lf_pin]]
pattern = "{kit}/*.sh"
why = "a CRLF shell script does not execute"
[[lf_pin]]
pattern = "{prefix}/gate-legs.json"
why = "the runner parses it through python with LF-only byte writes, and the canary byte-compares its rows"
[[lf_pin]]
pattern = "{kit}/gate-profiles.txt"
why = "the declared profile table is parsed at runtime with a TAB field separator, so a stray CR lands inside the last field and turns a knob value into one the runner refuses"
