# gate-legs.toml — the merge bar, DECLARED. One file: defaults, profiles, lanes, legs.
#
# Generated once from tools/gate-legs.json and tools/run-gates/gate-profiles.txt by the
# aGatheredDeclaration build, then AUTHORED from here on. It replaces both. Every number below
# may carry the argument for itself on the line above it, which is the whole reason this is not
# JSON: the file it replaces held a 1.4 KB _doc STRING and a ceiling_over_policy OBJECT in an
# adopter tree, both of them comments with nowhere to go.
#
# NEEDS CPython 3.11+ to be read at all — tomllib entered the stdlib there. Below that the
# runner reads the legacy pair and says so on stderr; it does not exit.
#
# THE GOVERNING INVARIANT, carried verbatim from gate-profiles.txt: no knob here may ever turn a
# leg into a PASS or a SKIP. A knob may make the bar slower, and it may turn an unbounded hang
# into a bounded RED. It may never make the bar check less.

[bar]
# OWNER OPT-IN, default false. A ceiling KILLS a leg before it can answer, so enforcement OFF
# produces strictly more evidence than a ceiling that fired. An adopter measured a leg killed at
# 2041 s against a 2040 s ceiling — by one second, on a bound already raised from a measurement
# that was 3.07x low. GATE_CEILINGS=0|1 overrides per machine.
enforce_ceilings = false
# What a leg inheriting no ceiling takes. DECLARATION stays expected; enforcement is the opt-in
# above. Also the fallback the profile row's retired timeout= knob used to supply.
default_ceiling = 1800
# OWNER OPT-IN, default false. The turnstile serialises one bar per repository and therefore
# enqueues parallel pushes behind each other; one killed bar once wedged a landing for 6858 s
# behind three dead tickets. It FAILS OPEN by design, so off is a state it already reaches on
# its own whenever its bounded wait expires. GATE_TURNSTILE=1 turns it on.
turnstile = false
# The turnstile's holder TTL, declared directly. It used to be derived as three times the
# profile row's timeout= knob, which this file retires; run-gates.sh:431 names setting that knob
# as the prescribed fix for a leg reaped mid-run, so the value survives as a key rather than
# disappearing with the knob. GATE_TURNSTILE_TTL overrides.
turnstile_ttl = 1800

# ------------------------------------------------------------------------------------------------
# PROFILES — the declared knob table, keyed by detected hardware. Rows are ordered
# MOST-CAPABLE-FIRST and the FIRST row whose BOTH thresholds are satisfied wins; the last row is
# a zero-threshold catch-all, so unknown hardware lands there by ordinary threshold matching
# rather than by a special case. GATE_PROFILE=<name> selects a row and skips detection.
# GATE_CORES / GATE_RAM_MB replace the detected readings.
#
# The timeout= knob does NOT travel. All three rows declared timeout=0, so the profile-level
# bound was already off everywhere — but the argument for removing it is its CONSUMERS, not that
# reading: run-gates.sh:434 derived the turnstile TTL from it and :1104 used it as the per-leg
# fallback. Both are now [bar] keys above.

# gate-profiles.txt — the runner's knobs, DECLARED, keyed by detected hardware.
#
# GRAMMAR: `<name>\t<min cores>\t<min RAM MB>\t<comma-joined knobs>` per row. Comments carry the
# justification for a threshold and every movement of it, because a number with no history beside it
# is a number nobody can question. Modelled on `tools/template-size-limits.txt`, which is this tree's
# settled answer to the same problem — a declared value read with `awk -F'\t'` and argued in place.
#
# SELECTION: rows are ordered MOST-CAPABLE-FIRST and the FIRST row whose BOTH thresholds are
# satisfied wins. The last row is a zero-threshold catch-all, so an unknown-hardware run lands there
# by ordinary threshold matching — one selection mechanism, no special case.
#
# THE GOVERNING INVARIANT: no knob here may ever turn a leg into a PASS or a SKIP. A knob may make
# the bar slower, and it may turn an unbounded hang into a bounded RED. It may never make the bar
# check less. The runner declares the set it implements; the canary PINS the same set separately, so
# a new knob cannot be added without an author reading this paragraph.
#
# KNOBS:
#   width=<n>    the worker-pool width. `GATE_JOBS` overrides it — width ONLY: the row is still
#                selected and still supplies every other knob.
#   timeout=<s>  a per-leg wall-clock bound, 0 = off. A timeout that fires produces a RED naming its
#                leg, never a skip and never a green: it converts a hang into a verdict AND returns
#                the worker to the pool. The second half is not free — the first landing of this
#                knob captured the leg through a pipe, so an orphaned grandchild held it open and
#                the bound applied to the verdict alone: 51.4 s measured against a 1 s bound. The
#                runner now captures through a file and adds a kill-after, and the canary grades
#                the elapsed time against an untimed control rather than the message.
#
# OVERRIDES: `GATE_PROFILE=<name>` selects a row by name and skips detection. `GATE_PROFILES=<path>`
# points at a different table; a path that does not exist falls back to the built-in formula, which
# is the documented rollback for this whole mechanism. `GATE_JOBS=<n>` overrides the WIDTH alone and
# leaves every other knob of the selected row in force.
#
# THE READINGS themselves have overrides too, and they are the escape hatch when detection is wrong:
# `GATE_CORES=<n>` and `GATE_RAM_MB=<mb>` replace what the chain would find and BYPASS it entirely —
# a seam is never capped by the cgroup source below, or the operator could not raise a number.
# `GATE_CGROUP_ROOT=<dir>` relocates the cgroup files the RAM chain reads, which is how a fixture
# drives the container path on a host that is not in one.
# --- 8+ cores AND a RAM class that can hold the width ---------------------------------------------
# 24000 MB, and cores alone are the wrong question: each heavy leg builds its OWN `mktemp -d` scratch
# repo, so width 8 means up to eight scratch git repos and eight interpreters resident at once. The
# threshold sits BELOW 32 GB deliberately — the honest distinction is a RAM class, not an exact
# figure, and a 16-core / 8 GB VM selecting this row is the thrash this table exists to stop.
# Width 8 is MEASURED, not guessed: at 16 each leg dilates under load faster than the extra worker
# repays. Node `a` (16 cores, 32693 MB) selects this row, so its behaviour does not move.
[[profile]]
name = "capable"
min_cores = 8
min_ram_mb = 24000
width = 8

# --- the 4-core class ------------------------------------------------------------------------------
# Deliberately BEHAVIOUR-NEUTRAL: the built-in formula already yields width 4 there. Moving the
# 4-core width in the same unit that introduces the table would confound the one measurement that
# matters, and a knob whose first landing is also its first behaviour change has no control. This
# row's PURPOSE is its RAM threshold of zero paired with the row above: it is what a high-core,
# low-RAM box falls to.
[[profile]]
name = "modest"
min_cores = 4
min_ram_mb = 0
width = 4

# --- the catch-all, and the detection-failure row --------------------------------------------------
# Zero thresholds, so it can never fail to match. Width 2 rather than 1 because unknown hardware is
# slow, not serial-only. Removing this row is an operator error and the runner refuses rather than
# silently falling through to the built-in formula: absent and unmatchable are different states and
# only one of them is a mistake.
[[profile]]
name = "minimal"
min_cores = 0
min_ram_mb = 0
width = 2

# ------------------------------------------------------------------------------------------------
# LANES — declared here, IMPLEMENTED by TOOL-aGatheredDeclaration-8. Lanes run in DECLARATION
# order; a lane declaring short_circuit = true skip-marks every later lane without launching it.
# Gov declares exactly ONE lane and every leg is in it, so this migration changes no behaviour:
# same legs, same held set, same single pool. Assigning legs to lanes is a later unit that reads
# <git-dir>/gate-ledger.tsv, because a knob whose first landing is also its first behaviour
# change has no control.

[[lane]]
name = "heavy"
concurrency = "profile"   # take the selected profile row's width
short_circuit = false

# ------------------------------------------------------------------------------------------------
# LEGS. opt_in = true means the leg is HELD unless asked for with GATE_OPTIN=1 (GATE_SELFTESTS=1
# remains an accepted alias). It replaces the subject/chunk pair the JSON used: the shipped
# predicate held a leg when subject was kit OR chunk was selftests, and mapping subject alone
# would have silently un-held six legs — including both run-gates canaries — reverting the owner
# ruling of 2026-08-26. The union is what travels.
#
# full_only is validated and SELECTS NOTHING. It is retained because an adopter declares it on
# four rows and the upgrader needs one source to follow; gov has none.
#
# A guard names what the leg READS. A leg with no guard runs on every bar. A ceiling is DECLARED
