# presets.toml - the policy kit's shipped presets (KICK-dKeptSession-1): one `[preset.<name>]` table per
# preset, each a complete assignment of the presettable keys by quoted dotted key, so `leases` and
# `leases.granularity` sit side by side. A presettable key is a catalogue row `never` does not name whose
# default is literal or which `literal` names. Seeded once from the design record's `[presets]` section,
# each presettable row that table lacks at its catalogue default; `presets.py check` holds it complete,
# inside each key's schema and inside the pair rules. `core.py new preset <name> --from <preset>` is its
# one writer. A derived-default row `literal` does not name, such as `budgets.*` or
# `roles.effort.<role>`, carries no key in any preset and reads unassigned (KICK-dKeptSession-33).

# The keys presets never touch: loosening the guard or switching an invariant off stays an owner choice.
never = ["floor", "preset", "policy-file.guard", "policy-file.proof", "policy-file.on-invalid",
         "charter.practices", "instructions.edit", "instructions.proof", "instructions.exclude",
         "policy-file.on-missing-expansion", "release.environments", "verdict.remote.pin",
         "attendance", "attendance.scope", "install.guards", "trace.identity",
         "runtime.agents-in-flight", "budgets.pinned", "memory.mirror", "runtime.owner-harness",
         "runtime.act-harness", "runtime.act-auth", "roles.harness.<role>", "roles.auth.<role>",
         "platforms.supported", "platforms.provision"]

# The derived-default rows the presets assign literal values, each spelled in every preset: v2 gives
# these literal cells, and restates the derived default on every other such row.
literal = ["maintain.fixes", "review.<stage>"]

# Each pair [higher, lower]: in every preset, and in a repository's effective assignment, `higher` is at
# least `lower`.
pairs = [["review.max-rounds", "review.design.round-count"], ["install.deprecation-window", "currency.max-behind"]]

