[[key]]
name = "tests.without-cadence"
allowed = ["run-at-landing", "report-unrun", "wait-for-expansion"]
default = "run-at-landing"
summary = "What a landing does with the product-test levels outside tests.landing-levels where no cadence runs them: runs them at landing anyway, reports them unrun, or waits for a cadence to be set up."
usage = 'tests.without-cadence = "report-unrun"'
owner = "dWitnessedBar"

[[key]]
name = "verdict"
allowed = { type = "enum", of = ["local-hook", "peer-node", "remote-ci"], registry = "another registered backend" }
default = "local-hook"
summary = "Which backend's verdict a landing stands on, a name a [[verdict_backend]] row in a kit descriptor declares: local-hook, this node's own hook's full per-tree verdict; peer-node, a second node's verify-peer tag for the commit's own tree; or remote-ci, a push run of the remote CI workflow under verdict.remote.trust. Read at the landed revision by the lander before each landing push, which under any backend but local-hook lands only on GREEN; a value no row declares refuses before any push."
usage = 'verdict = "peer-node"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.blocks"
allowed = ["own-mixed-contended", "every-red", "own-only"]
default = "own-only"
summary = "Which red of a red bar blocks its landing, by the class the runner's attribution reads each red at: under own-only an OWN or DEAD PROBE red blocks, under own-mixed-contended a MIXED or CONTENDED red blocks too, and under every-red an INHERITED red blocks as well. Read at the default branch's tip by the pre-push hook and the unattended driver; a red bar lands only when every red passes."
usage = 'verdict.blocks = "own-mixed-contended"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.held"
allowed = ["peer-or-cadence", "push-selected", "on-demand"]
default = "on-demand"
summary = "When a held leg runs, read at the default branch's tip: under on-demand it is held at every bar unless GATE_SELFTESTS asks for it; under push-selected the pre-push hook exports GATE_SELFTESTS=changed for its bar when the pusher set nothing, so the held legs the push moved run; under peer-or-cadence it is held at the push and runs elsewhere, a HELD_CI_WORKFLOW in .unattended.conf or a registered peer backend, and the selection refuses where neither is declared."
usage = 'verdict.held = "push-selected"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.flakes"
allowed = ["quarantine", "record", "retry-only"]
default = "quarantine"
summary = "What a red bar's flakes do, read by the run-gates kit's `verdict_flow.py flakes` after a bar run under GATE_RERUN=1, which re-runs each red leg once on the same tree: under retry-only nothing is written; under record each such run writes one `flake` record, a row per executed leg with its first rc and its re-run rc; under quarantine it also holds each leg whose flakes reach verdict.flakes.entry and no OPEN held-flaky-leg ask names, and the unattended close files that ask, which holds the leg through the selection's quarantine row: the held leg still runs at least once a day, outside the verdict, so its greens accrue in the flake records, and it is released, its ask closed, after verdict.flakes.release consecutive greens."
usage = 'verdict.flakes = "record"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.flakes.entry"
allowed = { type = "pattern", regex = "[0-9]+/[0-9]+", or = ["measured"] }
default = "measured"
summary = "How many flakes in a leg's last window of verdicts hold it under verdict.flakes quarantine, counted across the tracked flake records, newest first and after the leg's last release: a declared count/window such as 3/10, or measured, the Measured field of the newest gate-health record, and 2/10 until one exists."
usage = 'verdict.flakes.entry = "3/10"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.flakes.release"
allowed = { type = "count", min = 0 }
default = 3
summary = "How many consecutive greens release a leg held under verdict.flakes quarantine, read at the default branch's tip by the run-gates kit's `verdict_flow.py select`: the leg's executed rows in the tracked flake records since its held-flaky-leg ask was filed, newest first, must open with this many greens, a red resetting the count; a leg whose manifest row changed since that filing is released too. The unattended close then writes the ask's CLOSED row."
usage = 'verdict.flakes.release = 5'
owner = "dWitnessedBar"

[[key]]
name = "tests.product"
allowed = ["declared", "declared-with-runners", "none"]
default = "declared-with-runners"
summary = "Which product-test legs, the legs carrying a level, the manifest holds: the repository's own declared ones, those plus one leg per level each detected runner adapter declares, or none at all."
usage = 'tests.product = "declared"'
owner = "dWitnessedBar"

[[key]]
name = "tests.landing-levels"
allowed = { type = "set", of = ["unit", "integration", "e2e", "performance"], or = ["every-declared"] }
empty = "never"
default = ["unit", "integration"]
summary = "Which product-test levels a landing runs, from unit, integration, e2e and performance, or every level the manifest declares; the slower levels left out are tests.without-cadence's."
usage = 'tests.landing-levels = ["unit", "integration", "e2e"]'
owner = "dWitnessedBar"

[[key]]
name = "verdict.tree"
allowed = ["prepared-merge", "build-tip"]
default = "prepared-merge"
summary = "Which tree Test verifies: the merge `push-main.sh --prepare` makes of the build onto the advertised tip, or the build's own tip pinned with no merge, `--land` then making the landing merge."
usage = 'verdict.tree = "build-tip"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.red-route"
allowed = ["fix-pass-or-design", "always-new-unit"]
default = "fix-pass-or-design"
summary = "Where the tester's judgment of a blocking OWN or MIXED red sends it: under fix-pass-or-design a code-miss goes to a fix pass and a spec-wrong to a new unit through Design, and under always-new-unit both go to a new unit. Read by run-gates' verdict_flow.py judge."
usage = 'verdict.red-route = "always-new-unit"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.remote.trust"
allowed = ["pinned-workflow", "owner-reviews-workflow-change", "app-only"]
default = "pinned-workflow"
summary = "What the remote-ci backend does with the source check of its witness rule: under pinned-workflow pinned files that differ from verdict.remote.pin read HELD and an owner item asks to re-pin or to refuse; under owner-reviews-workflow-change the owner item opens at the first differing read and the slot stays HELD until the owner re-pins; under app-only the source check is skipped and a passing run reads GREEN with witness claimed, never witnessed."
usage = 'verdict.remote.trust = "owner-reviews-workflow-change"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.remote.pin-scope"
allowed = ["workflow", "dispatch-closure"]
default = "workflow"
summary = "Which files verdict.remote.pin pins for the remote-ci backend: workflow, the declared workflow .github/workflows/remote-ci.yml; or dispatch-closure, that workflow, the run-gates kit's run-gates.sh, the leg manifest and .githooks/gate-env.sh, the files that decide the bar's dispatch, never every script the bar job runs."
usage = 'verdict.remote.pin-scope = "dispatch-closure"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.remote.pin"
allowed = { type = "pattern", regex = "[0-9a-f]{40}|[0-9a-f]{64}", registry = "the pinned files' blob ids" }
default = { derived = "none, until the owner pins" }
summary = "The pin the remote-ci backend's source check compares against: one object id, git hash-object --stdin over one <path> <blob id> line per file verdict.remote.pin-scope names, sorted by path, each ending LF, which the run-gates kit's remote_verdict.py pin prints at HEAD. The owner's: set from a terminal or by policy_edit.py set on a live run's branch, and the loop guard refuses an agent's change to it anywhere else. Unset, remote-ci reads HELD, no pin."
usage = 'verdict.remote.pin = "1fe706824a048fd582f17ef18b4ec6b2d9898d46"'
owner = "dWitnessedBar"

[[key]]
name = "verdict.peer.signers"
allowed = { type = "set", item = '[A-Za-z0-9._-]+ (ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521|sk-ssh-ed25519@openssh[.]com|sk-ecdsa-sha2-nistp256@openssh[.]com) [A-Za-z0-9+/]+={0,3}' }
empty = "never"
default = { derived = "none, until the owner registers a node key" }
summary = "Which node keys may sign a peer-node verdict: one allowed-signers line per node, its node tag, its SSH key type and its base64 public key, with no options field. The peer-node reader reads it at the landed revision, verifies the refs/gov/verdict/<sha> tag with git verify-tag against it, and lets the verdict stand only when the signing key's node tag is the tag's node line and not the reading node's own. The owner's: set from a terminal or by policy_edit.py set on a live run's branch, and the loop guard refuses an agent's change to it anywhere else. Unset, every peer-node read is NONE, no signer table."
usage = 'verdict.peer.signers = ["b ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA01XHzWJLfi5hyD6zkT39tg7Apyf1k93ZQ2h2VvlYuK"]'
owner = "dWitnessedBar"

