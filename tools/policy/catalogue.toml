[[key]]
name = "review.loop.cadence"
allowed = ["weekly", "monthly", "every-n-landings"]
default = "weekly"
owner = "dCalibratedLens"

[[key]]
name = "review.loop.retire"
allowed = ["propose-ratify", "demote-then-propose", "report"]
default = "propose-ratify"
owner = "dCalibratedLens"

[[key]]
name = "review.loop.window-days"
allowed = { type = "days", min = 0 }
default = 60
owner = "dCalibratedLens"
direction = "raise-loosens"

[[key]]
name = "review.loop.catch-source"
allowed = ["verdict-records", "node-journal"]
default = "verdict-records"
owner = "dCalibratedLens"

[[key]]
name = "budgets.*"
allowed = { type = "count", min = 0 }
default = { derived = "the value its legacy home held, `template-size-limits.txt` moved by dSafePassage's step, then re-derived from evidence" }
owner = "dGroundRules"

[[key]]
name = "budgets.enforce"
allowed = ["warn", "refuse"]
default = "warn"
summary = "Whether a size cap's breach warns or refuses, for every cap not pinned."
usage = 'budgets.enforce = "refuse"'
owner = "dGroundRules"

[[key]]
name = "budgets.pinned"
allowed = { type = "set", item = ".+", registry = "named caps under `budgets.enforce`, each refusing whatever the switch says, a name outside the switch, exempt from it or matching no cap the caps census lists refused at the schema" }
empty = "allowed"
default = []
summary = "The caps whose breach refuses whatever `budgets.enforce` says."
usage = 'budgets.pinned = ["AGENTS.md"]'
owner = "dGroundRules"

[[key]]
name = "tags.slice"
allowed = ["leaf", "subtree"]
default = "leaf"
summary = "What `gov tag show` returns for a tag: its own row, or its subtree, every tag with it as a dot-prefix."
usage = 'tags.slice = "subtree"'
owner = "dOrderedCharter"

[[key]]
name = "tags.retired-cites"
allowed = ["refuse-new", "warn", "allow"]
default = "refuse-new"
summary = "What `gov tag check` does with new text citing a retired tag: refuse it, warn, or allow it; a retired name minted again is refused under every value."
usage = 'tags.retired-cites = "warn"'
owner = "dOrderedCharter"

[[key]]
name = "tags.positional"
allowed = ["shrink-only", "refuse", "report"]
default = "shrink-only"
summary = "What `gov tag check` does with a positional reference, a file:line citation or a section number: red it unless the positional list holds it, red it listed or not, or only print it."
usage = 'tags.positional = "report"'
owner = "dOrderedCharter"

[[key]]
name = "tags.bare-refs"
allowed = ["charter-only", "unique", "never"]
default = "charter-only"
summary = "How `gov tag check` reads a bare name, a tag less its namespace: as a charter practice only, against every namespace and red where two match, or red anywhere outside the charter."
usage = 'tags.bare-refs = "unique"'
owner = "dOrderedCharter"

[[key]]
name = "tags.bundle"
allowed = ["manifest", "inline", "both"]
default = "both"
summary = "What `gov tag bundle` does with a range's content: print the manifest alone and refuse --inline, inline every call under its --bytes budget, or print the manifest and inline on --inline."
usage = 'tags.bundle = "manifest"'
owner = "dOrderedCharter"

[[key]]
name = "tags.bundle-rows"
allowed = [20, 40, 80]
default = 40
summary = "How many rows `gov tag bundle` prints before it folds rows by their kit directory, the largest group first; --under opens a folded group."
usage = 'tags.bundle-rows = 80'
owner = "dOrderedCharter"

[[key]]
name = "annotations.lookup"
allowed = ["query-and-map", "query", "map-index"]
default = "query-and-map"
owner = "dLinkedLibrary"

[[key]]
name = "annotations.resolve-scope"
allowed = ["notes", "every-comment-ref"]
default = "every-comment-ref"
owner = "dLinkedLibrary"

[[key]]
name = "annotations.delivery"
allowed = ["work-order", "on-demand", "off"]
default = "work-order"
owner = "dFurnishedOrders"

[[key]]
name = "instructions.slices"
allowed = ["handed", "pointer"]
default = "handed"
owner = "dFurnishedOrders"

[[key]]
name = "instructions.legacy"
allowed = ["shrink-only", "refuse"]
default = "shrink-only"
summary = "What the render gate does with the list of instruction files not yet rendered from units: hold it to shrinking, a listed file rendered from units reading as stale, or refuse every listed file."
usage = 'instructions.legacy = "refuse"'
owner = "dOrderedCharter"

[[key]]
name = "instructions.task-charter"
allowed = ["when-not-static", "always"]
default = "when-not-static"
owner = "dBoundRoles"

[[key]]
name = "review.twin"
allowed = ["never", "design-records", "design-and-landing", "always"]
default = "never"
owner = "dDeclaredLoop"

[[key]]
name = "roles.shape-enforce"
allowed = ["refuse", "record"]
default = "refuse"
owner = "dWellOiledMachine"

[[key]]
name = "roles.orientation.house-index"
allowed = ["handed", "pointer", "off"]
default = "handed"
owner = "dFurnishedOrders"

[[key]]
name = "memory.default-load"
allowed = ["card", "card-and-live", "card-and-map"]
default = "card-and-map"
owner = "dWellOiledMachine"

[[key]]
name = "memory.code-budget"
allowed = { type = "pattern", regex = "[1-9][0-9]*k" }
default = "16k"
owner = "dFurnishedOrders"

[[key]]
name = "memory.code-roles"
allowed = ["working-roles", "every-role", "structural-roles"]
default = "every-role"
owner = "dFurnishedOrders"

[[key]]
name = "memory.code-languages"
allowed = ["builtin", "builtin+ctags", "ctags"]
default = "builtin"
owner = "dTotalRecall"

[[key]]
name = "memory.code-enrich"
allowed = ["symbol-hash-slots", "in-code-notes", "derived-only"]
default = "symbol-hash-slots"
owner = "dLinkedLibrary"

[[key]]
name = "memory.load-budget"
allowed = ["4k", "8k", "16k"]
default = "8k"
owner = "dTotalRecall"

[[key]]
name = "memory.item-budget"
allowed = { type = "enum", of = ["measured", 96, 128], registry = "KB per role (each role's cap the owner's to adjust)" }
default = "measured"
owner = "dTotalRecall"

[[key]]
name = "memory.over-budget"
allowed = ["refuse", "report", "off"]
default = "report"
owner = "dTotalRecall"

[[key]]
name = "memory.mirror"
allowed = { type = "enum", of = ["none"], registry = "a registered memory-mirror adapter" }
default = "none"
owner = "dWellOiledMachine"

[[key]]
name = "memory.project-map"
allowed = ["structural-roles", "every-role", "owner-only"]
default = "structural-roles"
owner = "dFurnishedOrders"

[[key]]
name = "memory.map-budget"
allowed = ["16k", "24k", "32k"]
default = "32k"
owner = "dTotalRecall"

[[key]]
name = "memory.map-overflow"
allowed = ["degrade", "refuse"]
default = "degrade"
owner = "dTotalRecall"

[[key]]
name = "memory.map-unfold"
allowed = ["item-declared", "none", "all"]
default = "item-declared"
owner = "dFurnishedOrders"

[[key]]
name = "memory.map-purpose"
allowed = ["review", "ledger", "derive", "refuse"]
default = "review"
owner = "dTotalRecall"

[[key]]
name = "memory.legacy-anchors"
allowed = ["derived", "none", "retag"]
default = "derived"
owner = "dTotalRecall"

[[key]]
name = "memory.superseded-slices"
allowed = ["refuse", "mark"]
default = "refuse"
owner = "dTotalRecall"

[[key]]
name = "retrofit.drain"
allowed = ["hunk", "file", "off"]
default = "hunk"
owner = "dScopedBuild"

[[key]]
name = "retrofit.drain-cap"
allowed = [5, 20, 50]
default = 20
owner = "dScopedBuild"

[[key]]
name = "retrofit.claim-on-touch"
allowed = ["claim", "carry", "off"]
default = "claim"
owner = "dScopedBuild"

[[key]]
name = "retrofit.claim-cap"
allowed = [1, 3, 5]
default = 3
owner = "dScopedBuild"

[[key]]
name = "retrofit.widen"
allowed = ["record-reason", "refuse"]
default = "record-reason"
owner = "dWitnessedBar"

[[key]]
name = "retrofit.unseeded"
allowed = ["unarmed", "refuse"]
default = "unarmed"
owner = "dWitnessedBar"

[[key]]
name = "retrofit.reconstruct"
allowed = ["on-touch", "at-adoption", "on-ask"]
default = "on-touch"
owner = "dLinkedLibrary"

[[key]]
name = "retrofit.decisions"
allowed = ["author-rubric", "docs-owner-ratifies", "docs-and-trailers"]
default = "author-rubric"
owner = "dLinkedLibrary"

[[key]]
name = "retrofit.practice-pending"
allowed = ["alongside", "propose-retire"]
default = "alongside"
owner = "dLinkedLibrary"

[[key]]
name = "retrofit.cadence"
allowed = ["off", "hot-first"]
default = "hot-first"
owner = "dTendedCadence"

[[key]]
name = "retrofit.slot-bytes"
allowed = [512, 1024, 2048]
default = 1024
owner = "dFurnishedOrders"

[[key]]
name = "commits.edge-check"
allowed = ["push-leg", "commit-msg", "off"]
default = "push-leg"
owner = "dWellOiledMachine"

[[key]]
name = "commits.squash"
allowed = ["re-emit-union", "refuse", "accept-loss"]
default = "re-emit-union"
owner = "dShippedRelease"

[[key]]
name = "trace.identity"
allowed = ["act-only", "session", "salted"]
default = "session"
owner = "dWellOiledMachine"

[[key]]
name = "trace.cost"
allowed = ["tokens+wall", "tokens", "none"]
default = "tokens+wall"
owner = "dWellOiledMachine"

[[key]]
name = "trace.leg-output"
allowed = ["tail-by-hash", "node-local"]
default = "tail-by-hash"
summary = "Where a failing leg's output tail lives: kept by its hash in the common dir and named in the verdict under either value, and under `tail-by-hash` also committed as a `leg-tail` record by the run-gates kit's `keep_tails.py`."
usage = 'trace.leg-output = "node-local"'
owner = "dWitnessedBar"

[[key]]
name = "trace.rows"
allowed = [60, 120, "all"]
default = 120
owner = "dWellOiledMachine"

[[key]]
name = "runtime.binary"
allowed = { type = "enum", of = ["newest-conforming", "path", "app-bundled"], registry = "a pinned path" }
default = "newest-conforming"
owner = "dWellOiledMachine"

[[key]]
name = "runtime.owner-harness"
allowed = { type = "enum", of = ["auto"], registry = "a registered harness adapter" }
default = "auto"
owner = "dWellOiledMachine"

[[key]]
name = "runtime.act-harness"
allowed = { type = "enum", of = ["claude-code", "codex"], registry = "another registered harness adapter that passes the act rows" }
default = "claude-code"
owner = "dWellOiledMachine"

[[key]]
name = "runtime.act-auth"
allowed = { type = "list", of = ["setup-token", "oauth-shared", "api-key"], registry = "api-key only last and only when the owner adds it" }
empty = "never"
default = ["setup-token", "oauth-shared"]
owner = "dWellOiledMachine"

[[key]]
name = "platforms.supported"
allowed = { type = "set", of = ["windows-gitbash", "linux", "macos", "pwsh-launch"] }
empty = "never"
default = ["windows-gitbash", "linux"]
owner = "dShippedRelease"

[[key]]
name = "platforms.verify"
allowed = ["held", "bar", "ci", "off"]
default = "held"
owner = "dShippedRelease"

[[key]]
name = "platforms.provision"
allowed = ["name", "uv", "off"]
default = "name"
summary = "What the Python resolver's refusal below the interpreter floor does about installing it: name the install command, offer to run it with uv on a terminal, or name nothing."
usage = 'platforms.provision = "uv"'
owner = "dSafePassage"

[[key]]
name = "install.deprecation-window"
allowed = [0, 1, 2, 4]
default = 2
summary = "How many releases gov cuts after a moved surface's forwarder lands before it may take the forwarder away; no forwarder closes before the first release."
usage = 'install.deprecation-window = 4'
owner = "dSafePassage"

[[key]]
name = "install.on-shim-call"
allowed = ["warn", "journal"]
default = "warn"
summary = "What a forwarder left at a moved command, hook or module path does when called: print a line naming the new path and journal the call, or journal it silently."
usage = 'install.on-shim-call = "journal"'
owner = "dSafePassage"

[[key]]
name = "install.retired-edits"
allowed = ["order", "keep"]
default = "order"
summary = "What update does with a file you edited that gov no longer ships: keep your copy and write an outbox order for it, or keep it and name it in the report with no order."
usage = 'install.retired-edits = "keep"'
owner = "dSafePassage"

[[key]]
name = "install.steps"
allowed = ["offer", "attended"]
default = "offer"
owner = "dShippedRelease"

[[namespace]]
name = "bar"
purpose = "How the merge bar treats a red leg: whether a red bar or pass leg may be fixed inline with no spec, its record written after."

[[namespace]]
name = "budgets"
purpose = "How the size caps are enforced: whether a cap's breach warns or refuses, and which caps refuse whatever that switch says."

[[namespace]]
name = "charter"
purpose = "What the rendered charter carries, and which wins when a live instruction conflicts with it."

[[namespace]]
name = "core"
purpose = "How the core checks hold: whether a permitted bypass skips them, and which exception records excuse a core red."

[[namespace]]
name = "help"
purpose = "What the docs leg does with a stale help page, an undeclared verb or flag, a broken link or an undocumented member."

[[namespace]]
name = "install"
purpose = "How install and update treat a moved or retired surface: a forwarder's deprecation window and its call, and an edited file gov no longer ships."

[[namespace]]
name = "instructions"
purpose = "How instruction units are written, proved, excluded, pinned and rendered, and what a render does with a missing unit or a legacy file."

[[namespace]]
name = "memory"
purpose = "How the memory tree's generated records are kept, such as whether the pre-commit hook renders and stages the build index."

[[namespace]]
name = "pass"
purpose = "What runs after each unit pass, such as whether the declared fast gate legs run."

[[namespace]]
name = "platforms"
purpose = "How the toolchain a platform needs is provisioned, such as what the Python resolver does below the interpreter floor."

[[namespace]]
name = "policy-file"
purpose = "How the policy file itself reads, such as what a malformed file or a value outside its key's allowed set reads as."

[[namespace]]
name = "review"
purpose = "How reviews run, such as how a spec audit disposes a confirmed finding and when its chain stops or holds for the owner."

[[namespace]]
name = "runtime"
purpose = "How a session runs its agents, such as how many it may have in flight."

[[namespace]]
name = "tags"
purpose = "What the `gov tag` commands do: how they show, check and bundle tags, and how they read a retired, positional or bare reference."
