# TOOL-dFoldedAudit-7: the three spec-audit switches, the new rules as their defaults and the old
# rule an allowed value. They are no row of the design's [policies] table, so the header's order does
# not place them; they bind a chain of subjects, where the rows above count one subject's rounds.
[[key]]
name = "review.spec-audit.disposal"
allowed = ["by-nature", "promote-all"]
default = "by-nature"
summary = "How a spec audit disposes a confirmed finding: fold local fixes and promote new mechanisms, or promote every finding."
usage = 'review.spec-audit.disposal = "promote-all"'
owner = "dFoldedAudit"

[[key]]
name = "review.spec-audit.chain-stop"
allowed = ["own-work", "clean-only"]
default = "own-work"
summary = "When a spec-audit chain stops: on a clean round or a round whose highs all sit in the prior round's own work, or on a clean round alone."
usage = 'review.spec-audit.chain-stop = "clean-only"'
owner = "dFoldedAudit"

[[key]]
name = "review.spec-audit.chain-ceiling"
allowed = { type = "round-count", min = 1 }
default = 4
summary = "The chain round at which a spec-audit chain neither stop has ended holds for the owner."
usage = 'review.spec-audit.chain-ceiling = 6'
owner = "dFoldedAudit"
direction = "raise-loosens"

# TOOL-aNimbleMend-1: the two switches of the aNimbleMend mechanisms, each default on. They are no
# row of the design's [policies] table, so the header's order does not place them.
[[key]]
name = "bar.inline-red-fixes"
allowed = ["on", "off"]
default = "on"
summary = "Whether a red bar leg or pass leg may be fixed with no spec, its record written after: on, or off, every product write then needing its specced unit."
usage = 'bar.inline-red-fixes = "off"'
owner = "aNimbleMend"

[[key]]
name = "pass.fast-legs"
allowed = ["on", "off"]
default = "on"
summary = "Whether the declared fast gate legs run after every unit pass: on, or off, a pass then running no gate leg."
usage = 'pass.fast-legs = "off"'
owner = "aNimbleMend"

# TOOL-aTrimmedWait-10: the commit-render switch, default off. It is no row of the design's [policies] table, so the header's order does not place it.
[[key]]
name = "memory.staged-render"
allowed = ["on", "off"]
default = "off"
summary = "Whether the pre-commit hook renders and stages the build index when check 9 refuses a commit: on, or off, the commit then refused as before."
usage = 'memory.staged-render = "on"'
owner = "aTrimmedWait"

