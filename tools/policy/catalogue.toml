# catalogue.toml - the policy kit's catalogue, and the schema every key of `.governance/policy.toml`
# is checked against. One [[key]] row per row of the design's [policies] table, in that table's
# order, each row's `name` and `owner` that table's own, but for `review.opt-in`, `review.unclassed`,
# `review.twin` and the two `review.design-audit.*` rows, whose `owner` is the build their reader lands
# in, dDeclaredLoop, and not the table's dFairHearing (TOOL-dFairHearing-50 S16). The fields and the
# `allowed` grammar are this kit's README; the value check and the shape audit are `policy.py` beside
# this file.
#
# A row with no `summary` or no `usage` is named on `unsummarised-keys.txt`, a shrink-only list:
# write both fields on a row, then drain it with `python <this kit>/policy.py lists --write`.
#
# A policy namespace, the first segment of a dotted key name, declares its purpose in one
# [[namespace]] row, `name` and `purpose`, after the last [[key]] row (KICK-dKeptSession-16). A
# namespace with no row is held on `unpurposed-namespaces.txt`, a shrink-only list awaiting review,
# and a new namespace that declares no purpose is refused: give it a row, then `lists --write`.

[[key]]
name = "preset"
allowed = { type = "enum", of = ["velocity", "standard", "strict", "guarded"], registry = "a repo-declared preset" }
default = "standard"
owner = "dKeptSession"

[[key]]
name = "charter.override"
allowed = ["explicit-override", "live-owner-wins", "absolute"]
default = "explicit-override"
summary = "Which wins when a live instruction conflicts with the charter: the charter unless the owner overrides it in so many words, the live owner instruction, or the charter always; an override taken is recorded in the build's folder."
usage = 'charter.override = "absolute"'
owner = "dOrderedCharter"

[[key]]
name = "charter.practices"
allowed = { type = "set", item = "[A-Za-z0-9][A-Za-z0-9_.-]*", registry = "catalogue or repo-declared practices" }
empty = "never"
default = { derived = "the governance foundation set" }
summary = "Which practices the rendered charter carries: practice tags or pack names, and unset, the catalogue's foundation set."
usage = 'charter.practices = ["practice.yagni", "practice.reuse"]'
owner = "dOrderedCharter"

[[key]]
name = "core.bypass"
allowed = ["with-hooks-report", "with-hooks-block", "never"]
default = "with-hooks-report"
summary = "Whether a permitted bypass skips the core checks with every other leg, its core red reported or blocking after, or never: under never the meta-check reds a core leg that carries a leg guard."
usage = 'core.bypass = "never"'
owner = "dOrderedCharter"

[[key]]
name = "core.exceptions"
allowed = ["any-session-recorded", "owner-only-expiring", "none"]
default = "any-session-recorded"
summary = "Which exception records excuse a core red: any well-formed record a session wrote, only an owner-written one whose expiry is still ahead, or none, every record then red."
usage = 'core.exceptions = "owner-only-expiring"'
owner = "dOrderedCharter"

