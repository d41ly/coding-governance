[[key]]
name = "hooks.bypass"
allowed = ["allowed", "refused"]
default = "allowed"
summary = "Whether a hook bypass is only recorded or also refused. Under both values each one is recorded as a decision=bypass line in the git common dir's runlog/pushes.log: a landing the pre-push hook never allowed, which the lander reports landed UNGATED, and a pushed pass commit with no Commit-Checked: trailer, which the unattended commit check never saw. Under allowed the push proceeds and the pass-order leg lists such commits as a note. Under refused the pre-push hook refuses them, the pass-order leg reds on them, and the lander and the hook refuse every landing until verdict names an off-node backend, since a hook on the bypassing node cannot refuse its own bypass. Read at the default branch's tip by the hook, at the landed revision by the lander, and at the graded commit by the leg."
usage = 'hooks.bypass = "refused"'
owner = "dWitnessedBar"

