# catalogue.toml - the policy kit's catalogue, and the schema every key of `.governance/policy.toml`
# is checked against. One [[key]] row per row of the design's [policies] table, in that table's
# order, each row's `name` and `owner` that table's own. The fields and the `allowed` grammar are
# this kit's README; the value check and the shape audit are `policy.py` beside this file.
#
# A row with no `summary` or no `usage` is named on `unsummarised-keys.txt`, a shrink-only list:
# write both fields on a row, then drain it with `python <this kit>/policy.py lists --write`.

[[key]]
name = "preset"
allowed = { type = "enum", of = ["velocity", "standard", "strict", "guarded"], registry = "a repo-declared preset" }
default = "standard"
owner = "dKeptSession"

[[key]]
name = "charter.override"
allowed = ["explicit-override", "live-owner-wins", "absolute"]
default = "explicit-override"
owner = "dOrderedCharter"

[[key]]
name = "charter.practices"
allowed = { type = "set", item = "[A-Za-z0-9][A-Za-z0-9_.-]*", registry = "catalogue or repo-declared practices" }
empty = "never"
default = { derived = "the governance foundation set" }
owner = "dOrderedCharter"

[[key]]
name = "core.bypass"
allowed = ["with-hooks-report", "with-hooks-block", "never"]
default = "with-hooks-report"
owner = "dOrderedCharter"

[[key]]
name = "core.exceptions"
allowed = ["any-session-recorded", "owner-only-expiring", "none"]
default = "any-session-recorded"
owner = "dOrderedCharter"

[[key]]
name = "design.forks"
allowed = ["agents-feature-rich-expandable", "preference-forks-park", "owner-decides-all"]
default = "agents-feature-rich-expandable"
owner = "dIndexedDesign"

[[key]]
name = "design.reentry"
allowed = { type = "set", of = ["interface-change", "two-plus-units", "review-cross-unit-flaw", "planner-or-owner-flag"] }
empty = "never"
default = ["interface-change", "review-cross-unit-flaw", "planner-or-owner-flag"]
owner = "dIndexedDesign"

[[key]]
name = "autonomy"
allowed = ["plan-only", "three-gates", "every-stage"]
default = "plan-only"
owner = "dDeclaredLoop"

[[key]]
