allowed = ["owner-only", "agents-with-reason", "agents-within-mandate"]
default = "owner-only"
owner = "dDeclaredLoop"

[[key]]
name = "policy-file.proof"
allowed = ["tty-cli", "signed", "both"]
default = "tty-cli"
owner = "dDeclaredLoop"

[[key]]
name = "policy-file.on-invalid"
allowed = ["last-valid", "refuse"]
default = "last-valid"
summary = "What a malformed policy file, or a value outside its key's allowed set, reads as: the last valid landed revision, or a refusal."
usage = 'policy-file.on-invalid = "refuse"'
owner = "dGroundRules"

