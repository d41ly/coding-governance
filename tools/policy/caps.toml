# caps.toml - the cap census (TOOL-dGroundRules-9): one [[cap]] table per size cap the caps research
# lists, read by `budgets.py` beside this file. The census is the population, so "every cap" is a join
# over these rows and never a list typed in an arm: `check_policy.py`'s `arm_cap_census` holds it to
# the tree both ways, and its fixture runs one `budgets-cap-<name>` case per row.
#
#   name      the key under `budgets.*` in .governance/policy.toml, quoted there when it carries a
#             `/`, `.` or `*`. A row of template-size-limits.txt is named by that row's key.
#   class     `switch`: a breach warns or refuses as `budgets.enforce` and `budgets.pinned` say;
#             `consumer`: a limit its consumer enforces by dropping what is over, outside the switch;
#             `correctness`: a check of correctness, outside the switch; `exempt`: outside the switch
#             and never pinnable. No `exempt` row exists today; the schema refuses one in `pinned`.
#   unit      `bytes`, `lines`, `chars` or `count`.
#   enforcer  the file that measures the cap, `{prefix}`-relative as gate-legs.json spells one.
#   home      where the value is declared today: `limits:<row key>` (a row of the template-size limits
#             file, read by budgets.py alone), `file:<path>:<row key>`, `conf:<path>:<KEY>` or
#             `constant:<path>:<NAME>`, the last three read by the enforcer and handed in.
#   family    true where the value is per subject: the enforcer asks only the mode, and the policy
#             file may not set a value.
#   research  the caps research's row number.
#   ships     optional, true when absent: `false` on a row whose enforcer is a `{prefix}` path the
#             deployer's registry exempts, so no install holds it and an adopter's census arm
#             announces the row rather than grading it (TOOL-dGroundRules-17). The `policy fixtures`
#             case `budgets-ships-join` holds these flags to the registry's exemptions both ways.
#   kit       on a shipped row only, and required there: the deployer's registry entry id that
#             installs the enforcer, the id an install receipt's `kits` list names.
#   installed on a shipped row only, and required there: where that entry writes the enforcer,
#             `{prefix}`-spelled. An adopter's census arm grades the row there, `{prefix}` read as
#             its receipt's `prefix` (TOOL-dGroundRules-22).
#
# No value is copied here: every cap keeps the value its home holds (help/size-caps.md).

