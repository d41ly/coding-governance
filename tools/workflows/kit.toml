# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "review-harness"
home = "tools/workflows"
scope = "repo"
version_from = { file = "tier2-review.js", pattern = "version: " }
requires = ["agent-cap"]
why_two_ids = "this directory versions its files under TWO kit ids — the review harness and the drift-audit workflows — so a single version_from cannot describe it. The drift-audit workflow scripts travel with the drift-audit entry."

[[files]]
include = "**"
role = "engine"

[[files]]
include = ["REVIEW-PROTOCOL.template.md"]
role = "rendered"
to = "{memory_root}/guides/REVIEW-PROTOCOL.md"
placeholders = ["TOOL_ROOT"]

[adopt]
argv = []
mutates_index = false
why_no_adopter = "the harness is copied and its protocol rendered; the render is performed by the parity gate's own --render mode rather than by a separate adopter"

[[gate_leg]]
name = "verifier fan-out"
subject = "repo"
argv = ["bash", "{kit}/check-verifier-fanout.sh"]
guard = ["{kit}/"]

[[gate_leg]]
name = "review-protocol parity (kit vs dogfood)"
subject = "repo"
argv = ["bash", "{kit}/check-protocol-parity.test.sh"]
guard = ["{kit}/", "{memory_root}/guides/REVIEW-PROTOCOL.md"]

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the parity gate is this entry's leg and it performs its own render comparison; there is no adopter to ask
"""

[[gate_leg]]
name = "verifier fan-out self-test"
subject = "kit"
argv = ["bash", "{kit}/check-verifier-fanout.test.sh"]
guard = ["{kit}/", "tools/hooks/"]

[[gate_leg]]
name = "review-join ban (no ref-keyed join)"
subject = "repo"
argv = ["bash", "{kit}/check-review-join.sh"]
guard = []

[[gate_leg]]
name = "workflow script syntax"
subject = "repo"
argv = ["node", "{kit}/check-workflow-syntax.js"]
guard = []

[[gate_leg]]
name = "review-join self-test"
subject = "kit"
argv = ["bash", "{kit}/check-review-join.test.sh"]
guard = ["{kit}/", "tools/hooks/"]

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = "{kit}/*.js"
why = "measured: 350 CR bytes made the shipped harness unlaunchable while its own syntax leg stayed green"
