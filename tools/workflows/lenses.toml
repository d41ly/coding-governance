# lenses.toml — one row per lens; a row's place in the file is its slot order.
#
# The review harness's lens literals are RENDERED from these rows by render_lenses.py, at install and
# in the parity leg, because a workflow script has no filesystem and cannot read this file. A row
# fills a default slot of every literal its `default_in` names. A literal name is what a marker
# `// gov:lens-slots <literal>` in tier2-review.template.js declares: `diff-review` for the diff
# kind's literal and a spec-audit preset name otherwise. The row grammar and the rules the renderer
# checks are in this kit's README, section "The lens catalogue". The slot count is the fan-out leg's,
# never this file's: a sixth default row renders a sixth slot, and check-verifier-fanout.sh reds it.
# An `optin = true` row is also rendered under the `// gov:lens-optins` marker, as OPTIN_LENSES, the set
# a caller's `optIn` may swap into a default slot of a literal its `presets` names.

[[lens]]
key = "security"
kinds = ["diff-review"]
presets = ["diff-review"]
default_in = ["diff-review"]
optin = false
brief = "Security: trust boundaries for THIS kind of code. Commands built from interpolated input (shell, SQL, regex, paths), path traversal and symlinks, secrets reaching logs or output, authorization or enforcement that can be bypassed, and output from another program or agent trusted without validation."

[[lens]]
key = "correctness"
kinds = ["diff-review"]
presets = ["diff-review"]
default_in = ["diff-review"]
optin = false
brief = "Correctness: logic bugs, wrong conditionals and edge cases, off-by-one, type and encoding coercion drift, error and empty-input paths, and two copies of one rule that disagree."

[[lens]]
key = "seams"
kinds = ["diff-review"]
presets = ["diff-review"]
default_in = ["diff-review"]
optin = false
brief = "Integration seams + dead plumbing: values computed→passed→never read, stale caches not reset on every mutation path, indexes that don't serve their query, half-applied merges, cross-language catalog drift."

[[lens]]
key = "verification"
kinds = ["diff-review"]
presets = ["diff-review"]
default_in = ["diff-review"]
optin = false
brief = "Verification: does every behaviour this diff changes have a check that can FAIL? Report a test or gate whose fixture never triggers the rule, a predicate that matches nothing, a skip that reads as a pass, and a changed behaviour with no check at all."

[[lens]]
key = "intent"
kinds = ["diff-review"]
presets = ["diff-review"]
default_in = ["diff-review"]
optin = false
brief = "Intent: does the diff do what its stated intent says? Read the range's commit messages and any spec or design document the diff touches or those messages name, then report an acceptance criterion with no code behind it, a stated mechanism that is not the one built, and scope beyond what was asked."

[[lens]]
key = "coherence"
kinds = ["spec-audit"]
presets = ["unit-spec"]
default_in = ["unit-spec"]
optin = false
brief = "Coherence: does the spec set agree with itself, and can its acceptance decide anything? Report a section-2 item no section-6 criterion observes; a criterion whose observation cannot FAIL on today's tree, because it is already green before the unit is built; a criterion that cannot PASS on a correct build, because it demands what the design does not produce or a figure the build cannot reach; section 2 against section 3; section 4 Design against section 7 Gates; and, across the subjects and the sibling context, the four axes scope, interface, ordering and acceptance: a name, path or key spelled two ways, a unit depending on one ordered after it, two units claiming one file or one landing slot, and an overview acceptance no unit's criteria imply."

[[lens]]
key = "grounding"
kinds = ["spec-audit"]
presets = ["unit-spec"]
default_in = ["unit-spec"]
optin = false
brief = "Grounding: is every claim sections 4 and 10 make about the world TRUE where the subjects stand? Check each claim about existing code, a tool's flags or output, a record, a count, a platform behaviour or a cost against the source, never against the spec. Hunt the traps this platform sets: MSYS argument and path rewriting, drive-letter and backslash paths, CRLF in a working copy and a text-mode read that drops a CR, and a stated wall-clock goal nobody timed. A claim marked UNVERIFIED is a finding only where the design rests on it."

[[lens]]
key = "reuse"
kinds = ["spec-audit"]
presets = ["unit-spec"]
default_in = ["unit-spec"]
optin = false
brief = "Reuse: functionality is reused and extended, never rebuilt. Report a design that builds what already exists, such as a function, a checker, a gate leg, a driver verb or a record shape, instead of extending it; a section-10 seam that is cited but is not the one section 4 extends, or that does not exist; and a question a decision record or an ask already decided, decided asks included. Probe before you claim: the codebase-map kit's reuse_lookup.py with a behaviour phrase, the memory-recall kit's query.py with a plain-English question and 8-14 --terms in this corpus's own jargon, and grep, because the lookup cannot see every layer and prints the ones it skipped. Locate each tool with git ls-files; where one is absent, say so in the finding and use grep. Read the asks through the memory-tree kit's gen_build_index.py --asks --json --all --path <every path the spec's Files touched estimate names>, falling back to the backlog shards when its mode field says shards. THE BAR: a reuse finding names the existing seam or record by path or id AND quotes the spec text that duplicates or contradicts it. That a related record exists is not a finding."

[[lens]]
key = "blast-radius"
kinds = ["spec-audit"]
presets = ["unit-spec"]
default_in = ["unit-spec"]
optin = false
brief = "Blast radius: what does this change trip that the spec does not list? For every name, value or rule the spec renames, retires or changes, grep the name AND the value, and report each consumer, carrier, test arm or document the spec does not name. Join section 4's files-touched list against the gate-leg manifest (gate-legs.json, where the project keeps one) and report a guarded leg section 7 omits; report a declared size or time budget the change will cross; and report the repo's own machinery the spec forgets: version carriers, codebase-map keys, record and filename rules, a --dispatch write set, and a render an adopter regenerates."

[[lens]]
key = "failure-envelope"
kinds = ["spec-audit"]
presets = ["unit-spec"]
default_in = ["unit-spec"]
optin = false
brief = "Failure envelope: what will the built thing meet that the spec never says it handles? Report the input classes the design is silent on (empty, malformed, multi-line, unterminated, huge, concurrent), signals, partial failure and a dead dependency; a security or write surface section 5 did not price; and a spec that names one INSTANCE where the class was meant, such as one file of two or one caller of three. A spec is built as a ceiling: in this kit's own trial (aBlindedTrial, report section 4.3), when a spec named the class for one input file and not the other, the builder handled exactly the file it named."

[[lens]]
key = "coherence"
kinds = ["spec-audit"]
presets = ["design-audit"]
default_in = ["design-audit"]
optin = false
brief = "Coherence: does the design record agree with itself and with the records it cites? Report a stated goal, requirement or invariant no mechanism in the record delivers; one rule, name, path, key or number stated two ways; a step that depends on one ordered after it; two mechanisms claiming one file, one owner or one landing slot; and, across the subjects and the sibling context, a decision one record takes that another contradicts."

[[lens]]
key = "grounding"
kinds = ["spec-audit"]
presets = ["design-audit"]
default_in = ["design-audit"]
optin = false
brief = "Grounding: is every claim the design makes about the world TRUE where the subjects stand? Check each claim about existing code, a tool's flags or output, a record, a count, a platform behaviour or a cost against the source, never against the design. Flag every load-bearing claim that rests on a docs line or a single observation as an untested assumption, name the observation that would overturn it, and probe it where the probe rules allow. Hunt the traps this platform sets: MSYS argument and path rewriting, drive-letter and backslash paths, CRLF in a working copy and a text-mode read that drops a CR, and a stated wall-clock goal nobody timed."

[[lens]]
key = "reuse"
kinds = ["spec-audit"]
presets = ["design-audit"]
default_in = ["design-audit"]
optin = false
brief = "Reuse and precedent: functionality is reused and extended, never rebuilt, and every choice keeps faith with what was decided. Report a mechanism that rebuilds an existing function, checker, gate leg, driver verb or record shape; and a choice that re-opens a decision row, an owner ruling or a decided ask, or drops a condition a ruling rested on, naming the id and quoting both texts. Probe before you claim: the codebase-map kit's reuse_lookup.py with a behaviour phrase, the memory-recall kit's query.py with a plain-English question and 8-14 --terms in this corpus's own jargon, and grep. THE BAR: a finding names the existing seam, record or ruling by path or id AND quotes the design text that duplicates or contradicts it."

[[lens]]
key = "failure-envelope"
kinds = ["spec-audit"]
presets = ["design-audit"]
default_in = ["design-audit"]
optin = false
brief = "Failure envelope and trust boundaries: what will the built system meet that the design never says it handles? Report the input classes it is silent on (empty, malformed, multi-line, unterminated, huge, concurrent), signals, partial failure and a dead dependency; every trust boundary the design creates or relies on, an enforcement a rule, a setting, a second path or a dead dependency bypasses, input trusted without validation, and a guarded action left allowed on failure; and a design that names one instance where the class was meant."

[[lens]]
key = "alternatives-and-cost"
kinds = ["spec-audit"]
presets = ["design-audit"]
default_in = ["design-audit"]
optin = false
brief = "Alternatives and cost: is there a materially simpler or cheaper mechanism meeting the same contract, and what does this one cost? Report an existing seam, a checker in place of an agent, or one process in place of many that meets the same requirement or invariant, saying which; and every agent, session, spawn, token and wall-clock cost the design adds that carries no ceiling, no enforcer, or a ceiling nobody measured."

# The WALKER rows (TOOL-dFairHearing-18): the `whole-design` preset's five slots, each brief naming its slot alone.
# What every walker is told is the harness's WALK_RULES, interpolated with that walker's own slice of the grid.

[[lens]]
key = "walk-1"
kinds = ["spec-audit"]
presets = ["whole-design"]
default_in = ["whole-design"]
optin = false
brief = "Walker slot 1 of 5 of the whole-design walk: walk the cells of your slice under the WALK RULES below."

[[lens]]
key = "walk-2"
kinds = ["spec-audit"]
presets = ["whole-design"]
default_in = ["whole-design"]
optin = false
brief = "Walker slot 2 of 5 of the whole-design walk: walk the cells of your slice under the WALK RULES below."

[[lens]]
key = "walk-3"
kinds = ["spec-audit"]
presets = ["whole-design"]
default_in = ["whole-design"]
optin = false
brief = "Walker slot 3 of 5 of the whole-design walk: walk the cells of your slice under the WALK RULES below."

[[lens]]
key = "walk-4"
kinds = ["spec-audit"]
presets = ["whole-design"]
default_in = ["whole-design"]
optin = false
brief = "Walker slot 4 of 5 of the whole-design walk: walk the cells of your slice under the WALK RULES below."

[[lens]]
key = "walk-5"
kinds = ["spec-audit"]
presets = ["whole-design"]
default_in = ["whole-design"]
optin = false
brief = "Walker slot 5 of 5 of the whole-design walk: walk the cells of your slice under the WALK RULES below."

# The OPT-IN rows (TOOL-dFairHearing-3): no `default_in`, so no literal runs one unless a caller's
# `optIn` swaps it into a default slot. Each stays `optin = false`, catalogued and selectable by
# nothing, until a blind replay it does not lose is recorded; that test flips its row and nothing else.
# The six tests are one ask in dCalibratedLens's BACKLOG.md.

[[lens]]
key = "security"
kinds = ["spec-audit"]
presets = ["unit-spec"]
default_in = []
optin = false
brief = "Security: trust boundaries the design creates or relies on; an enforcement a rule, setting, second path or dead dependency bypasses; input trusted without validation; a guarded action left allowed on failure."

[[lens]]
key = "alternatives"
kinds = ["diff-review", "spec-audit"]
presets = ["diff-review", "unit-spec"]
default_in = []
optin = false
brief = "Alternatives: a materially simpler or cheaper mechanism meeting the same contract: an existing seam, a checker instead of an agent, one process instead of many. Say which acceptance or invariant it meets."

[[lens]]
key = "cost"
kinds = ["diff-review", "spec-audit"]
presets = ["diff-review", "unit-spec"]
default_in = []
optin = false
brief = "Cost: agents, sessions, spawns, tokens and wall time added; one with no ceiling, no enforcer, or a ceiling nobody measured."

[[lens]]
key = "portability"
kinds = ["diff-review"]
presets = ["diff-review"]
default_in = []
optin = false
brief = "Portability: CRLF and autocrlf in fresh worktrees, text-mode reads, MSYS rewriting, path length, Git for Windows signal semantics, spawn cost under antivirus, clock skew."

[[lens]]
key = "adopter-migration"
kinds = ["diff-review", "spec-audit"]
presets = ["diff-review", "unit-spec", "design-audit"]
default_in = []
optin = false
brief = "Adopter migration: what an adopter on the prior version meets: a changed key, shape, render or gate with no upgrade step; non-additive data; versions that must move in lockstep with no check; an assumed install layout."

[[lens]]
key = "topology"
kinds = ["diff-review", "spec-audit"]
presets = ["diff-review", "unit-spec", "design-audit"]
default_in = []
optin = false
brief = "Topology: worktrees, merges and concurrent runs: linked-worktree `GIT_DIR`, absolute hooks paths, a merge read as additions, half-staged moves, leases outliving holders, commits under a running suite."
