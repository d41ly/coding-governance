# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "pytest-parallel-guardrails"
home = "tools/pytest-parallel-guardrails"
scope = "repo"
version_from = { file = "crashprobe.py", pattern = "^KIT_PYTEST_GUARDRAILS_VERSION = " }
requires = []

[[files]]
include = "**"
role = "engine"

# THIS KIT'S SELF-TESTS ARE WITHHELD. TOOL-aQuenchedHarness-3. Each stages a break into a copy of a
# checker in THIS directory and asserts the checker still catches it, so its subject is the checker
# and it has a job only when the source here changes -- and none at all in a tree that copy-installs
# the kit and never edits it. That is the 2026-08-23 owner ruling, applied to what SHIPS rather than
# only to what runs.
#
# WITHHELD BY CLAIMING THE DESTINATION, the mechanism `tools/codebase-map/kit.toml` already uses and
# explains: govkit has no `exclude` key, a `**` rule's pool drops only what another rule owns, and
# `project-owned` is absent from LANDABLE_ROLES so `apply` never writes it.
#
# AND THE LEG GOES WITH THE FILE, through machinery that already exists: `silenced_legs` refuses to
# emit a gate leg whose argv names a path the target does not hold, and `_cmd_apply` REPORTS each one
# rather than shipping it. So this rule closes both halves and needs no deployer code.
#
# SCOPE, and it is the half a reader misses: this withholds from `govkit apply` ONLY. The
# copy-install path in `WIRE-INTO-PROJECT.md` is a plain `cp -r` of the kit dir and does not read
# this file, so that runbook removes them separately. The suites remain in the public repository for
# anyone who edits a kit.
[[files]]
include = ["pytest-parallel-guardrails.test.sh"]
role = "project-owned"

[[files]]
include = ["pyproject-snippet.toml"]
role = "merged"
to = "pyproject.toml"
marker_style = "hash-comment"
block_id = "govkit:pytest-guardrails"

[adopt]
argv = []
mutates_index = false
why_no_adopter = "the kit ships no adopter; adoption is merging its snippet into the target's ini and copying two test files"

[[gate_leg]]
name = "pytest-guardrails self-test"
subject = "kit"
argv = ["bash", "{kit}/pytest-parallel-guardrails.test.sh"]
guard = ["{kit}/"]

[[hole]]
id = "pytest-ini-knobs"
kind = "measurement"
blocks_adopt = false
blocks_gate = false
why = "the knobs must be SIZED against the target's slowest test, not cargo-culted, and nothing the kit installs observes the target's ini — its own leg grades the SHIPPED snippet. The probe below proves PRESENCE and the ordering rule; it cannot prove sizing, and that limit is stated rather than implied."
discharge = { command = ["python", "-c", "import sys, tomllib; ini = tomllib.load(open('pyproject.toml','rb'))['tool']['pytest']['ini_options']; need = ('timeout','timeout_method','session_timeout','faulthandler_timeout'); sys.exit(0 if all(k in ini for k in need) and '--max-worker-restart=0' in str(ini.get('addopts','')) and int(ini['faulthandler_timeout']) < int(ini['timeout']) else 1)"] }

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the kit's leg grades the SHIPPED snippet and nothing in the kit reads a target's own ini — which is precisely this kit's declared hole, so a check arm here would report on the wrong file
"""
