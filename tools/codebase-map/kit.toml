# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "codebase-map"
home = "tools/codebase-map"
scope = "repo"
version_from = { file = "map_lib.py", pattern = "^KIT_CODEBASE_MAP_VERSION = " }
requires = ["memory-tree"]

[[files]]
include = "**"
role = "engine"

# THIS KIT'S SELF-TESTS ARE WITHHELD. TOOL-aQuenchedHarness-3. Each stages a break into a copy of a
# checker in THIS directory and asserts the checker still catches it, so its subject is the checker
# and it has a job only when the source here changes -- and none at all in a tree that copy-installs
# the kit and never edits it. That is the 2026-08-23 owner ruling, applied to what SHIPS rather than
# only to what runs.
#
# WITHHELD BY CLAIMING THE DESTINATION, the mechanism `tools/codebase-map/kit.toml` already uses and
# explains: govkit has no `exclude` key, a `**` rule's pool drops only what another rule owns, and
# `project-owned` is absent from LANDABLE_ROLES so `apply` never writes it.
#
# AND THE LEG GOES WITH THE FILE, through machinery that already exists: `silenced_legs` refuses to
# emit a gate leg whose argv names a path the target does not hold, and `_cmd_apply` REPORTS each one
# rather than shipping it. So this rule closes both halves and needs no deployer code.
#
# SCOPE, and it is the half a reader misses: this withholds from `govkit apply` ONLY. The
# copy-install path in `WIRE-INTO-PROJECT.md` is a plain `cp -r` of the kit dir and does not read
# this file, so that runbook removes them separately. The suites remain in the public repository for
# anyone who edits a kit.
[[files]]
include = ["adopt-codebase-map.test.sh", "selftest.py", "test_codebase_map.py"]
role = "project-owned"

[[files]]
include = ["map_extractors.py"]
role = "project-owned"

# The replay harness is GOV-ONLY. It parses THIS repo's build records for probe phrases and their
# section-10 ground truth, so in an adopter's tree it grades a corpus that does not exist — the
# `pin-copied-from-another-corpus` shape by another route. Withheld by CLAIMING its destination,
# exactly as `map_extractors.py` above: govkit has no `exclude` key, a `**` rule's pool drops only
# what another rule owns, and `project-owned` is absent from LANDABLE_ROLES so `apply` never writes
# it. NOTE THE SCOPE, and it is the half a reader misses: this withholds it from `govkit apply`
# ONLY. The copy-install path WIRE-INTO-PROJECT.md documents is a plain `cp -r` of the kit dir and
# does not read this file, so that runbook removes it separately.
[[files]]
include = ["replay-phrases.py"]
role = "project-owned"

# The ranking harness and its scenario set, withheld for the same reason and by the same mechanism.
# `scen-adversarial.json`'s 28 rows are seams established by reading THIS repo's code, so an adopter
# receives a set that grades a corpus they do not have; `rank_harness.py` without it grades nothing.
# `TOOL-dTracedLattice-1` S8/AC13. Same scope caveat as above: this withholds them from `govkit
# apply` ONLY, and the copy-install path in WIRE-INTO-PROJECT.md removes them separately.
[[files]]
include = ["rank_harness.py", "scen-adversarial.json"]
role = "project-owned"

[[files]]
include = ["map_extractors.template.py"]
role = "seed"
to = "{kit}/map_extractors.py"

[[files]]
include = [".codebase-map.conf.example"]
role = "engine"

[config]
file = ".codebase-map.conf"
owner = "codebase-map"
required_keys_gate = ["MAP_ROOT", "GATE_FILE"]
required_keys_render = ["MAP_ROOT"]
optional_keys = ["MAP_DIFF_CMD"]

[adopt]
argv = ["bash", "{kit}/adopt-codebase-map.sh", "--scaffold"]
mutates_index = false

[[outcome]]
code = 1
probe = { must_exist = ".codebase-map.conf", must_not_exist = "{kit}/map_extractors.py" }
means = "seeded-conf"
# The same accepted first-run stop as memory-tree's: the conf is seeded and the operator decides the
# inventory before extractors exist. The sibling outcome below is NOT marked, because its own name
# admits it cannot tell a seed from a crash.
ok = true

[[outcome]]
code = 1
probe = { must_exist = "{kit}/map_extractors.py", must_not_exist = "{map_root}/generated" }
means = "seeded-extractors-or-crashed"

[[gate_leg]]
name = "codebase-map coverage + freshness"
subject = "repo"
argv = ["python", "{gate_file}"]
guard = []
history_depth = "full"

[[hole]]
id = "map-extractors"
kind = "authoring"
blocks_adopt = true
blocks_gate = true
why = "the template raises on an empty EXTRACTORS dict and gen_map calls inventory_ids() at module level, so the adopter exits 1 with no map tree, no baseline and no gate file. The leg is then ABSENT rather than red, which a runner that skips a missing leg would score green."
discharge = { command = ["python", "-c", "import sys; sys.path.insert(0, '{kit}'); import map_extractors as e; sys.exit(0 if e.EXTRACTORS else 1)"] }

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the adopter accepts only `--scaffold`, measured. The kit ships runnable verifiers, but each is already this kit's own gate leg, so pointing `check` at one would make `check` run a gate. Wiring one anyway is a backlog row, not a silence
"""

[[hole]]
id = "frozen-gate-vs-moving-engine"
kind = "upgrade"
blocks_adopt = false
blocks_gate = false
why = "`adopt-codebase-map.sh` copies the gate template only when it is ABSENT and never again, correctly, because the project owns that file and may customise it. `gen_map.py` is engine and updates on every kit upgrade. So a kit that starts writing a NEW generated artifact starts writing it into upgraded adopters whose frozen gate has no tier for it: the artifact is generated, committed, and compared by nothing. Auto-updating the adopter's gate is a different and more dangerous change and govkit owns update policy, so the hole is declared and COMPENSATED rather than closed."
discharge = { command = ["python", "{kit}/check_gate_coverage.py"] }

[[gate_leg]]
name = "codebase-map gate coverage"
subject = "repo"
argv = ["python", "{kit}/check_gate_coverage.py"]
guard = ["{kit}/"]

[[lf_pin]]
pattern = ".codebase-map.conf"
why = "a sourced conf: a CR reaches the shell as part of the value"
