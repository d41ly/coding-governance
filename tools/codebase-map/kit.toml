# kit.toml — this entry, declared as data. Read by <prefix>/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "codebase-map"
home = "codebase-map"
layer = "layer.memory.map"
scope = "repo"
version_from = { file = "map_lib.py", pattern = "^KIT_CODEBASE_MAP_VERSION = " }
requires = ["memory-tree"]

[[files]]
include = "**"
role = "engine"

# THIS KIT'S SELF-TESTS ARE WITHHELD. TOOL-aQuenchedHarness-3. Each stages a break into a copy of a
# checker in THIS directory and asserts the checker still catches it, so its subject is the checker
# and it has a job only when the source here changes -- and none at all in a tree that copy-installs
# the kit and never edits it. That is the 2026-08-23 owner ruling, applied to what SHIPS rather than
# only to what runs.
#
# WITHHELD BY CLAIMING THE DESTINATION, the mechanism `<prefix>/codebase-map/kit.toml` already uses and
# explains: govkit has no `exclude` key, a `**` rule's pool drops only what another rule owns, and
# `project-owned` is absent from LANDABLE_ROLES so `apply` never writes it.
#
# AND THE LEG GOES WITH THE FILE, through machinery that already exists: `silenced_legs` refuses to
# emit a gate leg whose argv names a path the target does not hold, and `_cmd_apply` REPORTS each one
# rather than shipping it. So this rule closes both halves and needs no deployer code.
#
# SCOPE, and it is the half a reader misses: this withholds from `govkit apply` ONLY. The
# copy-install path in `WIRE-INTO-PROJECT.md` is a plain `cp -r` of the kit dir and does not read
# this file, so that runbook removes them separately. The suites remain in the public repository for
# anyone who edits a kit.
[[files]]
include = ["adopt-codebase-map.test.sh", "selftest.py", "test_codebase_map.py"]
role = "project-owned"

[[files]]
include = ["map_extractors.py"]
role = "project-owned"

# The replay harness is GOV-ONLY. It parses THIS repo's build records for probe phrases and their
# section-10 ground truth, so in an adopter's tree it grades a corpus that does not exist — the
# `pin-copied-from-another-corpus` shape by another route. Withheld by CLAIMING its destination,
# exactly as `map_extractors.py` above: govkit has no `exclude` key, a `**` rule's pool drops only
# what another rule owns, and `project-owned` is absent from LANDABLE_ROLES so `apply` never writes
# it. NOTE THE SCOPE, and it is the half a reader misses: this withholds it from `govkit apply`
# ONLY. The copy-install path WIRE-INTO-PROJECT.md documents is a plain `cp -r` of the kit dir and
# does not read this file, so that runbook removes it separately.
[[files]]
include = ["replay-phrases.py"]
role = "project-owned"

# The ranking harness and its scenario set, withheld for the same reason and by the same mechanism.
# `scen-adversarial.json`'s 28 rows are seams established by reading THIS repo's code, so an adopter
# receives a set that grades a corpus they do not have; `rank_harness.py` without it grades nothing.
# `TOOL-dTracedLattice-1` S8/AC13. Same scope caveat as above: this withholds them from `govkit
# apply` ONLY, and the copy-install path in WIRE-INTO-PROJECT.md removes them separately.
[[files]]
include = ["rank_harness.py", "scen-adversarial.json"]
role = "project-owned"

[[files]]
include = ["map_extractors.template.py"]
role = "seed"
to = "{kit}/map_extractors.py"

[[files]]
include = [".codebase-map.conf.example"]
role = "engine"

[config]
file = ".codebase-map.conf"
owner = "codebase-map"
required_keys_gate = ["MAP_ROOT", "GATE_FILE"]
required_keys_render = ["MAP_ROOT"]
optional_keys = ["MAP_DIFF_CMD", "GEN_MAP_PYTHON"]
# The defaults `map_lib.load_conf` and the adopter already apply, declared so govkit's required-key
# reader agrees with them; selfcheck refuses an adopter default the descriptor omits
# (DEPL-aHalvedInstall-1 rev-3).
defaults = { MAP_ROOT = "memory/map", GATE_FILE = "tests/test_codebase_map.py" }

[adopt]
argv = ["bash", "{kit}/adopt-codebase-map.sh", "--scaffold"]
mutates_index = false
# DEPL-aHalvedInstall-3: why `update` never re-runs this adopter. A kit with an adopter declares
# [[regenerate]] or this reason, and selfcheck refuses one declaring neither.
why_no_regenerate = "--scaffold seeds the project conf and the gate file once and leaves an adopted tree alone; nothing it writes is re-derived from engine bytes, and the gate reads the shipped engine directly"

[[outcome]]
code = 1
probe = { must_exist = ".codebase-map.conf", must_not_exist = "{kit}/map_extractors.py" }
means = "seeded-conf"
# The same accepted first-run stop as memory-tree's: the conf is seeded and the operator decides the
# inventory before extractors exist. The sibling outcome below is NOT marked, because its own name
# admits it cannot tell a seed from a crash.
ok = true

[[outcome]]
code = 1
probe = { must_exist = "{kit}/map_extractors.py", must_not_exist = "{map_root}/generated" }
means = "seeded-extractors-or-crashed"

[[gate_leg]]
tag = "leg.codebase-map.codebase-map-coverage-freshness"
tests = ["feature.codebase-map"]
name = "codebase-map coverage + freshness"
subject = "repo"
purpose = "grades the codebase map's coverage and freshness"
argv = ["python", "{gate_file}"]
precommit = ["python", "{gate_file}", "--precommit"]
guard = []
history_depth = "full"
stage = ["step.build", "step.test"]
enforces = ["practice.derive"]

[gate_leg.gov]
argv = ["python3", "{prefix}/codebase-map/test_codebase_map.py"]
precommit = ["python3", "{prefix}/codebase-map/test_codebase_map.py", "--precommit"]
reads = { base = "its baseline is the one carried at the merge-base with the remote default branch (TOOL-aSparedSpawn-13 S3).", history = "it reads that baseline out of history (TOOL-aSparedSpawn-13 S3)." }
guard = []
chunk = "declarations"
ceiling = 300

[[hole]]
id = "map-extractors"
kind = "authoring"
blocks_adopt = true
blocks_gate = true
why = "the template raises on an empty EXTRACTORS dict and gen_map calls inventory_ids() at module level, so the adopter exits 1 with no map tree, no baseline and no gate file. The leg is then ABSENT rather than red, which a runner that skips a missing leg would score green."
discharge = { command = ["python", "-c", "import sys; sys.path.insert(0, '{kit}'); import map_extractors as e; sys.exit(0 if e.EXTRACTORS else 1)"] }

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the adopter accepts only `--scaffold`, measured. The kit ships runnable verifiers, but each is already this kit's own gate leg, so pointing `check` at one would make `check` run a gate. Wiring one anyway is a backlog row, not a silence
"""

[[hole]]
id = "frozen-gate-vs-moving-engine"
kind = "upgrade"
blocks_adopt = false
blocks_gate = false
why = "`adopt-codebase-map.sh` copies the gate template only when it is ABSENT and never again, correctly, because the project owns that file and may customise it. `gen_map.py` is engine and updates on every kit upgrade. So a kit that starts writing a NEW generated artifact starts writing it into upgraded adopters whose frozen gate has no tier for it: the artifact is generated, committed, and compared by nothing. Auto-updating the adopter's gate is a different and more dangerous change and govkit owns update policy, so the hole is declared and COMPENSATED rather than closed."
discharge = { command = ["python", "{kit}/check_gate_coverage.py"] }

# `.codebase-map.conf` is in the guard because the checker reads it: govkit classes a root file a
# descriptor declares as its `[config] file` as `root-conf`, and its selfcheck reds a guarded bar
# leg whose argv names such a conf its guard lacks. TOOL-dDerivedDocket-21.
[[gate_leg]]
tag = "leg.codebase-map.codebase-map-gate-coverage"
tests = ["feature.codebase-map"]
name = "codebase-map gate coverage"
subject = "repo"
purpose = "checks the installed map gate compares every artifact"
argv = ["python", "{kit}/check_gate_coverage.py"]
guard = ["{kit}/", ".codebase-map.conf"]
stage = ["step.test"]
enforces = ["practice.derive"]

[gate_leg.gov]
argv = ["python3", "{prefix}/codebase-map/check_gate_coverage.py"]
guard = ["{prefix}/codebase-map/", ".codebase-map.conf", "{prefix}/memory-tree/coverage_join.py", "{prefix}/memory-tree/backlog.py", "{prefix}/memory-tree/id_grammar.py", "{prefix}/memory-tree/legacy_ledger.py", "{prefix}/memory-tree/tree_lib.py"]
chunk = "declarations"
ceiling = 180

[[lf_pin]]
pattern = ".codebase-map.conf"
why = "a sourced conf: a CR reaches the shell as part of the value"

# ---------------------------------------------------------------- the GENERATED OUTPUTS this kit writes
# TOOL-aWindowedPass-4. The map's generated artifacts, rewritten by `gen_map.py --write` whenever a
# symbol moves; the pre-commit gate refuses a commit that leaves them stale, so every pass touching
# code also writes them. The unattended kit reads this row in place of a hand-typed conf list.
[[generated]]
path = "{map_root}/generated"
generator = "gen_map.py"
why = "symbols.json, inventories.json and MAP.md, regenerated from the tree on every code change"
# Stage 3, last (TOOL-aPrimedIndex-1): the map reads the renders and the record indexes the
# earlier stages write, so run-gates' regen.py regenerates it after both.
write = ["python", "{kit}/gen_map.py", "--write"]
check = ["python", "{kit}/gen_map.py", "--check"]
stage = 3

# THE DRIVE ROWS (PLAY-dOrderedCharter-6): how a session starts or advances a stage this kit serves. The
# playbook render composes one charter line per row of each selected kit, and the role's handoff carries
# its own role's lines. `stage` names a workflow of the roles kit's workflows.toml, or `start`; `role` a
# role slot, or `main` for the main session.

[[drive]]
stage = "reuse"
role = "gov-reuse-scout"
command = 'python <prefix>/codebase-map/reuse_lookup.py "<behaviour>"'
when = "a new behaviour about to be designed"

# THE CONVERTED REGISTRIES (TOOL-dWitnessedBar-16): each list a check of this kit reads, converted in place
# onto the ledger grammar, its direction the one its old header declared. Every seed is the conversion
# program's `read-back`, which prints the home's own rows: no reader prints keyed rows of its own.
[[ledger]]
population = "affordance-exempt"
leg = "codebase-map coverage + freshness"
seed = ["python", "{prefix}/memory-tree/convert_registry.py", "read-back", "affordance-exempt"]
key = "key"
fields = ["seam"]
drain = "key"
direction = "shrink-only"
home = "memory/map/affordance-exempt.txt"

[[ledger]]
population = "baseline"
leg = "codebase-map coverage + freshness"
seed = ["python", "{prefix}/memory-tree/convert_registry.py", "read-back", "baseline"]
key = "key"
fields = ["kind", "key"]
drain = "key"
direction = "shrink-only"
home = "memory/map/baseline.txt"

# THE EMPTY-DECISIONS PIN AS A KEYED POPULATION (TOOL-dWitnessedBar-17 S1): one row per dossier declaring no
# decisions, so filling one and emptying another never nets to zero. The seed is `map_diff.py`'s, an engine
# file every adopter holds that renders no generated index (its section 8 F12); the project-owned gate no
# longer reads it, so `ratchet (both ways)` grades it as its own (section 8 F10).
[[ledger]]
population = "dossier-decisions-empty"
leg = "ratchet (both ways)"
seed = ["python", "{prefix}/codebase-map/map_diff.py", "--list-empty-decisions"]
key = "key"
fields = ["feature"]
drain = "key"
direction = "shrink-only"
home = "memory/project/dossier-decisions-empty.txt"

# The two map lists this kit's adopter seeds take their `.txt` names at the adopter's next update.

[[upgrade]]
id = "codebase-map/affordance-exempt-to-ledger"
up = ["python", "{gov}/govkit/steps/registry_to_ledger.py", "up", "{target}", "--home", "memory/map/affordance-exempt.txt"]
down = ["python", "{gov}/govkit/steps/registry_to_ledger.py", "down", "{target}", "--home", "memory/map/affordance-exempt.txt"]
witness = ["python", "{gov}/govkit/steps/registry_to_ledger.py", "witness", "{target}", "--home", "memory/map/affordance-exempt.txt"]
surfaces = ["file:memory/map/affordance-exempt.txt"]
needs-target = false

[[upgrade]]
id = "codebase-map/baseline-to-ledger"
up = ["python", "{gov}/govkit/steps/registry_to_ledger.py", "up", "{target}", "--home", "memory/map/baseline.txt"]
down = ["python", "{gov}/govkit/steps/registry_to_ledger.py", "down", "{target}", "--home", "memory/map/baseline.txt"]
witness = ["python", "{gov}/govkit/steps/registry_to_ledger.py", "witness", "{target}", "--home", "memory/map/baseline.txt"]
surfaces = ["file:memory/map/baseline.txt"]
needs-target = false

# The conf pin this kit's gate read leaves the conf at the adopter's next update, its population seeded
# first (TOOL-dWitnessedBar-17 S8).
[[upgrade]]
id = "codebase-map/dossier-decisions-empty-pin-to-ledger"
up = ["python", "{gov}/govkit/steps/conf_pins_to_ledger.py", "up", "{target}", "--key", "DOSSIER_DECISIONS_EMPTY_PIN"]
down = ["python", "{gov}/govkit/steps/conf_pins_to_ledger.py", "down", "{target}", "--key", "DOSSIER_DECISIONS_EMPTY_PIN"]
witness = ["python", "{gov}/govkit/steps/conf_pins_to_ledger.py", "witness", "{target}", "--key", "DOSSIER_DECISIONS_EMPTY_PIN"]
surfaces = ["conf-key:.codebase-map.conf#DOSSIER_DECISIONS_EMPTY_PIN", "file:memory/project/conf-scalar-pins.txt", "file:memory/project/dossier-decisions-empty.txt"]
needs-target = false
