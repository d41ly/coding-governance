# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the unit spec under
# memory/builds/dClosedLexicon/spec/.

id = "lexicon"
home = "tools/lexicon"
scope = "repo"
version_from = { file = "lexicon.py", pattern = "^KIT_LEXICON_VERSION = " }

# `**` means "everything not otherwise claimed", and since TOOL-dClosedLexicon-4 the engine means it:
# a wildcard rule's pool excludes any file whose DESTINATION another rule in this descriptor owns.
# This list used to be enumerated by hand precisely because it did not — an `include = "**"` rule
# overwrote the adopter's waiver registries with this repo's empty ones before the seed rule below
# was ever reached. The enumeration was a workaround with its own cost (a new kit file stayed
# silently undeployed until someone remembered to add a line), tracked as TOOL-dClosedLexicon-5 and
# closed by reverting to this.
[[files]]
include = "**"
role = "engine"

# THIS KIT'S SELF-TESTS ARE WITHHELD. TOOL-aQuenchedHarness-3. Each stages a break into a copy of a
# checker in THIS directory and asserts the checker still catches it, so its subject is the checker
# and it has a job only when the source here changes -- and none at all in a tree that copy-installs
# the kit and never edits it. That is the 2026-08-23 owner ruling, applied to what SHIPS rather than
# only to what runs.
#
# WITHHELD BY CLAIMING THE DESTINATION, the mechanism `tools/codebase-map/kit.toml` already uses and
# explains: govkit has no `exclude` key, a `**` rule's pool drops only what another rule owns, and
# `project-owned` is absent from LANDABLE_ROLES so `apply` never writes it.
#
# AND THE LEG GOES WITH THE FILE, through machinery that already exists: `silenced_legs` refuses to
# emit a gate leg whose argv names a path the target does not hold, and `_cmd_apply` REPORTS each one
# rather than shipping it. So this rule closes both halves and needs no deployer code.
#
# SCOPE, and it is the half a reader misses: this withholds from `govkit apply` ONLY. The
# copy-install path in `WIRE-INTO-PROJECT.md` is a plain `cp -r` of the kit dir and does not read
# this file, so that runbook removes them separately. The suites remain in the public repository for
# anyone who edits a kit.
[[files]]
include = ["selftest.py"]
role = "project-owned"

# The waiver registries are the ADOPTER's, not the kit's. They ship as empty headed files so a
# fresh install has somewhere to record its first deliberate exception, but their CONTENT is
# per-repo and must never be overwritten by an upgrade — a waiver list copied from a larger tree is
# the same defect as a pin copied from one. `seed` is the role that expresses "copied ONCE, then the
# target owns it"; `project-owned` alone would still be written on every apply.
[[files]]
include = ["lexicon-verb-waivers.txt", "lexicon-suffix-waivers.txt"]
role = "seed"
to = "{kit}/{relpath}"

# The rendered Skill. `role = "rendered"` rather than `engine` because its CONTENT is derived from
# the adopter's own declaration, so shipping this repo's copy would teach every adopter THIS repo's
# verbs. The wildcard rule above cannot claim it: a rule's pool excludes any file whose destination
# another rule owns, which is the property that lets this entry exist beside `include = "**"`.
[[files]]
include = ["SKILL.template.md"]
role = "rendered"
to = ".claude/skills/lexicon/SKILL.md"
placeholders = ["VERBS_TABLE", "SUGGEST_CLI", "GATE_CLI", "CONF", "KIT_VERSION"]

[config]
file = ".lexicon.conf"
owner = "lexicon"

[adopt]
argv = ["bash", "{kit}/adopt-lexicon.sh", "--scaffold"]
mutates_index = false

[check]
argv = ["bash", "{kit}/adopt-lexicon.sh", "--check"]

# THE PROBE NAMES WHAT THE ADOPTER PRODUCES, not what the WRITE phase copied. `{kit}/lexicon.py` is
# satisfied by the `include = "**"` rule above before `[adopt]` ever runs, so it was a liveness
# assertion true by construction -- govkit classified any rc-0 run as adopted even when no Skill had
# been rendered. Closing review M1; `tools/memory-recall/kit.toml` already has the right shape.
[[outcome]]
code = 0
probe = { must_exist = ".claude/skills/lexicon/SKILL.md" }
means = "adopted"

# The conf itself is deliberately NOT a guard pathspec. govkit partitions every guard into declared
# classes — memory-root-relative, verbatim-repo-root, renamed, exempt, kit-relative — and a root-level
# conf falls into none of them, so declaring one reds `selfcheck` rather than scoping anything.
# Widening that taxonomy is a change to a different kit's contract.
#
# SO THIS LEG IS THE EARLY SIGNAL AND NOT THE AUTHORITY, which is a correction to what this comment
# used to claim. It said the cost was "an early signal on a conf-only diff, never a merge verdict"
# because the pre-push hook bypasses every guard — but that force is bounded now (GATE_FULL_MAX_LAG),
# so a scoped push inside the lag landed a raised pin with NO verdict computed. Closing review B1.
# The grade moved onto `lexicon wiring` below, which carries an empty guard and already read the
# declaration; the leg here keeps its guard and keeps saying the same thing sooner, under its own
# name in the leg log.
[[gate_leg]]
name = "lexicon naming predicates"
subject = "repo"
argv = ["python", "{kit}/lexicon.py"]
guard = ["tools/", "skills/session-kickoff/", ".githooks/", ".claude/"]

[[gate_leg]]
name = "lexicon selftest"
subject = "kit"
argv = ["python", "{kit}/selftest.py"]
guard = ["{kit}/"]

# NO GUARD, and it is the only leg in this kit without one. `--check` now verifies BOTH the
# declaration and the rendered Skill, and the Skill drifts when `.lexicon.conf` moves -- a file that
# is not a guard pathspec govkit can express. A kit-dir guard would leave a conf-only edit unchecked,
# which is exactly the drift this leg exists to catch.
#
# ONE LEG, NOT TWO. TOOL-dScaffoldedMirror-10 first added a SECOND leg for the Skill with the same
# argv as this one, guarded differently -- so the bar ran `adopt-lexicon.sh --check` twice, and the
# guarded copy could never say anything the unguarded copy had not already said. Found by the closing
# review; the map's gate-legs inventory had also gained an unclaimed key for the redundant leg, which
# disappeared with it.
#
# AND SINCE CLOSING REVIEW B1 THIS LEG ALSO GRADES THE CORPUS, by running `{kit}/lexicon.py` from
# `--check`. That is deliberately the same engine the guarded leg above runs, and it does NOT
# re-earn the two-legs defect: what was struck there were two legs with one argv and different
# guards, where neither could ever out-say the other. Here the unguarded copy is the merge verdict
# and the guarded one is the fast fail on a `tools/` diff. Cost is one corpus walk, recorded per leg
# in `<git-dir>/gate-ledger.tsv`.
[[gate_leg]]
name = "lexicon wiring"
subject = "repo"
argv = ["bash", "{kit}/adopt-lexicon.sh", "--check"]
guard = []

[[hole]]
id = "lexicon-ratified"
kind = "authoring"
blocks_adopt = false
blocks_gate = true
why = "`--scaffold` takes each verb's SPELLING from the kit's frozen canon and asks the adopter's corpus only which concepts are live, so the seed is prescriptive rather than the hand-kept mirror companion §12 bans. It is still not CURATED: the canon's negatives are generic and the domain rows are missing. The seed ships marked PROPOSED with an empty `ratified` key, and the stamp is the checkable form of `a human read this table`."
discharge = { command = ["bash", "{kit}/adopt-lexicon.sh", "--check"] }

[[hole]]
id = "lexicon-pins"
kind = "measurement"
blocks_adopt = false
blocks_gate = true
why = "The offender pins are MEASURED against the adopting corpus at scaffold and are a TWO-SIDED equality thereafter: a rise reds and so does an unrecorded drain. A pin copied from a larger tree is either vacuous or permanently red, which `.memory-tree.conf` states in its own words. The probe is the gate itself: an unmeasured pin set fails it."
discharge = { command = ["python", "{kit}/lexicon.py"] }

[[lf_pin]]
pattern = ".claude/skills/lexicon/SKILL.md"
why = "a rendered artifact its own gate byte-compares"
