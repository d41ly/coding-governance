# kinds.toml — the kinds register (PLAY-dOrderedCharter-7 S4), the `kind` namespace's declaring source: the closed
# set of extension kinds of the foundations record's C3, so a `kind.*` tag this file lacks fails the tag resolver.
# One [[kind]] row per kind: `tag` (kind.<name>); `owner`, the chain build that lands its factory, as the
# foundations record's "Settled design for the core" assigns it; `binds`, the principle tags that bind it;
# `population`, a tracked-path glob (`{prefix}` the tool root); `factory`, the command `core.py new <kind>` runs;
# `gate`, the leg of <prefix>/gate-legs.json whose `enforces` holds every tag of `binds`; `summary`, one line on the
# kind, and `usage`, its factory command or how a member joins its population, which help/reference/kinds.md
# renders (PLAY-dOrderedCharter-37). A kind whose factory or
# gate has not landed carries "" there and is a `kind` row of core-pending.txt naming its owner.
# `python <prefix>/playbook/core.py kinds` grades the contract. A kind's name is never a namespace word: where a
# kind's members form a namespace, its name puts a qualifier before that word, naming where the population lives,
# and the `<kind>` that `core.py new` takes is that name.

[[kind]]
tag = "kind.tool-kit"
owner = "dShippedRelease"
binds = ["principle.p16"]
population = "{prefix}/*/kit.toml"
factory = ""
gate = ""
summary = "A deployable kit: a directory under the tool root with a kit.toml descriptor and its own adopter."
usage = "a directory {prefix}/<kit>/ holding kit.toml, its adopter and its engine, with an [[entry]] row in the govkit registry"

