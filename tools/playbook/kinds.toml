# kinds.toml — the kinds register (PLAY-dOrderedCharter-7 S4), the `kind` namespace's declaring source: the closed
# set of extension kinds of the foundations record's C3, so a `kind.*` tag this file lacks fails the tag resolver.
# One [[kind]] row per kind: `tag` (kind.<name>); `owner`, the chain build that lands its factory, as the
# foundations record's "Settled design for the core" assigns it; `binds`, the principle tags that bind it;
# `population`, a tracked-path glob (`{prefix}` the tool root); `factory`, the command `core.py new <kind>` runs;
# `gate`, the leg of <prefix>/gate-legs.json whose `enforces` holds every tag of `binds`; `summary`, one line on the
# kind, and `usage`, its factory command or how a member joins its population, which help/reference/kinds.md
# renders (PLAY-dOrderedCharter-37). A kind whose factory or
# gate has not landed carries "" there and is a `kind` row of core-pending.txt naming its owner.
# `python <prefix>/playbook/core.py kinds` grades the contract. A kind's one-segment name may be a namespace word, as
# the `item` and `command` kinds are: the grammar refuses a word only as the first of two or more segments
# (TOOL-dDeclaredLoop-18 S10). The `<kind>` that `core.py new` takes is still the name.

[[kind]]
tag = "kind.tool-kit"
owner = "dShippedRelease"
binds = ["principle.p16"]
population = "{prefix}/*/kit.toml"
factory = ""
gate = ""
summary = "A deployable kit: a directory under the tool root with a kit.toml descriptor and its own adopter."
usage = "a directory {prefix}/<kit>/ holding kit.toml, its adopter and its engine, with an [[entry]] row in the govkit registry"

[[kind]]
tag = "kind.command"
owner = "dDeclaredLoop"
binds = ["principle.p16"]
population = "{prefix}/*kit.toml"
factory = "python {prefix}/loop/factories.py command"
gate = "loop command conformance"
summary = "A command a kit declares: a [[command]] row of its kit descriptor, its verb and the file it runs."
usage = "python {prefix}/playbook/core.py new command <verb> --kit <id> --run <path>"

[[kind]]
tag = "kind.instruction-unit"
owner = "dOrderedCharter"
binds = ["principle.p13", "principle.p16"]
population = "{prefix}/*/instructions.toml"
factory = "python {prefix}/playbook/core.py new instruction-unit"
gate = "instruction units (schema, one fact)"
summary = "One instruction unit: a [[unit]] row of a kit's instructions.toml, rendered by its level, scope and trigger."
usage = "python {prefix}/playbook/core.py new instruction-unit <name> [factory flags]"

[[kind]]
tag = "kind.policy-key"
owner = "dDeclaredLoop"
binds = ["principle.p16"]
population = "{prefix}/policy/catalogue.toml"
factory = "python {prefix}/loop/factories.py policy-key"
gate = "policy check"
summary = "A policy key: a [[key]] row of the policy catalogue, read through policy.py get."
usage = "python {prefix}/playbook/core.py new policy-key <name> --allowed <toml> --default <toml> --summary <text> --usage <text> --owner <build>"

[[kind]]
tag = "kind.preset"
owner = "dKeptSession"
binds = ["principle.p16"]
population = ""
factory = ""
gate = ""
summary = "A named preset of policy values an adopter selects at once; dKeptSession lands its factory, with the preset store."
usage = "no factory has landed; dKeptSession lands it, and until then the kind has no member"

[[kind]]
