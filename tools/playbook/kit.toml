# kit.toml — the playbook RENDERER, declared as data. Read by <prefix>/govkit/.
#
# A SEPARATE entry id from `playbook`, which ships the template itself. `read_descriptors()` keys its
# map by id with no duplicate predicate, so a second entry named `playbook` would SILENTLY shadow the
# first and the shadowed entry's claimed files would then red as unclaimed surface.

id = "playbook-render"
scope = "repo"
kind = "dir"
home = "playbook"
layer = "layer.instruction"
version_from = { file = "render_playbook.py", pattern = "^KIT_PLAYBOOK_RENDER_VERSION = " }

# The declarations this engine reads live on the `playbook` entry, beside the artifact they describe,
# and `needed_answers()` quantifies over every selected descriptor either way. So a target taking the
# renderer without that entry would have an engine and no declarations to read. The template it renders
# travels with this kit, by the rule below the descriptor's (PLAY-dOrderedCharter-34 S5).
# `memory-tree` and `policy` are read by the engine's own composition (PLAY-dOrderedCharter-78 S1):
# `instruction_units.py#load_memory_tree_path` dies with no memory-tree kit holding `design_lib.py`,
# and `overlay.py#read_excluded_tags` refuses the composition with no policy kit found.
requires = ["playbook", "memory-tree", "policy"]

# PLAY-dOrderedCharter-10 S6: the tag check's one edge to a non-core kit, the lexicon, is a declared slot.
optional = [
  { part = "gov_tag.py", point = "point.instruction.name-check", fallback = "the shape check stands alone" },
  { part = "render_playbook.py", point = "point.runtime.install-target", fallback = "--reference refuses naming the absent docs leg; the reference pages are gov's own" },
]

[[files]]
include = ["**"]
role = "engine"
to = "{prefix}/playbook/{relpath}"

# THE ENGINE'S DECLARATIONS TRAVEL WITH IT. `render_playbook.py` reads the placeholder classes, the
# `when:` block names and the registry's entry-id set; all three live under `<prefix>/govkit/`, which is
# a registry `[[exempt]]` path that never lands in a target. Shipping the engine without them is what
# made an adopter's first `--check` die with an uncaught FileNotFoundError — reproduced in a scratch
# install. These are `root_relative` rules pointing at the REAL files rather than copies, so there is
# one source of truth and nothing to keep in step; gov itself has no copy beside the engine and reads
# its own tree, which is the fall-through `declaration_paths()` documents.
# GOV'S OWN LISTS STAY HOME (PLAY-dOrderedCharter-70 S10). The core's pending list and the legacy list name
# gov's own files and records, so no adopter receives them. The two positional lists live in gov's
# `<MEMORY_ROOT>/project/`, outside this kit (PLAY-dOrderedCharter-72). The write mode writes an empty
# `core-pending.txt` here and an empty `positional-refs.txt` in the target's memory project folder where a
# target lacks them, since an absent list is a red; the legacy list and the producer list read absent as empty.
[[files]]
include = ["core-pending.txt", "instructions-legacy.txt"]
role = "project-owned"

[[files]]
include = ["{prefix}/govkit/entries/playbook.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/playbook.kit.toml"

# THE TEMPLATE THE RENDER READS TRAVELS BESIDE THE ENGINE (PLAY-dOrderedCharter-34 S5). The render reads the
# copy in the rendered tree's renderer-kit directory first and gov's root second, never a target's seeded
# `playbook_path` copy, so every install and update writes the template the render reads. Gov holds no copy
# here and reads its own root's.
[[files]]
include = ["coding-governance-agents.template.md"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/coding-governance-agents.template.md"

# EVERY FLAT ENTRY'S DESCRIPTOR TRAVELS TOO (PLAY-dOrderedCharter-6, the fork record's F8). The drive
# section reads each selected kit's `[[drive]]` rows, and a flat entry has no kit directory to carry its
# descriptor, so each lands beside the engine under its own file name, where the renderer looks first.
# One rule per flat entry, whether or not it declares rows; `instruction_units.py drive --check` reds a
# flat entry of the registry with no rule here.

[[files]]
include = ["{prefix}/govkit/entries/check-line-length.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-line-length.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-microformats.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-microformats.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-placeholders.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-placeholders.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/kickoff-manifest.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/kickoff-manifest.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/settings-merge.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/settings-merge.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-testsuite-counts.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-testsuite-counts.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-wiring.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-wiring.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/push-main.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/push-main.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-kit-versions.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-kit-versions.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-agent-cap-restatement.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-agent-cap-restatement.kit.toml"

[[files]]
include = ["{prefix}/govkit/entries/check-install-prefix.kit.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/check-install-prefix.kit.toml"

[[files]]
include = ["{prefix}/govkit/registry.toml"]
root_relative = true
role = "engine"
to = "{prefix}/playbook/registry.toml"

[adopt]
argv = ["bash", "{prefix}/playbook/adopt-playbook.sh", "--target", "."]
mutates_index = false

# THE RE-RENDER an update runs by default; GOVKIT_RERENDER=0 declines it. DEPL-aHalvedInstall-3.
# The adopter writes the charter region FROM THE ENGINE'S BYTES and `[check]` compares that region with
# a fresh render, so without this block every renderer change landed, the region went one vintage
# stale, the check redded and `update` rolled the kit back (GOVKIT_RERENDER on or off: there was no
# block to run) -- at every adopter, on every renderer change. This kit ships no `rendered` ROW,
# which is why the 3b-ii arm never asked it for one. The argv is the adopter's own write mode, which re-renders the gov:playbook region whatever it held.
# `writes` names the default charter and the lock row the same render writes beside it, so a rollback
# restores both (PLAY-dOrderedCharter-70 S9).
[[regenerate]]
argv = ["bash", "{prefix}/playbook/adopt-playbook.sh", "--target", "."]
writes = ["AGENTS.md", ".governance/instructions.lock"]
# Staged for the bar (TOOL-aPrimedIndex-1): run-gates' regen.py re-renders this before a bar
# and proves it fresh with this kit's [check] argv; stage 1 is a render from a kit template.
stage = 1

[check]
argv = ["bash", "{prefix}/playbook/adopt-playbook.sh", "--target", ".", "--check"]

[[gate_leg]]
name = "playbook render wiring"
subject = "repo"
argv = ["bash", "{prefix}/playbook/adopt-playbook.sh", "--target", ".", "--check"]

# THE ENGINE'S OWN ARMS, and an adopter receives them because they are about the ENGINE rather than
# about gov: every fixture is written into a temp dir by the selftest itself, so there is no gov path
# to strand a target on. It is the arm set for the two predicates a closing review found certifying
# without measuring — an unrecognised `kits` member silently deleting a charter section, and a value
# substituted verbatim into a markdown table row.
[[gate_leg]]
name = "playbook render selftest"
subject = "kit"
argv = ["bash", "{prefix}/playbook/adopt-playbook.sh", "--selftest"]
