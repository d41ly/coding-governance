[[document]]
tag = "doc.skills"
path = ".claude/skills/*/SKILL.md"
level = 4
direction = "A Skill, followed when its trigger holds; yields to levels 0 to 3"
source = "{prefix}/*/SKILL.template.md"
h1 = "The rendered Skills, one per kit that ships one"

[[document]]
tag = "doc.kickoff-skill"
path = "skills/session-kickoff/SKILL.md"
level = 4
