# edges.toml — the edge-type registry (PLAY-dOrderedCharter-24 S1, PLAY-dOrderedCharter-28 S1). Read by
# edge_grammar.read_edge_types and edge_grammar.read_trailer_keys.
#
# One [[edge]] row per type of ONE closed set: `type`; `inverse`, derived from this row and never declared
# at a site; `from` and `to`, the namespace words of namespaces.toml a source and a target sit in, its
# native-id classes (`family-id`, `clause-id`, `commit`), or the class words `any` (every registered namespace and
# every native id) and `selects` (every namespace whose row has role = "selects"); `pin`, `none`, `tag` or
# `clause`; `status`, `declared` or `derived`; `declared-at`, the site that owns the fact; and an optional
# `writer`, the one site that writes the type, an edge of it read at any other site being red. Every
# declared row carries `cardinality = { per-source, per-target }` (TOOL-dTotalRecall-22), each a positive
# integer or `many`: how many edges of the type one source may carry and one target receive, counted over
# the merged tree by `edge_grammar.py --cardinality`; a type the design bounds nowhere writes `many` on
# both ends, and the derived row carries none. The kind registry mirrors each bounded type. A word not
# registered yet (`feature`, `item`, `record`, `session`, `act`, and the classes `spec`,
# `decision` and `build`) admits nothing until its build registers it; an id matching no class under such
# a word is `unarmed`. These are P33's twelve declared types and the derived `cites`, then
# PLAY-dOrderedCharter-28's twelve from the memory plan's [edges], `decides` and `after` widened,
# then PLAY-dOrderedCharter-49's two of a spec's `### Edges` block.
#
# One [[trailer]] row per commit trailer key: `key` and the `type` it declares, so a key is registered
# once and the commit adapter reads this table. A row with no `type` registers a key that carries a
# value and no edge (`Gov-Transition`, `Gov-Policy`, `Red-fix`): the adapter passes over it, and the
# one trailer reader, commit_trailers.read_commits, reads every row's key and refuses any other.
#
# One [[front-matter]] row per build README relation key (TOOL-dTotalRecall-6 S1): `key`, the `type` of
# the closed set it declares, and `target`, the address form each of its targets is typed by (`slug`, a
# build slug; `unit-id`, a family id whose slug names its build; `tag`, a tag of the tag index). A key
# is a spelling, never a type: `depends-on` and its alias `parents` both declare `after`. Read by the
# memory-tree kit's gen_build_index.read_relation_rows, which inverts each edge into its target's README.

[[edge]]
type = "part-of"
inverse = "has-part"
from = ["any"]
to = ["any"]
pin = "none"
status = "declared"
declared-at = "annotations, dossier claims"
cardinality = { per-source = "many", per-target = "many" }

[[edge]]
type = "implements"
inverse = "implemented-by"
from = ["any", "build"]
to = ["feature", "spec"]
pin = "none"
status = "declared"
declared-at = "gov:feature, the code record"
cardinality = { per-source = "many", per-target = "many" }

