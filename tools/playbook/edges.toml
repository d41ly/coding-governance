inverse = "consumed-by"
from = ["family-id"]
to = ["family-id"]
pin = "none"
status = "declared"
declared-at = "a spec's ### Edges block"
cardinality = { per-source = "many", per-target = "many" }

[[edge]]
type = "hands-off"
inverse = "receives-from"
from = ["family-id"]
to = ["family-id"]
pin = "none"
status = "declared"
declared-at = "a spec's ### Edges block"
cardinality = { per-source = "many", per-target = "many" }

# The commit trailer keys, each with the type it declares (the memory plan's [sites], a commit).

[[trailer]]
key = "Gov-Unit"
type = "serves"

[[trailer]]
key = "Gov-Item"
type = "serves"

[[trailer]]
key = "Gov-Act"
type = "made-by"

[[trailer]]
key = "Gov-Session"
type = "runs-in"

[[trailer]]
key = "Pass"
type = "serves"

[[trailer]]
key = "Decided"
type = "decides"

# The keys that carry a value and no edge (TOOL-dDeclaredLoop-23 S2): registered, so the one trailer
# reader reads them, and passed over by the commit adapter.

[[trailer]]
key = "Gov-Transition"     # value: <from> -> <to>, written by TOOL-dDeclaredLoop-3

[[trailer]]
key = "Gov-Policy"         # value: the policy change's record, written by TOOL-dDeclaredLoop-2

[[trailer]]
key = "Red-fix"            # value: one gate leg's name, read by the routed-commit gate

[[trailer]]
key = "Commit-Checked"     # value: unattended@<kit version>, written by the commit check, TOOL-dWitnessedBar-2

# The build README's relation keys, each with the type it declares and its targets' address form
# (TOOL-dTotalRecall-6 S1, gap-mem-07). The rows' order is the order a README's relation lines render in.

[[front-matter]]
key = "depends-on"
type = "after"
target = "slug"

[[front-matter]]
key = "parents"            # the alias, read exactly as depends-on
type = "after"
target = "slug"

[[front-matter]]
key = "patches"
type = "patches"
target = "unit-id"

[[front-matter]]
key = "amends"
type = "amends"
target = "unit-id"

[[front-matter]]
key = "supersedes"
type = "supersedes"
target = "slug"

[[front-matter]]
key = "implements"
type = "implements"
target = "tag"
