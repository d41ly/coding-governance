# PLAY-dOrderedCharter-49 S40: a spec's `### Edges` block, each its own type and inverse (F11). The hygiene
# gate and check-spec-tokens.py's scan_handoffs keep parsing the block; these rows put its two verbs in the set.

[[edge]]
