# aliases.toml — positional labels mapped to tags (PLAY-dOrderedCharter-19 S11). Read by gov_tag.py.
#
# One [[alias]] row per positional label that never moved: `ref = "<doc> <label>"`, `target` the
# `doc.<name>#<seg>` it names. `where` and `show` resolve a ref through it. The BUILD-METHOD M-steps
# each name their own `##` section; the hygiene checks are numbered items of one section, the check
# catalog, so each check names that section. The live positional references are kept by key in
# positional-refs.txt beside this file, never as a count.

