# policy.toml — this repository's own settings for its role agents. Seeded: yours to edit.
# A changed value reaches an agent after `render_agents.py --write` and a new session.
# Read through roles_lib.py's `load_policy` only; levels are low, medium, high, xhigh and max.

[effort]
default = "medium"            # every role and stage this file does not name

[effort.roles]                # one entry per role slot whose `agent` is true
gov-orienter = "high"
gov-spec-writer = "high"
gov-spec-reviewer = "medium"
gov-builder = "high"
gov-diff-reviewer = "medium"
gov-skeptic = "medium"
gov-synthesizer = "high"

[effort.stages.spec-review]   # one table per workflow; keys are that workflow's stage keys
skeptic = "medium"
synthesis = "medium"

[effort.stages.spec-write]
skeptic = "medium"
synthesis = "medium"

[effort.profiles.fable]       # a table per model family; an unmatched model takes the tables above
match = ["fable"]             # one word of the model id, any version, as in claude-fable-5-2
default = "medium"            # names no role and no stage, so every one runs at medium
# [effort.profiles.<name>.roles] and [effort.profiles.<name>.stages.<workflow>] take the keys of the
# tables above. A profile reaches an agent at dispatch, never through its rendered agent type.

[gates]                       # the gate legs a role may run, by manifest name; every other role runs none
# A trailing `?` marks a leg whose kit a target may not install: absent from the manifest, it is a note.
gov-spec-writer = ["memory hygiene", "lexicon naming predicates?"]
gov-builder = ["lexicon naming predicates?"]
