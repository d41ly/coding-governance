# role-schema.toml — the role kind's fields, read through roles_lib.load_role_schema only
# (TOOL-dBoundRoles-2). One row per front-matter key, in the order a role file writes them: `owner` is
# whose key it is (`claude`, Claude Code's own, or `gov`), `shape` its grammar, and `required` where it
# must be non-empty (`every` role, an `agent` role only, or `optional`). `empty = true` lets a required
# key be present and empty. A later unit's key is one row here.
[kind]
name = "role"

[[field]]
key = "name"
owner = "claude"
shape = "slot"
required = "every"

[[field]]
key = "description"
owner = "claude"
shape = "text"
required = "every"

[[field]]
key = "tools"
owner = "claude"
shape = "list"
required = "agent"

[[field]]
key = "model"
owner = "claude"
shape = "text"
required = "agent"

[[field]]
key = "maxTurns"
owner = "claude"
shape = "text"
required = "optional"

[[field]]
key = "workflow"
owner = "gov"
shape = "text"
required = "every"

# `layer` and `acts-as` (TOOL-dBoundRoles-1 S1): the `layer.<seg>` tag of the playbook kit's register row
# the role belongs to, and `item` or `cycle`. No shape grades a value, so R2 grades each by its key.
[[field]]
key = "layer"
owner = "gov"
shape = "text"
required = "every"

[[field]]
key = "acts-as"
owner = "gov"
shape = "text"
required = "every"

[[field]]
key = "reads"
owner = "gov"
shape = "list"
required = "every"

[[field]]
key = "writes"
owner = "gov"
shape = "class"
required = "every"

[[field]]
key = "rules"
owner = "gov"
shape = "list"
required = "every"
empty = true

[[field]]
key = "mandatory"
owner = "gov"
shape = "text"
required = "every"

[[field]]
key = "output"
owner = "gov"
shape = "text"
required = "every"

[[field]]
key = "never"
owner = "gov"
shape = "entries"
required = "every"

[[field]]
key = "return"
owner = "gov"
shape = "template"
required = "every"

[[field]]
key = "agent"
owner = "gov"
shape = "bool"
required = "optional"

# `effort` and `gates` (TOOL-dBoundRoles-21 S3, S6): the role's declared reasoning effort, one of the
# kit's EFFORT_LEVELS, the last step of the effort order and graded by R2 by its key; and the gate legs
# the role may run, comma-separated, a trailing `?` marking one optional, which take the place of the
# house file's `[gates]` row for the role. A leg name holding a comma cannot be granted here.
[[field]]
key = "effort"
owner = "gov"
shape = "text"
required = "agent"

[[field]]
key = "gates"
owner = "gov"
shape = "list"
required = "optional"
