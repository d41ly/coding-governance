# role-schema.toml — the role kind's fields, read through roles_lib.load_role_schema only
# (TOOL-dBoundRoles-2). One row per front-matter key, in the order a role file writes them: `owner` is
# whose key it is (`claude`, Claude Code's own, or `gov`), `shape` its grammar, and `required` where it
# must be non-empty (`every` role, an `agent` role only, or `optional`). `empty = true` lets a required
# key be present and empty. A later unit's key is one row here. A `tag` row names its namespace in `ns`, and a
# `choice` row its closed set in `values`, a list or the name of a roles_lib.py constant (TOOL-dBoundRoles-43
# S8); the README's shape table states every shape.
[kind]
name = "role"

[[field]]
key = "name"
owner = "claude"
shape = "slot"
required = "every"

[[field]]
key = "description"
owner = "claude"
shape = "text"
required = "every"

[[field]]
key = "tools"
owner = "claude"
shape = "list"
required = "agent"

[[field]]
key = "model"
owner = "claude"
shape = "text"
required = "agent"

[[field]]
key = "maxTurns"
owner = "claude"
shape = "text"
required = "optional"

[[field]]
key = "workflow"
owner = "gov"
shape = "text"
required = "every"

# `layer` and `acts-as` (TOOL-dBoundRoles-1 S1): the `layer.<seg>` tag of the playbook kit's register row
# the role belongs to, and `item` or `cycle`; R2 grades each.
[[field]]
key = "layer"
owner = "gov"
shape = "tag"
ns = "layer"
required = "every"

[[field]]
key = "acts-as"
owner = "gov"
shape = "choice"
values = ["item", "cycle"]
required = "every"

# `shapes` (TOOL-dBoundRoles-16 S5): the workflow kinds the role runs in, comma-separated, each one of
# roles_lib.py's WORKFLOW_KINDS, graded by R2 by its key; R9 refuses a stage row whose kind it lacks.
[[field]]
key = "shapes"
owner = "gov"
shape = "list"
required = "agent"

[[field]]
key = "reads"
owner = "gov"
shape = "list"
required = "every"

[[field]]
key = "writes"
owner = "gov"
shape = "class"
required = "every"

[[field]]
key = "rules"
owner = "gov"
shape = "list"
required = "every"
empty = true

[[field]]
key = "mandatory"
owner = "gov"
shape = "text"
required = "every"

[[field]]
key = "output"
owner = "gov"
shape = "text"
required = "every"

[[field]]
key = "never"
owner = "gov"
shape = "entries"
required = "every"

[[field]]
key = "return"
owner = "gov"
shape = "template"
required = "every"

[[field]]
key = "agent"
owner = "gov"
shape = "bool"
required = "optional"

# `effort` and `gates` (TOOL-dBoundRoles-21 S3, S6): the role's declared reasoning effort, one of the
# kit's EFFORT_LEVELS, the last step of the effort order and graded by R2 by its key; and the gate legs
# the role may run, comma-separated, a trailing `?` marking one optional, which take the place of the
# house file's `[gates]` row for the role. A leg name holding a comma cannot be granted here.
[[field]]
key = "effort"
owner = "gov"
shape = "choice"
values = "EFFORT_LEVELS"
required = "agent"

[[field]]
key = "gates"
owner = "gov"
shape = "list"
required = "optional"

# `budget` (TOOL-dBoundRoles-15 S2): the byte ceiling of the role's whole static block, its `## Charter`
# included, as `roles_lib.render_static_block` composes it; a non-negative decimal integer, which R5 reads
# through `roles_lib.read_role_budget` and grades (TOOL-dBoundRoles-43 S7).
[[field]]
key = "budget"
owner = "gov"
shape = "int"
required = "every"

# THE REFUSAL ARM (TOOL-dBoundRoles-26 S1), read through roles_lib.load_refusal_arm only: the typed refusal
# every role's `return` carries beside its own template, declared once here and rendered under each
# role's `## Return`. `actors` names who can perform the remedy, `build:<slug>` another build by its slug,
# and roles_lib.REFUSAL_ROUTES routes each; a role whose own `outcome` set holds the arm's `outcome` value
# is refused by check_roles.py's R2, so the arm cannot drift per role.
[return.refusal]
outcome = "refused"
fields = ["rule", "remedy", "actor"]
actors = ["self", "producer", "driver", "owner", "build:<slug>"]
