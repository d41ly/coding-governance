# kit.toml — this entry, declared as data. Read by <prefix>/govkit/.
# Contract: memory/builds/aOrientedCast/spec/2026-10-11-spec-TOOL-aOrientedCast-1.md (identity) and
# memory/builds/aOrientedCast/spec/2026-10-11-spec-TOOL-aOrientedCast-8.md (the wiring below).

id = "roles"
home = "roles"
layer = "layer.roles"
scope = "repo"

# The card every `task:` and `card:` input is read from is written by the kickoff kit's card writer,
# and the checker, the library and the adopter read the memory root and the governing doc's path from
# `.memory-tree.conf`. Each workflow's build order and step are the loop kit's (TOOL-dDeclaredLoop-1):
# the catalogue checker joins the workflow table with the loop definition, and the adopter binds the
# Skill's stage headings to its orders, so with no loop kit both refuse. TOOL-dBoundRoles-25 S6: the spawn
# guard `spawn-guard.js` reads the hooks kit's `scratch-guard.js` exports (entry `agent-cap`) and holds a
# harness to its blob at the landed revision the policy kit's `readLandedRevision` names, so both are required.
requires = ["kickoff-manifest", "memory-tree", "loop", "agent-cap", "policy"]

# `/build` and `handoff.py harness-args` drive the three harnesses `workflows.toml` names, and all
# three ship in `review-harness`, which is not a default. TOOL-aOrientedCast-8 section 8 F1: a plain
# requirement would make `apply` refuse every default install, so this is a DECLARATION selfcheck
# grades and nothing else. Where the harness is absent the catalogue checker, the agent render and
# check-wiring each print a `note`; the role agents, the handoffs and the gates work everywhere.
requires_if = [{ kit = "review-harness", why = "TOOL-aOrientedCast-8 section 8 F1: /build and the harness-arguments verb drive the three harnesses workflows.toml names, which review-harness ships. A plain requirement would refuse every default install, since review-harness is not a default; its absence is a note on the catalogue checker, the agent render and check-wiring. No condition key: the edge holds wherever /build is used" }, { kit = "agent-cap", why = "TOOL-dBoundRoles-25 S4, PLAY-dOrderedCharter-7: spawn-guard.js requires the hooks kit's scratch-guard.js in process for the role index readers, the card and fence readers, the handoff marker reader, the Workflow args reader, the slug walk and the policy helper's locator, found through its own resolveKitDir port (a receipt row, then <here>/hooks/ and <here>/../hooks/). This is the pack's one in-process edge to a sibling kit, declared here; where scratch-guard.js does not resolve the pack refuses every Workflow and Agent call, naming the hooks kit and the owner, since a guard that cannot read does not admit. No condition key: the edge holds wherever the pack is wired" }]

# Pinned at the library module, which lands in the SAME unit as this descriptor.
version_from = { file = "roles_lib.py", pattern = "^KIT_ROLES_VERSION = " }

# Everything the kit ships is engine, overwritten on every update: the base role files,
# `workflows.toml`, the library, the checker, the renderers, the adopter, the README and the Skill
# template. The rules below claim the paths that are not.
[[files]]
include = "**"
role = "engine"

# THE EFFORT POLICY IS SEEDED (TOOL-aOrientedCast-10). An adopter receives it once and owns it
# afterwards, and `update` never rewrites a seed. It is read by workflow and stage only where no
# `roles.effort.*` key is set (TOOL-dBoundRoles-16, TOOL-dBoundRoles-21). It is NAMED, because a LIST
# include claims literal paths only (the runlog descriptor records the measurement). A role's own
# project rules are no seed: they are level-5 units of `.governance/instructions.toml` selecting the
# role, and the step `roles/house-overlays-to-instructions` below moved the house text files there
# (TOOL-dBoundRoles-19).
[[files]]
include = ["house/policy.toml"]
role = "seed"

# THE ADOPTER'S SELF-TEST IS WITHHELD, by claiming the destination (TOOL-aQuenchedHarness-3): its
# subject is the adopter in this directory, so it has a job only when that source changes. Its leg is
# carried by an [[exempt_leg]] row in the deployer's registry. `render_agents.py --selftest` is a flag
# inside a shipped script, so it ships with that script as engine.
[[files]]
include = ["adopt-roles.test.sh"]
role = "project-owned"

# THE SPAWN GUARD'S SUITE IS WITHHELD the same way (TOOL-dBoundRoles-25 S5): it stages its fixtures around a copy
# of `spawn-guard.js` beside it, so its subject is the pack, and its leg `spawn-guard self-test` is an
# [[exempt_leg]] row in the deployer's registry.
[[files]]
include = ["spawn-guard.test.sh"]
role = "project-owned"

# The fragment `settings-merge.py` wires by default, read with sed by check-wiring.sh as the hooks kit's are.
[[lf_pin]]
pattern = "spawn-guard.fragment.json"
why = "check-wiring.sh reads the fragment with sed; a trailing CR lands inside the captured matcher and the arm reports UNWIRED against a correctly wired repo"

# THE SKILL IS RENDERED. It names the kit, the tool root and the memory root, three values that
# differ per repository, so the adopter renders it and its `--check` re-renders and compares. All
# three tokens are substituted by the adopter by their literal spellings, which the kit-placeholders
# gate joins against this list.
[[files]]
include = ["SKILL.template.md"]
role = "rendered"
to = ".claude/skills/build/SKILL.md"
placeholders = ["KIT_DIR", "TOOL_ROOT", "MEMORY_ROOT"]

[config]
file = ".memory-tree.conf"
owner = "memory-tree"
optional_keys = ["MEMORY_ROOT", "CHARTER"]

[adopt]
argv = ["bash", "{kit}/adopt-roles.sh", "--scaffold"]
mutates_index = false

# THE RE-RENDER an update runs unless GOVKIT_RERENDER=0 declines it, which govkit requires of a kit
# shipping a `rendered` row. `--scaffold` IS the re-render: it rewrites the Skill, every agent type and
# the role index from the kit and the target's conf whether or not they are already there.
[[regenerate]]
argv = ["bash", "{kit}/adopt-roles.sh", "--scaffold"]

[check]
argv = ["bash", "{kit}/adopt-roles.sh", "--check"]

[[outcome]]
code = 0
probe = { must_exist = ".claude/roles.json" }
means = "adopted"

# NO GOVERNING DOC AT `CHARTER`, and it is ACCEPTED (section 8 F3). The memory-tree seed writes
# `CHARTER="AGENTS.md"` wherever the playbook landed, so a default install often has no doc there.
# The adopter then renders the Skill alone and exits 3, and `check-wiring` reports `UNWIRED roles`
# naming the doc; failing the apply instead would fail every such default install. The probe is the
# Skill, which the adopter writes on this path before it exits.
[[outcome]]
code = 3
probe = { must_exist = ".claude/skills/build/SKILL.md" }
means = "no-governing-doc"
ok = true

# THE CATALOGUE LEG SHIPS (section 8 F2). It grades the shipped role files against the adopter's own
# governing doc and its overlay's role units, so its subject is the adopter's tree, and a broken unit reds
# on the adopter's bar before a handoff refuses at run time.
[[gate_leg]]
tag = "leg.roles.roles-catalogue"
tests = ["feature.roles"]
enforces = ["principle.p16"]
name = "roles catalogue"
subject = "repo"
purpose = "grades role files against the governing doc and overlays"
argv = ["python", "{kit}/check_roles.py"]
guard = []
ceiling = 120
stage = ["step.test"]

[gate_leg.gov]
guard = []
chunk = "declarations"

# THE RENDER'S WIRING LEG SHIPS. One leg grades the agent types, the role index and the Skill
# together; its subject is the target's own render, which goes stale when an overlay, the conf or the
# governing doc moves with nobody touching this kit.
[[gate_leg]]
tag = "leg.roles.roles-render-wiring"
tests = ["feature.roles"]
name = "roles render wiring"
subject = "repo"
purpose = "grades the agent types, role index and Skill renders"
argv = ["bash", "{kit}/adopt-roles.sh", "--check"]
guard = []
ceiling = 300
stage = ["step.test"]
enforces = ["practice.derive"]

[gate_leg.gov]
guard = []
chunk = "wiring"

[[gate_leg]]
tag = "leg.roles.roles-render-selftest"
tests = ["feature.roles"]
name = "roles render selftest"
subject = "kit"
purpose = "self-tests rendering roles into Claude Code agent types"
argv = ["python", "{kit}/render_agents.py", "--selftest"]
unguarded_why = "a guard naming the roles kit would make every live spec whose Files touched trips it name this leg, so it runs whole whenever GATE_SELFTESTS asks"
guard = []
ceiling = 300
stage = ["step.test"]

[gate_leg.gov]
guard = []
chunk = "selftests"

# THE OUTPUTS ARE A PROGRAM'S. An agent type is a base role, the overlay units selecting it and front matter
# composed by `render_agents.py`, not one template with tokens, so it is declared here and not as a
# `rendered` row. The unattended kit reads these rows into its generated set, so a pass's re-render
# is a generated write rather than an undeclared one.
[[generated]]
path = ".claude/agents"
generator = "render_agents.py"
why = "one agent type per role whose agent key is true, re-rendered whenever a role file, an overlay, the conf or the governing doc moves"

[[generated]]
path = ".claude/roles.json"
generator = "render_agents.py"
why = "the role index the role-aware write gate and spawn guard read, rendered beside the agent types"

# THREE [[lf_pin]] rows, one per artifact `--check` byte-compares.
[[lf_pin]]
pattern = ".claude/agents/*.md"
why = "rendered agent types the roles render wiring leg byte-compares"

[[lf_pin]]
pattern = ".claude/roles.json"
why = "a rendered index the roles render wiring leg byte-compares"

[[lf_pin]]
pattern = ".claude/skills/build/SKILL.md"
why = "a rendered artifact its own gate byte-compares"

# THE DRIVE ROWS (PLAY-dOrderedCharter-6): how a session starts or advances a stage this kit serves. The
# playbook render composes one charter line per row of each selected kit, and the role's handoff carries
# its own role's lines. `stage` names a workflow of the roles kit's workflows.toml, or `start`; `role` a
# role slot, or `main` for the main session.

[[drive]]
stage = "start"
role = "main"
command = "/build"
when = "only when the owner asks to attend a build"

[[drive]]
stage = "start"
role = "gov-session"
command = "python <prefix>/roles/handoff.py check <file>"
when = "a subagent's task, handed over as a prompt file"

[[drive]]
stage = "handoff"
role = "gov-session"
command = "python <prefix>/roles/handoff.py render --role <role> --build <slug>"
when = "work leaving this session for another"

[[drive]]
stage = "build"
role = "gov-builder"
command = "python <prefix>/roles/handoff.py render --role gov-builder --build <slug> --unit <id>"
when = "a unit whose spec is READY"

# TOOL-dBoundRoles-18: TOOL-dBoundRoles-1 merged gov-spec-reviewer and gov-diff-reviewer into
# gov-reviewer, and this step gives an adopter that merge. Its up re-keys the house file, the policy
# file and the overlay, carries the old house texts, removes the two old role files an update left, and
# runs the target's own render_agents.py, so it needs the target's code and runs attended. `surfaces`
# names every member the step gate reads as vanished with the two role files. It sits before the house
# step below, so the old house texts it carries reach gov-reviewer's file before that step moves the file.
# Once landed this row is frozen: a correction is a new step.
[[upgrade]]
id = "roles/reviewers-to-gov-reviewer"
up = ["python", "{gov}/govkit/steps/reviewer_merge.py", "up", "{target}", "{prefix}"]
down = ["python", "{gov}/govkit/steps/reviewer_merge.py", "down", "{target}", "{prefix}"]
witness = ["python", "{gov}/govkit/steps/reviewer_merge.py", "witness", "{target}", "{prefix}"]
resume = "atomic"
surfaces = ["agent:gov-spec-reviewer", "agent:gov-diff-reviewer",
            "installable:{prefix}/roles/agents/gov-spec-reviewer.agent.md",
            "installable:{prefix}/roles/agents/gov-diff-reviewer.agent.md"]
needs-target = true

# TOOL-dBoundRoles-19: a role's own project rules move from the seeded house text files `house/<slot>.md`
# into the overlay, `.governance/instructions.toml`, one level-5 `repo.house.<slot>` unit selecting
# `role.<slot>` per non-empty file, written through the playbook kit's overlay writer; every house text
# file is removed, `house/policy.toml` kept. Its down restores the files and the overlay from the
# before-image. It reads and writes files only, through gov's own overlay module, so it needs no target
# code. `surfaces` names each house text file the kit seeded, as the two classes the step gate reads it in.
# Once landed this row is frozen: a correction is a new step.
[[upgrade]]
id = "roles/house-overlays-to-instructions"
up = ["python", "{gov}/govkit/steps/house_overlays_to_instructions.py", "up", "{target}", "{prefix}"]
down = ["python", "{gov}/govkit/steps/house_overlays_to_instructions.py", "down", "{target}", "{prefix}"]
witness = ["python", "{gov}/govkit/steps/house_overlays_to_instructions.py", "witness", "{target}", "{prefix}"]
surfaces = ["file:{prefix}/roles/house/gov-architect.md", "file:{prefix}/roles/house/gov-builder.md",
            "file:{prefix}/roles/house/gov-orienter.md", "file:{prefix}/roles/house/gov-planner.md",
            "file:{prefix}/roles/house/gov-prompt-writer.md", "file:{prefix}/roles/house/gov-researcher.md",
            "file:{prefix}/roles/house/gov-reuse-scout.md", "file:{prefix}/roles/house/gov-reviewer.md",
            "file:{prefix}/roles/house/gov-session.md", "file:{prefix}/roles/house/gov-skeptic.md",
            "file:{prefix}/roles/house/gov-spec-writer.md", "file:{prefix}/roles/house/gov-synthesizer.md",
            "file:{prefix}/roles/house/gov-tester.md",
            "installable:{prefix}/roles/house/gov-architect.md", "installable:{prefix}/roles/house/gov-builder.md",
            "installable:{prefix}/roles/house/gov-orienter.md", "installable:{prefix}/roles/house/gov-planner.md",
            "installable:{prefix}/roles/house/gov-prompt-writer.md",
            "installable:{prefix}/roles/house/gov-researcher.md",
            "installable:{prefix}/roles/house/gov-reuse-scout.md", "installable:{prefix}/roles/house/gov-reviewer.md",
            "installable:{prefix}/roles/house/gov-session.md", "installable:{prefix}/roles/house/gov-skeptic.md",
            "installable:{prefix}/roles/house/gov-spec-writer.md",
            "installable:{prefix}/roles/house/gov-synthesizer.md",
            "installable:{prefix}/roles/house/gov-tester.md"]
needs-target = false
