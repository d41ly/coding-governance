# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "agent-instructions"
home = "tools/agent-instructions"
scope = "repo"
version_from = { none = "no version constant exists in this kit; measured 2026-08-11. It is --all-selectable, so AC8's detection predicate is blind to it and falls back to a declared sentinel path." }
requires = []
sentinel = "tools/agent-instructions/adopt-agent-instructions.sh"

[[files]]
include = "**"
role = "engine"

[adopt]
argv = ["bash", "{kit}/adopt-agent-instructions.sh"]
mutates_index = false

[check]
argv = ["bash", "{kit}/adopt-agent-instructions.sh", "--check"]

[[outcome]]
code = 0
probe = { must_exist = "AGENTS.md" }
means = "adopted"

[[gate_leg]]
name = "agent-instructions wiring"
subject = "repo"
argv = ["bash", "{kit}/adopt-agent-instructions.sh", "--check"]
guard = []

[[gate_leg]]
name = "agent-instructions self-test"
subject = "kit"
argv = ["bash", "{kit}/adopt-agent-instructions.test.sh"]
guard = ["{kit}/"]
