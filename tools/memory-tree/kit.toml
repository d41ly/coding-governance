# NO HOLE FOR stale-header-waiver.txt. DEPL-aRepatriatedFork-14 S2 retired it: its probe demanded a
# row while an EMPTY file is the expected state, and the one state worth observing, a MISSING file, is
# already a refusal of `gen_build_index.py --check`, which hygiene check 9 runs on every bar.

# DEPL-aRepatriatedFork-13 S3. THE CONTRACTS OTHER SHIPPED FILES CALL THESE ENGINES BY, so a target that
# declares one of them `adopter-owned` in its `[[own]]` rows is told, on every `update` and `check`,
# which clauses its own program keeps. A REPORT, never a red, unless an installed consumer that cannot
# run sits on a leg the receipt emitted. Every clause cites its consumer; `selfcheck` refuses one that
# is not a tracked gov file, and a contract with no clause. A consumer is a path relative to this
# kit's home, or `<entry>:<path>` relative to that entry's home, because this file ships. A probe must be READ-ONLY, because `check`
# runs it: `gen_build_index.py --write` and the `merge-rows.py` driver are not probed, and
# `check-wiring.sh` already smoke-tests whatever merge driver a target installed. The re-derivation
# and every row left out, with its reason, is the spec's section 4.
[[contract]]
source = "gen_build_index.py"
id = "memory-tree/gen-build-index"
[[contract.clause]]
probe = ["python3", "{own}", "--check"]
expect = "(?m)^build-index: "
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
probe = ["python3", "{own}", "--print-bindings"]
expect = '(?m)^N\t[0-9]+$'
consumer = "check-memory-hygiene.sh"
# TOOL-aRepatriatedFork-32 rev-3 (the closing review's C2). The consumer reds when N and the count of
# U rows disagree, so a generator printing N without its U rows breaks it. Held by a U row, or by
# N 0, the one corpus that owes none — the consumer's own guard, stated where the fork is graded.
[[contract.clause]]
probe = ["python3", "{own}", "--print-bindings"]
expect = '(?m)^U\t|^N\t0$'
consumer = "check-memory-hygiene.sh"
# TOOL-dTrueNorth-16 S29: the rows check 21's pin branch and checks 29 and 30 read. The Q row is the
# pin branch's liveness row; the coverage and as-built lines open every run of the two verbs, off or
# armed, so a generator that stopped printing either breaks its consumer here first.
[[contract.clause]]
probe = ["python3", "{own}", "--print-bindings"]
expect = '(?m)^Q\t'
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
probe = ["python3", "{own}", "--check-coverage"]
expect = '(?m)^build-index: coverage'
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
probe = ["python3", "{own}", "--check-asbuilt"]
expect = '(?m)^(build-index: as-built|as-built view: off)'
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
imports = ["apply_region", "Problem", "MARK_OPEN", "MARK_CLOSE"]
consumer = "marker-contract.test.sh"

[[contract]]
source = "corpus_ids.py"
id = "memory-tree/corpus-ids"
[[contract.clause]]
probe = ["python3", "{own}", "--print-defined-ids"]
expect = "(?m)^# id-ere: "
consumer = "kickoff-manifest:manifest-check.sh"
[[contract.clause]]
imports = ["ask_shell", "main"]
consumer = "gotchas.py"

[[contract]]
source = "gotchas.py"
id = "memory-tree/gotchas"
[[contract.clause]]
probe = ["python3", "{own}", "--for-paths", "{own}"]
expect = "(?m)^# "
consumer = "kickoff-manifest:SKILL.md unattended:SKILL.template.md"
# TOOL-aHastenedSweep-5 (closing review round 1, H1). One clause per launch the hygiene shell makes of
# this program: `--check-with-ids` on an unscoped run, `--check` under `--only`. An owned copy that
# predates the one-process verb lacks `cmd_check_with_ids` and is named here, where the shell would
# otherwise red checks 13 to 19 with a usage line. `imports` measures the names, never that `main`
# dispatches the verb to them or the `\x1d<rc>` frame the shell splits.
[[contract.clause]]
imports = ["cmd_check_with_ids", "main"]
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
imports = ["cmd_check", "main"]
consumer = "check-memory-hygiene.sh"

# SHAPE-EXACT, and measured: adopter ic's own hygiene engine ignores two of these flags and runs its whole
# check instead, whose failure text a bare `\S` read as a pass. One path per line, and one line.
[[contract]]
source = "check-memory-hygiene.sh"
id = "memory-tree/hygiene-print-modes"
[[contract.clause]]
probe = ["bash", "{own}", "--print-index-set"]
expect = '\A(\S+\r?\n)+\Z'
consumer = "corpus_ids.py"
[[contract.clause]]
probe = ["bash", "{own}", "--print-append-only-ere"]
expect = '\A[^\n]+\n?\Z'
consumer = "corpus_ids.py"
[[contract.clause]]
probe = ["bash", "{own}", "--print-rotated-archive-ere"]
expect = '\A[^\n]+\n?\Z'
consumer = "row_grammar.py"
# TOOL-dTotalRecall-5 S5: the slug grammar's export, the module's ERE run once through the script's python.
[[contract.clause]]
probe = ["bash", "{own}", "--print-slug-re"]
expect = '\A\^\([^\n]+\)\$\r?\n?\Z'
consumer = "unattended:unattended.sh"
[[contract.clause]]
probe = ["bash", "{own}", "--print-slug-class"]
expect = '\A[^\n]+\n?\Z'
consumer = "unattended:unattended.sh review-harness:check-protocol-parity.test.sh"

# ---------------------------------------------------------------- the GENERATED OUTPUTS this kit writes
# TOOL-aWindowedPass-4. Paths a generator in this kit rewrites on its own schedule, usually from the
# pre-commit hook, so no pass CHOSE to write them. The unattended kit reads these rows (its
# `resolve_generated_indexes`) wherever it once read a hand-typed `GENERATED_INDEXES` conf list: check
# 23 does not count them as undeclared writes, and `--dispatch` refuses one only together with its
# generator. `generator` is relative to this kit's directory. govkit selfcheck grades each row.
# The backlog rows carry `when`: the backlog is GENERATED only under `BACKLOG_MODE=builds`, and under
# the default it is authored and a shared record, so an unconditional row contradicted every
# adopter's default `SHARED_RECORDS` and the driver refused its conf (closing review r1, B1).
# `write`, `check` and `stage` (TOOL-aPrimedIndex-1) make a row an item run-gates' regen.py
# regenerates with `--write` and proves fresh before every bar; a row carries all three or none.
# Stage 2 is an index over the records. The two shell readers above match only `path`,
# `generator` and `when`, so neither reads these keys. The backlog.py row carries none: the
# build index's write renders the same views.
[[generated]]
path = "{memory_root}/LIVE.md"
generator = "gen_build_index.py"
why = "the work-state index, re-rendered from every build's front matter whenever a spec header moves"
write = ["python", "{kit}/gen_build_index.py", "--write"]
check = ["python", "{kit}/gen_build_index.py", "--check"]
stage = 2

[[generated]]
path = "{memory_root}/ledger"
generator = "gen_build_index.py"
why = "the month shards of the generated ledger, rendered beside LIVE.md"
write = ["python", "{kit}/gen_build_index.py", "--write"]
check = ["python", "{kit}/gen_build_index.py", "--check"]
stage = 2

[[generated]]
path = "{memory_root}/backlog"
generator = "gen_build_index.py"
when = ".memory-tree.conf:BACKLOG_MODE=builds"
why = "the per-family backlog views, rendered from every build's asks"
write = ["python", "{kit}/gen_build_index.py", "--write"]
check = ["python", "{kit}/gen_build_index.py", "--check"]
stage = 2

[[generated]]
path = "{memory_root}/backlog"
generator = "backlog.py"
when = ".memory-tree.conf:BACKLOG_MODE=builds"
why = "the same views, written by the backlog verbs a run calls to file or dispose an ask"

[[generated]]
path = "{memory_root}/gotchas/INDEX.md"
generator = "gotchas.py"
why = "the bug-class catalogue's index table, regenerated by `gotchas.py --write` when a class is added"
write = ["python", "{kit}/gotchas.py", "--write"]
check = ["python", "{kit}/gotchas.py", "--check"]
stage = 2

# THE DRIVE ROWS (PLAY-dOrderedCharter-6): how a session starts or advances a stage this kit serves. The
# playbook render composes one charter line per row of each selected kit, and the role's handoff carries
# its own role's lines. `stage` names a workflow of the roles kit's workflows.toml, or `start`; `role` a
# role slot, or `main` for the main session.

[[drive]]
stage = "bookkeeping"
role = "main"
command = "python <prefix>/memory-tree/gen_build_index.py --write"
when = "a record, an index or the run state changed"

[[drive]]
stage = "closing-review"
role = "main"
command = "python <prefix>/memory-tree/gotchas.py --for-diff <base>..<head>"
when = "before any review, for the bug classes a diff can hit"

