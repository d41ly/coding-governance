# kit.toml — this entry, declared as data. Read by tools/govkit/. Contract: the deployer unit's spec under memory/builds/aSealedCaravan/spec/.

id = "memory-tree"
home = "tools/memory-tree"
scope = "repo"
version_from = { file = "check-memory-hygiene.sh", pattern = "^KIT_MEMORY_TREE_VERSION=" }
requires = []
requires_if = [{ kit = "memory-recall", when_any_key_set = ["DEAD_PATH_PIN", "ORPHAN_ID_PIN"], when_verb_used = ["--print-defined-ids"], why = "corpus_ids.py arms checks 13-15 on either of these pins and raises when the memory-recall sibling is absent; the edge is FALSE at apply time because the pins ship blank, and becomes TRUE when the measured-pins hole is discharged. Check 16 is NOT on this edge: it is structural since memory-tree 2.42 and reaches neither walk() nor the grammar, so it stays available to an adopter who took memory-tree alone. The `--print-defined-ids` verb (the kickoff kit's id-citation reader) is on this edge too, and it DEGRADES rather than raises: exit 3 with one line naming this kit, which the kickoff checker maps onto its 'id citations unchecked' branch — memory-tree + kickoff-manifest without memory-recall is supported, with id citations unchecked (the aReplayedCard closing review, F1). `when_verb_used` is documentation the selfcheck does not resolve; the mechanism is corpus_ids.py's exit 3" }]

[[files]]
path = "build-readme-slot-limits.txt"
role = "seed"
why = "the declared per-slot byte ceilings for a build README's authored half. Copied to an adopter with its rows and WITHOUT gov's values; see the slot-budget-ceilings hole."

[[files]]
path = "build-readme-slot-highwater.txt"
role = "seed"
why = "the advisory high-water per slot, rewritten by `gen_build_index.py --bump` and never by hand. Split from the ceilings file because --bump writes this one, and a ceiling inside the write path of the thing that must not move it is guarded only by a diff reader."

[[files]]
include = "**"
role = "engine"

# THIS KIT'S SELF-TESTS ARE WITHHELD. TOOL-aQuenchedHarness-3. Each stages a break into a copy of a
# checker in THIS directory and asserts the checker still catches it, so its subject is the checker
# and it has a job only when the source here changes -- and none at all in a tree that copy-installs
# the kit and never edits it. That is the 2026-08-23 owner ruling, applied to what SHIPS rather than
# only to what runs.
#
# WITHHELD BY CLAIMING THE DESTINATION, the mechanism `tools/codebase-map/kit.toml` already uses and
# explains: govkit has no `exclude` key, a `**` rule's pool drops only what another rule owns, and
# `project-owned` is absent from LANDABLE_ROLES so `apply` never writes it.
#
# AND THE LEG GOES WITH THE FILE, through machinery that already exists: `silenced_legs` refuses to
# emit a gate leg whose argv names a path the target does not hold, and `_cmd_apply` REPORTS each one
# rather than shipping it. So this rule closes both halves and needs no deployer code.
#
# SCOPE, and it is the half a reader misses: this withholds from `govkit apply` ONLY. The
# copy-install path in `WIRE-INTO-PROJECT.md` is a plain `cp -r` of the kit dir and does not read
# this file, so that runbook removes them separately. The suites remain in the public repository for
# anyone who edits a kit.
[[files]]
include = ["check-memory-hygiene.test.sh", "check-method-carriers.test.sh", "check-verdict-epoch.test.sh", "hygiene-parity.test.sh", "merge-rows.test.sh"]
role = "project-owned"

[[files]]
include = ["HYGIENE.template.md"]
role = "rendered"
to = "{memory_root}/HYGIENE.md"
placeholders = ["KIT_DIR", "TOOL_ROOT", "INDEX_CAP_LINES", "ENTRY_CAP_UNIT"]

[[files]]
include = ["SPEC-TEMPLATE.template.md"]
role = "rendered"
to = "{memory_root}/TEMPLATE-SPEC.md"
placeholders = ["KIT_DIR", "TOOL_ROOT", "READINESS_ROWS"]

[[files]]
include = ["BUILD-METHOD.template.md"]
role = "rendered"
to = "{memory_root}/guides/BUILD-METHOD.md"
placeholders = ["KIT_DIR", "TOOL_ROOT"]

[[files]]
include = ["ANNOTATION-STYLE.template.md"]
role = "rendered"
to = "{memory_root}/guides/ANNOTATION-STYLE.md"
placeholders = ["KIT_DIR", "TOOL_ROOT"]

[config]
file = ".memory-tree.conf"
owner = "memory-tree"
required_keys_gate = ["MEMORY_ROOT", "DISCIPLINES", "FAMILIES"]
required_keys_render = ["MEMORY_ROOT", "READINESS_ROWS"]
optional_keys = ["SPEC_FORMAT_CUTOFF", "STREAMS_CUTOFF", "SPEC_WITNESS_CUTOFF", "DEAD_PATH_EXCLUDE", "READ_PATH_WAIVER", "BUILD_SLUG_RE", "PROJECT_REGISTRY_EXTRA", "RECORD_SERVES_CUTOFF", "RECORD_UNDATED_ARTIFACTS", "ENTRY_CAP_UNIT", "READINESS_ROWS_CUTOFF", "ARMS_FLOORS", "LIVE_ROW_PIN", "SEVERITY_UNLABELLED_PIN"]
conditional_keys = ["DEAD_PATH_PIN", "ORPHAN_ID_PIN"]
defaults = { MEMORY_ROOT = "memory" }

[adopt]
argv = ["bash", "{kit}/adopt-memory-tree.sh", "--scaffold"]
mutates_index = true

# `--render` AND NOT THE `[adopt]` ARGV, which is the whole reason this block exists. `--scaffold`
# takes one of exactly two branches on an adopted tree and NEITHER re-renders: the marker branch
# prints `already scaffolded — nothing to do` and exits 0, and a marker-less root is refused. So the
# four `rendered` rows below — `{memory_root}/HYGIENE.md`, `{memory_root}/TEMPLATE-SPEC.md`,
# `{memory_root}/guides/BUILD-METHOD.md` and `{memory_root}/guides/ANNOTATION-STYLE.md` — had no verb
# able to refresh them, and went one vintage stale on every pull. `--render` skips the adoption guard,
# reads the `gov:kit memory-tree@` marker instead — and stops at the accepted exit 3 when it is
# absent rather than refusing — then writes those four and nothing else.
#
# GATED BY `GOVKIT_RERENDER`, like every block of this kind: the step runs by default, and with
# GOVKIT_RERENDER=0 exported a `govkit update` refreshes nothing here and still relabels each moved
# `rendered` row `re-rendered` before the flag is ever read. Reachable by hand at any time.
#
# SAFE TO RE-RUN for the reason the mode was cut this narrow: it seeds no conf, writes no waiver
# registry, creates no directory beyond a destination's own parent, and leaves a file whose render is
# already current byte-identical and unmentioned. It cannot reset a measured pin, because it never
# touches a file that holds one.
#
# NO `[[outcome]]` PAIR OF ITS OWN. The marker question `--render` used to answer with exit 1 is now
# answered at exit 3 by the accepted `not-rendered-here` row below, so the only exit-1 states left
# under `--render` are the blank-`READINESS_ROWS` refusal, which sits after the marker gate and which
# an adopted tree does reach, and the incomplete-render-set refusal inside `render_all`. Both leave
# `{memory_root}/HYGIENE.md` present, so the `code = 1` probe below matches and labels them
# `refused-foreign-tree`, which is the wrong `means` for either: they stay failures, and the label is
# misleading rather than wrong in effect. Stated here rather than given a row, because a second
# `code = 1` row would have to discriminate on a file neither state distinguishes.
[[regenerate]]
argv = ["bash", "{kit}/adopt-memory-tree.sh", "--render"]

[[outcome]]
code = 1
probe = { must_exist = ".memory-tree.conf", must_not_exist = "{memory_root}/HYGIENE.md" }
means = "seed-and-stop"
# An ACCEPTED stop, not a failure: the adopter seeds the conf and stops BY DESIGN so a person edits
# it before anything renders against the wrong values. Every correct first install ends here, so
# treating it as a failure made `apply` exit non-zero on all of them. `refused-foreign-tree` below
# carries no `ok` and stays a failure, which is the distinction this flag exists to draw.
ok = true

[[outcome]]
code = 1
probe = { must_exist = "{memory_root}/HYGIENE.md" }
means = "refused-foreign-tree"

# `--render` ON A TREE THAT DOES NOT RENDER FROM THIS KIT, and it is ACCEPTED. A target can claim
# these rendered rows in its receipt while holding its own hand-authored docs — measured at one of
# the two adopters this kit shipped to this week — and for it there is nothing to refresh and nothing
# wrong. Without this row the regenerate step of an `update` run with GOVKIT_RERENDER=1 read the
# refusal as a wedge and told the operator to repair by hand a render that should never have run.
# Exit 3 and NOT 1 so it stays
# distinguishable from `refused-foreign-tree` above, which is `--scaffold` meeting a real conflict.
[[outcome]]
code = 3
means = "not-rendered-here"
ok = true
# THE CONF, NOT `{memory_root}/HYGIENE.md`, and the difference is the whole row. The adopter exits 3
# on a DISJUNCTION -- no HYGIENE.md at all, OR one without the marker -- so a probe naming HYGIENE.md
# matches the second half only, and the first half is this kit's own declared first-install steady
# state: `seed-and-stop` above pins `must_not_exist = "{memory_root}/HYGIENE.md"` and its comment
# says every correct first install ends there. Narrowed that way the descriptor held two `ok = true`
# rows contradicting each other about one path, and an `update` over a seeded-and-stopped target
# found no accepted outcome for exit 3, left its writes staged and told the operator to repair by
# hand a render that should never have run -- verbatim the wedge this row exists to remove. The conf
# is present on both halves, it cannot be satisfied by a run that died before writing (the adopter
# refuses and seeds it long before the exit-3 gate), and a `must_exist` term is REQUIRED here by
# DEPL-cMendedVintage-16's arm, so it cannot simply be dropped.
probe = { must_exist = ".memory-tree.conf" }

[[gate_leg]]
name = "memory hygiene"
subject = "repo"
argv = ["bash", "{kit}/check-memory-hygiene.sh"]
guard = []
history_depth = "full"

[[hole]]
id = "memory-tree-taxonomy"
kind = "authoring"
blocks_adopt = false
blocks_gate = false
why = "DISCIPLINES and FAMILIES ship as the example's DEMO values rather than blank, so an un-edited conf scaffolds another project's enum into the target and every gate stays green. Neither flag set: measured, the adopter exits 0 and the hygiene leg exits 0."
discharge = { command = ["bash", "-c", "! diff -q <(grep -E '^(DISCIPLINES|FAMILIES)=' .memory-tree.conf) <(grep -E '^(DISCIPLINES|FAMILIES)=' {kit}/.memory-tree.conf.example) >/dev/null"] }

[[hole]]
id = "slot-budget-ceilings"
kind = "measurement"
blocks_adopt = false
blocks_gate = false
why = "build-readme-slot-limits.txt ships to an adopter with its canonical rows and NO ceiling values. A ceiling measured against gov's corpus and inherited by a tree that never measured its own is either vacuous or permanently red — the same reason measured-pins exists, one file over. A row present with no value is the ANNOUNCED unarmed state and is legal; the leg names how many slots are unarmed on every run, so an unmeasured tree says so rather than reporting a clean bar. A MISSING row stays a refusal, because that is a slot nobody decided about."
discharge = { command = ["bash", "-c", "awk -F'\t' '/^## /{ if ($2 !~ /^[0-9]+$/) exit 1 } END{ }' {kit}/build-readme-slot-limits.txt"] }

[[hole]]
id = "measured-pins"
kind = "measurement"
blocks_adopt = false
blocks_gate = false
why = "every pin is measured against the target corpus; an inherited number is vacuous or permanently red. Blank means checks 13-15 are simply OFF, so the hygiene leg exits 0 with that hole wide open. Check 16 is NOT in this bargain: it is structural since memory-tree 2.42 and runs whatever the pins say."
# DEPL-aRepatriatedFork-13 S5. The probe runs `{kit}/corpus_ids.py --check`; at a target that
# owns that program, it would grade the adopter's own engine against gov's pins.
stands_down = { when_owned = ["corpus_ids.py"], why = "the probe runs corpus_ids.py, and an adopter-owned corpus_ids.py is the target's program rather than gov's" }
discharge = { command = ["bash", "-c", "for k in ORPHAN_ID_PIN DEAD_PATH_PIN; do grep -qE \"^${k}=\\\"[^\\\"]+\\\"\" .memory-tree.conf || exit 1; done; python {kit}/corpus_ids.py --check"] }

# THE RE-RENDER an update runs, with GOVKIT_RERENDER=1. This kit owns FOUR `rendered` rows — the
# hygiene rules, the spec template, the build method and the annotation style — and until this block
# existed it declared no way to refresh any of them, so each went one vintage stale on every update
# INCLUDING one run with GOVKIT_RERENDER=1, which had nothing here to run
# and the adopter's own dogfood-parity leg reds on the gap (TOOL-dRetiredFork-29, measured at two
# adopters). `--scaffold` cannot be that argv and the backlog row says why: on an adopted tree it
# prints "already scaffolded" and exits 0. `--render` is the narrow entrypoint added for this, it
# refuses an unadopted tree, and it stops before the authored files a refresh must never touch.
[[regenerate]]
argv = ["bash", "{kit}/adopt-memory-tree.sh", "--render"]

[check]
# Declared absence, not silence: `check` reds on an entry that declares neither an argv nor a
# reason, because one string for "nothing was measured" and "measured and broken" is not a verdict.
none = """
the adopter's two modes are `--scaffold` and `--render`, measured, and neither is a verifier. Its verifiers default to a check mode but each is already this kit's own gate leg. Wiring one is a backlog row, not a silence
"""

[[gate_leg]]
name = "verdict epoch (kit version dates the engine)"
subject = "repo"
argv = ["bash", "{kit}/check-verdict-epoch.sh"]
guard = []

[[gate_leg]]
name = "kit/dogfood doc parity"
subject = "repo"
argv = ["bash", "{kit}/kit-dogfood-parity.test.sh"]
guard = ["{memory_root}/HYGIENE.md", "{memory_root}/TEMPLATE-SPEC.md", "{memory_root}/guides/BUILD-METHOD.md", "{memory_root}/guides/ANNOTATION-STYLE.md", "{kit}/"]
# BUILD-METHOD.md is in the guard because the leg VALIDATES it — the pairs this test compares are
# HYGIENE.md, TEMPLATE-SPEC.md and guides/BUILD-METHOD.md, and the third was missing from both this
# descriptor and gov's own manifest row. A guard that omits a file the leg reads makes the leg skip
# on every scoped run in which only that file changed. While the push boundary forced a total run
# that cost a late signal; now that the boundary DECIDES, it would cost a wrong merge verdict — which
# is why the unit that removes the force closes this hole in the same commit rather than filing it.
# TWO carriers, because govkit copies a descriptor's declared guard verbatim into a target: fixing
# gov's manifest alone would leave the half that SHIPS open, and the hole would be exported rather
# than fixed.

[[gate_leg]]
name = "method carriers (every pointer declared)"
subject = "repo"
argv = ["bash", "{kit}/check-method-carriers.sh"]
guard = []

[[gate_leg]]
name = "build README slot contract"
subject = "repo"
argv = ["python3", "{kit}/gen_build_index.py", "--check-format"]
guard = []

[[gate_leg]]
name = "build-index selftest"
subject = "kit"
argv = ["python3", "{kit}/gen_build_index.py", "--selftest"]
guard = ["{kit}/"]

[[gate_leg]]
name = "corpus-ids selftest"
subject = "kit"
argv = ["python3", "{kit}/corpus_ids.py", "--selftest"]
guard = ["{kit}/"]

[[gate_leg]]
name = "gotchas selftest"
subject = "kit"
argv = ["python3", "{kit}/gotchas.py", "--selftest"]
guard = ["{kit}/"]

[[gate_leg]]
name = "row-grammar selftest"
subject = "kit"
argv = ["python3", "{kit}/row_grammar.py", "--selftest"]
guard = ["{kit}/"]

[[gate_leg]]
name = "marker contracts"
subject = "repo"
argv = ["bash", "{kit}/marker-contract.test.sh"]
guard = []

[[gate_leg]]
name = "harness arms (fail branches armed or pinned)"
subject = "repo"
argv = ["python3", "{kit}/check-arms.py", "--check"]
guard = []

[[gate_leg]]
name = "check-arms selftest"
subject = "kit"
argv = ["python3", "{kit}/check-arms.py", "--selftest"]
guard = ["{kit}/"]

# Line-ending pins this kit needs in a TARGET. Emitted into the target's own
# .gitattributes as one govkit-owned block; the renormalize that follows reads git's
# answer about which paths they govern, never these pattern strings.
[[lf_pin]]
pattern = "{memory_root}/**/*.md"
why = "three gates byte- or char-compare these"
[[lf_pin]]
pattern = "{memory_root}/**/*.toml"
why = "the same gates read them as data"
[[lf_pin]]
pattern = "{memory_root}/**/*.txt"
why = "the waiver registries are read line by line"
[[lf_pin]]
pattern = "{kit}/build-readme-slot-limits.txt"
why = "a tab-separated declaration read line by line; a CR would land inside the value field"
[[lf_pin]]
pattern = "{kit}/build-readme-slot-highwater.txt"
why = "written by --bump and read line by line, same reason as the ceilings beside it"
[[lf_pin]]
pattern = ".memory-tree.conf"
why = "a sourced conf: a CR reaches the shell as part of the value"
[[lf_pin]]
pattern = "{kit}/.memory-tree.conf.example"
why = "the adopter copies it verbatim into the line above"

# NO HOLE FOR stale-header-waiver.txt. DEPL-aRepatriatedFork-14 S2 retired it: its probe demanded a
# row while an EMPTY file is the expected state, and the one state worth observing, a MISSING file, is
# already a refusal of `gen_build_index.py --check`, which hygiene check 9 runs on every bar.

# DEPL-aRepatriatedFork-13 S3. THE CONTRACTS OTHER SHIPPED FILES CALL THESE ENGINES BY, so a target that
# declares one of them `adopter-owned` in its `[[own]]` rows is told, on every `update` and `check`,
# which clauses its own program keeps. A REPORT, never a red, unless an installed consumer that cannot
# run sits on a leg the receipt emitted. Every clause cites its consumer; `selfcheck` refuses one that
# is not a tracked gov file, and a contract with no clause. A consumer is a path relative to this
# kit's home, or `<entry>:<path>` relative to that entry's home, because this file ships. A probe must be READ-ONLY, because `check`
# runs it: `gen_build_index.py --write` and the `merge-rows.py` driver are not probed, and
# `check-wiring.sh` already smoke-tests whatever merge driver a target installed. The re-derivation
# and every row left out, with its reason, is the spec's section 4.
[[contract]]
source = "gen_build_index.py"
id = "memory-tree/gen-build-index"
[[contract.clause]]
probe = ["python3", "{own}", "--check"]
expect = "(?m)^build-index: "
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
probe = ["python3", "{own}", "--print-bindings"]
expect = '(?m)^N\t[0-9]+$'
consumer = "check-memory-hygiene.sh"
[[contract.clause]]
imports = ["apply_region", "Problem", "MARK_OPEN", "MARK_CLOSE"]
consumer = "marker-contract.test.sh"

[[contract]]
source = "corpus_ids.py"
id = "memory-tree/corpus-ids"
[[contract.clause]]
probe = ["python3", "{own}", "--print-defined-ids"]
expect = "(?m)^# id-ere: "
consumer = "kickoff-manifest:manifest-check.sh"
[[contract.clause]]
imports = ["ask_shell"]
consumer = "gotchas.py"

[[contract]]
source = "gotchas.py"
id = "memory-tree/gotchas"
[[contract.clause]]
probe = ["python3", "{own}", "--for-paths", "{own}"]
expect = "(?m)^# "
consumer = "kickoff-manifest:SKILL.md unattended:SKILL.template.md"

# SHAPE-EXACT, and measured: inCMS's own hygiene engine ignores two of these flags and runs its whole
# check instead, whose failure text a bare `\S` read as a pass. One path per line, and one line.
[[contract]]
source = "check-memory-hygiene.sh"
id = "memory-tree/hygiene-print-modes"
[[contract.clause]]
probe = ["bash", "{own}", "--print-index-set"]
expect = '\A(\S+\r?\n)+\Z'
consumer = "corpus_ids.py"
[[contract.clause]]
probe = ["bash", "{own}", "--print-append-only-ere"]
expect = '\A[^\n]+\n?\Z'
consumer = "corpus_ids.py"
[[contract.clause]]
probe = ["bash", "{own}", "--print-rotated-archive-ere"]
expect = '\A[^\n]+\n?\Z'
consumer = "row_grammar.py"
