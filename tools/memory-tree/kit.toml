optional = [
  { part = "gen_build_index.py", point = "point.memory.live-column", fallback = "the Landed-unclosed column renders not-installed: drift-audit" },
  { part = "check-memory-hygiene.test.sh", point = "point.memory.consult", fallback = "the map arms skip with the slot line, their assertions counted" },
  { part = "legacy_ledger.py", point = "point.memory.record-home", fallback = "with no deployer registry tracked, the registrations are the kit descriptors' own [[ledger]] tables" },
  { part = "kit.toml", point = "point.memory.consult", fallback = "the memory-recall row is a declaration and selects no kit" },
  { part = "record_find.py", point = "point.memory.consult", fallback = "a question exits 2 with one refused line naming memory-recall, and a filter-only find reads no recall kit" },
  { part = "record_kinds.py", point = "point.runtime.reading", fallback = "the Serves-alias join prints unarmed and reds nothing with no runlog kit; its fixture writes a runlog file of its own" },
]

