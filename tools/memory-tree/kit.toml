# TOOL-dTotalRecall-20: dTotalRecall's three moves an adopter can see. The journal step grades the
# target's `journal` records through the alias and writes nothing; the front-matter step grades each
# build README's keys before the schema's refusal meets them, and writes nothing; the retag writes
# each untagged record heading's derived anchor as its authored tag, only under the target's own
# `memory.legacy-anchors = "retag"`, through a before-image its down restores. Each runs gov's code
# over the target's files and none of the target's, so none needs the target.
[[upgrade]]
id = "memory-tree/serves-journal-read-as-log"
up = ["python", "{gov}/govkit/steps/memory_journal_alias.py", "up", "{target}"]
down = ["python", "{gov}/govkit/steps/memory_journal_alias.py", "down", "{target}"]
witness = ["python", "{gov}/govkit/steps/memory_journal_alias.py", "witness", "{target}"]
resume = "atomic"
surfaces = ["serves-kind:journal"]
needs-target = false

[[upgrade]]
id = "memory-tree/readme-front-matter-graded"
up = ["python", "{gov}/govkit/steps/memory_front_matter.py", "up", "{target}"]
down = ["python", "{gov}/govkit/steps/memory_front_matter.py", "down", "{target}"]
witness = ["python", "{gov}/govkit/steps/memory_front_matter.py", "witness", "{target}"]
resume = "atomic"
surfaces = ["front-matter:build-readme"]
needs-target = false

[[upgrade]]
id = "memory-tree/legacy-anchors-retag"
up = ["python", "{gov}/govkit/steps/memory_retag.py", "up", "{target}"]
down = ["python", "{gov}/govkit/steps/memory_retag.py", "down", "{target}"]
witness = ["python", "{gov}/govkit/steps/memory_retag.py", "witness", "{target}"]
resume = "atomic"
surfaces = ["record-headings:memory-root"]
needs-target = false

# THE RATCHET PACK (TOOL-dWitnessedBar-14): one leg per row of retrofit's `[ratchet]` table, each a verb
# of `ratchet.py`; `untouched quiet` and `merge` are plants of `ratchet selftest`, and the touch join is
# `build.scope`'s, printed unarmed by `ratchet.py --list`. An adopter receives these two legs; the
# other seven read gov's registered populations or the base remote, so they are `[[exempt_leg]]` rows
# of govkit's registry (TOOL-dWitnessedBar-46 S5).

[[gate_leg]]
name = "ratchet (keys, not a scalar)"
tag = "leg.memory-tree.ratchet-keys-not-a-scalar"
tests = ["feature.memory-tree-hygiene"]
purpose = "refuses a scalar count pin in a root conf"
argv = ["python3", "{kit}/ratchet.py", "keys-not-scalar"]
subject = "repo"
pack = "ratchet"
enforces = ["practice.gate"]
stage = ["step.test"]

[gate_leg.gov]
chunk = "declarations"
ceiling = 300

[[gate_leg]]
name = "ratchet selftest"
tag = "leg.memory-tree.ratchet-selftest"
tests = ["feature.memory-tree-hygiene"]
purpose = "self-tests the ratchet pack's plants red and green"
argv = ["python3", "{kit}/ratchet.py", "--fixture"]
unguarded_why = "a guard naming the memory-tree kit would make every live spec whose Files touched trips it name this leg, so it runs whole whenever GATE_SELFTESTS asks"
subject = "kit"
pack = "ratchet"
enforces = ["practice.gate"]
stage = ["step.test"]

[gate_leg.gov]
chunk = "selftests"
ceiling = 300

[[command]]
verb = "seen-red"
run = "seen_red.py"

[[gate_leg]]
name = "shape-run records (each record equals its review line)"
tag = "leg.memory-tree.shape-run-records-each-record-equals-its-review"
tests = ["feature.memory-tree-hygiene"]
purpose = "compares each shape-run record with its review line"
argv = ["python3", "{kit}/shape_run.py", "--check"]
subject = "repo"
enforces = ["practice.one-fact"]
stage = ["step.test"]

[gate_leg.gov]
chunk = "records"
ceiling = 125
