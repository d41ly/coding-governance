id = "memory-tree"
home = "memory-tree"
layer = "layer.memory"
scope = "repo"
version_from = { file = "check-memory-hygiene.sh", pattern = "^KIT_MEMORY_TREE_VERSION=" }
requires = []
requires_if = [{ kit = "playbook-render", why = "TOOL-aRepatriatedFork-42: the four renders ask the playbook-render engine's `--answers` for every adopter-declared path, and rev-3 speaks keys only 1.11 answers. A FLOOR, which govkit cannot express: a plain `requires` would refuse every default apply, since the default selection carries this kit and not that one, and no key couples two kits' rollbacks. So the render enforces it: it reads KIT_PLAYBOOK_RENDER_VERSION before spawning the engine, and an engine below 1.11, or none, renders each path's stated phrase with one stderr line naming `govkit update --kits playbook-render`. No condition key: the edge holds wherever the target carries a deploy.toml, which no key of this kit's config names. TOOL-dTotalRecall-16 S4: record_kinds.py --purpose-review reads the chain registry's path from this engine's tag_index.py CHAIN_REGISTRY, found by the inline resolve_kit_dir block and read by `ast` through read_schema_source, never by import; where the kit or the literal does not resolve it prints `unarmed chain · <why>` and reviews the registry alone. TOOL-dTotalRecall-43 S10: record_find.py, behind gov_record.py's find, show and budget, reads this engine's tag index, tag_index.py and record_extract.py found by the inline resolve_kit_dir block at call time (record_find.py's load_tag_index); where the kit does not resolve, the verb exits 2 with one `refused` line naming the kit and reads no index (gov_record.py's run_read_verb)" }, { kit = "memory-recall", why = "TOOL-dTotalRecall-43 S10: record_find.py's question form, behind gov_record.py's find, ranks over the FTS tables memory-recall's query.py load_served_set fills, that kit's directory found by the inline resolve_kit_dir block at call time (record_find.py's load_recall_kit) and its bench.py imported from it. A filter-only find needs no recall kit; a question where the kit does not resolve exits 2 with one `refused` line naming it. This row is a DECLARATION `govkit selfcheck` grades and nothing else: it SELECTS no kit" }, { kit = "unattended", when_any_key_set = ["DESIGN_RECORD", "DESIGN_BASELINE", "DESIGN_VIEW", "DESIGN_NODES"], why = "TOOL-dTrueNorth-12, its four keys design_lib's DESIGN_KEYS (TOOL-dTrueNorth-20 S29): deviation_join.py, armed by these keys, strips each graded spec revision's generated regions with the unattended kit's GEN_REGION_AWK, read from its lib-unattended.sh through `backlog.resolve_kit_dir` and never copied. The live join resolves that strip as its first act and, where the kit does not resolve, refuses by name, exit 2, because a population read without the strip would count a status-only revision as a member. Its fixture and the routed-commits self-test print one named `deviation: SKIP` line instead, naming the plants that read the strip, and run every other plant under the strip stubbed to the identity, so an adopter without the kit runs that self-test with the skip said aloud. This row is a DECLARATION `govkit selfcheck` grades and nothing else: it SELECTS no kit, so an adopter installs the unattended kit before setting the keys, which ship blank" }, { kit = "review-harness", when_any_key_set = ["SPEC_AUDIT_PIN_CUTOFF"], why = "TOOL-dTrueNorth-20 S14: under SPEC_AUDIT_PIN_CUTOFF, gen_build_index.py's derive_audit_writers reads the workflows kit's tier2-review.js, the harness this entry ships, at each graded spec-audit record's adding commit, and exempts a record whose harness there lacks the function AUDIT_WRITER_MARK names, that constant being the reader's one spelling of it. Where the kit does not resolve, --print-bindings prints one `build-index: SKIP audit-writer test` line and exempts nothing. The producer pins the literal: an arm of the harness's own suite reads AUDIT_WRITER_MARK and asserts the harness defines that function, so a rename reds the producer before it strands this reader. This row is a DECLARATION `govkit selfcheck` grades and nothing else: it SELECTS no kit, and the key ships blank" }, { kit = "roles", why = "TOOL-dTotalRecall-18 S2, the owner's ruling on its F6 (a): record_kinds.py renders the record-kind view's `Read by` and `Written by` cells from the roles kit, its READ_KEYS and load_roles from roles_lib.py and its WRITE_FOLDERS from check_roles.py, the modules found through the inline resolve_kit_dir block and called in process, the role files read under the tree checked. A plain `requires` cannot hold it, since the roles kit requires this one. Where the kit does not resolve, or holds no role, --check prints one `unarmed` line naming it and reds, and --write and new render `unarmed` cells, so an unresolved kit never reads as an empty column. This row is a DECLARATION `govkit selfcheck` grades and nothing else: it SELECTS no kit" }, { kit = "loop", why = "TOOL-dTotalRecall-18 S2, the owner's ruling on its F6 (a): record_kinds.py takes the loop items of the record-kind view's `Read by` and `Written by` cells from the loop kit's definition, read through loop_lib.py's read_definition and read_item_rows and parsed by loop_items.py's derive_record_ref, the modules found through the inline resolve_kit_dir block and called in process, the definition read under the tree checked. Where the kit does not resolve or its definition does not read, --check prints one `unarmed` line naming it and reds, and --write and new render `unarmed` cells. This row is a DECLARATION `govkit selfcheck` grades and nothing else: it SELECTS no kit" }]
# PLAY-dOrderedCharter-17: the edges this core kit keeps to a non-core one, each a declared slot with
# its fallback. The Landed-unclosed column replaced the drift-audit `requires_if` row: under
# LIVE_LANDED_UNCLOSED=1 with no drift-audit kit the render proceeds and the column reads
