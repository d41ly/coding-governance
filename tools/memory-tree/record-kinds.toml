# record-kinds.toml — the record-kind registry (TOOL-dTotalRecall-1): one [[record-kind]] row per kind of
# record the memory tree holds, the memory contract's one declaration of each. Columns, in this order:
# `name`; `tag`, record.<name>; `layer`; `home`, the `git ls-files` glob of its records, required on a
# `fields` row; `id-rule`, its name grammar or ""; `schema`, { form, source, fields }, `form` one of
# fields, header, rows, generated, `source` the literal another module declares the fields in, read by
# `ast`; `writer`, the command that writes it, `generator:<path>` or `hand`; `readers`; `lifecycle`;
# `check`, the leg of <prefix>/gate-legs.json grading it. `layer`, `readers` and `lifecycle` stay empty
# until TOOL-dTotalRecall-18 requires them. A kind joins through
# `python <prefix>/memory-tree/record_kinds.py new`, and `record_kinds.py --check` grades the file.

[[record-kind]]
name = "spec"
tag = "record.spec"
layer = ""
home = ""
id-rule = "<date>-spec-<unit id>.md"
schema = { form = "header", fields = [] }
writer = "gen_build_index.py --new-spec"
readers = []
lifecycle = ""
check = "memory hygiene"

