# record-kinds.toml — the record-kind registry (TOOL-dTotalRecall-1, -18, -16, -25): one [[record-kind]] row per
# kind of record the memory tree holds, and one witness row per family of pockets outside it, the
# memory contract's one declaration of each. Columns, in this order: `name`; `tag`, record.<name>;
# `layer`, the `layer.<name>` tag of the kit whose writer writes the kind; `home`, one glob or a list:
# a tracked-path glob (`git ls-files`), `refs/gov/<glob>` or `<git-common-dir>/<glob>`, one tracked glob
# on a `fields` row; `id-rule`, its name grammar or ""; `schema`, { form, source, fields, validator },
# `form` one of fields, header, rows, generated, fence, `source` the literal another module declares the
# fields in, read by `ast`, `validator` a `fence` row's <module>:<function> of this kit grading its
# records; `writer`, the command that writes it, `generator:<path>` or `hand`; `readers`, the work-order
# read keys a handoff fills from a record of the kind, or [] beside `readers-none`, the reason no role
# reads it; `lifecycle`, one of append-only, current-state, frozen, generated, out; `check`, the leg of
# <prefix>/gate-legs.json grading it; `purpose`, last, { text, source }, one line of at most
# PURPOSE_BYTES cited <path>:<line> or `owner`, or { pending = "<id>" }, which `memory.map-purpose`
# grades; `cardinality`, after `purpose` on a row whose `schema.fields` name a bounded edge type, each such
# type's { per-source, per-target } as the playbook kit's edge registry declares it, compared both ways by
# `edge_grammar.py --cardinality --registry` (TOOL-dTotalRecall-22); `root`, after `purpose` and before
# `cardinality`, `true` on a kind whose record is a root of the orphan walk and needs no `Caused-by`, absent
# read as `false`, a boolean or red, read by the record door's cause refusal (TOOL-dTotalRecall-19);
# `unarmed`, after them on a typed
# kind's `fields` or `fence` row whose home holds no record yet, the reason its unarmed line gives, naming
# the writer that will arm it, red once the row grades a record (TOOL-dTotalRecall-42), set by hand as
# `cardinality` is; `sections`, after `purpose` on the spec row alone, each section's { tag, required,
# heading }, `heading` its title with its `<n>. ` stripped, read by `record_kinds.py`'s `read_sections`,
# the door's scaffold refusing a new record lacking a required one (TOOL-dTotalRecall-9 S2). A
# tracked-path home names its records' glob, never a directory. Every column but
# `id-rule`, `root`, `cardinality`, `sections` and `unarmed` is required and non-empty. A kind
# joins through `python <prefix>/memory-tree/record_kinds.py new`, a `fence` row through its
# `--form fence --validator <module>:<function>`, a `generated` row through its `--form generated` with no
# field and no validator (TOOL-dTotalRecall-8), and `record_kinds.py --check` grades
# the file; `record_kinds.py --purpose-review` derives a missing purpose and writes it as one line of its row.
# `not-records`, the one top-level list before the rows, `{ glob, why }` per entry: the tracked files under the
# memory root and outside its builds that are no record, so the homeless arm reads each file outside builds
# as homed by a row, declared here, or red (TOOL-dTotalRecall-53 S23).

not-records = [
  { glob = "memory/gotchas/**", why = "a bug class the gotchas checklist reads, written by hand, no record" },
  { glob = "memory/guides/**", why = "a rendered or authored guide the charter points at, no record" },
  { glob = "memory/map/**", why = "the codebase map's dossiers and generated indexes, no record" },
  { glob = "memory/README.md", why = "the memory tree's own front page" },
  { glob = "memory/DECISIONS.md", why = "the decision register, read by recall as prose, no record" },
  { glob = "memory/HYGIENE.md", why = "the hygiene contract, rendered from the kit's template" },
  { glob = "memory/TEMPLATE-SPEC.md", why = "the spec format, rendered from the kit's template" },
]

[[record-kind]]
name = "spec"
tag = "record.spec"
layer = "layer.memory"
home = "memory/builds/*/spec/*.md"
id-rule = "<date>-spec-<unit id>.md"
schema = { form = "header", fields = [] }
writer = "gov_record.py new spec"
readers = ["input:spec"]
lifecycle = "current-state"
check = "memory hygiene"
purpose = { text = "its writer is `design.unit-spec`; the spec redesigned as a structured, tagged contract", source = "memory/builds/dClosedLoop/build/2026-10-15-build-PLAY-dClosedLoop-1-layer-memory.md:412" }
sections = [
  { tag = "section.goal", required = true, heading = "Goal" },
  { tag = "section.scope", required = true, heading = "Scope (IN)" },
  { tag = "section.non-goals", required = true, heading = "Non-goals (OUT)" },
  { tag = "section.design", required = true, heading = "Design" },
  { tag = "section.production-readiness-checklist", required = false, heading = "Production-readiness checklist" },
  { tag = "section.acceptance-criteria", required = true, heading = "Acceptance criteria" },
  { tag = "section.gates", required = true, heading = "Gates" },
  { tag = "section.open-questions", required = true, heading = "Open questions" },
  { tag = "section.revision-log", required = true, heading = "Revision log" },
  { tag = "section.reuse-audit", required = false, heading = "Reuse audit" },
]

