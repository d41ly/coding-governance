/* Layout: a signal-box console. Views fill the left, an inspector rail holds the selected record on the right, and the flow's lanes and stations borrow a transit map's grammar. Today is grey, the target is the accent, and the change between them is the signal amber. */
:root {
  --bg: #EDF1F0; --surface: #FFFFFF; --surface-2: #F5F8F7; --ink: #13201C; --ink-2: #384843; --muted: #64746E;
  --line: #CED8D5; --line-2: #A9B8B3; --accent: #0D6B5B; --accent-soft: #DCEFE9; --signal: #B07800; --signal-soft: #FBEFD2;
  --ok: #23824F; --warn: #A86A12; --bad: #B9362F; --ok-soft: #DDF1E5; --warn-soft: #F8EAD3; --bad-soft: #F7DEDB;
  --l-entry: #62738C; --l-plan: #2A67C4; --l-design: #7748BA; --l-build: #C96A16; --l-test: #1F8D58; --l-deploy: #C23838; --l-breakpoint: #A98312; --l-lifecycle: #5F716D;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Overpass", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px; --top-h: 96px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #141D1A; --surface-2: #1A2522; --ink: #E3EBE8; --ink-2: #BFCBC6; --muted: #8A9B95;
    --line: #26332F; --line-2: #3A4B46; --accent: #52C4A9; --accent-soft: #16342D; --signal: #F0B23A; --signal-soft: #3A2E12;
    --ok: #4CC38A; --warn: #E3A43C; --bad: #EF6A5F; --ok-soft: #14321F; --warn-soft: #352812; --bad-soft: #3A1916;
    --l-entry: #8EA0B8; --l-plan: #5C94EA; --l-design: #A47DE2; --l-build: #EE8E3A; --l-test: #3CC07F; --l-deploy: #EC6464; --l-breakpoint: #DDB23C; --l-lifecycle: #92A6A1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #141D1A; --surface-2: #1A2522; --ink: #E3EBE8; --ink-2: #BFCBC6; --muted: #8A9B95;
  --line: #26332F; --line-2: #3A4B46; --accent: #52C4A9; --accent-soft: #16342D; --signal: #F0B23A; --signal-soft: #3A2E12;
  --ok: #4CC38A; --warn: #E3A43C; --bad: #EF6A5F; --ok-soft: #14321F; --warn-soft: #352812; --bad-soft: #3A1916;
  --l-entry: #8EA0B8; --l-plan: #5C94EA; --l-design: #A47DE2; --l-build: #EE8E3A; --l-test: #3CC07F; --l-deploy: #EC6464; --l-breakpoint: #DDB23C; --l-lifecycle: #92A6A1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; word-break: break-word; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.stripe { display: grid; grid-template-columns: repeat(8, 1fr); height: 4px; }
.stripe span:nth-child(1) { background: var(--l-entry); } .stripe span:nth-child(2) { background: var(--l-plan); }
.stripe span:nth-child(3) { background: var(--l-design); } .stripe span:nth-child(4) { background: var(--l-build); }
.stripe span:nth-child(5) { background: var(--l-test); } .stripe span:nth-child(6) { background: var(--l-deploy); }
.stripe span:nth-child(7) { background: var(--l-breakpoint); } .stripe span:nth-child(8) { background: var(--l-lifecycle); }
.top-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 10px; max-width: 1480px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }
.wordmark b { color: var(--accent); font-weight: 700; }
.sub { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: thin; }
.tab { border: 0; background: transparent; padding: 8px 11px; border-radius: var(--radius); font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -3px 0 var(--accent); }

/* Shell */
.shell { max-width: 1480px; margin: 0 auto; padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1100px) { .shell { grid-template-columns: minmax(0, 1fr) 380px; } }
.view { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.view-title { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
.lede { color: var(--ink-2); max-width: 70ch; margin: 4px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.scroll-x { overflow-x: auto; min-width: 0; }

/* Overview */
.thesis { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 4.2vw, 46px); line-height: 1.05; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; }
.thesis button { border: 0; background: none; padding: 0; font: inherit; text-transform: inherit; cursor: pointer; color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.thesis button:hover { color: var(--signal); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; color: var(--ink-2); }
.chip b { font-family: var(--f-mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 900px) { .ov-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.diagram { padding: 8px; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 520px; }
.layer-list { display: flex; flex-direction: column; gap: 6px; }
.layer-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.layer-card:hover { border-color: var(--line-2); }
.layer-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.layer-card .lc-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.03em; }
.layer-card .lc-what { grid-column: 1 / -1; color: var(--ink-2); font-size: 13.5px; }
.kind { justify-self: start; align-self: center; font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); }
.kind.core { border-color: var(--accent); color: var(--accent); }
.kind.expansion { border-style: dashed; }
.group-label { margin-top: 8px; }
.cycle-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 2px; }
.two-col { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .two-col { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.box { padding: 14px 16px; min-width: 0; }
.box > .eyebrow { margin-bottom: 8px; }

/* SVG shared */
svg text { fill: var(--ink); font-family: var(--f-body); }
.svg-node { cursor: pointer; }
.svg-node rect.body, .svg-node circle.body { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; transition: stroke .15s, stroke-width .15s; }
.svg-node:hover rect.body, .svg-node:hover circle.body { stroke: var(--accent); }
.svg-node.on rect.body, .svg-node.on circle.body { stroke: var(--accent); stroke-width: 3; }
.svg-node.exp rect.body, .svg-node.opt circle.body { stroke-dasharray: 5 4; }
.svg-node:focus-visible { outline: none; }
.svg-node:focus-visible rect.body, .svg-node:focus-visible circle.body { stroke: var(--signal); stroke-width: 3; }
.n-title { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.04em; }
.n-sub { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.ring-label { fill: var(--ink-2); font-size: 12.5px; font-style: italic; }
.dash { fill: none; stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.base rect { fill: var(--surface-2); }
.arrowhead { fill: var(--accent); }

/* Flow */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { flex: 1 1 200px; min-width: 0; max-width: 340px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; align-items: center; }
.legend svg { vertical-align: middle; }
.lanes { display: flex; flex-direction: column; gap: 10px; }
.lane { padding: 12px 14px 8px; border-left: 6px solid var(--lc); }
.lane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--lc); color: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 16px; flex: none; align-self: center; }
.lane-name { font-family: var(--f-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: 0.03em; }
.lane-q { color: var(--ink-2); font-size: 14px; }
.lane-count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
.lane-track { margin-top: 2px; }
.lane-track svg { display: block; }
.lane details { margin: 4px 0 2px; font-size: 13.5px; color: var(--ink-2); }
.lane summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.lane summary:hover { color: var(--ink); }
.lane dl { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 4px; }
.lane dt { color: var(--muted); font-size: 12.5px; }
.lane dd { margin: 0; min-width: 0; }
.st { cursor: pointer; }
.st .hit { fill: transparent; }
.st .ring-sel { fill: none; stroke: transparent; stroke-width: 2.5; }
.st.sel .ring-sel { stroke: var(--signal); stroke-width: 3; }
.st.need .ring-sel { stroke: var(--accent); stroke-dasharray: 3 3; }
.st.route .ring-sel { stroke: var(--accent); }
.st.dim { opacity: 0.18; }
.st-label { font-family: var(--f-mono); font-size: 11.5px; fill: var(--ink-2); }
.st.sel .st-label { fill: var(--ink); font-weight: 600; }
.st:focus-visible { outline: none; }
.st:focus-visible .ring-sel { stroke: var(--signal); }

/* Lifecycle */
.state rect.body { rx: 6px; }
.state.terminal rect.body { stroke-width: 3; }
.state .s-label { font-family: var(--f-mono); font-size: 12.5px; text-anchor: middle; }
.edge { fill: none; stroke: var(--ink-2); stroke-width: 1.7; }
.edge.back { stroke: var(--signal); }
.edge.end { stroke: var(--muted); }
.edge.ctrl { stroke: var(--l-lifecycle); stroke-dasharray: 5 4; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.edge-g.on .edge { stroke-width: 3.5; stroke: var(--accent); }
.edge-g:hover .edge { stroke-width: 3; }
.bracket { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.bracket-tick { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 4; }
.bracket-label { fill: var(--muted); font-size: 12px; font-style: italic; }

/* Tables */
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th { text-align: left; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--surface); }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--surface-2); }
table.data tr.on td { background: var(--accent-soft); }
td.key { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
td.diff { background: var(--signal-soft); }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { max-height: 70vh; overflow: auto; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sev { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 0 7px; border-radius: 999px; font-weight: 600; }
.sev.HIGH { background: var(--bad-soft); color: var(--bad); } .sev.MED { background: var(--warn-soft); color: var(--warn); } .sev.LOW { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
select.pick { padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; max-width: 100%; min-width: 0; }

/* Roles */
.matrix td { min-width: 120px; }
.matrix td:first-child { min-width: 170px; }
.ichips { display: flex; flex-wrap: wrap; gap: 4px; }
.ichip { border: 1px solid var(--line); border-left: 4px solid var(--lc, var(--line-2)); background: var(--surface); border-radius: 4px; padding: 1px 6px; font-family: var(--f-mono); font-size: 11.5px; cursor: pointer; color: var(--ink); text-align: left; overflow-wrap: anywhere; }
.ichip:hover { border-color: var(--accent); border-left-color: var(--lc, var(--accent)); }
.ichip.ref { --lc: var(--accent); }
.role-name { font-weight: 600; }
.role-meta { color: var(--muted); font-size: 12px; }

/* Chain */
.chain-svg svg { display: block; min-width: 860px; width: 100%; height: auto; }
.cnode rect.body { rx: 6px; }
.cnode.root rect.body { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.c-slug { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.c-stage { fill: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.c-count { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.cedge { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.cedge.hot { stroke: var(--accent); stroke-width: 2.5; }
.bar-h { fill: var(--bad); } .bar-m { fill: var(--warn); } .bar-l { fill: var(--line-2); }

/* Progress */
.rail { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 560px) { .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.step-card { padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; cursor: pointer; }
.step-card:hover { border-color: var(--line-2); }
.step-card .sc-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.03em; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.state-pill { align-self: start; font-family: var(--f-mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; }
.state-pill.done { background: var(--ok-soft); color: var(--ok); }
.state-pill.open { background: var(--signal-soft); color: var(--signal); }
.state-pill.todo { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line-2); }
.sc-meta { color: var(--ink-2); font-size: 13px; }
.chart svg { display: block; width: 100%; height: auto; min-width: 560px; }
.ax { stroke: var(--line); stroke-width: 1; }
.ax-label { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.bar-label { font-family: var(--f-mono); font-size: 12px; fill: var(--ink-2); }
.rbar { cursor: pointer; }
.rbar:hover .rb-bg { fill: var(--surface-2); }
.rb-bg { fill: transparent; }
.rb-h { fill: var(--bad); } .rb-m { fill: var(--warn); } .rb-l { fill: var(--line-2); } .rb-r { fill: none; stroke: var(--line-2); stroke-dasharray: 3 2; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.tl-day { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; margin: 14px 0 4px; color: var(--ink); }
.tl-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; border: 0; background: none; text-align: left; padding: 5px 0; cursor: pointer; width: 100%; }
.tl-item::before { content: ""; width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--surface); border: 2px solid var(--accent); }
.tl-item:hover span, .tl-item.on span { color: var(--accent); }
.tl-item span { color: var(--ink-2); font-size: 14px; }
.open-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.open-list ul { margin: 4px 0 0; padding-left: 16px; display: grid; gap: 2px; }
.owed { display: flex; flex-direction: column; gap: 10px; }
.fold { border-top: 1px solid var(--line); padding-top: 8px; }
.fold > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.fold > summary .muted { font-weight: 400; }
.fold > .md { margin-top: 8px; }
.themes > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.themes[open] > summary { margin-bottom: 8px; }
.themes > .ref-line { margin-bottom: 6px; }
.events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.events li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.events li:first-child { border-top: 0; padding-top: 0; }
.ev-date { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.events .md { font-size: 13.5px; }
.events .md p { margin: 0 0 4px; }
.more { align-self: start; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.more:hover { border-color: var(--accent); color: var(--ink); }

/* Records: markdown rendered from the records' own text */
.md { font-size: 14.5px; line-height: 1.6; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0 0 12px; }
.md h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: 0.01em; margin: 6px 0 8px; }
.md h3 { font-weight: 700; font-size: 15.5px; margin: 16px 0 6px; }
.md h4 { font-size: 14px; margin: 12px 0 4px; }
.md p { margin: 0 0 10px; max-width: 80ch; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; max-width: 80ch; }
.md li { margin: 2px 0; }
.md li > ul, .md li > ol { margin: 2px 0 4px; }
.md li > p { margin: 0 0 4px; }
