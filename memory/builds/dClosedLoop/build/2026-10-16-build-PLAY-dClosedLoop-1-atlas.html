<title>Closed Loop Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: a signal-box console. Views fill the left, an inspector rail holds the selected record on the right, and the flow's lanes and stations borrow a transit map's grammar. */
:root {
  --bg: #EDF1F0; --surface: #FFFFFF; --surface-2: #F5F8F7; --ink: #13201C; --ink-2: #384843; --muted: #64746E;
  --line: #CED8D5; --line-2: #A9B8B3; --accent: #0D6B5B; --accent-soft: #DCEFE9; --signal: #B07800; --signal-soft: #FBEFD2;
  --ok: #23824F; --warn: #A86A12; --bad: #B9362F; --ok-soft: #DDF1E5; --warn-soft: #F8EAD3; --bad-soft: #F7DEDB;
  --l-entry: #62738C; --l-plan: #2A67C4; --l-design: #7748BA; --l-build: #C96A16; --l-test: #1F8D58; --l-deploy: #C23838; --l-breakpoint: #A98312; --l-lifecycle: #5F716D;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Overpass", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px; --top-h: 96px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #141D1A; --surface-2: #1A2522; --ink: #E3EBE8; --ink-2: #BFCBC6; --muted: #8A9B95;
    --line: #26332F; --line-2: #3A4B46; --accent: #52C4A9; --accent-soft: #16342D; --signal: #F0B23A; --signal-soft: #3A2E12;
    --ok: #4CC38A; --warn: #E3A43C; --bad: #EF6A5F; --ok-soft: #14321F; --warn-soft: #352812; --bad-soft: #3A1916;
    --l-entry: #8EA0B8; --l-plan: #5C94EA; --l-design: #A47DE2; --l-build: #EE8E3A; --l-test: #3CC07F; --l-deploy: #EC6464; --l-breakpoint: #DDB23C; --l-lifecycle: #92A6A1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #141D1A; --surface-2: #1A2522; --ink: #E3EBE8; --ink-2: #BFCBC6; --muted: #8A9B95;
  --line: #26332F; --line-2: #3A4B46; --accent: #52C4A9; --accent-soft: #16342D; --signal: #F0B23A; --signal-soft: #3A2E12;
  --ok: #4CC38A; --warn: #E3A43C; --bad: #EF6A5F; --ok-soft: #14321F; --warn-soft: #352812; --bad-soft: #3A1916;
  --l-entry: #8EA0B8; --l-plan: #5C94EA; --l-design: #A47DE2; --l-build: #EE8E3A; --l-test: #3CC07F; --l-deploy: #EC6464; --l-breakpoint: #DDB23C; --l-lifecycle: #92A6A1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; word-break: break-word; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.stripe { display: grid; grid-template-columns: repeat(8, 1fr); height: 4px; }
.stripe span:nth-child(1) { background: var(--l-entry); } .stripe span:nth-child(2) { background: var(--l-plan); }
.stripe span:nth-child(3) { background: var(--l-design); } .stripe span:nth-child(4) { background: var(--l-build); }
.stripe span:nth-child(5) { background: var(--l-test); } .stripe span:nth-child(6) { background: var(--l-deploy); }
.stripe span:nth-child(7) { background: var(--l-breakpoint); } .stripe span:nth-child(8) { background: var(--l-lifecycle); }
.top-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 10px; max-width: 1480px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }
.wordmark b { color: var(--accent); font-weight: 700; }
.sub { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: thin; }
.tab { border: 0; background: transparent; padding: 8px 12px; border-radius: var(--radius); font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -3px 0 var(--accent); }

/* Shell */
.shell { max-width: 1480px; margin: 0 auto; padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1100px) { .shell { grid-template-columns: minmax(0, 1fr) 380px; } }
.view { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.view-title { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; }
.lede { color: var(--ink-2); max-width: 70ch; margin: 4px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.scroll-x { overflow-x: auto; min-width: 0; }

/* Overview */
.thesis { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 4.2vw, 46px); line-height: 1.05; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; }
.thesis button { border: 0; background: none; padding: 0; font: inherit; text-transform: inherit; cursor: pointer; color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.thesis button:hover { color: var(--signal); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; color: var(--ink-2); }
.chip b { font-family: var(--f-mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 900px) { .ov-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.diagram { padding: 8px; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 520px; }
.layer-list { display: flex; flex-direction: column; gap: 6px; }
.layer-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.layer-card:hover { border-color: var(--line-2); }
.layer-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.layer-card .lc-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.03em; }
.layer-card .lc-what { grid-column: 1 / -1; color: var(--ink-2); font-size: 13.5px; }
.kind { justify-self: start; align-self: center; font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); }
.kind.core { border-color: var(--accent); color: var(--accent); }
.kind.expansion { border-style: dashed; }
.group-label { margin-top: 8px; }
.cycle-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 2px; }
.two-col { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .two-col { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.box { padding: 14px 16px; }

/* SVG shared */
svg text { fill: var(--ink); font-family: var(--f-body); }
.svg-node { cursor: pointer; }
.svg-node rect.body, .svg-node circle.body { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; transition: stroke .15s, stroke-width .15s; }
.svg-node:hover rect.body, .svg-node:hover circle.body { stroke: var(--accent); }
.svg-node.on rect.body, .svg-node.on circle.body { stroke: var(--accent); stroke-width: 3; }
.svg-node.exp rect.body, .svg-node.opt circle.body { stroke-dasharray: 5 4; }
.svg-node:focus-visible { outline: none; }
.svg-node:focus-visible rect.body, .svg-node:focus-visible circle.body { stroke: var(--signal); stroke-width: 3; }
.n-title { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.04em; }
.n-sub { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.ring-label { fill: var(--ink-2); font-size: 12.5px; font-style: italic; }
.dash { fill: none; stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.base rect { fill: var(--surface-2); }
.arrowhead { fill: var(--accent); }

/* Flow */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { flex: 1 1 200px; min-width: 0; max-width: 340px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; align-items: center; }
.legend svg { vertical-align: middle; }
.lanes { display: flex; flex-direction: column; gap: 10px; }
.lane { padding: 12px 14px 8px; border-left: 6px solid var(--lc); }
.lane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--lc); color: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 16px; flex: none; align-self: center; }
.lane-name { font-family: var(--f-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: 0.03em; }
.lane-q { color: var(--ink-2); font-size: 14px; }
.lane-count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); }
.lane-track { margin-top: 2px; }
.lane-track svg { display: block; }
.lane details { margin: 4px 0 2px; font-size: 13.5px; color: var(--ink-2); }
.lane summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.lane summary:hover { color: var(--ink); }
.lane dl { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 4px; }
.lane dt { color: var(--muted); font-size: 12.5px; }
.lane dd { margin: 0; min-width: 0; }
.st { cursor: pointer; }
.st .hit { fill: transparent; }
.st .ring-sel { fill: none; stroke: transparent; stroke-width: 2.5; }
.st.sel .ring-sel { stroke: var(--signal); stroke-width: 3; }
.st.need .ring-sel { stroke: var(--accent); stroke-dasharray: 3 3; }
.st.route .ring-sel { stroke: var(--accent); }
.st.dim { opacity: 0.18; }
.st-label { font-family: var(--f-mono); font-size: 11.5px; fill: var(--ink-2); }
.st.sel .st-label { fill: var(--ink); font-weight: 600; }
.st:focus-visible { outline: none; }
.st:focus-visible .ring-sel { stroke: var(--signal); }

/* Lifecycle */
.state rect.body { rx: 6px; }
.state.terminal rect.body { stroke-width: 3; }
.state .s-label { font-family: var(--f-mono); font-size: 12.5px; text-anchor: middle; }
.edge { fill: none; stroke: var(--ink-2); stroke-width: 1.7; }
.edge.back { stroke: var(--signal); }
.edge.end { stroke: var(--muted); }
.edge.ctrl { stroke: var(--l-lifecycle); stroke-dasharray: 5 4; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.edge-g.on .edge { stroke-width: 3.5; stroke: var(--accent); }
.edge-g:hover .edge { stroke-width: 3; }
.bracket { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.bracket-tick { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 4; }
.bracket-label { fill: var(--muted); font-size: 12px; font-style: italic; }

/* Tables */
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th { text-align: left; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--surface); }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--surface-2); }
table.data tr.on td { background: var(--accent-soft); }
td.key { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
td.diff { background: var(--signal-soft); }
.table-wrap { max-height: 70vh; overflow: auto; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sev { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 0 7px; border-radius: 999px; font-weight: 600; }
.sev.HIGH { background: var(--bad-soft); color: var(--bad); } .sev.MED { background: var(--warn-soft); color: var(--warn); } .sev.LOW { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
select.pick { padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; max-width: 100%; }

/* Roles */
.matrix td { min-width: 120px; }
.matrix td:first-child { min-width: 170px; }
.ichips { display: flex; flex-wrap: wrap; gap: 4px; }
.ichip { border: 1px solid var(--line); border-left: 4px solid var(--lc, var(--line-2)); background: var(--surface); border-radius: 4px; padding: 1px 6px; font-family: var(--f-mono); font-size: 11.5px; cursor: pointer; color: var(--ink); }
.ichip:hover { border-color: var(--accent); border-left-color: var(--lc, var(--accent)); }
.role-name { font-weight: 600; }
.role-meta { color: var(--muted); font-size: 12px; }

/* Chain */
.chain-svg svg { display: block; min-width: 860px; width: 100%; height: auto; }
.cnode rect.body { rx: 6px; }
.cnode.root rect.body { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.c-slug { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.c-stage { fill: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.c-count { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.cedge { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.cedge.hot { stroke: var(--accent); stroke-width: 2.5; }
.bar-h { fill: var(--bad); } .bar-m { fill: var(--warn); } .bar-l { fill: var(--line-2); }

/* Progress */
.rail { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 560px) { .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.step-card { padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; cursor: pointer; }
.step-card:hover { border-color: var(--line-2); }
.step-card .sc-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: 0.03em; }
.state-pill { align-self: start; font-family: var(--f-mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; }
.state-pill.done { background: var(--ok-soft); color: var(--ok); }
.state-pill.open { background: var(--signal-soft); color: var(--signal); }
.state-pill.todo { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line-2); }
.sc-meta { color: var(--ink-2); font-size: 13px; }
.chart svg { display: block; width: 100%; height: auto; min-width: 560px; }
.ax { stroke: var(--line); stroke-width: 1; }
.ax-label { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.bar-label { font-family: var(--f-mono); font-size: 12px; fill: var(--ink-2); }
.rbar { cursor: pointer; }
.rbar:hover .rb-bg { fill: var(--surface-2); }
.rb-bg { fill: transparent; }
.rb-h { fill: var(--bad); } .rb-m { fill: var(--warn); } .rb-l { fill: var(--line-2); } .rb-r { fill: none; stroke: var(--line-2); stroke-dasharray: 3 2; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.tl-day { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; margin: 14px 0 4px; color: var(--ink); }
.tl-item { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; border: 0; background: none; text-align: left; padding: 5px 0; cursor: pointer; width: 100%; }
.tl-item::before { content: ""; width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--surface); border: 2px solid var(--accent); }
.tl-item:hover span, .tl-item.on span { color: var(--accent); }
.tl-item span { color: var(--ink-2); font-size: 14px; }
.open-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.open-list ul { margin: 4px 0 0; padding-left: 16px; display: grid; gap: 2px; }

/* Inspector */
.inspector { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.insp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.insp-close { display: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1; }
.insp-title { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.1; text-transform: none; word-break: break-word; }
.insp-title.mono { font-family: var(--f-mono); font-size: 18px; text-transform: none; }
.insp-body { display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.insp-body h4 { margin: 0 0 3px; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.insp-body p { margin: 0; }
.insp-body .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.insp-body ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.gap-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.gap-item .gid { font-family: var(--f-mono); font-size: 12px; }
.gap-item p { grid-column: 1 / -1; color: var(--ink-2); font-size: 13px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
@media (min-width: 1100px) {
  .inspector { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - var(--top-h) - 32px); overflow: auto; align-self: start; }
}
@media (max-width: 1099.98px) {
  .inspector { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 72vh; overflow: auto; border-radius: 12px 12px 0 0; border-width: 1px 0 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18); transform: translateY(105%); transition: transform .25s ease; }
  .inspector.open { transform: none; }
  .insp-close { display: inline-grid; place-items: center; }

build's lease record","proof":"the transition record and the lease record","then":"Deploy","needsRefs":["test.recommend"],"thenRefs":[]}]},{"tag":"deploy","title":"Deploy: is it landed?","enters":"**Enters** at the Test-to-Deploy transition, with a current verdict.","exits":"**Exits** when: - the build is landed and recorded; - its major decisions' rows are in the decision log at the landed SHA; - its dependents are notified; - the card's terminal snapshot is committed; - its leases are released and its mailbox pruned.","items":[{"tag":"deploy.current","actor":"command","kind":"command","role":"","needs":"—","does":"checks that the verdict's tree equals the prepared merge on the current tip, or under `verdict.tree: build-tip`, the build's tip","proof":"the comparison record","then":"current → `deploy.mandate`; stale → Test","needsRefs":[],"thenRefs":["deploy.mandate"]},{"tag":"deploy.mandate","actor":"command","kind":"command","role":"","needs":"`deploy.current`","does":"checks the landing's authority: the request's mandate under `plan-only`; under `three-gates` and `every-stage`, the disposition of the owner's landing gate, the breakpoint before this item","proof":"the intake record, or the gate's witness","then":"`deploy.parents`","needsRefs":["deploy.current"],"thenRefs":["deploy.parents"]},{"tag":"deploy.parents","actor":"command","kind":"command","role":"","needs":"`deploy.mandate`","does":"reads each parent's state, as `deps.landing` says","proof":"the parents' records","then":"every parent landed → `deploy.land`; under `test-decides`, the build's own verdict green without the parents' unlanded work → `deploy.land`; a parent unlanded or paused → holds; a parent withdrawn, or ended in planning without landing (deferred, retired, refused or answered) → as `deps.on-parent-withdrawn` says; a parent superseded or merged → the link moves to its replacement, or to the build it merged into, and the hold reads that","needsRefs":["deploy.mandate"],"thenRefs":["deploy.land","deploy.land"]},{"tag":"deploy.land","actor":"command: the lander's `--land`, run with `GOV_PUSH_MAIN_MAX_RETRIES=1`","kind":"command","role":"","needs":"`deploy.parents`","does":"pushes HEAD of the prepared merge, gated by the pre-push bar for that tree. On a race it re-prepares onto the new tip and exits without a second push","proof":"the outcome class, from the lander's exit, the pre-push hook's allow and bar records, and a probe of the remote's default branch; a landing is the remote holding the pushed SHA, and the lander's marker is optional","then":"landed and gated, the allow record naming the SHA and the bar record a real bar → `deploy.core`; landed ungated, no allow record naming the SHA or a bar record reading a stub → `deploy.core`, the landing recorded ungated until its bar is green; nothing pushed, the remote already holding the SHA → `deploy.core`, the landing recorded as already held; refused before the push, a race included → Test, which grades the merge `--land` re-prepared, or an ask for a carried commit; the remote unreachable, a failed probe included → the supervisor's retry, then an owner item; an argument → an ask on the adapter","needsRefs":["deploy.parents"],"thenRefs":["deploy.core","deploy.core","deploy.core"]},{"tag":"deploy.core","actor":"command","kind":"command","role":"","needs":"`deploy.land`","does":"starts the post-merge bar on the landed SHA unless a run for that SHA already shows, and reads its verdict keyed by that SHA (K1), as `GATE_POST_MERGE` declares","proof":"the bar's verdict for the landed SHA, copied into the landing record when read","then":"green → `deploy.record`; red → a patch build through the entry-point table's post-close row, and the close waits for its filing; refused → one re-run after a fetch, then an owner item; still running → waits, within the act's ceiling; no verdict past it → an owner item","needsRefs":["deploy.land"],"thenRefs":["deploy.record"]},{"tag":"deploy.record","actor":"command","kind":"command","role":"","needs":"`deploy.core`","does":"writes the landing record: SHA, the builds and units carried, the outcome class, the pre-push verdict or ungated, and the core re-check's verdict. It reads the lander's marker where one was written, otherwise the pushed SHA and the remote tip","proof":"the landing record","then":"`deploy.distill`","needsRefs":["deploy.core"],"thenRefs":["deploy.distill"]},{"tag":"deploy.distill","actor":"command, idempotent","kind":"command","role":"","needs":"`deploy.record`","does":"confirms that the decision-log rows `build.distill` wrote are in the log at the landed SHA","proof":"the rows at the landed SHA, joined one to one to the build's major forks","then":"`deploy.recommend`","needsRefs":["deploy.record"],"thenRefs":["deploy.recommend"]},{"tag":"deploy.recommend","actor":"command","kind":"command","role":"","needs":"`deploy.distill`","does":"scores the recommendation, signals only, since core Deploy has no producing role","proof":"the recommendation record","then":"the landing review where declared, otherwise `deploy.notify`","needsRefs":["deploy.distill"],"thenRefs":["deploy.notify"]},{"tag":"deploy.notify","actor":"command, idempotent","kind":"command","role":"","needs":"`deploy.recommend`, and the landing review where it ran","does":"posts `landed` to dependents, keyed by the landing SHA, so a repeated post is a no-op","proof":"the mailbox posts","then":"`deploy.snapshot`","needsRefs":["deploy.recommend"],"thenRefs":["deploy.snapshot"]},{"tag":"deploy.snapshot","actor":"command, idempotent","kind":"command","role":"","needs":"`deploy.notify`","does":"commits the card's terminal snapshot; an equal snapshot is a no-op","proof":"the snapshot commit","then":"`deploy.release`","needsRefs":["deploy.notify"],"thenRefs":["deploy.release"]},{"tag":"deploy.release","actor":"command, idempotent","kind":"command","role":"","needs":"`deploy.snapshot`","does":"deletes the build's lease refs, a missing ref counting as done, and closes its mailbox (`[rules]`)","proof":"the deleted refs, and the mailbox's messages in the folder","then":"`deploy.close`","needsRefs":["deploy.snapshot"],"thenRefs":["deploy.close"]},{"tag":"deploy.close","actor":"command","kind":"command","role":"","needs":"`deploy.release`","does":"records the transition","proof":"the transition record","then":"the build is closed","needsRefs":["deploy.release"],"thenRefs":[]}]},{"tag":"breakpoint","title":"The breakpoint: review at any boundary","enters":"","exits":"","items":[{"tag":"review.trigger","actor":"command","kind":"command","role":"","needs":"—","does":"records why the breakpoint fired","proof":"the policy value, the recommendation record, or the owner's request record","then":"fired → `review.pin`; not fired → the flow continues","needsRefs":[],"thenRefs":["review.pin"]},{"tag":"review.pin","actor":"command","kind":"command","role":"","needs":"`review.trigger`","does":"pins the artifact: the plan revision, the spec revisions, the commit range or the landing record","proof":"the pinned SHAs","then":"`review.lens`","needsRefs":["review.trigger"],"thenRefs":["review.lens"]},{"tag":"review.lens","actor":"reviewer, one per lens, within the fan-out bound","kind":"role","role":"reviewer","needs":"`review.pin`","does":"reviews through the lens","proof":"a computed join: each finding cites lines that exist in the pinned artifact, and carries its lens and, where one fits, a class from memory's bug-class catalogue (KN-1)","then":"`review.refute`","needsRefs":["review.pin"],"thenRefs":["review.refute"]},{"tag":"review.refute","actor":"skeptic","kind":"role","role":"skeptic","needs":"`review.lens`","does":"tries to refute each finding","proof":"a computed join: every finding has one verdict (confirmed, refuted, or unverified, the harness's `uncertain`), and each verdict names its probe and the probe's output","then":"`review.report`","needsRefs":["review.lens"],"thenRefs":["review.report"]},{"tag":"review.report","actor":"synthesizer","kind":"role","role":"synthesizer","needs":"`review.refute`","does":"merges the findings into one report, giving each confirmed finding its left-shift disposition: `class:<slug>`, `new:<slug>`, `gate:<leg>`, or, where `review.unclassed` allows it, `none` with its reason","proof":"a computed join: every confirmed finding appears in the report, under the build's `reviews/`, with one disposition. `class:` resolves to a record under `memory/gotchas/`, and `gate:` to a leg in the legs manifest. `new:` names a slug that no record held at the report's pinned SHA, or whose record carries `from:` this report and finding. `none` carries a reason, and appears only under `reason` or `owner-rules`","then":"`review.dispose`; under `owner-rules`, each `none` → an owner item first, resolved as `run.on-owner-question` says: a class or a gate named, the reason accepted, or the finding returned for a disposition, within `flow.route-backs`","needsRefs":["review.refute"],"thenRefs":["review.dispose"]},{"tag":"review.dispose","actor":"command","kind":"command","role":"","needs":"`review.report`","does":"disposes each confirmed finding by the artifact's state. On an unbuilt spec, the findings go to `review.fold`. On built work, they become new units or asks by `review.findings`. It files each `new:` class with the item that owes its record: `review.fold`'s spec writer on an unbuilt spec, and the fix unit's builder on built work. A finding that becomes an ask carries its `new:` slug, and the ask is accepted once the class record exists. Each new class carries `from:` its review and finding. It counts each class by its tag (`review.left-shift`), turns an earned gate into a patch-build intake, and files each unverified finding as `review.unverified` says","proof":"each disposition joined to its fold, unit or ask, and each `new:` slug to the item or ask that owes its record","then":"unbuilt → `review.fold`; built → released, with a follow-up round as `review.follow-up` says; an unverified finding ring documents (about 551 KB) reach agents by six routes at different times, carry no identity or rank, and state precedence only for kickoff; nothing restores their order after a context reset. Raised by the owner.","evidence":"foundations step 1, current state","owner":"dOrderedCharter"},{"id":"gap-found-02","stage":"Foundation","sev":"HIGH","gap":"The charter's practices are one-line rules without reach: no stage contract, role or review lens reads them, and an adopter's methodology has no home but free prose. Raised by the owner.","evidence":"foundations step 1, current state","owner":"dOrderedCharter"},{"id":"gap-found-03","stage":"Foundation","sev":"HIGH","gap":"Subagents load no charter (`omitClaudeMd: true`) and receive unranked charter fragments, with nothing ordering charter, role and task. Raised by the owner.","evidence":"foundations step 1, current state","owner":"dOrderedCharter"},{"id":"gap-found-04","stage":"Foundation","sev":"MED","gap":"No rule and no record governs a live instruction that conflicts with the charter. Raised by the owner.","evidence":"foundations step 1, F1-1","owner":"dOrderedCharter"},{"id":"gap-found-05","stage":"Foundation","sev":"HIGH","gap":"The charter does not teach an agent how to drive gov for its role: its generated tool lines say what each tool answers, so every agent re-derives how to start and advance the loop from many files. Raised by the owner.","evidence":"foundations step 1 continued, current state","owner":"dOrderedCharter"},{"id":"gap-found-07","stage":"Foundation","sev":"HIGH","gap":"No principle declares its enforcement: 22 of the charter's 36 practices are cited by no code file, no leg names the principle it enforces (0 of 140), and nothing stops a principle existing only as prose. Raised by the owner.","evidence":"foundations core, current state and instrument","owner":"dOrderedCharter"},{"id":"gap-found-08","stage":"Foundation","sev":"HIGH","gap":"Extensions are hand-made: factories exist for 3 of 13 extension kinds (kit adoption, builds, micro-specs), so a new kit, command, document, policy key, leg, role, workflow, hook or Skill conforms only if its author remembers every rule. Raised by the owner.","evidence":"foundations core, current state","owner":"dOrderedCharter"},{"id":"gap-found-09","stage":"Foundation","sev":"HIGH","gap":"Instructions map to almost nothing below them: tags name sections, and only the roles kit's `rules:` key joins each role to the charter's rule tags; checklist items are numbered, and no registry joins an instruction to the step, item, policy or layer it serves, so no loader can select an agent's instructions by its item. Raised by the owner.","evidence":"layers round one, `[uncovered]`; `AGENTS.md`; the roles kit's `rules:` join (the instruction layer's fold, `roles-tag-join`)","owner":"dOrderedCharter"},{"id":"gap-found-10","stage":"Foundation","sev":"HIGH","gap":"Load is mostly unbudgeted and unmeasured: six load points carry declared, gated byte budgets, the rest carry none, no load set is computed per reader, a session starts on about 30 KB of repository and user text before the card, a trigger read pulls whole documents (the four unattended guides are 216 KB), and no injected load point is measured. Raised by the owner.","evidence":"layers round one, `[current]`; `wc -c` on 2026-10-15; `tools/template-size-limits.txt` (the instruction layer's fold, `existing-budgets`)","owner":"dOrderedCharter"},{"id":"gap-found-11","stage":"Foundation","sev":"MED","gap":"Loaded text is unshaped: nothing checks that a loaded line gives direction; the charter's headings name provenance or a label, it points at a marker the agent never loads, its render provenance loads every session, and typed facts that go stale load at the top level (\"Worktrees: none yet\" beside 13 worktrees; a model name in the trailer). Raised by the owner.","evidence":"layers round one, `[charter-today]`; `AGENTS.md`","owner":"dOrderedCharter"},{"id":"gap-found-12","stage":"Foundation","sev":"HIGH","gap":"Protocols and templates are hand-written monoliths: 409 KB of guides and templates restate the flow's steps in prose, so one rule lives in a guide, a Skill and a checklist at once, and nothing renders a protocol view from the loop's, the roles' and the policies' structured definitions. Raised by the owner.","evidence":"layers round one, `[current]`; `memory/guides/`, `memory/HYGIENE.md`, `memory/TEMPLATE-SPEC.md`","owner":"dConvergedCharter"},{"id":"gap-found-13","stage":"Foundation","sev":"MED","gap":"Skills are parallel procedures: build, unattended and session-kickoff carry their own procedures (SKILL.md files of 3.6 to 18 KB, session-kickoff with 258 KB of engine files) rather than shortcutting a CLI command into the flow, and every Skill's description loads each session without a trigger contract. Raised by the owner.","evidence":"layers round one, `[current]`; `.claude/skills/`, `skills/`","owner":"dConvergedCharter"},{"id":"gap-found-14","stage":"Foundation","sev":"HIGH","gap":"Memory instructs outside the ladder: the auto-memory index (13.2 KB) loads every session under the harness's instruction framing, its feedback entries carry directives, and nothing promotes a standing directive into the instruction layer or holds memory at evidence. Gov never renders the index: the harness writes and injects it from outside the repository, so it can only be measured at session start and its directives detected. Raised by the owner.","evidence":"layers round one, `[uncovered]`; the harness's session-start injection","owner":"dOrderedCharter"},{"id":"gap-found-15","stage":"Foundation","sev":"MED","gap":"No write path for instructions: the owner changes an instruction only by editing a source or the template by hand; there is no manifest, no validating command, no recorded change and no instruction preset beyond the practice catalogue. Raised by the owner.","evidence":"layers round one, `[uncovered]`","owner":"dOrderedCharter"},{"id":"gap-found-16","stage":"Foundation","sev":"LOW","gap":"No instruction's effect is measured: nothing records which units an agent loaded, followed or broke, so text that bears no load is never found, though P11 says it must not exist. Raised by the owner.","evidence":"layers round one, `[uncovered]`","owner":"dCalibratedLens"},{"id":"gap-found-17","stage":"Foundation","sev":"HIGH","gap":"The product has no layer model: kits declare no layer, the core depends on optional kits (the reuse scout's work order carries the map's dossiers; bug classes are core since KN-1), and no layer contract exists, so an expansion cannot be added or removed mechanically. Raised by the owner. Check 27's near-match ranking and the decision log's holds-now view import memory-recall (the library round's review).","evidence":"layers round one, `[layers]`; flow-roles `[steps]`; v2 `[owed]`; runtime's layer and build since settled (dWellOiledMachine)","owner":"dOrderedCharter"},{"id":"gap-found-06","stage":"Foundation","sev":"HIGH","gap":"No tool names the next step: six adopt scripts print install hints and nothing else ends with the caller's next command, so the loop advances only by agents re-deriving it. Raised by the owner.","evidence":"foundations step 1 continued, current state","owner":"dWellOiledMachine"},{"id":"gap-flow-01","stage":"Flow","sev":"HIGH","gap":"No feature level between build and unit: the interfaces between a feature's units have no record, so a change that breaks a feature cannot be told from one that touches a unit, and re-design has no granularity but the unit. Raised by the owner.","evidence":"flow FL-D2, FL-D4, FL-D5","owner":"dIndexedDesign"},{"id":"gap-flow-02","stage":"Flow","sev":"HIGH","gap":"The decision principles that resolve unattended forks (the most feature-rich option, then the most expandable, fully recorded) are stated nowhere; M3 names feature-rich only, and nothing ranks them above the charter's adjustable practices. Raised by the owner.","evidence":"flow FL-D3, FL-D6; `memory/guides/BUILD-METHOD.md` M3","owner":"dOrderedCharter"},{"id":"gap-flow-03","stage":"Flow","sev":"MED","gap":"The plan is written up to three times (README, brief, card) and the levels of card, plan and brief are declared nowhere. Raised by the owner.","evidence":"flow Plan, current state; FL-P2, FL-P5","owner":"dRankedPlan"},{"id":"gap-flow-05","stage":"Flow","sev":"MED","gap":"Built specs are revised retroactively: a closing review's blockers can be folded into an already-built unit as a spec revision (dSweptBranches, \"the blockers folded into unit 3 rev-3\"), so the trail of what was built against which spec breaks. Raised by the owner.","evidence":"flow FL-B3; `memory/builds/dSweptBranches/README.md`","owner":"dScopedBuild"},{"id":"gap-flow-06","stage":"Flow","sev":"HIGH","gap":"No cross-build coordination: a build cannot reach the session working on a build it depends on, no message survives a session, and a dependency gates nothing. Raised by the owner.","evidence":"flow interactions FI-2, FI-5, FI-6","owner":"dDeclaredLoop"},{"id":"gap-flow-07","stage":"Flow","sev":"MED","gap":"A build whose units sit in different steps has no defined step, and a session's card does not follow its build across transitions. Raised by the owner.","evidence":"flow interactions FI-1, FI-8","owner":"dDeclaredLoop"},{"id":"gap-flow-08","stage":"Flow","sev":"MED","gap":"Landing order among builds verified at once is undefined; the first landing silently stales the others' verdicts; and no landing queue exists: the turnstile is a host-wide bar semaphore that `push-main.sh` never takes. Raised by the owner.","evidence":"flow interactions FI-7","owner":"dShippedRelease"},{"id":"gap-flow-09","stage":"Flow","sev":"MED","gap":"A merge conflict between a build and the default branch's tip has no route. Raised by the owner.","evidence":"flow interactions FI-3","owner":"dWitnessedBar"},{"id":"gap-flow-04","stage":"Flow","sev":"MED","gap":"A critical planning issue has no path: no recorded plan revision and no re-design inventory of completed work, though none has occurred in 173 builds. Raised by the owner.","evidence":"flow FL-P6 and its measurement","owner":"dRankedPlan"},{"id":"gap-flow-10","stage":"Flow","sev":"HIGH","gap":"A build can end only by landing: no withdrawn, superseded or merged terminal state exists, the owner's pause, resume and abort exist only for unattended runs (`--hold`, `--resume`, `--abort`) and supersede does not exist, and a dependent held until its parent lands (`deps.landing`) waits forever on a parent that never will. Raised by the owner.","evidence":"layers round two, `[uncovered]`; flow-roles `[steps]` Deploy; coordination `[design]`","owner":"dWellOiledMachine"},{"id":"gap-flow-11","stage":"Flow","sev":"MED","gap":"Reviews and owner gates are two mechanisms fixed to set points: each step's review sits at one item (`review.<stage>`), owner gates sit at `autonomy`'s points, and neither can be placed at another item boundary. Raised by the owner.","evidence":"layers round two, `[uncovered]`; flow `[review]`","owner":"dCalibratedLens"},{"id":"gap-flow-12","stage":"Flow","sev":"MED","gap":"The driver reasons out the review recommendation at Plan, Design, Test and Deploy, against P25 and `driver.reads`: a command scores it, and no role is named to reason it (FL-R3). Raised by the owner.","evidence":"layers round two, `[audit]`; research flow items a F2, b F-X1; roles `[map]`","owner":"dCalibratedLens"},{"id":"gap-flow-13","stage":"Flow","sev":"HIGH","gap":"Item declarations are incomplete: items carry more than one actor, many state no witness or no failure route, the records disagree (two disposition sets; checklist text against later settlements), and Deploy has no item for settled behaviours (the parent-landing hold, the core re-check, the `landed` notice). Raised by the owner.","evidence":"layers round two, `[audit]`; research flow items a F3, F4, F10 to F13, F15 to F21; b F-T1, F-T5 to F-T10, F-D1 to F-D12, F-M1, F-M3 to F-M11, F-R1, F-R3 to F-R10","owner":"dDeclaredLoop"},{"id":"gap-flow-14","stage":"Flow","sev":"HIGH","gap":"Witnesses typed by the acting agent decide routes or mandates: the tester's class routes a red, the builder's own \"checks run\" stands for acceptance, the driver's typed disposition places a request, and Maintain's agent-typed intake becomes a patch build's mandate under `patch.ratify: auto`. Raised by the owner.","evidence":"layers round two, `[audit]`; research flow items a F1, F5, F6; b F-T3, F-D7, F-D8, F-M2, F-R2, F-R7","owner":"dDeclaredLoop"},{"id":"gap-flow-15","stage":"Flow","sev":"MED","gap":"No transition table is declared: F-D settled one per level, build, feature and unit, with terminal states and backward routes as rows. The build's table is drafted in flow-steps `[transitions]`; the feature and unit tables are not, and no check yet joins each item's `Then` routes to the table both ways, each step's policy list to the keys its routes read, or each filed ask to an acceptance form. Nor does one check that each value a policy catalogues has, in each item that reads its key, a witness arm and a route, walked per preset through the table (the library round's review).","evidence":"the flow layer's fold, `withdraw-program-missing`","owner":"dDeclaredLoop"},{"id":"gap-orient-01","stage":"Orient","sev":"HIGH","gap":"Placement is unaided and unrecorded: kickoff tells the agent to derive a request's scope itself, an unattended run handed a prompt always opens a new build, and only 6 of 131 recent builds name a predecessor, so a mis-placement cannot be audited; path overlap cannot decide placement (the named predecessor ranked first 0 of 5 times). Raised by the owner.","evidence":"orientation research, routing; `skills/session-kickoff/SKILL.md:126-131`; `tools/unattended/SKILL.template.md:28-32`","owner":"dRankedPlan"},{"id":"gap-orient-02","stage":"Orient","sev":"HIGH","gap":"Nothing binds a session to its build: the route check verifies existence and pairing only, so a route to a terminal build or to another session's build lands, and a resumed route is never re-checked. Raised by the owner.","evidence":"orientation research, routing; `skills/session-kickoff/manifest-check.sh:995-1001`","owner":"dDeclaredLoop"},{"id":"gap-orient-03","stage":"Orient","sev":"HIGH","gap":"A build's position is read from typed state: a unit's step and pass come from status headers and RUN.md's phase, all 10 INPROGRESS units sat idle 8 days or more, no resolver says which pass is due, and `LIVE.md` inherits 7 of 30 stale non-terminal headers. Raised by the owner.","evidence":"orientation research, routing (c) and trust","owner":"dDeclaredLoop"},{"id":"gap-orient-04","stage":"Orient","sev":"HIGH","gap":"Orientation is exploratory: a new session spends a median 35 tool calls and 146k fresh input tokens before its first productive write, 20% of them locating the work or re-reading git state; kickoff's Step 1 orders re-deriving what the card printed (median 6 calls), and READY reaches the card in 19 of 64 sessions. Raised by the owner.","evidence":"orientation research, cost; `skills/session-kickoff/SKILL.md:49-56`","owner":"dDeclaredLoop"},{"id":"gap-orient-05","stage":"Orient","sev":"HIGH","gap":"Claims carry no freshness keys: the card's cells go stale unmarked, the replay's `now —` line read the primary tree instead of the session's worktree, and 4 of 17 run claims disagree with their RUN.md, so a session cannot tell a fresh claim from a stale one without re-deriving it. Raised by the owner.","evidence":"orientation research, trust; `skills/session-kickoff/manifest-check.sh:499`; this session's compact hook output","owner":"dDeclaredLoop"},{"id":"gap-orient-06","stage":"Orient","sev":"MED","gap":"Resuming costs more than starting: a resume caches the whole context again (median 467k fresh input tokens, against 146k for a new session), and a compaction spends a median 15 calls re-reading content. Raised by the owner.","evidence":"orientation research, cost","owner":"dDeclaredLoop"},{"id":"gap-orient-07","stage":"Orient","sev":"MED","gap":"Briefs carry pointers, not facts: briefed agents spend 15% of their calls on method documents and 15% locating, agents read their own prompt file 10 times, and `role-sha` is never compared with the role it was rendered from. Raised by the owner.","evidence":"orientation research, cost P4 and P6; `tools/hooks/agent-cap.js:55-60`","owner":"dBoundRoles"},{"id":"gap-orient-08","stage":"Orient","sev":"HIGH","gap":"Work is bound to no checklist item: about 63% of main-loop tool calls follow no protocol step, typed role agents are 4.1% of subagents, a harness branches on free text, and researcher returns are unchecked (5 of 10 ended without a final turn). Raised by the owner.","evidence":"orientation research, determinism; `tools/workflows/unattended-unit.js:348`","owner":"dDeclaredLoop"},{"id":"gap-orient-09","stage":"Orient","sev":"HIGH","gap":"Allowances escape in the field: the role-gate arm let 34 typed gate runs through though a replay of the same commands is refused, cause unknown, and the `none` and `review` write classes are declared but read by nothing. Raised by the owner.","evidence":"orientation research, determinism probes 2 and 3; `tools/hooks/scratch-guard.js:101-104`","owner":"dBoundRoles"},{"id":"gap-orient-10","stage":"Orient","sev":"MED","gap":"Memory loads unchecked: 12 of the 98 paths the auto-memory names no longer exist, and the dangling-pointer signal only reports. Raised by the owner.","evidence":"orientation research, trust; `tools/drift-audit/drift_signals.py:470`","owner":"dTendedCadence"},{"id":"gap-orient-11","stage":"Orient","sev":"HIGH","gap":"A build's card cannot be found by its build: cards are keyed by session id in the clone's git directory, so a new session, a dead process or another node never finds the card of the build it picks up, and no card exists on the remote. Raised by the owner.","evidence":"orientation research, preserve; `skills/session-kickoff/manifest-check.sh:311-316`","owner":"dDeclaredLoop"},{"id":"gap-orient-12","stage":"Orient","sev":"HIGH","gap":"A resume delivered no card: in this session the resume hooks printed only the process and wiring checks, though the replay is wired for resume; the cause is unknown. Raised by the owner.","evidence":"orientation research, preserve (this session's transcript, the resume at 16:21:01Z)","owner":"dWellOiledMachine"},{"id":"gap-orient-13","stage":"Orient","sev":"MED","gap":"The card never reaches the charter's instruction slot: hook output lands as a reminder at the hook point, subagents (`omitClaudeMd: true`) get only the route, and another harness gets nothing. Raised by the owner.","evidence":"orientation research, preserve; `tools/roles/render_agents.py:132`; https://code.claude.com/docs/en/hooks","owner":"dOrderedCharter"},{"id":"gap-orient-14","stage":"Orient","sev":"HIGH","gap":"Compaction is ungoverned: nothing persists an item's work in flight before an automatic compaction; the card the compact hook re-injects is the kickoff's, written once and never updated as the build progresses, so it points at none of the records made since; nothing sets what a session does as its window fills; and the summary is read as a source. In this session the summary alone carried 34 of the 55 facts that survived, 1 of 7 identifiers and 1 of 9 measured numbers came back, and the summary misstated one fact about the session. Raised by the owner.","evidence":"compaction experiment, results (`build/2026-10-15-build-PLAY-dClosedLoop-1-compaction-results.md`); this session's compact hook output","owner":"dWellOiledMachine"},{"id":"gap-roles-01","stage":"Roles","sev":"HIGH","gap":"Most checklist items have no role: of 70 items across the steps, 11 are performed by a role, 18 by the main session, 9 by a command and 32 by nobody; no role exists for planning, feature design, testing, deployment, maintenance or the Plan, Test, Deploy and Loop reviews. Raised by the owner.","evidence":"roles research, coverage","owner":"dBoundRoles"},{"id":"gap-roles-02","stage":"Roles","sev":"HIGH","gap":"The main session performs role functions: in 60 days it wrote or edited specs 605 times, product code 565 times, folded review findings 367 times, and wrote plans 336 times and task briefs 74 times. Raised by the owner.","evidence":"roles research, coverage P2 and P5","owner":"dBoundRoles"},{"id":"gap-roles-03","stage":"Roles","sev":"HIGH","gap":"Role limits are prose: 58 of the 59 prohibitions in role bodies name no enforcer, `writes` is a class rather than an allowance, and shell writes escape every role gate (85 from the main session and 66 from typed roles since the role arm landed). Raised by the owner.","evidence":"roles research, anatomy probe 3, coverage P4","owner":"dBoundRoles"},{"id":"gap-roles-04","stage":"Roles","sev":"HIGH","gap":"Returns between roles are uncontracted on the direct route: 48 of 48 direct-spawn returns are free text, `returns` is prose no code reads, and no subagent-stop check exists. Raised by the owner.","evidence":"roles research, prior art probe C, anatomy","owner":"dBoundRoles"},{"id":"gap-roles-05","stage":"Roles","sev":"HIGH","gap":"Exchanges between roles are retyped by the main session: 64.5% of a rendered task's bytes are typed input, 71 of 126 direct spawns carried free-text prompts, and 844 of 901 spec fold commits came from no unit. Raised by the owner.","evidence":"roles research, interactions probes 3, 4 and 7","owner":"dBoundRoles"},{"id":"gap-roles-06","stage":"Roles","sev":"HIGH","gap":"The guard shares state with what it guards: the role index and agent files sit outside every role gate, so a role holding Write could edit them, and a tree with no role index is unarmed. Raised by the owner.","evidence":"roles research, anatomy; `tools/hooks/scratch-guard.js:99-101`","owner":"dBoundRoles"},{"id":"gap-roles-07","stage":"Roles","sev":"MED","gap":"Roles go unused or double up: the orienter, reuse scout and diff reviewer had no spawn in 60 days, the reuse scout's body adds nothing, the spec writer also holds disposal, and the session-handoff template has no agent. Raised by the owner.","evidence":"roles research, coverage P6","owner":"dBoundRoles"},{"id":"gap-roles-08","stage":"Roles","sev":"MED","gap":"The work order names no checklist item, allowance or witness key, and a builder's divergence returns to \"the caller\" with no route back. Raised by the owner.","evidence":"roles research, anatomy; `tools/workflows/unattended-unit.js:269`","owner":"dBoundRoles"},{"id":"gap-roles-09","stage":"Roles","sev":"LOW","gap":"A return's harness notices cannot be recorded: the injection guard's matches on researcher returns and the MCP-failure notice lived only in the context and died at the compaction, and nothing can persist them, so `notices.record` has no mechanism for its values other than the default `none`. Raised by the owner.","evidence":"compaction experiment, results (`build/2026-10-15-build-PLAY-dClosedLoop-1-compaction-results.md`), Q07 and Q68","owner":"dBoundRoles"},{"id":"gap-roles-10","stage":"Roles","sev":"HIGH","gap":"Role definitions order re-verification and declare no trust: `tools/roles/agents/gov-spec-writer.agent.md:30` and `gov-researcher.agent.md:33` order every claim about current code verified by reading the code, `gov-session.agent.md:18` makes a sender's records background to re-verify, `memory/TEMPLATE-SPEC.md:106` orders every claim verified against source, `gov-builder.agent.md:19` orders the spec read whole, and no role declares what it may act on without re-checking or which inputs its job verifies. Raised by the owner.","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[current]`","owner":"dBoundRoles"},{"id":"gap-roles-11","stage":"Roles","sev":"HIGH","gap":"Work orders hand references, not content: 42.0% of the files directly spawned role agents read were files their parent had read before the dispatch (spec writers 46.8%, researchers 25.8%; 61 agents), and the item cycle hands the prompt writer references to its input records. Raised by the owner.","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[current]` and `[instrument]`","owner":"dBoundRoles"},{"id":"gap-roles-12","stage":"Roles","sev":"MED","gap":"Role files point at whole protocol documents: 9 of 9 carry \"Protocols — read the one whose trigger holds\", and role agents made 811 method-class reads of whole documents, among them `TEMPLATE-SPEC.md` 131, `BUILD-METHOD.md` 130, `SESSION-KICKOFF.md` 59 and `HYGIENE.md` 43. The pointers come from the charter's Protocols section, which the roles kit carries whole (`CARRIED_SECTIONS`).","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[current]` and `[instrument]`","owner":"dBoundRoles"},{"id":"gap-roles-13","stage":"Roles","sev":"MED","gap":"Nothing sees or bounds an answered call: state, locate and method calls are 12.7% of 9,980 role calls and 16.9% of the bytes role agents take in, spec writers read their own prompt file 17 times, and no hook compares a call with the work order.","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[current]` and `[instrument]`","owner":"dBoundRoles"},{"id":"gap-roles-14","stage":"Roles","sev":"MED","gap":"The roster is not sorted by layer: the settled roster lists the deployer and the maintainer beside the core roles and the reviewer's maintenance and loop lenses as core, and no check keeps core items to core roles (P28).","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[roster]`","owner":"dBoundRoles"},{"id":"gap-roles-15","stage":"Roles","sev":"MED","gap":"The role-to-step relation is typed, never derived or joined: the roles round's item map and the step definitions' Actor cells are authored tables, and nothing checks that every actor is declared and every core role acts.","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[matrix]`","owner":"dBoundRoles"},{"id":"gap-roles-16","stage":"Roles","sev":"LOW","gap":"Nothing declares what a verifying role receives: a reviewer's or skeptic's packet is whatever its prompt's author put in, so nothing keeps an author's reasoning out of it.","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[trust]`","owner":"dBoundRoles"},{"id":"gap-roles-17","stage":"Roles","sev":"LOW","gap":"A handed fact found false has no repair record and no route: only the builder's `diverged` routes back, no role's return can record a repair, and nothing files one against the producer's record.","evidence":"layer review, roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`), `[trust]`; step definitions, `[build]`","owner":"dBoundRoles"},{"id":"gap-roles-18","stage":"Roles","sev":"MED","gap":"Role items declare only part of an execution shape: the agent set per workflow and stage (`workflows.toml`), the effort per role and stage (`house/policy.toml`) and the bug-class checklist (`gotchas.py`) are declared, while the orientation template and the merge are chosen per harness or prompt, though aScoutedSeam measured that shape moves recall and cost: one checklist scout at medium matched a two-scout workflow with a judge (12 of 23) on a third of the agents, and a scout that reads a generated house index first solved 16 of 24 against 13. Raised by the owner.","evidence":"aScoutedSeam benchmark (`origin/branch/deterministic-reuse-workflows-f70c33` at `b0fe68f30`, `memory/builds/aScoutedSeam/build/2026-10-11-build-TOOL-aScoutedSeam-1-2-benchmark.md`); layer review, roles, `[owner-notes]`","owner":"dBoundRoles"},{"id":"gap-mem-01","stage":"Memory","sev":"HIGH","gap":"No memory contract: no registry declares the record kinds with their schemas, writers, readers and checks. Conventions are spread over `HYGIENE.md` (58.5 KB), the spec template, the guides and 21 memory-tree legs; review bodies, build journals and 535 of 565 prompts are free prose; README front matter is open-world, so a misspelled `parent:` is accepted silently. Raised by the owner.","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-builds.md`","owner":"dTotalRecall"},{"id":"gap-mem-02","stage":"Memory","sev":"HIGH","gap":"The decision index holds the wrong things and instructs no one: 28 of 200 rows are major decisions or features others must reuse, 0 carry a reuse instruction, nothing requires a row, recall opened the file 0 times in 121 opens, 47 rows chain a supersession or narrowing, and 79 sit within 20 characters of the 300-character cap. Raised by the owner. Nothing defines a major decision: 160 rows were added in 60 days, beside 1,829 `Decided:` trailers (the library round).","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-asks-decisions.md`","owner":"dTotalRecall"},{"id":"gap-mem-03","stage":"Memory","sev":"HIGH","gap":"No reuse instruction reaches an agent: each dossier's `## Reuse affordance` block holds the facts, but no instruction carries them, the task card's `**Reuse:**` field has no producer, and `reuse_lookup.py` solved 0 of 24 cases, ranking test helpers first with a median of 110 candidates shown. Raised by the owner. Nothing proposes an entry when a unit builds a new seam (256 specs in 67 builds say no existing seam fits), `gov:feature` marks 0 code lines, and 4 of 20 stored cards fill `**Reuse:**` (the library round).","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-map-reuse.md`; aScoutedSeam's benchmark","owner":"dTotalRecall"},{"id":"gap-mem-04","stage":"Memory","sev":"HIGH","gap":"The codebase map stores no relations: 0 caller edges, a fan-in that counts files mentioning a name, 75.5% of Python's definitions (methods, nested and private functions missing), no Markdown, TOML or JSON symbols, and 1,012 cross-language script invocations unseen. Raised by the owner.","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-map-reuse.md`","owner":"dTotalRecall"},{"id":"gap-mem-05","stage":"Memory","sev":"MED","gap":"A build's README routes only to specs: nothing routes a reader by purpose, records route only through spec regions, and 77.9% of agent-build pairs never read the README, while 96.4% of build-folder reads go past it. Raised by the owner.","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-builds.md`","owner":"dTotalRecall"},{"id":"gap-mem-06","stage":"Memory","sev":"MED","gap":"Slug and id patterns are spelled per reader: at least eleven readers in seven kits, of which a digit date breaks six and a hyphenated date ten; `BUILD_SLUG_RE` reaches one; the prose rule says two words (\"adjective-noun\") where the owner says one to three, and nothing checks either. Raised by the owner.","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-builds.md`","owner":"dTotalRecall"},{"id":"gap-mem-07","stage":"Memory","sev":"MED","gap":"Relations between builds are untyped: `parents:` alone (11 builds, 13 edges); no patch, amendment or supersession field, with supersession in prose in 110 builds; no cross-build unit edge; no cycle check. Raised by the owner.","evidence":"layer review, memory, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-builds.md`","owner":"dTotalRecall"},{"id":"gap-mem-08","stage":"Memory","sev":"MED","gap":"Code annotations have no grammar, tags or index: 0 tag lines among 91,661 comment lines, a style guide that refuses a grammar and was read once in 60 days, cited ids followed to their record within 3 calls 2.5% of the time, and not h-test`","owner":"dTotalRecall"},{"id":"gap-mem-13","stage":"Memory","sev":"HIGH","gap":"No claim makes a slug unique across clones: `check_slug_claimed` reads the local clone only, and no claim ref exists for a slug or for an ask family, so two clones that have not fetched each other can mint one slug, and with it one id.","evidence":"the fold's follow-up round, H2 and M6 (`reviews/2026-10-16-review-PLAY-dClosedLoop-1-fold-followup.md`)","owner":"dTotalRecall"},{"id":"gap-mem-14","stage":"Memory","sev":"LOW","gap":"A bug class can anchor on nothing: HYGIENE check 19 only advises on a gotcha record's dead anchor, so a class filed with one is never selected for the changes it describes.","evidence":"the fold's follow-up round, L4 (`reviews/2026-10-16-review-PLAY-dClosedLoop-1-fold-followup.md`)","owner":"dTotalRecall"},{"id":"gap-mem-15","stage":"Memory","sev":"MED","gap":"No research view: research records are found across builds only through recall, an optional component, or by file name, and 8 of 59 research returns, the research-named records bound as research in 10 builds, are cited from another build. The binding alone also covers design records, logs and registers.","evidence":"the library round's research, `build/2026-10-16-build-PLAY-dClosedLoop-1-research-library-paths.md`","owner":"dTotalRecall"},{"id":"gap-tool-01","stage":"Tooling","sev":"MED","gap":"Gate legs are declared twice: 81 of 140 legs exist only in `tools/gate-legs.json`, beside 67 `[[gate_leg]]` rows in kit packs.","evidence":"layer review, memory, `[tools]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-memory-tooling.md`","owner":"dWitnessedBar"},{"id":"gap-tool-02","stage":"Tooling","sev":"MED","gap":"Wiring is judged three ways (check-wiring, eleven `adopt-*.sh --check` legs, `govkit check`) and version lockstep four ways (check-kit-versions, check-placeholders, `govkit epoch`, check-verdict-epoch).","evidence":"layer review, memory, `[tools]`; `build/2026-10-15-build-PLAY-dClosedLoo oop-1-lexicon.md`), `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-lexicon-population.md`","owner":"dMindYourWords"},{"id":"gap-lex-02","stage":"Lexicon","sev":"HIGH","gap":"`--suggest` proposes renames that break overrides: `do_GET` to `cmd_get`, `emit` to `print`, `handle` to `run`, `get_queryset` to `read_queryset`, and `setUp` to `set_up`, which silently stops unittest calling it; P29 would hand these answers to builders. Raised by the owner.","evidence":"kit review, lexicon (`build/2026-10-15-build-PLAY-dClosedLoop-1-lexicon.md`), `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-lexicon-kit.md`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-lexicon-population.md`","owner":"dMindYourWords"},{"id":"gap-lex-03","stage":"Lexicon","sev":"HIGH","gap":"Naming is enforced only as a corpus count at the bar: nothing judges a name at commit or by name, a fixed offender plus a new one nets to zero, and landings do not hold the equality (main reads 1,088 against the pin of 1,087 since `8ddc0a482`). Raised by the owner.","evidence":"kit review, lexicon (`build/2026-10-15-build-PLAY-dClosedLoop-1-lexicon.md`), `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-lexicon-kit.md`","owner":"dMindYourWords"},{"id":"gap-lex-04","stage":"Lexicon","sev":"MED","gap":"Records are graded: 43 offenders sit under `memory/builds/` and drove the latest raise (+24 of +30 in `301a36664`), and an undeclared record extension refuses the wiring leg (this build's `.html` and `.svg`, declared dark on 2026-10-15).","evidence":"kit review, lexicon (`build/2026-10-15-build-PLAY-dClosedLoop-1-lexicon.md`), `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-lexicon-kit.md`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-lexicon-population.md`","owner":"dMindYourWords"},{"id":"gap-lex-05","stage":"Lexicon","sev":"MED","gap":"No consistency beyond verbs: 57 objects carry two or more declared acquire-family verbs (`conf` is loaded 11
