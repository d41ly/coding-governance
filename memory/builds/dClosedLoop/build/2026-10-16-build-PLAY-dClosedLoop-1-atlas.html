w, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-executor.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-02","stage":"Runtime","sev":"HIGH","gap":"Every enforcement hook fails open: no entry sets `onFailure`, all 31 failures of one burst on 2026-10-14 admitted the call, and pre-commit, commit-msg and pre-rebase trap no signal.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-hooks.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-03","stage":"Runtime","sev":"HIGH","gap":"Spawned work dies with its session: 4 background agents died with their parent, limits killed 57 agents in 16 Workflow runs and the whole fan in 10, 7 of 12 all-errored runs report `completed`, and a null becomes `committed:false` with no reason.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-spawn.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-04","stage":"Runtime","sev":"HIGH","gap":"The headless resumer skips permissions (`resume-tick.sh:385`), so with hooks failing open, a resumed session under resource exhaustion would run unguarded.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-spawn.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-05","stage":"Runtime","sev":"MED","gap":"Fan-out is bounded per prompt, not in flight: the direct budget resets on every notification, and Workflow calls and headless launches are outside the count.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-spawn.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-06","stage":"Runtime","sev":"MED","gap":"Workspaces are neither allocated nor reclaimed: 8 merged worktrees and 497 stale temp directories remain, the directories' source unattributed, and concurrent agents share one scratch directory.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-hooks.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-07","stage":"Runtime","sev":"LOW","gap":"Session hooks miss events: no matcher covers `fork`, and SubagentStop, PreCompact, PostCompact and SessionEnd are unwired.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-sessions.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-08","stage":"Runtime","sev":"LOW","gap":"Node facts go unrecorded: the `claude` binaries and their versions, node d's clock running 8 to 13 s slow, and its `autocrlf` against CI's.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-sessions.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-09","stage":"Runtime","sev":"LOW","gap":"gov wires none of the five hook events Codex ships.","evidence":"layer review, runtime, `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-sessions.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-10","stage":"Runtime","sev":"LOW","gap":"Runtime records contradict the code: the \"four-verb driver\" has 30 verbs, `/build` claims an identical spec review in both modes, an earlier design record said the spawn guard compares `role-sha`, the Facts line's placeholder \"Worktrees: none yet\", meaning no bootstrap script, reads as no worktrees while 13 exist, and a keepalive comment says the cron store dies with its session.","evidence":"layer review, runtime, `[current]`; the four runtime research returns","owner":"dWellOiledMachine"},{"id":"gap-rt-11","stage":"Runtime","sev":"MED","gap":"Codex gets no card: an override file would replace the charter, since Codex reads one instruction file per directory; its 32 KiB limit covers the whole chain it reads; and Codex has no SessionStart, so only the harness adapter's launch input can carry the card.","evidence":"the instruction layer's fold, `codex-override`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-runtime-sessions.md`","owner":"dWellOiledMachine"},{"id":"gap-rt-12","stage":"Runtime","sev":"MED","gap":"An act session loads the whole charter: `claude -p` reads `CLAUDE.md`, which imports `AGENTS.md`, so driver-scoped units such as the micro-formats reach a role's act, and nothing renders the act's own load set.","evidence":"the instruction layer's fold, `act-session-load-point`","owner":"dWellOiledMachine"},{"id":"gap-rt-13","stage":"Runtime","sev":"MED","gap":"Hook text is unregistered instruction: SubagentStart context, Stop-hook block reasons, PreToolUse deny reasons and SessionStart output are composed in code, outside the unit registry, its grammar and its budgets.","evidence":"the instruction layer's fold, `hook-injected-loads`","owner":"dWellOiledMachine"},{"id":"gap-rt-14","stage":"Runtime","sev":"HIGH","gap":"The intake hook sits outside Runtime's enforcement surface: no prompt-submit event is wired, nothing scopes it to attended-bound sessions, and no reader checks its witness when it crashes or never fires, though the intake record is the mandate to land.","evidence":"the flow layer's fold, `intake-hook-crash`, `intake-owner-scope`","owner":"dWellOiledMachine"},{"id":"gap-spine-01","stage":"Spine","sev":"HIGH","gap":"No stage model: no kit, leg, dossier, role or hook declares the stage it serves, and the loop exists only implicitly.","evidence":"design §4.1 (0 of 31 dossiers carry a stage); `tools/roles/workflows.toml` covers stages 0–7 only","owner":"dDeclaredLoop"},{"id":"gap-spine-02","stage":"Spine","sev":"HIGH","gap":"Guards read agent-written state across stages, against `[class]`.","evidence":"build §4 (write gate), design §4.4 (INPROGRESS), test §5 C (pusher-written receipt), deploy §5 C","owner":"dDeclaredLoop"},{"id":"gap-spine-03","stage":"Spine","sev":"HIGH","gap":"Attended and unattended builds run different exit contracts.","evidence":"build §3, §4 (DoD needs RUN.md)","owner":"dScopedBuild"},{"id":"gap-spine-04","stage":"Spine","sev":"MED","gap":"gov's own governance and the shipped product are one body; adopters receive partial stage contracts. (main loop)","evidence":"test §4, deploy §4; `.claude/rules/product.md`","owner":"dConvergedCharter"},{"id":"gap-spine-05","stage":"Spine","sev":"MED","gap":"Protocol volume: guides 301 KB, runbook 163 KB, unattended guides about 216 KB. (main loop)","evidence":"maintain instrument 2; `wc -c` of `memory/guides/`","owner":"dConvergedCharter"},{"id":"gap-spine-06","stage":"Spine","sev":"HIGH","gap":"No single answer to \"what is this repo's policy\": per-repo configuration spans at least eight surfaces holding about 160 keys, owner choices mixed with kit mechanics. Added after round 4. (main loop)","evidence":"design-rounds R4; five dotfile confs hold 138 keys","owner":"dDeclaredLoop"},{"id":"gap-conc-01","stage":"Spine","sev":"HIGH","gap":"Cross-build and cross-node overlap is advisory: the probe always returns 0 and sees only pushed refs; no unit or path claim exists.","evidence":"build §4, design §4.2 (41 pairs across 22 build pairs)","owner":"dDeclaredLoop"},{"id":"gap-conc-02","stage":"Spine","sev":"MED","gap":"Claims never age, name a user rather than a fleet tag, and cover unattended runs only; slug uniqueness is checked against local history only.","evidence":"plan §4 (8 of 17 held, 17 of 17 user names)","owner":"dDeclaredLoop"},{"id":"gap-conc-03","stage":"Spine","sev":"MED","gap":"`[isolate]` has no mechanism: harness passes share one worktree and meet git's index lock.","evidence":"build §4","owner":"dWellOiledMachine"},{"id":"gap-plan-01","stage":"Plan","sev":"HIGH","gap":"No priority, order or dependency record across builds and asks.","evidence":"plan §4 (absent; TOOL-aBoundedVerdict-7 DEFERRED)","owner":"dRankedPlan"},{"id":"gap-plan-02","stage":"Plan","sev":"HIGH","gap":"Triage is never drained: 435 of 521 live asks unlabelled; 297 deferred onto one owner-triage ask open since 2026-10-05; no role owns triage.","evidence":"plan §4","owner":"dRankedPlan"},{"id":"gap-plan-03","stage":"Plan","sev":"HIGH","gap":"The asks pipeline is not the real intake: 165 of 167 builds came from prompts, and a prompt yields a one-build brief, never a plan.","evidence":"plan §2, §4","owner":"dRankedPlan"},{"id":"gap-plan-04","stage":"Plan","sev":"HIGH","gap":"Nothing reviews a plan, a backlog or a priority order.","evidence":"plan §4","owner":"dRankedPlan"},{"id":"gap-plan-05","stage":"Plan","sev":"HIGH","gap":"Dormant work is labelled, never disposed: 21 of 25 live builds dormant.","evidence":"plan §4; maintain instrument 1","owner":"dRankedPlan"},{"id":"gap-plan-06","stage":"Plan","sev":"MED","gap":"Most OPEN asks are not ready to build: 94 of 218 grade `no`, 132 lack an acceptance.","evidence":"plan §4","owner":"dRankedPlan"},{"id":"gap-plan-07","stage":"Plan","sev":"MED","gap":"The brief is gated only for units a run built; attended briefs are stated.","evidence":"plan §4","owner":"dRankedPlan"},{"id":"gap-design-01","stage":"Design","sev":"HIGH","gap":"No record holds an architecture above one unit; the map is an inventory.","evidence":"design §4.1","owner":"dDeclaredLoop"},{"id":"gap-design-02","stage":"Design","sev":"HIGH","gap":"Design conflicts between builds are invisible: 25 non-registry shared paths between live specs, 21 with an INPROGRESS side.","evidence":"design §4.2","owner":"dIndexedDesign"},{"id":"gap-design-03","stage":"Design","sev":"HIGH","gap":"Design review is off by default: 3 of 173 builds declare an audit; 503 of 989 Tier-2 specs unaudited.","evidence":"design §4.3","owner":"dIndexedDesign"},{"id":"gap-design-04","stage":"Design","sev":"HIGH","gap":"The hand-off to Build ignores design state: a FORKED unit at INPROGRESS is admitted.","evidence":"design §4.4 (TOOL-dNarrowedAnchor-1)","owner":"dIndexedDesign"},{"id":"gap-design-05","stage":"Design","sev":"MED","gap":"Nothing checks that a spec's reuse audit is true; 142 of 978 cite no probe. The audit's outcome is prose: the hygiene check admits three phrasings of a new seam, while the reuse-line trigger reads one (236 specs carry the exact phrase, 256 one of two) (the library round's review).","evidence":"design §4.5","owner":"dIndexedDesign"},{"id":"gap-design-06","stage":"Design","sev":"MED","gap":"Rejected design candidates are unchecked; 95 of 978 Tier-2 specs record none.","evidence":"design §4.6","owner":"dIndexedDesign"},{"id":"gap-design-07","stage":"Design","sev":"MED","gap":"The reuse stage is neither enforced nor recorded, and research has no harness (7 research records in 173 builds). A 2026-10-16 count finds 59 research-named records bound as research, in 10 builds; the binding alone covers 179 records, design records and logs among them.","evidence":"design §4.7, §4.8","owner":"dIndexedDesign"},{"id":"gap-design-08","stage":"Design","sev":"MED","gap":"Audits never come back clean: 0 of 254, 170 BLOCKED; nothing measures whether specs reach review short of their bar or the bar moves. (main loop)","evidence":"design §4.3","owner":"dCalibratedLens"},{"id":"gap-design-09","stage":"Design","sev":"LOW","gap":"Sub-spec agreement, tier assignment and unpushed specs are prose or invisible.","evidence":"design §4.9–4.12","owner":"dIndexedDesign"},{"id":"gap-build-01","stage":"Build","sev":"HIGH","gap":"Scope is not bound to the unit: 120 of 584 unit-attributed product commits touched files outside their unit (42 of 582 at kit granularity).","evidence":"build §4","owner":"dScopedBuild"},{"id":"gap-build-02","stage":"Build","sev":"HIGH","gap":"The attended closing review is unenforced: 29 of 59 attended builds with a CLOSED unit carry one, against 86 of 89 unattended.","evidence":"build §4","owner":"dScopedBuild"},{"id":"gap-build-03","stage":"Build","sev":"MED","gap":"Bash and PowerShell product writes escape the write gate.","evidence":"build §4","owner":"dScopedBuild"},{"id":"gap-build-04","stage":"Build","sev":"LOW","gap":"The per-pass bug-class checklist is unverified, and agents a harness spawns are uncounted.","evidence":"build §4","owner":"dScopedBuild"},{"id":"gap-test-01","stage":"Test","sev":"HIGH","gap":"Kit self-tests, 70 of 140 legs and 23,494 s of 28,066 s summed maxima, are on no pre-landing path.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-02","stage":"Test","sev":"HIGH","gap":"The binding verdict is one node's bypassable hook; remote CI blocks nothing; the default branch reds memory hygiene today.","evidence":"test §4; maintain instrument 4","owner":"dWitnessedBar"},{"id":"gap-test-03","stage":"Test","sev":"HIGH","gap":"Adopters get no product-test contract: no test levels, selection, or flake policy; their manifest starts empty.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-04","stage":"Test","sev":"MED","gap":"Flakes: one timeout retry only, no quarantine or flake record. The bar reports nondeterminism only for a cached-green leg a reuse run samples, which Test's invocation never draws, and it has no mode that re-runs a red leg on the same tree.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-05","stage":"Test","sev":"MED","gap":"A green is not shared across nodes: the stamp is local and no green ref exists.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-06","stage":"Test","sev":"MED","gap":"\"A gate never seen red is not a gate\" has no recorder.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-07","stage":"Test","sev":"MED","gap":"The pre-commit leg list is hand-named.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-08","stage":"Test","sev":"MED","gap":"Cost evidence is thin: 21 legs have no ceiling evidence, all from one node, and no whole-bar wall time is recorded (records claim 4–7 h).","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-test-09","stage":"Test","sev":"LOW","gap":"A stale README example, 8 unguarded held legs, and a PowerShell scan on no leg.","evidence":"test §4","owner":"dWitnessedBar"},{"id":"gap-deploy-01","stage":"Deploy","sev":"HIGH","gap":"An adopter's own release, environments, rollout, rollback and post-deploy verification are not addressed; one adopter built all of it outside gov.","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-02","stage":"Deploy","sev":"HIGH","gap":"The post-landing verdict is inert: `GATE_POST_MERGE` declared in 0 of 3 trees, `refs/gov/bar-red` absent, CI cannot publish. Its verdict sits in one last-verdict file a later landing overwrites, with no record keyed by the landed SHA.","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-03","stage":"Deploy","sev":"HIGH","gap":"No CI job is emitted into adopters; one adopter's six workflows never call the bar.","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-04","stage":"Deploy","sev":"HIGH","gap":"Adopter currency is unwatched: receipts 990 commits behind after six days; `update` is pull-only; no fleet register.","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-05","stage":"Deploy","sev":"MED","gap":"Outbox orders are graded by nothing (one adopter holds 16, five of them rollbacks).","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-06","stage":"Deploy","sev":"MED","gap":"Landing and release have no review, no role and no changelog.","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-07","stage":"Deploy","sev":"MED","gap":"A killed hook on Windows still lands an ungated push; hooks-path drift is only a note; the lander kit is unversioned with an undeclared dependency.","evidence":"deploy §4","owner":"dWellOiledMachine"},{"id":"gap-deploy-08","stage":"Deploy","sev":"LOW","gap":"The runbook is 163 KB of narrative under an existence-only parity check; `[isolate]` ports and the `up —` line are stated only.","evidence":"deploy §4","owner":"dShippedRelease"},{"id":"gap-deploy-09","stage":"Deploy","sev":"MED","gap":"The lander's outcomes are no interface. Exit 0 covers a gated landing, an ungated stub-vetted one and a no-op push. Exit 1 covers the refusals before the push (a mint or regen failure, a reconcile conflict, a carried commit, the tip moved, and the pre-push hook's gate-red, head-moved, signalled and precondition refusals), a landing whose marker failed, and an unreachable remote. An adapter must read lines, the hook's allow and bar records and the remote to route a landing.","evidence":"the fold's follow-up round, M2 and M3 (`reviews/2026-10-16-review-PLAY-dClosedLoop-1-fold-followup.md`)","owner":"dShippedRelease"},{"id":"gap-maint-01","stage":"Maintain","sev":"HIGH","gap":"No cadence: no declared cadence item runs on a schedule. The only scheduled actors are the OS-scheduled resume tick, the desktop durable-restart task and CI's read-only cron, and in-session cron expires after 7 days; corrected by the runtime layer's review.","evidence":"maintain §4; runtime `[current]`","owner":"dTendedCadence"},{"id":"gap-maint-02","stage":"Maintain","sev":"HIGH","gap":"Detectors without owners: 15 of 27 drift signals nonzero, most report-only, 2 dead probes.","evidence":"maintain §4, instrument 1","owner":"dTendedCadence"},{"id":"gap-maint-03","stage":"Maintain","sev":"HIGH","gap":"The governing surface only grows, and nothing prices or retires a leg, rule or bug class.","evidence":"maintain §4, instrument 2","owner":"dCalibratedLens"},{"id":"gap-maint-04","stage":"Maintain","sev":"HIGH","gap":"Records dominate the work: 1,598 of 2,827 commits in 30 days touched only `memory/`. (main loop)","evidence":"maintain instrument 3","owner":"dConvergedCharter"},{"id":"gap-maint-05","stage":"Maintain","sev":"MED","gap":"Run records and dormant builds never close: 89 live `RUN.md`, 10 non-terminal for merged work.","evidence":"maintain §4","owner":"dTendedCadence"},{"id":"gap-maint-06","stage":"Maintain","sev":"MED","gap":"The map goes stale: 28 of 31 dossiers older than their paths.","evidence":"maintain §4","owner":"dTendedCadence"},{"id":"gap-maint-07","stage":"Maintain","sev":"MED","gap":"Ratchets that should shrink do not (3 of 5), timeouts are retried and forgotten, and reaping is manual: procmon-hook only dry-runs the sweep, 44 idle processes were flagged in 60 days and 4 were killed by hand.","evidence":"maintain §4; runtime `[current]`","owner":"dTendedCadence"},{"id":"gap-maint-08","stage":"Maintain","sev":"LOW","gap":"Naming offense rate and dangling ledger pointers are report-only.","evidence":"maintain §4","owner":"dTendedCadence"},{"id":"gap-review-01","stage":"Review","sev":"HIGH","gap":"Review exists at two stages only; Plan, Test, Deploy and Maintain have none.","evidence":"every record §3","owner":"dCalibratedLens"},{"id":"gap-review-02","stage":"Review","sev":"HIGH","gap":"No review of the loop itself: no retrospective reads the loop's metrics and changes a stage contract.","evidence":"maintain §3, §4","owner":"dCalibratedLens"},{"id":"gap-review-03","stage":"Review","sev":"MED","gap":"Review cost is high: a spec audit runs 11 or 12 agents (9 when this row was written) and about 0.81 M tokens, and that cost is why audits are off by default.","evidence":"design §5 C3; agent count re-measured by the review system's research, 2026-10-15","owner":"dCalibratedLens"},{"id":"gap-review-04","stage":"Review","sev":"HIGH","gap":"Design records are audited by a unit-spec preset: the spec lenses aim at unit-spec sections, and every defect found after the runtime design's two rounds (security, cost, alternatives, assumptions, adopter migration, portability) fell outside them.","evidence":"review system `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-review-lenses.md`","owner":"dFairHearing"},{"id":"gap-review-05","stage":"Review","sev":"MED","gap":"One defect splits across items by grade: same-address pairs with different grades were merged 0 times in 110, and synthesizers named the split 29 times.","evidence":"review system `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-review-adjudication.md`","owner":"dFairHearing"},{"id":"gap-review-06","stage":"Review","sev":"MED","gap":"Twins meet different skeptics: ids are assigned by lens and batches are contiguous slices, so only 8% of same-address pairs share a skeptic, and each of the 9 verified refutations by design beside a confirmed twin sat in a different batch.","evidence":"review system `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-review-adjudication.md`","owner":"dFairHearing"},{"id":"gap-review-07","stage":"Review","sev":"MED","gap":"Proposed gates have no home: 56% of 721 name nothing and 2% a bug class, and 2 of 5 round-2 reports re-found a defect whose fix had covered the instance, not the class.","evidence":"review system `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-review-adjudication.md`","owner":"dFairHearing"},{"id":"gap-review-08","stage":"Review","sev":"LOW","gap":"Duplicates count as refuted, understating precision (0.866 pooled against 0.880 merged), and the orphan-duplicate check runs on the spec kind only.","evidence":"review system `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-review-adjudication.md`","owner":"dFairHearing"},{"id":"gap-review-09","stage":"Review","sev":"LOW","gap":"Review records contradict the code: REVIEW-PROTOCOL.md lists retired lenses, allows three to six and calls skeptics default-refute; agent-cap.js says tier2-review has four lenses; the synthesizer's role says it is handed confirmed findings only.","evidence":"review system `[current]`; `build/2026-10-15-build-PLAY-dClosedLoop-1-research-review-adjudication.md`","owner":"dFairHearing"},{"id":"gap-review-10","stage":"Review","sev":"MED","gap":"Left-shift has no witness: 724 of 907 confirmed findings in the 36 review appendices with a classes column carry no class and no disposition, the harness falls back to bare `C<n>` labels, and 13 of 124 class records cite the review that filed them.","evidence":"the library round's research, `build/2026-10-16-build-PLA ld's own commits introduced stands. `core.bypass`'s default rests on an interpretation of the owner's K1 answer that awaits confirmation."},{"date":"2026-10-14","what":"after the flow walk's Plan stage","detail":"after the flow walk's Plan stage (`build/2026-10-14-build-PLAY-dClosedLoop-1-flow.md`): builds run unattended by default past Plan, so `autonomy`'s default and the `standard` preset's value move to `plan-only`; the owner's plan ratification is the mandate. A critical planning issue is a recorded plan revision followed by a re-design that preserves completed work."},{"date":"2026-10-14","what":"after the flow walk's Design stage","detail":"after the flow walk's Design stage: P17 and P18 are added; the preset `autonomous` is renamed `guarded`; `design.forks` and `design.reentry` join the catalogue and the presets; the charter's order ranks the core, then the decision principles, then the practices; four owner-raised `gap-flow-*` gaps are owned by dOrderedCharter, dRankedPlan and dIndexedDesign."},{"date":"2026-10-14","what":"after the flow walk's Build stage","detail":"after the flow walk's Build stage: P19 is added; `review.findings` joins the catalogue and the presets; dScopedBuild freezes built specs and disposes every closing-review finding as new units, owning `gap-flow-05`."},{"date":"2026-10-14","what":"after the flow walk's Test stage","detail":"after the flow walk's Test stage: `verdict.tree`, `verdict.red-route` and `tests.landing-levels` join the catalogue and the presets; Test verifies the prepared merge, so one bar serves Test and the landing."},{"date":"2026-10-14","what":"after the flow walk's Deploy stage","detail":"after the flow walk's Deploy stage: `build.closes` and `release.cadence` join the catalogue and the presets; a build closes at landing by default, and Deploy's release is recorded per SHA across landings; gov's kits reach adopters as tagged releases cut on a cadence."},{"date":"2026-10-14","what":"after the flow walk's Maintain stage","detail":"after the flow walk's Maintain stage: `maintain.events` and `patch.ratify` join the catalogue and the presets; nothing changes tracked content outside the flow, so Maintain's safe fixes and small product changes enter at Design as patch builds; the entry points are settled."},{"date":"2026-10-14","what":"after the flow walk's Review stage","detail":"after the flow walk's Review stage: P20 is added; `review.blocks`, `review.left-shift` and `review.recommendation.source` join the catalogue and the presets; the flow walk is complete, and the chain is re-cut around it after the owner's next steps."},{"date":"2026-10-14","what":"after the flow-interactions round","detail":"after the flow-interactions round (`build/2026-10-14-build-PLAY-dClosedLoop-1-flow-interactions.md`): P21 is added; `deps.coordination`, `deps.early-build`, `deps.messaging`, `landing.order` and `card.follows` join the catalogue and the presets; four owner-raised gaps are owned by dLeasedFleet, dDeclaredLoop, dWitnessedBar and dShippedRelease."},{"date":"2026-10-14","what":"at the owner's directive that no build outside the chain is counted on","detail":"at the owner's directive that no build outside the chain is counted on (`build/2026-10-14-build-PLAY-dClosedLoop-1-coordination.md`): dLeasedFleet leaves the chain, and its leases, the mailbox and dependency coordination become dDeclaredLoop's coordination feature, with gap-conc-01, gap-conc-02 and gap-flow-06; P5 is restated; no chain build waits for a live build's close, and Maintain's run no longer rides recipe mode; the chain has ten builds."},{"date":"2026-10-14","what":"after the orientation round","detail":"after the orientation round (`build/2026-10-14-build-PLAY-dClosedLoop-1-orientation.md`): P22 to P24 are added; the build's orientation card joins the charter at the ladder's rank 1; `placement`, `placement.check`, `kickoff.runs`, `card.store`, `actions.free`, `resume.partial`, `resume.context` and `orient.budget` join the catalogue and the presets; `gap-orient-01` to `gap-orient-10` are owned by dDeclaredLoop, dRankedPlan, dOrderedCharter, dScopedBuild and dTendedCadence."},{"date":"2026-10-14","what":"adopting the researched way to preserve the card","detail":"adopting the researched way to preserve the card (orientation OR-5, dispatch 15): the remote ref is the card's truth, delivered at rank 1 through an imported per-worktree file and re-rendered by every session-start hook in the session's own tree; the clone's copy is a cache keyed by object id; `card.snapshot` joins the catalogue and the presets; `gap-orient-11` to `gap-orient-13` are owned by dDeclaredLoop and dOrderedCharter."},{"date":"2026-10-14","what":"after the owner confirmed both orientation interpretations","detail":"after the owner confirmed both orientation interpretations: the charter wins any conflict with the build's card at rank 1, and a session runs the full kickoff only when it has no saved READY card for the build and slice it is placed into."},{"date":"2026-10-14","what":"after the roles round","detail":"after the roles round (`build/2026-10-14-build-PLAY-dClosedLoop-1-roles.md`): P25 and P26 are added; `driver.reads`, `prompts.author`, `roles.retries` and `roles.no-spawn` join the catalogue and the presets; the chain gains `dBoundRoles`, the roles layer's own build, child of dDeclaredLoop, which owns `gap-roles-01` to `gap-roles-08` and takes `gap-orient-07` from dOrderedCharter and `gap-orient-09` from dScopedBuild with their units."},{"date":"2026-10-15","what":"after the flow revisit with roles","detail":"after the flow revisit with roles (`build/2026-10-15-build-PLAY-dClosedLoop-1-flow-roles.md`): the owner's request is the ratification, so the gate `autonomy` keeps at Plan is met as `plan.ratification` says; P18 gains the rule that no build parks on an unresolved fork; `plan.ratification`, `run.host`, `notify.owner`, `run.on-owner-question`, `deps.landing`, `mailbox.reads`, `review.follow-up` and `prompts.batch` join the catalogue and the presets; the session model's holes are all settled, and the units that carry them join six chain rows."},{"date":"2026-10-15","what":"after the compaction experiment","detail":"after the compaction experiment (`build/2026-10-15-build-PLAY-dClosedLoop-1-compaction-results.md`): `context.on-full` (default compact-with-card, fresh-at-boundary allowed), `context.threshold`, `card.pointers` (default every-item: the card's pointers updated as the build progresses, the owner's addition) and `notices.record` (default none, all three values allowed) join the catalogue and the presets; gap-orient-14 joins dDeclaredLoop and gap-roles-09 joins dBoundRoles; the compaction checks join `[owed]`."},{"date":"2026-10-15","what":"K1 confirmed","detail":"K1 confirmed: the reading of `core.bypass` went to the owner as a fork, and the owner chose \"the violator pays\". `with-hooks-report` stands as read in foundations `[core]`, and P16 is unchanged. dShippedRelease's lander gains a core re-check on the landed tree before it releases a build, so a core red that first appears in the landing merge still stops that build from closing."},{"date":"2026-10-15","what":"after layers round one","detail":"after layers round one (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-instruction.md`): the owner framed the product as layers; the `[layers]` section is added (capabilities, five core layers with Runtime among them, four expansions); P11 and P13 are amended to the owner's two instruction principles and the tag system, P27 and P28 are added; the ladder is renumbered with the charter at level 0 and the card at level 1; Skills are level-4 thin entries; `instructions.checks` and `instructions.edit` join the catalogue, the first in every preset, the second kept from presets; `gap-found-09` to `gap-found-17` join dOrderedCharter, dConvergedCharter and dCalibratedLens."},{"date":"2026-10-15","what":"after layers round two","detail":"after layers round two (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-flow.md`): - A build's lifecycle is five core steps, Plan to Deploy, each a program of items with declared dependencies. - Maintain and the Loop Review are cadence steps delivered with the observability expansion. - Promotion after landing is an integrations extension. - Review is a breakpoint, placeable at any item boundary. - A build ends landed, withdrawn or superseded. - P6, P7, P20 and P24 are amended. - `review.breakpoints` and `deps.on-parent-withdrawn` join the catalogue and the presets. - `gap-flow-10` to `gap-flow-14` join the register. The item audit's findings are owned as item declarations by dDeclaredLoop."},{"date":"2026-10-15","what":"after the step definitions","detail":"after the step definitions (`build/2026-10-15-build-PLAY-dClosedLoop-1-flow-steps.md`): four keys join the catalogue and the presets: - `review.design.rounds`, one round by default; - `review.design.round-count`; - `review.unverified`, an ask by default; - `tests.without-cadence`, running at landing by default."},{"date":"2026-10-15","what":"after the roles layer's review","detail":"after the roles layer's review (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-roles.md`): - P29 is added: a role acts on what its work order hands it, and verifies only what its job is to verify. - `roles.trust`, `roles.answered-calls`, `roles.verifier-context` and `roles.on-contradiction` join the catalogue and the presets. - dBoundRoles' roster is sorted into core and expansion roles. Its units gain the trust mechanism, the derived role-by-step matrix and role metrics. - `gap-roles-10` to `gap-roles-17` join dBoundRoles."},{"date":"2026-10-15","what":"opening round four","detail":"opening round four: - `gap-roles-18` joins dBoundRoles: role items declare no execution shape. - `[owed]` gains the roles layer's mechanical shape, which the owner set for a later revisit."},{"date":"2026-10-15","what":"after the memory layer's review","detail":"after the memory layer's review (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-memory.md`): - P30 is added: memory is declared once and written through one door. - The chain gains dTotalRecall, the memory layer's own build and a child of dDeclaredLoop. It owns the memory contract and Knowledge's stores. - Eight keys join the catalogue and the presets: `reuse.delivery`, `annotations.grammar`, `builds.agent-root`, `asks.acceptance`, `builds.slug-words`, `builds.slug-style`, `builds.slug-date` and `lexicon.pin`. - `gap-mem-01` to `gap-mem-11` join dTotalRecall. `gap-tool-01` to `gap-tool-06` join dWitnessedBar, dShippedRelease, dDeclaredLoop and dConvergedCharter."},{"date":"2026-10-15","what":"after the lexicon kit's review","detail":"after the lexicon kit's review (`build/2026-10-15-build-PLAY-dClosedLoop-1-lexicon.md`): - The chain gains dMindYourWords, the lexicon's own build and a child of dTotalRecall. It takes the lexicon pin and `gap-mem-10` from dTotalRecall. - `lexicon.forced`, `lexicon.at-commit`, `lexicon.drift` and `lexicon.packs` join the catalogue and the presets. - `gap-lex-01` to `gap-lex-07` join dMindYourWords."},{"date":"2026-10-15","what":"after the runtime layer's review","detail":"after the runtime layer's review (`build/2026-10-15-build-PLAY-dClosedLoop-1-layer-runtime.md`) and its two Tier-2 rounds: - The chain gains dWellOiledMachine, Runtime's own build and a child of dBoundRoles and dTotalRecall (RT-3). - From dDeclaredLoop it takes the `next` verb and its micro-format, the owner's pause, resume, withdraw and supersede, the executor's launch, the resume card fix and the compact hook, with `gap-found-06`, `gap-flow-10`, `gap-tool-03`, `gap-orient-12` and `gap-orient-14`. - From dScopedBuild it takes the worktree mechanism and the commit queue, with `gap-conc-03`. - From dShippedRelease it takes lander hardening, with `gap-deploy-07`. - dDeclaredLoop keeps the position function, which gains a closed answer set. - dScopedBuild and dTendedCadence gain dWellOiledMac <script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('atlas-data').textContent);
  var NS = 'http://www.w3.org/2000/svg';

  // ---------- helpers ----------
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function md(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);

      if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    if (html != null) e.innerHTML = html;
    return e;
  }
  function sv(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) e.textContent = text;
    return e;
  }
  function memo(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function onActivate(node, fn) {
    node.addEventListener('click', fn);
    node.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(ev); } });
  }
  function svgButton(g, label, fn) { g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', label); onActivate(g, fn); }

  // ---------- derived indexes ----------
  var STEP_META = {
    entry: { badge: '0' }, plan: { badge: '1' }, design: { badge: '2' }, build: { badge: '3' },
    test: { badge: '4' }, deploy: { badge: '5' }, breakpoint: { badge: 'R' }, lifecycle: { badge: 'C' }

  var ITEMS = {}, STEP_OF = {}, NEEDED_BY = {}, ROUTED_FROM = {};
  D.steps.forEach(function (s) {

  });
  D.steps.forEach(function (s) {
    s.items.forEach(function (it) {
      it.needsRefs.forEach(function (t) { (NEEDED_BY[t] = NEEDED_BY[t] || []).push(it.tag); });
      it.thenRefs.forEach(function (t) { (ROUTED_FROM[t] = ROUTED_FROM[t] || []).push(it.tag); });

  var BUILD = {}; D.chain.forEach(function (c) { BUILD[c.build] = c; });
  var GAP = {}; D.gaps.forEach(function (g) { GAP[g.id] = g; });
  var SEV_ORDER = { HIGH: 0, MED: 1, LOW: 2 };
  var MAX_GAPS = Math.max.apply(null, D.chain.map(function (c) { return c.gaps.length; }).concat([1]));
  var REVIEW = {}; D.reviews.forEach(function (r) { REVIEW[r.file] = r; });

  function itemChip(tag) {
    var s = STEP_OF[tag];

  }
  function buildChip(name) {
    var b = el('button', { class: 'ichip', type: 'button' }, esc(name));
    b.addEventListener('click', function () { select('build', name); });
    return b;
  }

  // ---------- inspector ----------

  var current = {};

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') insp.classList.remove('open'); });

  var activeView = 'overview';
  function select(type, id, quiet) {

    ({ layer: showLayer, item: showItem, state: showState, edge: showEdge, build: showBuild, review: showReview, revision: showRevision, gap: showGap, role: showRole })[type](id);

  function showLayer(tag) {
    var L = LAYER[tag];
    var kits = D.kits.filter(function (k) { return new RegExp('\\b' + tag + '\\b', 'i').test(k.layer.split(/[:;]/)[0]); });
    var prog = D.progress.find(function (p) { return p.layer === tag; });
    var nodes = [el('p', null, '<span class="kind ' + esc(L.kind) + '">' + esc(L.kind) + '</span>'), block('What it is', md(L.what))];
    if (kits.length) {
      var ul = el('ul');
      kits.forEach(function (k) { ul.appendChild(el('li', null, '<strong>' + md(k.kit) + '</strong> · ' + md(k.layer) + ' <span class="muted">(' + esc(k.kind) + ')</span>')); });

        b.addEventListener('click', function () { select('review', f); }); rv.appendChild(b);
      });
      nodes.push(block('Design records', prog.records.map(function (r) { return '<code>' + esc(r) + '</code>'; }).join('<br>')));

      c.innerHTML = '<span class="sc-name">' + esc(l.tag) + '</span><span class="state-pill todo">not yet designed</span><span class="sc-meta">an expansion</span>';
      c.addEventListener('click', function () { select('layer', l.tag); });
      rail.appendChild(c);
    });
    v.appendChild(rail);
    var two = el('div', { class: 'two-col' });
    var ch = el('div', { class: 'panel box chart scroll-x' });
    ch.appendChild(el('div', { class: 'eyebrow', text: 'Findings per review: high, medium, low, then refuted' }));
    ch.appendChild(reviewChart());
    two.appendChild(ch);
    var op = el('div', { class: 'panel box' });
    op.appendChild(el('div', { class: 'eyebrow', text: "The library side's round owes" }));
    var ol = el('ul', { class: 'open-list' });
    D.open.forEach(function (o) {
      var li = el('li', null, '<strong>' + md(o.label) + '</strong>' + (o.text ? ' ' + md(o.text) : ''));
      if (o.items.length) { var u = el('ul'); o.items.forEach(function (x) { u.appendChild(el('li', null, md(x))); }); li.appendChild(u); }
      ol.appendChild(li);
    });
    op.appendChild(ol); two.appendChild(op);
    v.appendChild(two);
    var tl = el('div', { class: 'panel box' });
    tl.appendChild(el('div', { class: 'eyebrow', text: 'The architecture\'s revisions, ' + D.timeline.length + ' so far' }));
    var list = el('ul', { class: 'timeline' }), day = null;
    D.timeline.forEach(function (t, i) {
      if (t.date !== day) { day = t.date; list.appendChild(el('li', { class: 'tl-day', text: t.date })); }
      var li = el('li'); var b = el('button', { class: 'tl-item', type: 'button', 'data-rev': String(i) }, '<span>' + md(cap(t.what)) + '</span>');
      b.addEventListener('click', function () { select('revision', i); });
      li.appendChild(b); list.appendChild(li);
    });
    tl.appendChild(list); v.appendChild(tl);
  };
  function reviewChart() {
    var rows = D.reviews.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.scope < b.scope ? -1 : 1); });
    var max = Math.ceil(Math.max.apply(null, rows.map(function (r) { return r.raw; })) / 10) * 10;
    var L = 132, Wd = 560, RH = 24, top = 10, H = top + rows.length * RH + 30, sc = (Wd - L - 16) / max;
    var svg = sv('svg', { viewBox: '0 0 ' + Wd + ' ' + H, role: 'img', 'aria-label': 'Confirmed and refuted findings per review' });
    for (var t = 0; t <= max; t += 10) {
      var x = L + t * sc;
      svg.appendChild(sv('line', { x1: x, y1: top - 4, x2: x, y2: top + rows.length * RH, class: 'ax' }));
      svg.appendChild(sv('text', { x: x, y: top + rows.length * RH + 16, 'text-anchor': 'middle', class: 'ax-label' }, String(t)));
    }
    rows.forEach(function (r, i) {
      var y = top + i * RH, g = sv('g', { class: 'rbar', 'data-review': r.file });
      g.appendChild(sv('rect', { x: 0, y: y, width: Wd, height: RH, class: 'rb-bg' }));
      g.appendChild(sv('text', { x: L - 8, y: y + 16, 'text-anchor': 'end', class: 'bar-label' }, r.scope));
      var x = L;
      [['high', 'rb-h'], ['medium', 'rb-m'], ['low', 'rb-l']].forEach(function (p) {
        var w = r[p[0]] * sc; if (w > 0) { g.appendChild(sv('rect', { x: x, y: y + 5, width: Math.max(w - 1, 1), height: RH - 10, class: p[1] })); x += w; }
      });
      if (r.refuted) g.appendChild(sv('rect', { x: x + 0.5, y: y + 5.5, width: Math.max(r.refuted * sc - 1, 1), height: RH - 11, class: 'rb-r' }));
      g.appendChild(sv('title', null, r.scope + ': ' + r.confirmed + ' confirmed (' + r.high + ' high), ' + r.refuted + ' refuted'));
      svgButton(g, 'Review ' + r.scope, function () { select('review', r.file); });
      svg.appendChild(g);
    });
    return svg;
  }
  function showReview(file) {
    var r = REVIEW[file];
    var dl = el('dl', { class: 'kv' });
    [['Kind', r.kind + ', round ' + r.round + ', ' + r.intensity], ['Verdict', r.verdict], ['Findings', r.raw + ' raw · ' + r.confirmed + ' confirmed · ' + r.refuted + ' refuted'],
     ['By severity', r.blocker + ' blocker · ' + r.high + ' high · ' + r.medium + ' medium · ' + r.low + ' low'], ['Cost', r.agents + ' agents · ' + Math.round(r['out-tokens'] / 1000) + 'k output tokens'],
     ['Record', '<code>' + esc(r.file) + '</code>']].forEach(function (p) { dl.appendChild(el('dt', { text: p[0] })); dl.appendChild(el('dd', null, p[0] === 'Record' ? p[1] : esc(p[1]))); });
    inspector('Tier-2 review · ' + r.date, r.scope, true, [dl]);
  }
  function showRevision(i) {
    var t = D.timeline[i];
    inspector('Revision · ' + t.date, cap(t.what), false, [block('What changed', md(t.detail))]);
  }

  // ---------- highlight: selection, needs, routes and filters ----------
  function highlight() {
    var sel = current[activeView] || {};
    $$('.layer-card').forEach(function (b) { b.setAttribute('aria-pressed', sel.type === 'layer' && b.getAttribute('data-layer') === sel.id ? 'true' : 'false'); });
    $$('#view-overview .svg-node').forEach(function (n) { n.classList.toggle('on', sel.type === 'layer' && n.getAttribute('data-layer') === sel.id); });
    var it = sel.type === 'item' ? ITEMS[sel.id] : null;
    $$('.st').forEach(function (g) {
      var tag = g.getAttribute('data-tag'), x = ITEMS[tag];
      g.classList.toggle('sel', !!it && tag === sel.id);
      g.classList.toggle('need', !!it && it.needsRefs.indexOf(tag) >= 0);
      g.classList.toggle('route', !!it && it.thenRefs.indexOf(tag) >= 0);
      var hay = (tag + ' ' + x.actor + ' ' + x.does + ' ' + x.proof + ' ' + x.then).toLowerCase();
      var pass = (flowFilter.kind === 'all' || x.kind === flowFilter.kind) && (!flowFilter.q || hay.indexOf(flowFilter.q) >= 0);
      g.classList.toggle('dim', !pass);
    });
    $$('.edge-g').forEach(function (g) { g.classList.toggle('on', sel.type === 'edge' && g.getAttribute('data-edge') === sel.id); });
    $$('#view-lifecycle .state').forEach(function (g) { g.classList.toggle('on', sel.type === 'state' && g.getAttribute('data-state') === sel.id); });
    $$('#view-lifecycle tr[data-row]').forEach(function (tr) { tr.classList.toggle('on', sel.type === 'edge' && EDGES[sel.id] && EDGES[sel.id].rows.indexOf(+tr.getAttribute('data-row')) >= 0); });
    $$('.cnode').forEach(function (g) { g.classList.toggle('on', sel.type === 'build' && g.getAttribute('data-build') === sel.id); });
    $$('.cedge').forEach(function (p) { p.classList.toggle('hot', sel.type === 'build' && (p.getAttribute('data-from') === sel.id || p.getAttribute('data-to') === sel.id)); });
    $$('#gap-table tr[data-gap]').forEach(function (tr) { tr.classList.toggle('on', sel.type === 'gap' && tr.getAttribute('data-gap') === sel.id); });
    $$('.tl-item').forEach(function (b) { b.classList.toggle('on', sel.type === 'revision' && +b.getAttribute('data-rev') === sel.id); });
  }

  // ---------- tabs ----------
  var DEFAULTS = { overview: ['layer', 'memory'], flow: ['item', 'entry.claim'], lifecycle: ['state', 'planning'], roles: ['role', 'reviewer'], chain: ['build', 'dTotalRecall'], policies: null, progress: ['review', D.reviews.length ? D.reviews.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0].file : null] };
  var built = {};
  function show(view) {
    if (!views[view]) view = 'overview';
    activeView = view;
    $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.getAttribute('data-view') === view ? 'true' : 'false'); });
    $$('.view').forEach(function (s) { s.hidden = s.id !== 'view-' + view; });
    var host = $('#view-' + view);
    if (!built[view]) { views[view](host); host.appendChild(footer()); built[view] = true; }
    var sel = current[view];
    if (!sel) {
      var saved = memo('atlas.sel.' + view);
      if (saved) { var p = saved.split('|'); sel = { type: p[0], id: p[0] === 'revision' ? +p[1] : p[1] }; }
      else if (DEFAULTS[view] && DEFAULTS[view][1] != null) sel = { type: DEFAULTS[view][0], id: DEFAULTS[view][1] };
    }
    if (sel && valid(sel)) select(sel.type, sel.id, true);
    else { current[view] = null; inspector('Details', 'Select anything', false, [el('p', { class: 'muted' }, 'Pick a key group or search the catalogue. Layers, items, states, builds and reviews open their records here.')]); highlight(); }
    memo('atlas.view', view);
  }
  function valid(s) {
    return (s.type === 'layer' && LAYER[s.id]) || (s.type === 'item' && ITEMS[s.id]) || (s.type === 'state' && POS[s.id]) || (s.type === 'edge' && EDGES[s.id]) ||
      (s.type === 'build' && BUILD[s.id]) || (s.type === 'review' && REVIEW[s.id]) || (s.type === 'revision' && D.timeline[s.id]) || (s.type === 'gap' && GAP[s.id]) ||
      (s.type === 'role' && D.roster.some(function (r) { return r.role === s.id; }));
  }
  function footer() {
    var f = el('div', { class: 'foot' });
    f.innerHTML = '<span>Derived from ' + Object.keys(D.sources).map(function (k) { return '<code>' + esc(D.sources[k]) + '</code>'; }).join(', ') + ' and the build\'s reviews.</span><span>Digest <code>' + esc(D.digest) + '</code> · latest revision ' + esc(D.latest) + '</span>';
    return f;
  }
  $$('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      var v = t.getAttribute('data-view');
      try { if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v); } catch (e) { /* a sandboxed frame may refuse history writes */ }
      show(v); window.scrollTo(0, 0);
    });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  $('#derived').textContent = 'latest revision ' + D.latest + ' · digest ' + D.digest;
  function sizeTop() { document.documentElement.style.setProperty('--top-h', $('.top').offsetHeight + 'px'); }
  window.addEventListener('resize', sizeTop); sizeTop();
  var start = location.hash.slice(1) || memo('atlas.view') || 'overview';
  show(start);
})();
</script>
