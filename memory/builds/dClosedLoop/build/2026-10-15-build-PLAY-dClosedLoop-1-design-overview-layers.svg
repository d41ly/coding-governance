<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<!--
**Serves:** research PLAY-dClosedLoop-1
-->
<title>Gov's three layers</title>
<desc>Charter instructions drive the DLG flow from Plan to Maintain, with review at any step; roles perform each step's items, and their typed returns move the build.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="600" height="120" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="42" dominant-baseline="central">1 · Charter instructions</text>
<text class="ts" x="60" y="60" dominant-baseline="central">What every session and agent loads first</text>
<g class="node c-gray" onclick="sendPrompt('Walk me through the instruction ladder, rank by rank')"><rect x="60" y="72" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="90" text-anchor="middle" dominant-baseline="central">Ladder</text><text class="ts" x="125" y="112" text-anchor="middle" dominant-baseline="central">Ranks 0 to 7</text></g>
<g class="node c-gray" onclick="sendPrompt('How does the build card sit beside the charter at rank 1?')"><rect x="202" y="72" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="267" y="90" text-anchor="middle" dominant-baseline="central">Rank 1</text><text class="ts" x="267" y="112" text-anchor="middle" dominant-baseline="central">Charter + card</text></g>
<g class="node c-gray" onclick="sendPrompt('Show me the policy catalogue and how the four presets differ')"><rect x="344" y="72" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="409" y="90" text-anchor="middle" dominant-baseline="central">Policies</text><text class="ts" x="409" y="112" text-anchor="middle" dominant-baseline="central">4 presets</text></g>
<g class="node c-gray" onclick="sendPrompt('List principles P1 to P26 with one line each')"><rect x="486" y="72" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="551" y="90" text-anchor="middle" dominant-baseline="central">Principles</text><text class="ts" x="551" y="112" text-anchor="middle" dominant-baseline="central">P1 to P26</text></g>
<line x1="340" y1="142" x2="340" y2="168" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="172" width="600" height="174" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="194" dominant-baseline="central">2 · DLG flow</text>
<text class="ts" x="60" y="212" dominant-baseline="central">Maintain feeds Plan ↻ · features enter at Plan, patches at Design</text>
<g class="node c-teal" onclick="sendPrompt('Walk me through the Plan step: its checklist, roles and witness')"><rect x="60" y="226" width="76" height="56" rx="8" stroke-width="0.5"/><text class="th" x="98" y="244" text-anchor="middle" dominant-baseline="central">Plan</text><text class="ts" x="98" y="266" text-anchor="middle" dominant-baseline="central">11 items</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the Design step: its checklist, roles and witness')"><rect x="156" y="226" width="76" height="56" rx="8" stroke-width="0.5"/><text class="th" x="194" y="244" text-anchor="middle" dominant-baseline="central">Design</text><text class="ts" x="194" y="266" text-anchor="middle" dominant-baseline="central">10 items</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the Build step: its checklist, roles and witness')"><rect x="252" y="226" width="76" height="56" rx="8" stroke-width="0.5"/><text class="th" x="290" y="244" text-anchor="middle" dominant-baseline="central">Build</text><text class="ts" x="290" y="266" text-anchor="middle" dominant-baseline="central">10 items</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the Test step: its checklist, roles and witness')"><rect x="348" y="226" width="76" height="56" rx="8" stroke-width="0.5"/><text class="th" x="386" y="244" text-anchor="middle" dominant-baseline="central">Test</text><text class="ts" x="386" y="266" text-anchor="middle" dominant-baseline="central">8 items</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the Deploy step: its checklist, roles and witness')"><rect x="444" y="226" width="76" height="56" rx="8" stroke-width="0.5"/><text class="th" x="482" y="244" text-anchor="middle" dominant-baseline="central">Deploy</text><text class="ts" x="482" y="266" text-anchor="middle" dominant-baseline="central">10 items</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the Maintain step: its checklist, roles and witness')"><rect x="540" y="226" width="76" height="56" rx="8" stroke-width="0.5"/><text class="th" x="578" y="244" text-anchor="middle" dominant-baseline="central">Maintain</text><text class="ts" x="578" y="266" text-anchor="middle" dominant-baseline="central">9 items</text></g>
<line x1="138" y1="254" x2="154" y2="254" class="arr" marker-end="url(#arrow)"/>
<line x1="234" y1="254" x2="250" y2="254" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="254" x2="346" y2="254" class="arr" marker-end="url(#arrow)"/>
<line x1="426" y1="254" x2="442" y2="254" class="arr" marker-end="url(#arrow)"/>
<line x1="522" y1="254" x2="538" y2="254" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple" onclick="sendPrompt('How does review work at each step, and what does the Loop Review change?')"><rect x="60" y="294" width="556" height="36" rx="8" stroke-width="0.5"/><text class="th" x="338" y="312" text-anchor="middle" dominant-baseline="central">Review at any step · Loop Review tunes the loop</text></g>
<line x1="340" y1="348" x2="340" y2="372" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="376" width="600" height="124" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="398" dominant-baseline="central">3 · Roles</text>
<text class="ts" x="60" y="416" dominant-baseline="central">14 bound workers · typed returns move the build ↻</text>
<g class="node c-purple" onclick="sendPrompt('What exactly may the driver do, and what may it not?')"><rect x="60" y="428" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="446" text-anchor="middle" dominant-baseline="central">Driver</text><text class="ts" x="125" y="468" text-anchor="middle" dominant-baseline="central">No role work</text></g>
<g class="node c-purple" onclick="sendPrompt('How do the orientation scout and the prompt writer keep noise out of the main session?')"><rect x="202" y="428" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="267" y="446" text-anchor="middle" dominant-baseline="central">Sidechain</text><text class="ts" x="267" y="468" text-anchor="middle" dominant-baseline="central">Scout, writer</text></g>
<g class="node c-purple" onclick="sendPrompt('Which worker performs which checklist items in each step?')"><rect x="344" y="428" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="409" y="446" text-anchor="middle" dominant-baseline="central">Workers</text><text class="ts" x="409" y="468" text-anchor="middle" dominant-baseline="central">9, one per job</text></g>
<g class="node c-purple" onclick="sendPrompt('How do the reviewer, skeptic and synthesizer work together?')"><rect x="486" y="428" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="551" y="446" text-anchor="middle" dominant-baseline="central">Review</text><text class="ts" x="551" y="468" text-anchor="middle" dominant-baseline="central">3 roles</text></g>
</svg>
