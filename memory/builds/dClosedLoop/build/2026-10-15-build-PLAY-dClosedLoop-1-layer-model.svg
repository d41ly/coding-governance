<svg width="100%" viewBox="0 0 680 414" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Gov's layers as capabilities</title>
<desc>A core cycle of Instruction, Flow, Roles and Memory runs on a Runtime base; Knowledge, Observability and Integrations plug in at declared points, and Distribution installs everything.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-purple" onclick="sendPrompt('What belongs in the Knowledge expansion, and where does it plug in?')"><rect x="40" y="30" width="176" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="128" y="50" text-anchor="middle" dominant-baseline="central">Knowledge</text><text class="ts" x="128" y="70" text-anchor="middle" dominant-baseline="central">Consulted to decide</text></g>
<g class="node c-purple" onclick="sendPrompt('What belongs in the Observability expansion, and who reads its signals?')"><rect x="252" y="30" width="176" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">Observability</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Signals for review</text></g>
<g class="node c-purple" onclick="sendPrompt('What would the Integrations expansion connect, and through which slots?')"><rect x="464" y="30" width="176" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="552" y="50" text-anchor="middle" dominant-baseline="central">Integrations</text><text class="ts" x="552" y="70" text-anchor="middle" dominant-baseline="central">Outside services</text></g>
<line x1="128" y1="88" x2="128" y2="108" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="340" y1="88" x2="340" y2="108" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="552" y1="88" x2="552" y2="108" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="40" y="112" width="600" height="132" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="132" dominant-baseline="central">Core: the practice's shape</text>
<g class="node c-teal" onclick="sendPrompt('Walk me through the instruction layer review')"><rect x="60" y="146" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="164" text-anchor="middle" dominant-baseline="central">Instruction</text><text class="ts" x="115" y="186" text-anchor="middle" dominant-baseline="central">Levels 0 to 7</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the flow layer at its highest level')"><rect x="210" y="146" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="265" y="164" text-anchor="middle" dominant-baseline="central">Flow</text><text class="ts" x="265" y="186" text-anchor="middle" dominant-baseline="central">DLG steps</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the roles layer at its highest level')"><rect x="360" y="146" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="415" y="164" text-anchor="middle" dominant-baseline="central">Roles</text><text class="ts" x="415" y="186" text-anchor="middle" dominant-baseline="central">14 workers</text></g>
<g class="node c-teal" onclick="sendPrompt('Walk me through the memory layer: what is core trail and what is expansion')"><rect x="510" y="146" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="164" text-anchor="middle" dominant-baseline="central">Memory</text><text class="ts" x="565" y="186" text-anchor="middle" dominant-baseline="central">Build trail</text></g>
<line x1="172" y1="174" x2="208" y2="174" class="arr" marker-end="url(#arrow)"/>
<line x1="322" y1="174" x2="358" y2="174" class="arr" marker-end="url(#arrow)"/>
<line x1="472" y1="174" x2="508" y2="174" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="226" text-anchor="middle" dominant-baseline="central">↻ Memory renders the card and feeds next</text>
<g class="node c-teal" onclick="sendPrompt('Why should Runtime be a core layer, and what would its build own?')"><rect x="40" y="260" width="600" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="282" text-anchor="middle" dominant-baseline="central">Runtime: the executor, hooks and the next CLI</text></g>
<g class="node c-purple" onclick="sendPrompt('What belongs in the Distribution expansion?')"><rect x="40" y="320" width="600" height="44" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="342" text-anchor="middle" dominant-baseline="central">Distribution: govkit installs and updates every layer</text></g>
<text class="ts" x="40" y="390" dominant-baseline="central">Teal: core, needed to run one build · Purple, dashed: expansion, plugs in at a declared point</text>
</svg>
