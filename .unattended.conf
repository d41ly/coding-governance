# .unattended.conf — the project layer for the unattended-run kit (coding-governance, dogfooding).
#
# Every value below is a DECLARATION the driver and the gate leg READ. Neither restates one: a phase
# token or a DoD item spelled into a script is itself a defect, and the leg reds on it. The kit owns
# the CORE phase vocabulary and the CORE DoD set; this file may only EXTEND them.
#
# Contract: memory/guides/UNATTENDED-PROTOCOL.md (binding).

# The memory tree, matching .memory-tree.conf. The run-state file is <MEMORY_ROOT>/builds/<slug>/RUN.md.
MEMORY_ROOT=memory

# The MANDATED lander. The pre-push hook refuses any default-branch push lacking this script's
# marker, because it reconciles origin BEFORE the gate so the bar never runs on an already-stale
# tree. An unattended run that meets that refusal with nobody to interpret it either stalls or learns
# to bypass, and bypassing discards the entire bar the mandate leaned on.
LANDER="bash tools/push-main.sh"

# The flag the close path must NEVER emit. Grepped in both directions: lander present, flag absent.
BYPASS_BAN="--no-verify"

# The full merge bar, for the `gates-green` DoD item.
GATE_CMD="bash tools/run-gates/run-gates.sh"

# The wall-clock bound on any command this driver runs that THIS project declared -- GATE_CMD and
# WIRING_CHECK both. TOOL-aBoundedCeiling-6, written after an adopter --close was observed on node a
# running 3h19m with its launching session dead and its inner child at zero CPU. Nothing in that
# chain had a deadline.
#
# 3600s: this repo full bar with self-tests is roughly 9700s of leg-sum with a 1320s longest leg,
# about 26 minutes of wall at width 8. An hour sits well above that and far below the 3h19m observed.
# Raise it here, with the reason beside it, if the bar legitimately grows.
GATE_BOUND="3600"

# The NON-repairing wiring check --preflight delegates to. Deliberately not `--fix`: that mode sets
# git config and rewrites the bytes of tracked skill renders, and its own source records the scar —
# a wider selector once stripped CR bytes out of a settings file and a PNG. The run's first act is
# not the repairing mode.
WIRING_CHECK="bash tools/check-wiring.sh --check"

# The agent-facing scheduler, named for the AGENT to call — no script can reach the store, which is
# in-memory and session-scoped. The driver only records the id the agent hands it and later asserts
# a recorded reap. Two spellings are live on this fleet; the Cron pair is the harness-native one.
KEEPALIVE_CREATE="CronCreate"
KEEPALIVE_DELETE="CronDelete"

# The cadence the agent schedules the keepalive at, rendered into the Skill beside the tool names.
# OPTIONAL and deliberately outside the gate's required-key loop: nothing reads it but the rendered
# sentence, and a key with no consumer does not belong in a refusal. Offset off the :00 mark, because
# the obvious */10 spelling puts every fleet member on the same minute.
KEEPALIVE_INTERVAL="every 10 minutes (cron 3-59/10 * * * *)"

# The /session-kickoff engine, for the hand-back check. BLANK turns that check off — an adopter may
# not use the kickoff skill at all. KICKOFF_EXITS is a shrink-only FLOOR on how many interactive
# exits the engine enumerates a no-owner-turn resolution for: dropping one from the list is how a run
# silently regains a place to stop, and the count is the only thing that notices.
KICKOFF_ENGINE="skills/session-kickoff/SKILL.md"
KICKOFF_EXITS="6"

# The kit's CORE set sizes, `<phases>:<dod>`, SHRINK-ONLY. The names live in the driver and are not
# repeated here; what is pinned is the count, so deleting a core member reds and adding one is free.
# A membership list would be a second spelling of the driver's, and the membership form of this
# check was measured VACUOUS: the effective set is composed as core plus extras, so core is a subset
# by construction and "every core member is present" can never fail.
CORE_FLOOR="12:11"

# Project EXTENSIONS to the kit-owned core sets, space-separated. Empty is legal and means "core
# only"; it is NOT the same as an empty core set, which is a refusal.
# TOOL-cBriefedPilot-2 - the DEFAULT DIRECTIVE SET is kit-owned; this is the extension point and
# the shrink-only floor on the core count. A separate key rather than a third CORE_FLOOR field:
# that value has a recorded failure mode where ONE malformed spelling disarms BOTH its pins while
# the conf still looks configured, and a third field makes one typo disarm three.
DIRECTIVES_EXTRA=""
# TOOL-cSettledDocket-2 — the project-owned ROW SOURCE for anything DIRECTIVES_EXTRA declares.
# A repo-relative markdown file carrying rows in the Skill table shape: | `handle` | what it
# points at | M<n> | ... . Undeclared is the EMPTY SET, which is what every adopter has today.
# Without it an extra handle was waivable by a verb and invisible to the agent, and the project
# could not fix that by adding a table row because the Skill is rendered from a kit template.
# A FILE rather than a region inside the render: the render has a recorded zero-byte write that
# --check then certified, and a file nobody renders has no adopter bytes to preserve.
DIRECTIVES_EXTRA_TABLE=""
DIRECTIVES_FLOOR="16"

# TOOL-aBranchedMandate-3 — which anchors may authorize a run. CLOSED value set:
#   default-branch  the build README must resolve at the merge-base with the tip the remote
#                   advertises for its own HEAD. This is the historical behaviour.
#   published       that anchor FIRST, and failing it the tip the remote advertises for the run's
#                   OWN branch, provided that tip is an ancestor of HEAD.
# ABSENT, BLANK, or any value outside the set keeps `default-branch`. A misspelling may not silently
# select either behaviour, which is why this is a scope name over a closed set rather than a boolean:
# a boolean whose absence and whose misspelling produce the same answer hides a misconfiguration.
#
# WHAT `published` SPENDS, stated here because an adopter reads this file and not the spec. A branch
# push is not gated by the pre-push hook, so under `published` a run can authorize ITSELF in two
# ordinary commands rather than only its successor. The leg-side half CANNOT be gated on this key —
# this file is a working-tree file the run can commit — so the bar's BASE check widens for every
# adopter, including one that declares `default-branch` and one that declares nothing. And roster
# integrity stops being enforceable on the branch anchor. All three were put to the owner and
# accepted; protocol section 1 carries them.
ANCHOR_SCOPE="published"

# TOOL-aNamedGesture-1 - the TOKEN that authorizes a prompt-mode run. The Skill's prompt path is
# entered only when the invocation carries it, so this is the gesture that separates a description of
# a build from a run that will merge and push with no owner turn. Its ARGUMENT is the build: either a
# path to a file holding the prompt, or the prompt itself.
#
# BLANK is the kit default and is what every adopter should ship. The default literal lives in
# adopt-unattended.sh and nowhere else, and the RENDERED Skill states it verbatim - so read the value
# out of .claude/skills/unattended/SKILL.md rather than expecting this file to name it. Declare a
# value here only to override the spelling, which is worth doing in a project whose ordinary prose
# would contain the default.
#
# WHAT IS REFUSED at render time, and why each: a value that does not begin with a hyphen (a bare
# word reads as a positional argument, which is the prose inference the fence forbids), and a value
# carrying whitespace, a pipe or a backtick (it is interpolated into a markdown table row and a code
# span, and each of those three ends one of them early).
#
# NOTHING VERIFIES THE GESTURE. No script in this kit sees an invocation, so this key buys a token an
# agent can test for and never an authorization; the authorization stays the pushed build folder.
AUTH_PARAM=""

PHASES_EXTRA=""
DOD_EXTRA=""

# TOOL-aBoundedVerdict-11 S6a — the date from which a build README's pinned BASE must carry a
# `gen:build-units` pair for the authorization scope to be comparable. A BASE committed BEFORE this
# keeps the old presence-based opt-in; at or after it, an absent pair is a REFUSAL, because a subset
# test over an empty BASE set is vacuously true and that is the hole the id-set comparison closes.
#
# The cutoff is not decoration. A run's BASE is pinned before its own work, so the BASE of the very
# run that lands the migration render CANNOT carry the region — without a cutoff the unit is
# unlandable by any run, not merely awkward for one. Same idiom as `.memory-tree.conf`'s
# STREAMS_CUTOFF, SPEC10_CUTOFF and SPEC_WITNESS_CUTOFF, and declared HERE rather than there because
# the driver sources this file and nothing else.
#
# Set to the day the migration render landed. Moving it later re-opens the vacuity for every BASE in
# between; moving it earlier refuses runs whose BASE predates the region and can never carry it.
UNITS_REGION_CUTOFF="2026-08-19"

# The HALT VOCABULARY. A run that stops records WHY in a token,
# validated against the kit core set plus whatever a project appends here. The floor is
# shrink-only and REQUIRED: undeclared or malformed is a refusal, not a defaulted value,
# because a pin that quietly defaults is a pin nobody set.
HALT_CODES_EXTRA=""
HALT_FLOOR="7"

# The LANDER MARKER. When declared, the lander writes it on a successful push and `--landed`
# reads it — the only verb that runs after the push, so the only one that can observe it. What a
# COMPLIANT LANDER must write: a line naming the commit it pushed. Identity, not existence — a
# bare touched file is satisfied by any previous landing. Leave it EMPTY and the observation is
# simply not asked for; an adopter who has not adapted their lander is not wedged by a key they
# have never heard of.
#
# A BARE NAME, resolved by both halves against `git rev-parse --git-common-dir`. It was a
# tree-relative `.git/unattended-landed`, which is wrong twice over: in a LINKED WORKTREE `.git`
# is a file, so the write fails with `Not a directory` and no unattended run could ever land from
# one; and the two halves resolve a relative path against different directories, the lander
# against its own top and the driver against ROOT. The git common dir is the one place both agree
# on and the right home for run metadata that must never be committed.
LANDER_MARKER="unattended-landed"
# TOOL-dUnstalledConvoy-9 — the two halves of the build method's condition 3, DECLARED rather than
# guessed. A concurrently dispatched pass may not declare a write under SHARED_RECORDS at all; a
# GENERATED_INDEXES entry is refused ONLY when the same declaration, or a sibling's in the same
# group, also names its generator. Two keys and not one, because the condition has two halves and the
# conditional one was earned by a retraction — every pass changes a spec header the index is rendered
# from, so a flat ban on a generated index refuses the ORDINARY declaration.
#
# The run-state file is DERIVED from MEMORY_ROOT and the slug, never declared: it is the one member
# the kit already knows how to locate, and a declaration of it would be a second spelling.
# BLANK is the empty set and is legal. Absent falls through to the driver's default, which is the
# kit's reading of a memory tree at its conventional layout.
SHARED_RECORDS="memory/DECISIONS.md memory/backlog"
GENERATED_INDEXES="memory/LIVE.md:tools/memory-tree/gen_build_index.py memory/ledger:tools/memory-tree/gen_build_index.py"

# TOOL-dUnstalledConvoy-2 — the date from which a LANDED record must NAME its anchor kind. Set to the
# day the pair landed, the same idiom UNITS_REGION_CUTOFF uses and for the same reason: every LANDED
# record written before it carries no `landed-anchor`, all of them are in fact remote-anchored, and a
# check that redded them would be unlandable by any run. A record whose FIRST commit is at or after
# this date has no such excuse and an absent kind is a refusal.
# Moving it later re-admits an absent kind for every record in between; moving it earlier reds records
# that can never carry the key. BLANK or absent grandfathers everything.
LANDED_ANCHOR_CUTOFF="2026-08-21"

