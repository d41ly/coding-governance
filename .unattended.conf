# .unattended.conf — the project layer for the unattended-run kit (coding-governance, dogfooding).
#
# Every value below is a DECLARATION the driver and the gate leg READ. Neither restates one: a phase
# token or a DoD item spelled into a script is itself a defect, and the leg reds on it. The kit owns
# the CORE phase vocabulary and the CORE DoD set; this file may only EXTEND them.
#
# Contract: memory/guides/UNATTENDED-PROTOCOL.md (binding).

# The memory tree, matching .memory-tree.conf. The run-state file is <MEMORY_ROOT>/builds/<slug>/RUN.md.
MEMORY_ROOT=memory

# The MANDATED lander. The pre-push hook refuses any default-branch push lacking this script's
# marker, because it reconciles origin BEFORE the gate so the bar never runs on an already-stale
# tree. An unattended run that meets that refusal with nobody to interpret it either stalls or learns
# to bypass, and bypassing discards the entire bar the mandate leaned on.
LANDER="bash tools/push-main.sh"

# The flag the close path must NEVER emit. Grepped in both directions: lander present, flag absent.
BYPASS_BAN="--no-verify"

# The full merge bar, for the `gates-green` DoD item.
GATE_CMD="bash tools/run-gates.sh"

# The NON-repairing wiring check --preflight delegates to. Deliberately not `--fix`: that mode sets
# git config and rewrites the bytes of tracked skill renders, and its own source records the scar —
# a wider selector once stripped CR bytes out of a settings file and a PNG. The run's first act is
# not the repairing mode.
WIRING_CHECK="bash tools/check-wiring.sh --check"

# The agent-facing scheduler, named for the AGENT to call — no script can reach the store, which is
# in-memory and session-scoped. The driver only records the id the agent hands it and later asserts
# a recorded reap. Two spellings are live on this fleet; the Cron pair is the harness-native one.
KEEPALIVE_CREATE="CronCreate"
KEEPALIVE_DELETE="CronDelete"

# The cadence the agent schedules the keepalive at, rendered into the Skill beside the tool names.
# OPTIONAL and deliberately outside the gate's required-key loop: nothing reads it but the rendered
# sentence, and a key with no consumer does not belong in a refusal. Offset off the :00 mark, because
# the obvious */10 spelling puts every fleet member on the same minute.
KEEPALIVE_INTERVAL="every 10 minutes (cron 3-59/10 * * * *)"

# The /session-kickoff engine, for the hand-back check. BLANK turns that check off — an adopter may
# not use the kickoff skill at all. KICKOFF_EXITS is a shrink-only FLOOR on how many interactive
# exits the engine enumerates a no-owner-turn resolution for: dropping one from the list is how a run
# silently regains a place to stop, and the count is the only thing that notices.
KICKOFF_ENGINE="skills/session-kickoff/SKILL.md"
KICKOFF_EXITS="6"

# The kit's CORE set sizes, `<phases>:<dod>`, SHRINK-ONLY. The names live in the driver and are not
# repeated here; what is pinned is the count, so deleting a core member reds and adding one is free.
# A membership list would be a second spelling of the driver's, and the membership form of this
# check was measured VACUOUS: the effective set is composed as core plus extras, so core is a subset
# by construction and "every core member is present" can never fail.
CORE_FLOOR="10:8"

# Project EXTENSIONS to the kit-owned core sets, space-separated. Empty is legal and means "core
# only"; it is NOT the same as an empty core set, which is a refusal.
# TOOL-cBriefedPilot-2 - the DEFAULT DIRECTIVE SET is kit-owned; this is the extension point and
# the shrink-only floor on the core count. A separate key rather than a third CORE_FLOOR field:
# that value has a recorded failure mode where ONE malformed spelling disarms BOTH its pins while
# the conf still looks configured, and a third field makes one typo disarm three.
DIRECTIVES_EXTRA=""
# TOOL-cSettledDocket-2 — the project-owned ROW SOURCE for anything DIRECTIVES_EXTRA declares.
# A repo-relative markdown file carrying rows in the Skill table shape: | `handle` | what it
# points at | M<n> | ... . Undeclared is the EMPTY SET, which is what every adopter has today.
# Without it an extra handle was waivable by a verb and invisible to the agent, and the project
# could not fix that by adding a table row because the Skill is rendered from a kit template.
# A FILE rather than a region inside the render: the render has a recorded zero-byte write that
# --check then certified, and a file nobody renders has no adopter bytes to preserve.
DIRECTIVES_EXTRA_TABLE=""
DIRECTIVES_FLOOR="11"

PHASES_EXTRA=""
DOD_EXTRA=""
