[[unit]]
tag = "repo.rule-01-this-repository-ships-the-charter-templa"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "This repository ships the charter template and the kits under `tools/`, and dogfoods every kit it ships on itself."

[[unit]]
tag = "repo.rule-02-claude-rules-product-md-summarizes-what"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "`.claude/rules/product.md` summarizes what ships; read it before touching `tools/`, `skills/`, the template or `WIRE-INTO-PROJECT.md`."

[[unit]]
tag = "repo.rule-03-agents-md-is-canonical-and-claude-md-imp"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "`AGENTS.md` is canonical and `CLAUDE.md` imports it; the playbook renderer, `playbook-render`, wires every other agent's filename to it."

[[unit]]
tag = "repo.rule-04-skills-session-kickoff-stays-at-the-repo"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "`skills/session-kickoff/` stays at the repository root, because every machine discovers it through a junction."

[[unit]]
tag = "repo.rule-05-the-memory-tree-is-flat-a-spec-review-or"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "The memory tree is flat: a spec, review or research record lives in its build's folder, and `memory/project/` holds only the gates' row registries."

[[unit]]
tag = "repo.rule-06-the-codebase-map-is-memory-map-dossiers"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "The codebase map is `memory/map/`: dossiers under `features/`, and the keys none claims yet in `baseline.toml`, which shrinks unless a recorded decision says otherwise."

[[unit]]
tag = "repo.rule-07-work-state-is-read-from-the-generated-me"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "Work state is read from the generated `memory/LIVE.md` and `memory/ledger/`; there is no authored session ledger."

[[unit]]
tag = "repo.rule-08-read-memory-guides-merge-bar-md-before-r"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "Read `memory/guides/MERGE-BAR.md` before running, scoping or debugging a bar, and before any push."

[[unit]]
tag = "repo.rule-09-gate-selftests-1-runs-the-held-kit-self"
level = 0
type = "adopter-rule"
scope = ["reader.every"]
text = "`GATE_SELFTESTS=1` runs the held kit self-tests on demand only, and no boundary sets it."
