# .lexicon.conf — the naming lexicon this repo declares. Read by tools/lexicon/lexicon.py through
# tools/lexicon/lexicon_conf.py, which is the ONE reader; nothing else parses this file.
#
# GRAMMAR: single-line keys use the sibling KEY=VALUE form (`.memory-tree.conf`, `.codebase-map.conf`)
# — a value with spaces is double-quoted and no comment follows it on the line. Block keys are a
# `KEY:` header followed by INDENTED rows, ending at the first non-indented line.
#
# CURATED from the derived seed on 2026-08-16, and the derivation is worth recording because it is
# the argument for curating. `--scaffold` proposed 25 rows by leading-token frequency and ten of them
# were not verbs at all: `t`, `do`, `git`, `kit`, `signal`, `bounded`, `all`, `repo`, `is`, `no` —
# leading tokens of `git_x`, `signal_ledger`, `boundedK`, `all_inventories`, `is_x`. A table seeded
# with those would have been a mirror of the identifiers it grades, which is the one shape a naming
# gate must not have. What is below is PRESCRIPTIVE: it says what this repo should be called, not
# what it is called.

# Type-name suffixes that name a responsibility nobody scoped. Prescriptive, and safe to inherit.
BANNED_SUFFIXES="Manager Helper Util Utils Handler Processor Data Info"

# <ext>:<pattern-set-id>:<mode>, one per extension PRESENT in this corpus. An extension here with no
# declaration is a named refusal, never a silent skip. `sh` is DARK on purpose and not by omission:
# a regex over shell function definitions would look like coverage while silently skipping what it
# forgot, which is the law `map_extractors.py` already wrote down for the recall corpus.
LANGS="<none>::dark conf::dark example::dark gitattributes::dark gitignore::dark js:js-regex:probe json::dark md::dark py:python-ast:parser sh::dark toml::dark txt::dark"

# MEASURED against this corpus after curation. Shrink-only: the count may fall, never rise. Honestly
# non-zero on day one — `ORPHAN_ID_PIN` is the precedent for a pin that is not a target. The value
# counts every DEFINITION the declared extractors see (Python via `ast`, JavaScript via the probe
# set) whose leading token is outside the table below. It is large because the table is prescriptive
# and this corpus predates it, which is the expected shape rather than a backlog.
VERB_OFFENDER_PIN="412"
SUFFIX_OFFENDER_PIN="0"
LAYER_OFFENDER_PIN="0"

# The date and node that CURATED the seed below.
ratified="2026-08-16 node d"

VERBS:
  build     create a new value and return it — NOT `create`, which is reserved for side-effecting setup
  load      read a store into memory — NOT `fetch`, which implies a network call
  read      pull bytes or records from a named source — NOT `get`, which says nothing about cost
  write     persist to a store — NOT `save`, which hides whether anything was already there
  parse     turn text into structure, raising on text that is not that structure — NOT `convert`
  render    turn structure into text — NOT `format`, which reads as cosmetic
  resolve   turn a name into the thing it denotes, RUNNING the candidate where that is the only proof
  check     assert a predicate and return a verdict — NOT `validate`, which implies mutation on failure
  scan      walk a population looking for matches — NOT `search`, which implies stopping at the first
  extract   pull a declared shape out of a larger one
  measure   count a population and report the number, deciding nothing
  derive    compute a value from a source so it never has to be authored — the §5 rule, as a verb
  seed      write an initial value the tool will not overwrite again
  init      set up state at construction — NOT `setup`
  run       execute a process to completion and report its outcome
  arm       make a dormant check live; its opposite is a check that cannot fail
  add       append to an existing collection
  remove    detach without destroying — NOT `delete`, which is irreversible
  set       assign a known value — NOT `update`, which implies a diff against prior state
  print     write to stdout for a human — never a return value in disguise
  main      a module's CLI entry point; reserved, one per module
  test      a test function; reserved for harnesses

# FORBIDDEN import directions, `<glob> -> <glob>`. The direction below is a real constraint this repo
# already relies on, not a policy invented to fill the slot: the lexicon kit must ship SELF-CONTAINED
# so an adopter taking it without `codebase-map` gets a working kit, which means it may not import
# from `codebase-map` even though it PORTS a function from it. That is the rule the port exists to
# honour, and this is the machine-checkable form of it.
LAYERS:
  tools/lexicon/* -> tools/codebase-map/*
