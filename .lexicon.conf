# them was refused. On the tree this build validated both cells graded clean; `main` landed
# build-record scripts in parallel and the merge is where the conflation showed.
#
# THE FIX THEY NEED IS A PATH-SCOPED SELECTOR and the kit ships none: `CELLS` selectors are
# `prefix` and `decorator`, both over the NAME, and neither can say "product code, not
# records". That is `TOOL-aSurfacedLexicon-23`. Un-arming is the honest interim state --
# the capability is built, gated and self-tested, and it is declared OFF for two surfaces
# whose population the declaration cannot yet express. The four cells below grade product
# code and grade it clean.
CELLS:
  js.function  camel

  py.function  snake

  py.type      pascal

  sh.function  snake

PINS:
  sh.function.conv  6

# THE CANON DOOR, declared here because it is the owner's to open and nobody else's.
# TOOL-aSurfacedLexicon-11.
#
# `tools/lexicon/canon.py` ships a frozen table of concept clusters. It decides which SPELLING
# represents a concept — always element 0, at every frequency — and the corpus decides only which
# concepts are live. That freeze is the whole reason a proposed table is not a mirror of the code it
# grades. This repo declares NO overlay, and the two keys below are commented for exactly that
# reason: the capability is legible from this file before it has ever been used.
#
# A `CANON:` block is an OVERLAY, in three directions, all of them in the row key:
#
#     canon_unfrozen="2026-09-05 node a — our stores are `hydrate`, and the canon calls that `load`"
#
#     CANON:
#       load        hydrate rehydrate      # REPLACES the shipped cluster's alternatives
#       frobnicate  frob fnord             # ADDS a cluster the canon does not carry
#       -measure                           # DELETES a shipped cluster; takes no alternatives
#
# THE STAMP IS NOT OPTIONAL. A block with an empty `canon_unfrozen`, or one carrying a date and a
# node but no REASON, is a refusal on `bash tools/lexicon/adopt-lexicon.sh --check` — a leg with no
# guard, so a conf-only commit reaches it. And the unfreeze PRINTS on every run of
# `python tools/lexicon/lexicon.py`, green as well as red, above the counts: there is no state in
# which this table is quietly overridden.
#
# THE HONEST LIMIT, which belongs beside the door rather than in a review nobody re-reads.
# No machine check can tell a considered overlay from a mirror. An owner may unfreeze the canon and
# fill the block from their corpus's commonest spellings, reinstating precisely the defect
# `canon.py` closes, and the difference is WHY the rows were chosen — which the tool cannot see.
# What the door buys is visibility and attribution, not proof: the choice is one tracked line, it is
# attributed to a node and a date, it is refused without a reason, and it is printed on every run.
# The blast radius is bounded by the fact that the canon grades nothing — it decides what may be
# PROPOSED and how an offender is labelled — so an unfrozen canon cannot legalise a name by itself.
#
# A SECOND LIMIT, smaller and concrete: an ADDED cluster has no GLOSS. A `CANON:` row declares a
# cluster and a gloss is a `VERBS` row's job, so the advice half prints the negative alone until the
# owner writes the matching `VERBS` row. The overlay changes what may be proposed; it does not write
# the sentence saying what the verb means.
#
# ONE MORE CONSEQUENCE, so it is not met as a surprise: both P1 pins are two-sided equalities, and
# an overlay moves definitions between the DEBT and UNRULED buckets. The first run after declaring
# one reds until the `PINS:` rows are re-pasted. The run says so, naming the overlay as the cause.

VERBS:
  build     create a new value and return it — NOT `create`, which is reserved for side-effecting setup
  load      read a store into memory — NOT `fetch`, which implies a network call
  read      pull bytes or records from a named source — NOT `get`, which says nothing about cost
  write     persist to a store — NOT `save`, which hides whether anything was already there
  parse     turn text into structure, raising on text that is not that structure — NOT `convert`
  render    turn structure into text — NOT `format`, which reads as cosmetic
  resolve   turn a name into the thing it denotes, RUNNING the candidate where that is the only proof — NOT `lookup`, a lookup returns a row; resolve returns the thing, RUNNING the candidate
  check     assert a predicate and return a verdict — NOT `validate`, which implies mutation on failure
  scan      walk a population looking for matches — NOT `search`, which implies stopping at the first
  extract   pull a declared shape out of a larger one — NOT `pluck`, pluck names the taking; extract names the declared shape taken
  measure   count a population and report the number, deciding nothing — NOT `count`, count is the arithmetic; measure counts a population and decides nothing
  derive    compute a value from a source so it never has to be authored — the §5 rule, as a verb — NOT `compute`, compute says a value was produced, not that it never has to be authored
  seed      write an initial value the tool will not overwrite again — NOT `install`, install claims the tool owns the result after; a seed is never overwritten
  init      set up state at construction — NOT `setup`
  run       execute a process to completion and report its outcome — NOT `execute`, the same word twice, and this repo already runs processes
  arm       make a dormant check live; its opposite is a check that cannot fail — NOT `enable`, enable reads as a feature flag; arm makes a dormant CHECK live
  add       append to an existing collection — NOT `append`, append claims a position at the end; add claims only membership
  remove    detach without destroying — NOT `delete`, which is irreversible
  set       assign a known value — NOT `update`, which implies a diff against prior state
  print     write to stdout for a human — never a return value in disguise — NOT `log`, log implies a level, a sink and a filter; print writes to stdout for a human
  main      a module's CLI entry point; reserved, one per module — NOT `start`, start names a lifecycle event; main is a module's one CLI entry point
  cmd       a subcommand entry point, dispatched by name; reserved — NOT `do`, which names no role
  test      a test function; reserved for harnesses — NOT `assert`, assert is one statement inside a test; test is what a harness collects
