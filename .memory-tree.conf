# .memory-tree.conf — per-repo config for the memory-tree hygiene kit (coding-governance dogfooding itself).
MEMORY_ROOT=memory

# DISCIPLINES is a CLOSED ENUM of stream values, NOT a list of directories. Since the flatten
# (TOOL-aFoldedQuarry-3) the discipline lives in each spec's status header as `streams <value>`,
# and every build folder sits directly under <MEMORY_ROOT>/builds/<slug>/.
#   playbook  — the governance template + its companions (parallel-coding-governance.*)
#   kickoff   — the /session-kickoff engine + the kickoff-manifest ratchet
#   tooling   — the reusable kits: memory-tree, codebase-map, hooks, workflows, agent-instructions, gates
#   deployer  — the single-ratchet deployer (govkit) research + design
DISCIPLINES="playbook kickoff tooling deployer"

# <enum value>:FAMILY — the id prefix for that stream's decisions, its backlog shard
# (<MEMORY_ROOT>/backlog/<FAMILY>.md), and the optional FAMILY qualifier in a recording filename.
FAMILIES="playbook:PLAY kickoff:KICK tooling:TOOL deployer:DEPL"

# Not migrating away from an old tree root; the sprawled root docs are individually re-filed.
TOMBSTONE_ROOTS=""

# Spec-format ratchet (check 12): specs dated >= this follow memory/TEMPLATE-SPEC.md.
SPEC_FORMAT_CUTOFF="2026-07-15"

# Streams ratchet (check 12): specs dated >= this MUST carry `· streams <value>[+<value>]` in the
# status header. Set strictly ahead of every committed spec's filename date at the flatten, so no
# landed spec is retroactively red — which means the corpus does NOT exercise the required arm and
# the self-test carries explicit red/green fixtures for it instead.
STREAMS_CUTOFF="2026-08-09"
