# .memory-tree.conf — per-repo config for the memory-tree hygiene kit (coding-governance dogfooding itself).
MEMORY_ROOT=memory

# DISCIPLINES is a CLOSED ENUM of stream values, NOT a list of directories. Since the flatten
# (TOOL-aFoldedQuarry-3) the discipline lives in each spec's status header as `streams <value>`,
# and every build folder sits directly under <MEMORY_ROOT>/builds/<slug>/.
#   playbook  — the governance template + its companions (parallel-coding-governance.*)
#   kickoff   — the /session-kickoff engine + the kickoff-manifest ratchet
#   tooling   — the reusable kits: memory-tree, codebase-map, hooks, workflows, agent-instructions, gates
#   deployer  — the single-ratchet deployer (govkit) research + design
DISCIPLINES="playbook kickoff tooling deployer"

# <enum value>:FAMILY — the id prefix for that stream's decisions, its backlog shard
# (<MEMORY_ROOT>/backlog/<FAMILY>.md), and the optional FAMILY qualifier in a recording filename.
FAMILIES="playbook:PLAY kickoff:KICK tooling:TOOL deployer:DEPL"

# Not migrating away from an old tree root; the sprawled root docs are individually re-filed.
TOMBSTONE_ROOTS=""

# Spec-format ratchet (check 12): specs dated >= this follow memory/TEMPLATE-SPEC.md.
SPEC_FORMAT_CUTOFF="2026-07-15"

# Streams ratchet (check 12): specs dated >= this MUST carry `· streams <value>[+<value>]` in the
# status header. Set strictly ahead of every committed spec's filename date at the flatten, so no
# landed spec is retroactively red — which means the corpus does NOT exercise the required arm and
# the self-test carries explicit red/green fixtures for it instead.
STREAMS_CUTOFF="2026-08-09"

# --- corpus_ids.py (checks 13-16). Every number below is MEASURED against THIS corpus by
# --- `python tools/memory-tree/corpus_ids.py --measure`, never inherited: a pin copied from a larger
# --- tree is either vacuous or permanently red. Blank turns its check off.
# The document a session is pointed at before it touches code (check 16 derives the read path from it).
CHARTER="AGENTS.md"
# Orphan ids: cited but never defined. Measured 4 — the four grandfathered builds whose only spec is
# a legacy-named recording with no anchor. Shrink-only: it falls as those gain proper records.
ORPHAN_ID_PIN="4"
# Dead repo-path citations in the present-tense corpus. Measured 0, so the registry ships EMPTY and
# the pin is a ratchet: the next unresolving citation reds until it is registered or repaired.
DEAD_PATH_PIN="0"
# The charter's read path under MEMORY_ROOT: measured 3670 B + 20480 B headroom. One-sided.
READ_PATH_CEILING="24150"
# Read-path members deliberately under no byte cap (space-separated). Empty = every member is capped.
READ_PATH_WAIVER=""
# gotchas.py (checks 17-19): how many bug-class records may be `universal: true` — emitted on EVERY
# reviewer checklist. Measured 2 of 8 classes. Upstream designed for 10 and measured 40, and 40 of a
# 68-entry checklist are the always-emitted core, so this one is budgeted rather than left to drift.
UNIVERSAL_BUDGET="3"
# check-arms.py: the harness meta-gate. BOTH floors are MEASURED and one-sided upward. The branch
# floor catches a DELETED guard; the armed floor catches an assertion dropped by widening the pin —
# a derived count alone cannot see the second, because the branch count falls and the pin still holds.
ARMS_BRANCH_FLOOR="14"
ARMS_ARMED_FLOOR="5"
