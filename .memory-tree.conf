# .memory-tree.conf — per-repo config for the memory-tree hygiene kit (coding-governance dogfooding itself).
MEMORY_ROOT=memory

# DISCIPLINES is a CLOSED ENUM of stream values, NOT a list of directories. Since the flatten
# (TOOL-aFoldedQuarry-3) the discipline lives in each spec's status header as `streams <value>`,
# and every build folder sits directly under <MEMORY_ROOT>/builds/<slug>/.
#   playbook  — the governance charter template (coding-governance-agents.template.md)
#   kickoff   — the /session-kickoff engine + the kickoff-manifest ratchet
#   tooling   — the reusable kits: memory-tree, codebase-map, hooks, workflows, agent-instructions, gates
#   deployer  — the single-ratchet deployer (govkit) research + design
DISCIPLINES="playbook kickoff tooling deployer"

# <enum value>:FAMILY — the id prefix for that stream's decisions, its backlog shard
# (<MEMORY_ROOT>/backlog/<FAMILY>.md), and the optional FAMILY qualifier in a recording filename.
FAMILIES="playbook:PLAY kickoff:KICK tooling:TOOL deployer:DEPL"

# Not migrating away from an old tree root; the sprawled root docs are individually re-filed.
TOMBSTONE_ROOTS=""

# Spec-format ratchet (check 12): specs dated >= this follow memory/TEMPLATE-SPEC.md.
SPEC_FORMAT_CUTOFF="2026-07-15"

# Streams ratchet (check 12): specs dated >= this MUST carry `· streams <value>[+<value>]` in the
# status header. Set strictly ahead of every committed spec's filename date at the flatten, so no
# landed spec is retroactively red — which means the corpus does NOT exercise the required arm and
# the self-test carries explicit red/green fixtures for it instead.
STREAMS_CUTOFF="2026-08-09"

# Acceptance-witness ratchet (check 12): a spec whose FILENAME date is on or after this must give
# every acceptance bullet at least one backticked token. Set to the date the rule landed, which is
# strictly ahead of every spec committed before it, so nothing landed is retroactively red. The
# corpus DOES exercise the rule from day one -- TOOL-cTracedPromise-2's own spec is dated on this
# cutoff and is its first live subject -- but it cannot exercise the GRANDFATHERED, UNBOLDED,
# Tier-1 or continuation cases, so the self-test carries fixtures for those, as STREAMS_CUTOFF does.
#
# MEASURED before choosing the predicate: over 774 acceptance bullets in the tracked corpus, 181 name
# nothing in backticks. A stricter "witness-shaped token" rule flagged 218 with false positives on
# things like `.map`; a phrasing rule flagged 247 on punctuation variance. The bare backtick is the
# only one of the four that did not punish good criteria. It checks SHAPE, never that the named thing
# exists -- memory/TEMPLATE-SPEC.md says so where an author reads it.
# check 12, the §8 RESOLUTION MARK, graded PER ITEM once a spec filename reaches this date. Both
# machine readers of a section 8 used to decide on its FIRST NON-BLANK LINE with an unanchored
# case-sensitive substring, which had two live failure modes: a section whose opening sentence
# announced that a fork was NOT resolved classified as RESOLVED, because the word appeared in the
# sentence denying it; and any unresolved item BELOW a `none` first line was invisible, because
# nothing past that line was read. The mark is now the documented shape -- the word, then a
# parenthesised attribution whose first field is the resolver class, whose second is a date, whose
# optional third is the delegation qualifier -- and an ITEM is its opening line plus its continuation
# lines, because that is where this corpus actually puts the mark.
#
# MEASURED over the tracked corpus before the predicate tightened: 211 spec files carrying a section
# 8, holding 339 items, of which 246 carry a conforming mark and 93 do not, spread over 38 files.
# Resolver names in the wild include `builder`, `build` and `unattended build`, none of which is in
# the documented set. The measurement is EVIDENCE FOR THE CUTOFF, not a repair worklist: rewriting a
# ratified record is against this tree's own rule, so the cutoff carries the landed corpus instead.
# Observed rather than assumed: with this key set retroactively to 2026-01-01, check 12 reds 33
# TERMINAL specs. That is the number the cutoff exists to keep green, and it is why the date is set
# strictly AHEAD of the newest tracked spec filename date (2026-08-20) rather than at it.
# check 22, the REVIEW VERDICT vocabulary. A review record has to state what it concluded in a token
# something can read. MEASURED over the tracked corpus before the check was written: 111 review
# records, 66 carrying a `## Verdict:` line and 45 carrying none, across 17 DISTINCT values — of which
# only BLOCKED and CLEAN WITH FIXES are in the closed set, and CLEAN, the token the build method names
# as the review loop's only exit, occurs ZERO times. The rest is free prose: "FIX THE BLOCKER BEFORE
# LANDING", "SHIP WITH FIXES", "CHANGES REQUESTED". So the vocabulary the method states in prose was
# written consistently by nobody and read by nothing.
#
# FORWARD-ONLY, and observed rather than assumed: with this key set retroactively to 2026-01-01, check
# 22 flags 60 records. Rewriting a landed review is against this tree's own rule, so the cutoff carries
# the corpus — set strictly ahead of the newest tracked review filename date, which is 2026-08-20.
# 2026-08-21 -> 2026-08-22, on the merge that LANDS this rule. The cutoff was set to the day the rule
# was WRITTEN, which caught two review records another node authored the same day and before the rule
# existed - a gate reding honest content for not following a rule it could not have read.
#
# The repair is deliberately NOT to fill their verdict lines. A halt code CLASSIFIES a reason its
# author already wrote, so deriving one is reading; a verdict ASSERTS a conclusion nobody wrote, so
# deriving one would put this session words into another node record. The aborted record in the same
# bar run got a derived halt code for exactly that reason, and this one gets a cutoff instead.
# Forward-only in truth rather than in intent.
REVIEW_VERDICT_CUTOFF="2026-08-22"
FORK_MARK_CUTOFF="2026-08-21"
SPEC_WITNESS_CUTOFF="2026-08-15"

# --- corpus_ids.py (checks 13-16). Every number below is MEASURED against THIS corpus by
# --- `python tools/memory-tree/corpus_ids.py --measure`, never inherited: a pin copied from a larger
# --- tree is either vacuous or permanently red. Blank turns its check off.
# The document a session is pointed at before it touches code (check 16 derives the read path from it).
CHARTER="AGENTS.md"
# Orphan ids: cited but never defined. Measured 4 at the flatten, RAISED to 5 when a fifth
# grandfathered build (aPortableWarden) was preserved into the flat shape. DRAINED 5 -> 0 by
# TOOL-aTetheredRecord-1: each of those five specs gained a family-qualified H1 id, which is all
# `corpus_ids.py`'s definition scan needs, so every waived id now resolves and the registry is empty.
# The drain was the exit condition the rows themselves stated. Shrink-only, and 0 is the floor: the
# next unresolvable citation reds until it is defined or registered with its reason.
ORPHAN_ID_PIN="0"
# Dead repo-path citations in the present-tense corpus. Measured 0, so the registry ships EMPTY and
# the pin is a ratchet: the next unresolving citation reds until it is registered or repaired.
DEAD_PATH_PIN="0"
# Prefixes that are NOT repo CONTENT. Resolution never touches the filesystem — it is `git ls-files`
# membership plus a prefix scan — so a checkout LOCATION classifies as dead identically on every
# node. The question is about meaning, not existence, so the answer is declared here.
DEAD_PATH_EXCLUDE=".claude/worktrees/"
# --- check 6's two DECLARED byte bounds (TOOL-aRelaxedShard-1). POLICY CEILINGS, not measured pins:
# --- they ship WITH a value, blank resolves FORWARD to the kit default rather than skipping the check,
# --- and there is no spelling that turns either bound off. The line bound is retired for the whole row
# --- class, which is the one part of that unit an adopter cannot opt out of.
#
# Every row document except a build README (25,600, kit-owned) and a dossier (below). MEASURED: the
# tooling backlog shard's live rows are 18,519 B over 73 rows = 253.7 B/row by `wc -c`, and 250 rows at
# that width is 63,425 B, rounded DOWN to 60 KiB. That derivation is the point: the retired 250-line
# figure and the retired 20,480-byte figure were never consistent with each other, because 20,480/250
# is 81.92 B/line against a measured 253.7. This is the byte figure the line figure always implied.
#
# Runway: SUPERSEDED as a figure, unchanged as a value. This said 8.1 live rows/day (~2,057 B) and
# about 21 days, measured during TOOL-aRelaxedShard-1 by a weaker method on a 73-row width. The
# census in TOOL-aRelaxedShard-4 gives +9.0 rows/day at 247.6 B, and the honest runway is a RANGE of
# 11 to 26 days across four methods. The 61,440 below is unaffected either way: it is 250 rows at
# measured width. Derivation: memory/builds/aRelaxedShard/build/2026-08-18-build-TOOL-aRelaxedShard-4-census.md That is WEEKS, not a
# quarter, and deliberately so -- no byte cap compatible with a readable file buys a quarter at 17.3 ids
# a day. The re-shape unit, not this number, is what changes the slope.
# The engine ships 20480/250 for this class. This repo declares both, and the LINE half is the
# owner-ratified retirement: TOOL-aRelaxedShard-1 set it to 0 after the owner was shown that 22 of the
# 29 members were line-bound FIRST, reversing what TOOL-aWidenedGuide-1 refused. 61440 is 250 rows at
# the measured 247.6 B/row; the derivation and the four methods that disagree about the runway are in
# memory/builds/aRelaxedShard/build/2026-08-18-build-TOOL-aRelaxedShard-4-census.md.
INDEX_CAP_BYTES="61440"
INDEX_CAP_LINES="0"
# Codebase-map dossiers only, and only where a map is adopted. Held at the kit default ON PURPOSE while
# the row class triples. MEASURED over the 12 dossiers: effective ceilings ran 12,805 to 18,671 B (250
# lines at 51.2 to 74.7 B/line), so 20,480 with no line bound buys the DENSEST +10% (274 lines) and the
# SPARSEST +60% (400). Letting them inherit the row cap instead would have been 3.29x to 4.80x, roughly
# 820 to 1,200 lines -- the loosening `TOOL-aWidenedGuide-1` refused, on the one class whose only size
# gate is check 6 and whose remedy is a SPLIT rather than a rotation.
# Held at the shipped default while the index class triples, deliberately: check 6 is the only size
# gate a dossier has and its remedy is a SPLIT, not a rotation. Measured over the 12 dossiers,
# effective ceilings ran 12,805-18,671 B, so 20480 with no line bound buys the densest +10% and the
# sparsest +60% — against 3.29x-4.80x had they inherited the index cap.
DOSSIER_CAP_BYTES="20480"
DOSSIER_CAP_LINES="0"

# Read-path members deliberately under no byte cap (space-separated). Empty = every member is capped.
#
# The ONLY conf key check 16 still reads. `READ_PATH_CEILING` and `READ_PATH_HEADROOM` were retired
# by TOOL-dSpentCeiling-1: check 6 already caps every member by class, so the summed budget was a
# second bound over an already-bounded population, and across every movement it never once caused a
# trim. Its movement history — the largest declaration chunk this corpus had, and the exhibit the
# retirement rests on — moved verbatim to
# memory/builds/dSpentCeiling/build/2026-08-25-build-TOOL-dSpentCeiling-1-ceiling-history.md,
# which also names memory/guides/BUILD-METHOD.md as the largest read-path member it ever measured.
READ_PATH_WAIVER=""
# gotchas.py (checks 17-19): how many bug-class records may be `universal: true` — emitted on EVERY
# reviewer checklist. Measured 2 of 8 classes. Upstream designed for 10 and measured 40, and 40 of a
# 68-entry checklist are the always-emitted core, so this one is budgeted rather than left to drift.
#
# RAISED 3 -> 4 on 2026-08-23 (TOOL-dScriptedRepeat-5, the round-6 fold). The fourth is
# `staged-break-substitutes-a-synthetic-value`, and it is universal because it is a defect in how ARMS
# are written rather than in any subsystem — an anchored record would only reach the diffs that touch
# the file it names, and the class bit six rounds of this build across three different files. Its
# sibling `structured-record-split-on-whitespace` is deliberately NOT universal: that one anchors on
# shell sources and belongs on the checklists that touch them.
UNIVERSAL_BUDGET="4"
# check-arms.py: the harness meta-gate. PER GATE, `<gate>:<branches>:<armed>`, both MEASURED and both
# one-sided upward. The branch floor catches a DELETED guard; the armed floor catches an assertion
# dropped by widening the pin, which a branch count alone cannot see because the count falls and the
# pin still holds. Per-gate rather than aggregate: a total lets one gate's deletion be masked by
# another gate's addition, and goes slack by a whole gate's branch count the day a third gate lands.
# check-playbook-parity.sh moved 15:15 -> 9:9 on 2026-08-18: its catalogue stage asserted the
# customize companion's placeholder arithmetic, the charter converged to one file, and that
# companion was deleted — six fail branches went with the stage, MEASURED after the deletion.
# The unattended.sh and check-unattended.sh figures are main's, raised by a concurrent build.
# unattended.sh went 105:102 -> 103:100 on 2026-08-21, a DELIBERATE lowering and the only kind
# that is legitimate: a `fail` branch covering an unresolvable git common dir was DELETED because
# it could not fire - the driver exits at startup when the repository does not resolve, so by the
# time that branch ran the condition was impossible. TWO such branches were deleted, not one: the
# other gave a local scratch failure in branch_tip_quiet its own code, and that function is only
# reached behind `[ -n "$ASHA" ]`, so a TMPDIR broken enough to reach it has already failed
# observe_anchor and left ASHA empty. Both measured before deleting. The count went down because
# branches went away, not because coverage did; what each was FOR is kept in the surviving
# refusal, which names the directory this side resolved and all three causes of an unknown tip.
# that added arms; each side's own movement is kept rather than either side's whole line.
ARMS_FLOORS="tools/check-playbook-parity.sh:9:9 tools/check-template-size.sh:6:6 skills/session-kickoff/manifest-check.sh:28:28 tools/memory-tree/check-memory-hygiene.sh:20:20 tools/unattended/unattended.sh:104:101 tools/unattended/check-unattended.sh:99:98 tools/memory-tree/check-method-carriers.sh:6:6"

# memory-recall's cache budget over the whole `<git-common-dir>/recall/cache/` tree, in megabytes.
# ABSENT = the kit's measured default (512 MB); BLANK = uncapped. Measured here: one cache is 2.4 MB,
# and upstream measured ~110 MB per LIVE worktree on a far larger corpus, of which only 37.9% was
# evictable by the dead-worktree rule — hence a size budget rather than a liveness one. Eviction is
# least-recently-built first, runs only AFTER a successful build, and never touches the current
# cache, one mid-build, or one with no built_at.
RECALL_CACHE_BUDGET_MB="512"

# DECLARED extra sources for the recall corpus, space-separated and repo-RELATIVE. The corpus is
# rooted at MEMORY_ROOT, so a constraint declared in a conf was unreachable by construction: a
# recall query for a declared byte budget returned 40 hits and not the read-path ceiling, the live
# prior art it was asking about, declared in this very file. (That ceiling has since been retired by
# TOOL-dSpentCeiling-1; the miss it demonstrates is why this key exists.) Each KEY=value in a declared file
# becomes one chunk carrying the comment block ABOVE it, because that block is where this tree puts
# the justification and the bare assignment would be reachable and worthless.
#
# DECLARED, never globbed: a glob would sweep whatever a project keeps, and the membership of a
# retrieval corpus is a decision about what counts as an answer. Blank or absent = the pre-widening
# corpus exactly. A declared file that does not exist is skipped with one line.
RECALL_EXTRA_SOURCES=".memory-tree.conf .unattended.conf tools/template-size-limits.txt"

# Check 20 — ids duplicated INSIDE one row document. Shrink-only COUNT, not a membership
# list: the names stay single-sourced in the document, and a deletion there still reds.
# RAISED 2 -> 3 at the merge with main, and this is a RAISE, not a drain — the distinction the
# drift-audit backlog row warns is invisible to every gate. The third is TOOL-aWrittenMethod-1,
# which arrives from node d carrying FOUR rows under one id. It is pre-existing content this
# check saw on its first exposure to another node's rows, not a regression from this build.
ROW_DUPLICATE_PIN="3"

# Check 21 — records carrying the deliberate `**Serves:** none` escape. MEASURED at 6 after
# TOOL-aTetheredRecord-3 bound the corpus: one build predating the spec-format ratchet that holds no
# spec at all, two design passes their READMEs grade as rejected or as preceding the set, two
# commissioning censuses, and aTetheredRecord's own design-pass record. Shrink-only: it falls as
# those builds gain specs a record can name. UNDECLARED is a refusal, not a disabled check — the
# escape is a declaration and an undeclared bound is an unbounded one. An adopter measures their own
# after the mechanical `none` pass; a number copied from here is either vacuous or permanently red.
# 2026-08-20: 9 -> 10. The worktree-cleanup session rescued
# builds/aBranchedMandate/build/2026-08-18-...-5-handoff-open-rows.md from an uncommitted worktree that was
# about to be deleted; it is a handoff for a separate session and the six rows it details were never specced,
# so it takes the `none` escape on the aFerriedDossier adopter-handoff precedent. This moves a SHRINK-ONLY pin
# the wrong way by one, deliberately and with the reason recorded: the alternative was destroying 104 lines of
# measured reproductions. It falls back to 9 the moment any of TOOL-aBranchedMandate-5/6/8/9/10/11 gains a spec.
# 2026-08-25: 10 -> 11. The dTieredTribunal research record precedes its own spec set, so there is no id
# for it to name: HYGIENE defines the `research` kind as "a report that precedes the specs", and citing an
# id no spec defines would red check 14 as an orphan instead. Second deliberate wrong-way move of a
# SHRINK-ONLY pin, on the 2026-08-20 precedent above, reason recorded beside it. It falls back to 10 the
# moment that build gains a spec the record can bind as `**Serves:** research <id>`.
RECORD_UNBOUND_PIN="11"

# --- check-recall.py: the recall quality floor (TOOL-aWalkedCorpus-3).
# ONE token, so the CELL and the VALUE cannot drift apart. The matrix bench.py emits spans 0.17 to
# 0.83 in a single run, so a bare scalar names nothing.
#   set        `records` -- an id is a record-level target; `chunks` measures 0.1667 on this fixture
#              because expected_by_target credits a chunk only when its own text carries the id.
#   substrate  `fts5`, because query.py:655 ranks with bm25(d, 1.0, 1.0, ALIAS_WEIGHT) and bench's
#              `fts5` is that same unweighted expression. `fts5w` scores IDENTICALLY here (r@10
#              0.8333 both) -- the reason is the source, not a score.
#   metric@k   `r@5`, because a session reads a handful of hits.
# The value is compared against the CEILING-NORMALISED score (r@k / ceiling), which reduces exactly
# to h/R -- h questions that hit, R whose targets resolve at all.
#
# 0.81 is DERIVED, not observed. Measured: h=10, R=12, normalised 0.8333. The one-retirement worst
# case is (h-1)/(R-1) = 9/11 = 0.8182, so the pin is the floor BELOW that, and the property it buys
# is that retiring one hitting target costs nothing. All twelve single retirements were enumerated:
# ten land on 0.8182 and the two non-hitting targets on 0.9091. Retiring a NON-hitting target raises
# the score, so a second retirement reds only when both were hits -- 21 of the 66 pairs stay green.
# A regression with no retirement (9/12 = 0.75) reds in every case, which is the direction that
# matters. Re-measure with:
#   python tools/memory-recall/check-recall.py --audit-fixture
# which prints h, R and (h-1)/(R-1) beside this value. It reds in ONE direction: when the declared
# pin EXCEEDS the worst case, i.e. a fixture edit made this value unsafe. A pin left merely
# CONSERVATIVE after an edit (h and R both fell, worst case rose) is not detected here — the
# literal h=10 R=12 is asserted by tools/memory-recall/test_recall_floor.py, which is the
# instrument that notices that direction.
RECALL_FLOOR="records:fts5:r@5>=0.81"

# ACCEPTANCE_LEDGER_CUTOFF — TOOL-dUnstalledConvoy-11. The date from which a CLOSED Tier-2 spec owes
# an acceptance ledger. Same idiom as SPEC10_CUTOFF and SPEC_WITNESS_CUTOFF above, and the same
# reason: roughly 149 closed specs predate the grammar and a check that redded them would be
# unlandable by any run.
#
# Set to THIS BUILD'S OWN DATE rather than the day after it, which is the fork's resolution and not
# an accident. The alternative grandfathers the build that introduces the mechanism, and a gate whose
# first run measures an empty set is an assertion about nothing. This build back-fills its own units
# instead, so the check ships having been exercised on real ones.
#
# Moving it later re-opens the gap for every spec in between; moving it earlier reds specs that closed
# before the grammar existed and can never carry one. BLANK grandfathers everything.
ACCEPTANCE_LEDGER_CUTOFF="2026-08-20"

# ACCEPTANCE_LEDGER_GRANDFATHER — unit ids exempt from the acceptance-ledger check, by ID and never by
# pattern. SHRINK-ONLY: a row drains when that unit's build back-fills its own ledger, and nothing
# should ever be added except for the reason below.
#
# TOOL-aMeteredTurnstile-1 closed on the cutoff date itself, hours before this grammar existed. A date
# boundary falls mid-day and cannot separate it from the units that closed after. Back-filling another
# build's ledger is not this build's to do — a build's own folder owns its own prose — and that run
# ABORTED at the landing boundary, so its conformance is unobservable by construction rather than by
# omission. No compensating check is claimed for it, because none is possible.

# EIGHT MORE AT THE dUnstalledConvoy MERGE, 2026-08-21. These units closed on `main` inside the
# cutoff window while this grammar was still on an unmerged branch, so their authors could not
# have written a ledger — the rule did not exist where they were working. Named INDIVIDUALLY
# rather than by moving the cutoff, because moving it forward would re-open the gap for every
# spec in between AND drop this build's own units out of the population, leaving a check whose
# first run measures nothing. A dated exemption that cannot be audited is not an exemption.
ACCEPTANCE_LEDGER_GRANDFATHER="TOOL-aMeteredTurnstile-1 TOOL-aShardedFloor-1 TOOL-aShardedFloor-2 TOOL-aShardedFloor-3 TOOL-dScriptedRepeat-1 TOOL-dScriptedRepeat-2 TOOL-dScriptedRepeat-3 TOOL-dScriptedRepeat-4 TOOL-dSettledRoster-5"
