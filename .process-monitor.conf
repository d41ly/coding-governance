# .process-monitor.conf — the project layer for the process-monitor kit.
#
# Every value here is a DECLARATION the kit READS. Nothing in the engine restates one, and nothing
# here is derivable from the tree. Contract: memory/builds/aReapedSpinner/spec/.
#
# THE KIT ANSWERS ONE QUESTION: which processes did this repo's agent work launch and forget, and
# which of those may be killed. It is not a general process manager and it has no opinion about
# anything outside these roots.

# ---------------------------------------------------------------- scope: the safety property
#
# PROCMON_ROOTS — space-separated absolute path prefixes. A process is ATTRIBUTABLE when a declared
# root prefix-matches its resolved program path or one of its path-shaped argument tokens; the
# in-scope set is those roots plus their transitive descendants. Everything else is invisible to
# this kit, including to its reaper.
#
# BLANK IS A REFUSAL, NOT AN EMPTY SET. A monitor that reports zero because nobody configured it is
# indistinguishable from a clean tree, which is the failure class this repo gates against in a dozen
# places. `govkit selfcheck` carries a declared hole for exactly this key.
#
# WHAT MAY NOT GO HERE, and it is a safety rule with a measurement behind it: the system temp
# directory or any ancestor of it. Measured on node `a` — every Claude Bash-tool shell carries an
# `export TEMP=` assignment naming that directory inside its argv, and `mktemp -d` resolves under
# it, so a root there admits every agent session in every repository on the machine. One such
# sibling shell in the live table already carries no live parent and would grade ORPHAN under the
# default reap mode below. `adopt-process-monitor.sh --check` refuses such a root.
#
# The gate runner's scratch directories need no entry: its legs are in scope because the runner
# that spawned them is, and the runner because the shell that invoked it names an absolute repo
# path. Attribution is a property of the TREE.
PROCMON_ROOTS="C:/projects/coding-governance /c/projects/coding-governance"

# ---------------------------------------------------------------- the decision
#
# PROCMON_AGE_CEILING — seconds. A process older than this is FLAGGED; under it, nothing else about
# it matters. Age DECIDES and the CPU rate only LABELS, because a single sample cannot tell a spin
# loop from honest work while a deadline can tell either from abandonment.
#
# 14400 (four hours). It must sit well above this repo's own bar: `.unattended.conf` declares
# GATE_BOUND=3600, the full bar has a measured 26-minute floor, and individual legs carry ceilings
# up to 2940s. Four hours leaves room for a contended full bar and is still far below the failures
# this kit was built for — spin loops at 11.4h, Monitor greps at 52-61h, a runner alive 7.5h after
# it was stopped.
PROCMON_AGE_CEILING="14400"

# PROCMON_SPIN_RATE — cpu_seconds/age_seconds at or above which a FLAGGED row is labelled SPIN
# rather than IDLE. Purely descriptive: it changes what a report says, never whether a row is
# flagged. 0.5 is half a core sustained over the process's whole life; the observed pair measured
# 1.13 across two processes over 11.4 hours.
PROCMON_SPIN_RATE="0.5"

# ---------------------------------------------------------------- the act
#
# PROCMON_REAP_MODE — what the AUTOMATIC path may kill. CLOSED value set:
#   report        kill nothing; name what was found. The report path always does this.
#   reap-orphans  kill only flagged rows whose parent is gone. THE DEFAULT.
#   reap-all      kill every flagged row.
#
# `reap-orphans` rather than `report`, because the owner asked for a monitor that KILLS and a report
# nobody acts on is the state this kit was built to end. `reap-orphans` rather than `reap-all`,
# because the charter forbids an irreversible default resting on a single-sample heuristic.
#
# THIS DEFAULT IS CONDITIONAL and the condition is not decoration: it is defensible only while the
# fence matches PROGRAM PATHS rather than raw command strings, and only while PROCMON_ROOTS excludes
# the temp root. Measured — 24 of 337 rows on this node are parentless and 18 are over an hour old,
# including csrss, wininit, winlogon, explorer, Spotify and msedge. On Windows a parent exiting
# neither reparents its children nor clears the field, so parentless is the ORDINARY state of a
# long-lived desktop process. The only thing between this mode and `explorer.exe` is the fence.
# If either condition is relaxed, set this to `report`.
PROCMON_REAP_MODE="reap-orphans"

# ---------------------------------------------------------------- the report
#
# PROCMON_THROTTLE_S — seconds between hook censuses. The hook stats one stamp file and exits when
# the stamp is newer than this, so the throttled path costs no census. A census measured ~1.2s
# against a 320ms PowerShell floor, so 300 is 0.4% of a session's tool-call time and still names a
# spin loop within five minutes of it starting.
PROCMON_THROTTLE_S="300"

# PROCMON_BACKEND — force a census backend, for testing. Empty means SELECT by platform. A value
# naming no known backend is a REFUSAL, never a silent fallback to an empty table.
PROCMON_BACKEND=""
